<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speakout · Интерактивная книга · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#3a1020;color:#fff}
  button{font-family:inherit;cursor:pointer;border:none}
  #bar{height:56px;background:#7c2340;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #bar .home{background:rgba(255,255,255,.15);color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font:800 13px 'Nunito',sans-serif;white-space:nowrap}
  #bar .title{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;white-space:nowrap;margin-right:4px}
  .tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
  .tab{background:rgba(255,255,255,.14);color:#fff;font:800 13px 'Nunito',sans-serif;padding:8px 12px;border-radius:10px;flex:none}
  .tab.on{background:#fff;color:#7c2340}
  .seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;flex:none}
  .seg button{background:none;color:#fff;font:800 12px 'Nunito',sans-serif;padding:8px 12px}
  .seg button.on{background:#e0952a}
  #bar .ic{background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;flex:none}
  #stage{position:relative;height:calc(100% - 56px);background:#3a1020;display:flex;align-items:stretch;justify-content:center}
  #page{flex:1;max-width:1000px;background:#f4e9d8;box-shadow:0 0 40px rgba(0,0,0,.4);overflow:hidden;transition:opacity .18s}
  #page.turn{opacity:0}
  #page iframe{width:100%;height:100%;border:none;display:block;background:#f4e9d8}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:#7c2340;color:#fff;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:5;opacity:.9}
  .arrow:hover{opacity:1}
  #prev{left:14px}#next{right:14px}
  .arrow:disabled{opacity:.25;cursor:default}
  #foot{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.35);padding:6px 14px;border-radius:999px;font:800 12px 'Nunito',sans-serif;z-index:5}
</style>
</head>
<body>
  <div id="bar">
    <a class="home" href="#" id="hub">← Все юниты</a>
    <span class="title" id="ttl">Speakout</span>
    <div class="tabs" id="tabs"></div>
    <div class="seg" id="mode">
      <button data-m="lesson" class="on">📚 Урок</button>
      <button data-m="grammar">✏️ Грамматика</button>
      <button data-m="workbook">📒 Workbook</button>
    </div>
    <button class="ic" id="full" title="На весь экран">⛶</button>
  </div>
  <div id="stage">
    <button class="arrow" id="prev" aria-label="Назад">‹</button>
    <div id="page"><iframe id="frame" title="Страница книги"></iframe></div>
    <button class="arrow" id="next" aria-label="Вперёд">›</button>
    <div id="foot" id="pos"></div>
  </div>
<script>
  var params=new URLSearchParams(location.search);
  var course=params.get("course")||"speakout-b1plus";
  var LABEL={"speakout-b1":"Speakout B1","speakout-b1plus":"Speakout B1+"};
  var HUB={"speakout-b1":"speakout-b1-course.html","speakout-b1plus":"speakout-b1plus-course.html"};
  var n=Math.max(1,Math.min(8, parseInt(params.get("u")||"1",10)||1));
  var mode="lesson";
  document.getElementById("ttl").textContent=LABEL[course]||"Speakout";
  document.getElementById("hub").href=HUB[course]||"index.html";
  var tabs=document.getElementById("tabs");
  for(var i=1;i<=8;i++){(function(u){var b=document.createElement("button");b.className="tab"+(u===n?" on":"");b.textContent="U"+u;b.onclick=function(){n=u;render(true);};tabs.appendChild(b);})(i);}
  function src(){ var suf=mode==="grammar"?"-grammar":(mode==="workbook"?"-workbook":""); return course+"-u"+n+suf+".html"; }
  function render(turn){
    var f=document.getElementById("frame"),p=document.getElementById("page");
    function go(){ f.src=src();
      [].forEach.call(tabs.children,function(b,i){b.classList.toggle("on",(i+1)===n);});
      document.querySelectorAll("#mode button").forEach(function(b){b.classList.toggle("on",b.dataset.m===mode);});
      document.getElementById("prev").disabled=(n<=1);
      document.getElementById("next").disabled=(n>=8);
      document.getElementById("foot").textContent=(LABEL[course]||"")+" · Unit "+n+" / 8 · "+(mode==="grammar"?"грамматика":(mode==="workbook"?"workbook":"лексика и чанки"));
      var u=new URLSearchParams(location.search);u.set("course",course);u.set("u",n);history.replaceState(null,"","?"+u.toString());
    }
    if(turn){ p.classList.add("turn"); setTimeout(function(){go();p.classList.remove("turn");},160); } else go();
  }
  document.getElementById("prev").onclick=function(){ if(n>1){n--;render(true);} };
  document.getElementById("next").onclick=function(){ if(n<8){n++;render(true);} };
  document.querySelectorAll("#mode button").forEach(function(b){b.onclick=function(){mode=b.dataset.m;render(true);};});
  document.getElementById("full").onclick=function(){ var el=document.documentElement; if(document.fullscreenElement){document.exitFullscreen();} else if(el.requestFullscreen){el.requestFullscreen();} };
  document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight"&&n<8){n++;render(true);} else if(e.key==="ArrowLeft"&&n>1){n--;render(true);} });
  render(false);
</script>
</body>
</html>
