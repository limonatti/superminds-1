<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет учителя · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Archivo',sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 32px;
    border-bottom:2px solid var(--color-divider);background:var(--color-bg);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .brand i{width:24px;height:24px;background:var(--color-accent);display:block}
  .nav{display:flex}
  .nav a{position:relative;padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--color-neutral-800)}
  .nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--color-accent)}
  .nav a:hover{background:var(--color-accent-100)}
  .pill{border:2px solid var(--color-text);padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--color-text);text-decoration:none;background:none;display:inline-block}
  .pill:hover{background:var(--color-text);color:var(--color-bg)}

  .wrap{max-width:1000px;margin:0 auto;padding:44px 32px 64px}
  h1{margin:0;font-size:56px;line-height:1;font-weight:800;letter-spacing:-.02em}
  .sub{margin:12px 0 28px;font-size:18px;font-weight:500;color:var(--color-neutral-700)}

  .panel{border:2px solid var(--color-divider);background:var(--color-surface);padding:0}
  .panel>*{padding-left:26px;padding-right:26px}
  .tabs{display:flex;padding:0!important;border-bottom:2px solid var(--color-divider)}
  .tab{flex:1;background:none;border:0;border-right:2px solid var(--color-divider);padding:14px;
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)}
  .tab:last-child{border-right:0}
  .tab.on{background:var(--color-accent);color:#fff}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin:18px 0 7px}
  input{width:100%;border:2px solid var(--color-text);border-radius:0;padding:13px 14px;font:600 16px 'Archivo',sans-serif;color:var(--color-text);background:var(--color-bg)}
  input:focus{outline:none;border-color:var(--color-accent)}
  select{font-family:'Archivo',sans-serif;border-radius:0}
  .primary{width:100%;margin:22px 0 0;background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:16px;
    font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .primary:hover{background:var(--color-accent-700)}
  .msg{margin:12px 0 0;font-size:13px;font-weight:700;min-height:18px;padding-bottom:22px}
  .msg.err{color:var(--color-accent)}.msg.ok{color:var(--color-neutral-800)}
  .note{font-size:13px;font-weight:600;color:var(--color-neutral-700);padding-top:22px;padding-bottom:22px;line-height:1.55}

  .who{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px;border-bottom:2px solid var(--color-divider)}
  .who .name{font-size:28px;font-weight:800;letter-spacing:-.01em}
  .logout{background:none;border:2px solid var(--color-text);border-radius:0;padding:9px 16px;
    font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)}
  .logout:hover{background:var(--color-text);color:var(--color-bg)}

  .codebox{margin:0 -26px 0;padding:24px 26px;border-bottom:2px solid var(--color-divider);background:var(--color-bg)}
  .codebox .lbl{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:10px}
  .codebox .code{font-size:44px;font-weight:800;letter-spacing:.14em;line-height:1;margin:0 0 12px;color:var(--color-accent)}
  .codebox button{background:none;border:2px solid var(--color-text);border-radius:0;padding:9px 16px;
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text);margin-right:6px}
  .codebox button:hover{background:var(--color-text);color:var(--color-bg)}
  .codebox .hint{font-size:12px;font-weight:600;color:var(--color-neutral-600);margin-top:14px;line-height:1.5}
  .codebox .lnk{display:inline-block;border:2px solid var(--color-text);padding:9px 16px;margin:6px 6px 0 0;
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text)}
  .codebox .lnk:hover{background:var(--color-text);color:var(--color-bg)}

  .sec-title{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);
    padding-top:22px;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .sec-title button{background:none;border:2px solid var(--color-neutral-400);border-radius:0;padding:6px 12px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)}
  .sec-title button:hover{border-color:var(--color-text);color:var(--color-text)}

  .srow{display:flex;align-items:center;gap:12px;padding:4px 0;flex-wrap:wrap}
  .srow .av{width:36px;height:36px;border:2px solid var(--color-divider);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
  .srow .nm{font-size:17px;font-weight:800;flex:1;min-width:110px;letter-spacing:-.01em}
  .srow .st{font-size:12px;font-weight:700;color:var(--color-neutral-700);display:flex;gap:12px;flex-wrap:wrap}
  .srow .st b{color:var(--color-text)}
  .empty{font-size:14px;font-weight:600;color:var(--color-neutral-700);padding:22px 0}
  .bigInvite{background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:14px 22px;
    font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .bigInvite:hover{background:var(--color-accent-700)}
  .bigInvite:disabled{opacity:.5}
  .invout{margin-top:12px;font-size:12.5px;font-weight:700}
  .invout.err{color:var(--color-accent)}
  .invout .invlink{background:var(--color-surface);border:2px dashed var(--color-neutral-500);padding:12px;word-break:break-all;font-weight:600}
  .invout .invcopy{margin-top:8px;background:var(--color-text);color:var(--color-bg);border:0;border-radius:0;padding:10px 18px;
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .scard{border:2px solid var(--color-divider);padding:14px 16px;margin-bottom:12px;background:var(--color-bg)}
  .assign-btn{background:none;color:var(--color-text);border:2px solid var(--color-text);border-radius:0;padding:7px 12px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:none}
  .assign-btn:hover{background:var(--color-text);color:var(--color-bg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--color-accent-100);border:2px solid var(--color-accent);
    padding:4px 9px;font-size:11.5px;font-weight:800;color:var(--color-text)}
  .chip.done{background:var(--color-neutral-200);border-color:var(--color-neutral-400);color:var(--color-neutral-700)}
  .chip .del{background:none;border:0;color:var(--color-accent);cursor:pointer;font-size:12px;padding:0}
  .assignform{display:none;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
  .assignform select{border:2px solid var(--color-text);padding:9px;font-size:12px;font-weight:700;background:var(--color-bg);flex:1;min-width:130px}
  .assignform .assign-go{background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:9px 18px;
    font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .foot{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:18px;border-top:2px solid var(--color-divider);
    font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)}

  .spk-btn{background:none;color:var(--color-text);border:2px solid var(--color-neutral-500);border-radius:0;padding:7px 12px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:none;margin-top:10px}
  .spk-btn:hover{border-color:var(--color-text)}
  .spk-panel{display:none;margin:12px 0 2px;background:var(--color-surface);border:2px solid var(--color-divider);padding:14px}
  .spk-panel.on{display:block}
  .spk-panel .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .spk-panel select,.spk-panel input{border:2px solid var(--color-neutral-500);border-radius:0;padding:9px;
    font-size:12.5px;font-weight:700;background:var(--color-bg);color:var(--color-text)}
  .spk-panel input{flex:1;min-width:130px;width:auto}
  .spk-panel .go{background:var(--color-text);color:var(--color-bg);border:0;border-radius:0;padding:9px 16px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .spk-panel .go:hover{background:var(--color-accent)}
  .spk-panel .lbl2{font-size:11px;font-weight:800;color:var(--color-neutral-600);letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px}
  .hwchip{display:inline-flex;align-items:center;gap:6px;background:var(--color-bg);border:2px solid var(--color-neutral-500);
    padding:4px 9px;font-size:11.5px;font-weight:800;color:var(--color-text);margin:0 5px 5px 0}
  .hwchip.done{opacity:.55}
  .hwchip .del{background:none;border:0;color:var(--color-accent);cursor:pointer;font-size:12px}
  .resbtn{display:block;width:100%;text-align:left;background:var(--color-bg);border:2px solid var(--color-neutral-400);border-radius:0;
    padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--color-text);margin-bottom:6px}
  .resbtn:hover{border-color:var(--color-text);background:var(--color-accent-100)}
  .att{padding:9px 12px;margin-bottom:5px;font-size:12.5px;font-weight:600;border-left:6px solid}
  .att.ok{background:var(--color-neutral-200);border-color:var(--color-neutral-600)}
  .att.no{background:var(--color-accent-100);border-color:var(--color-accent)}
  .att .qa{color:var(--color-neutral-700);margin-top:3px}
  @media(max-width:640px){
    .nav{display:none}.bar{padding:14px 20px}.wrap{padding:30px 20px 48px}h1{font-size:38px}
    .codebox .code{font-size:32px}.foot{flex-direction:column;gap:6px}
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand"><i></i>English with Asya</span>
    <nav class="nav">
      <a href="index.html">Учебники</a>
      <a href="course.html">Курс</a>
      <a href="cabinet.html">Кабинет ученика</a>
      <a class="on" href="teacher.html">Кабинет учителя</a>
    </nav>
    <a class="pill" href="board.html">Доска</a>
  </div>
  <div class="wrap">
    <div style="font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px">Учитель / Teacher</div>
    <h1>Мой класс</h1>
    <div class="sub" id="sub">вход и твой класс</div>
    <div id="root"></div>
    <div class="foot"><span>Made for @english.with_asya</span><span>класс и прогресс</span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="words.js"></script>
  <script src="sm-auth.js"></script>
  <script>
    let authTab="in";
    function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    function copyText(txt){
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert("Скопировано!\n\n"+txt),()=>prompt("Скопируй:",txt));
      else prompt("Скопируй:",txt);
    }
    function ago(ts){ if(!ts)return "—"; const d=(Date.now()-new Date(ts).getTime())/86400000;
      if(d<1)return "сегодня"; if(d<2)return "вчера"; return Math.floor(d)+" дн. назад"; }
    function learned(data){ let n=0; for(const k in data){ if(k==="__meta")continue; if(data[k]&&data[k].status==="learned")n++; } return n; }

    function renderAuth(){
      if(!SM.isCloud){
        document.getElementById("sub").textContent="нужен Supabase";
        document.getElementById("root").innerHTML='<div class="panel"><div class="note">Кабинет учителя работает только с настоящими аккаунтами (Supabase). Он уже подключён — если видишь это сообщение, обнови страницу.</div></div>';
        return;
      }
      document.getElementById("sub").textContent="войди как учитель";
      document.getElementById("root").innerHTML=
        '<div class="panel">'+
          '<div class="tabs"><button class="tab '+(authTab==="in"?"on":"")+'" onclick="setTab(\'in\')">Вход</button><button class="tab '+(authTab==="up"?"on":"")+'" onclick="setTab(\'up\')">Регистрация</button></div>'+
          (authTab==="up"?'<label>ИМЯ</label><input id="fName" placeholder="Ася">':'')+
          '<label>EMAIL</label><input id="fEmail" type="email" placeholder="mail@example.com">'+
          '<label>ПАРОЛЬ</label><input id="fPass" type="password" placeholder="минимум 6 символов">'+
          '<button class="primary" id="go">'+(authTab==="in"?"Войти":"Создать аккаунт учителя")+'</button>'+
          '<div class="msg" id="msg"></div>'+
        '</div>';
      document.getElementById("go").onclick=submit;
    }
    function setTab(t){authTab=t;renderAuth();}
    async function submit(){
      const msg=document.getElementById("msg");msg.className="msg";msg.textContent="…";
      const name=(document.getElementById("fName")||{}).value||"";
      const email=(document.getElementById("fEmail")||{}).value||"";
      const pass=(document.getElementById("fPass")||{}).value||"";
      let res;
      if(authTab==="up")res=await SM.signUp(name,email,pass); else res=await SM.signIn(email,pass);
      if(!res.ok){msg.className="msg err";msg.textContent=res.error||"Ошибка";return;}
      if(res.needConfirm){msg.className="msg ok";msg.textContent="Аккаунт создан! Подтверди email и войди.";return;}
      route();
    }

    async function renderDash(user){
      document.getElementById("sub").textContent="твой класс и прогресс учеников";
      const root=document.getElementById("root");
      root.innerHTML='<div class="panel"><div class="who"><div class="name">'+esc(user.name)+'</div><button class="logout" id="out">Выйти</button></div><div id="body"><div class="empty">Загрузка…</div></div></div>';
      document.getElementById("out").onclick=async()=>{await SM.signOut();route();};

      const codeRes=await SM.ensureTeacherCode(user.name);
      const code=codeRes.code||"—";
      const students=await SM.myStudents();
      let asg=[]; try{ asg=await SM.classAssignments(); }catch(e){}
      const byStudent={}; asg.forEach(a=>{ (byStudent[a.student_id]=byStudent[a.student_id]||[]).push(a); });
      const unitOptions=SM_UNITS.map(u=>'<option value="'+u.id+'">'+u.emoji+' '+esc(u.title)+'</option>').join("");
      const kindOptions='<option value="trainer">🎯 Тренажёр</option><option value="games">🎮 Игры</option><option value="worksheet">✏️ Лист</option>';
      const kmap={trainer:"🎯",games:"🎮",worksheet:"✏️"};
      function uLabel(uid){var u=SM_UNITS.find(x=>x.id===uid);return u?(u.emoji+" "+u.title):uid;}

      const inviteBase = location.origin + location.pathname.replace(/teacher\.html$/,"join.html");
      const rows = students.length ? students.map(s=>{
        const data=s.data||{}; const meta=data.__meta||{}; const sid=s.student_id;
        const chips=(byStudent[sid]||[]).map(a=>'<span class="chip'+(a.done?" done":"")+'">'+(kmap[a.kind]||"🎯")+' '+esc(uLabel(a.unit_id))+' '+(a.done?"✓":"⏳")+'<button class="del" data-id="'+a.id+'">✕</button></span>').join("");
        return '<div class="scard">'+
          '<div class="srow"><div class="av">🧒</div><div class="nm">'+esc(s.name)+'</div>'+
            '<div class="st"><span>✅ <b>'+learned(data)+'</b></span><span>⭐ '+(meta.totalPoints||0)+'</span><span>🔥 '+(meta.dayStreak||0)+'</span><span>🕘 '+ago(s.updated_at)+'</span></div>'+
            '<button class="assign-btn" data-sid="'+sid+'">Задать</button></div>'+
          (chips?'<div class="chips">'+chips+'</div>':'')+
          '<div class="assignform" id="af-'+sid+'"><select class="af-unit">'+unitOptions+'</select><select class="af-kind">'+kindOptions+'</select><button class="assign-go" data-sid="'+sid+'">Задать</button></div>'+
          '<button class="spk-btn" data-sid="'+sid+'">Speakout — курс, ДЗ, результаты</button><div class="spk-panel" id="spk-'+sid+'"></div>'+
        '</div>';
      }).join("") : '<div class="empty">Пока нет учеников.<br><br><button class="bigInvite" id="emptyInvite">Пригласить ученика</button></div>';

      document.getElementById("body").innerHTML=
        '<div class="codebox"><div class="lbl">ПРИГЛАСИТЬ УЧЕНИКА</div>'+
          '<button class="bigInvite" id="mkInvite">Создать ссылку-приглашение</button>'+
          '<div class="invout" id="invout"></div>'+
          '<div class="lbl" style="margin-top:12px">ПОСТОЯННЫЙ КОД КЛАССА</div><div class="code">'+esc(code)+'</div>'+
          '<button id="copy">Скопировать код</button>'+
          '<a class="lnk" href="room.html">Комната урока</a>'+
          '<a class="lnk" href="builder.html">Конструктор</a>'+
          '<a class="lnk" href="admin.html">Учебники</a>'+
          '<div class="hint">Ссылка одноразовая — по ней зарегистрируется один ученик. Код класса работает всегда.</div></div>'+
        '<div class="sec-title">Мои ученики · '+students.length+'<button id="refresh">Обновить</button></div>'+
        rows;

      document.getElementById("refresh").onclick=()=>renderDash(user);
      document.querySelectorAll(".assign-btn").forEach(b=>b.onclick=()=>{var f=document.getElementById("af-"+b.dataset.sid);f.style.display=(f.style.display==="flex"?"none":"flex");});
      document.querySelectorAll(".assign-go").forEach(b=>b.onclick=async()=>{
        var card=document.getElementById("af-"+b.dataset.sid);var unit=card.querySelector(".af-unit").value;var kind=card.querySelector(".af-kind").value;
        b.textContent="…";var r=await SM.assignTo(b.dataset.sid,unit,kind);
        if(r.ok)renderDash(user);else{b.textContent="Задать";alert(r.error||"Ошибка");}
      });
      document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{ if(!confirm("Удалить задание?"))return; await SM.deleteAssignment(b.dataset.id); renderDash(user);});
      document.querySelectorAll(".spk-btn").forEach(b=>b.onclick=()=>{var p=document.getElementById("spk-"+b.dataset.sid);var open=p.classList.toggle("on");if(open&&!p.dataset.loaded){p.dataset.loaded="1";loadSpk(b.dataset.sid);}});
      document.getElementById("copy").onclick=()=>{
        const txt="Заходи ко мне на English with Asya! Открой ссылку и впиши имя с паролем:\n"+inviteBase+"?i="+code;
        copyText(txt);
      };
      async function makeInvite(btn){
        btn.disabled=true; const old=btn.textContent; btn.textContent="…";
        const r=await SM.createInvite(null);
        btn.disabled=false; btn.textContent=old;
        const out=document.getElementById("invout");
        if(!r.ok){ if(out){out.className="invout err";out.textContent=r.error||"Не получилось создать ссылку";} else alert(r.error||"Ошибка"); return; }
        const link=inviteBase+"?i="+r.code;
        if(out){
          out.className="invout ok";
          out.innerHTML='<div class="invlink">'+esc(link)+'</div><button class="invcopy">📋 Скопировать ссылку</button>';
          out.querySelector(".invcopy").onclick=()=>copyText("Заходи ко мне на English with Asya! Открой ссылку и впиши имя с паролем:\n"+link);
        } else copyText("Заходи ко мне на English with Asya! Открой ссылку и впиши имя с паролем:\n"+link);
      }
      document.getElementById("mkInvite").onclick=(e)=>makeInvite(e.target);
      var ei=document.getElementById("emptyInvite");
      if(ei)ei.onclick=()=>document.getElementById("mkInvite").click();
    }


    function fmtMs(ms){ms=ms||0;var sec=Math.round(ms/1000);var m=Math.floor(sec/60);return m+"м "+(sec%60)+"с";}
    function stripTags(h){return (h||"").replace(/<[^>]*>/g,"");}
    const SPK_COURSES=[["speakout-b1","Speakout B1"],["speakout-b1plus","Speakout B1+"]];
    const SPK_L={"speakout-b1":"Speakout B1","speakout-b1plus":"Speakout B1+"};
    async function loadSpk(sid){
      const el=document.getElementById("spk-"+sid); el.innerHTML='<div class="lbl2">Загрузка…</div>';
      let course=null,hw=[],mats=[],sum=[];
      try{course=await SM.studentCourse(sid);}catch(e){}
      try{hw=await SM.listHW(sid);}catch(e){}
      try{mats=await SM.listMaterials(sid);}catch(e){}
      try{sum=await SM.studentHwSummary(sid);}catch(e){}
      const cOpts=SPK_COURSES.map(c=>'<option value="'+c[0]+'"'+(c[0]===course?' selected':'')+'>'+c[1]+'</option>').join("");
      const uOpts=[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'">Unit '+n+'</option>').join("");
      let html='<div class="lbl2">КУРС УЧЕНИКА</div><div class="r"><select class="sp-course">'+cOpts+'</select><button class="go sp-savecourse">Назначить курс</button></div>';
      html+='<div class="lbl2">ДОМАШКА ПО ЮНИТУ</div><div class="r"><select class="sp-unit">'+uOpts+'</select><input class="sp-note" placeholder="заметка (необяз.)"><button class="go sp-addhw">Задать ДЗ</button></div>';
      if(hw.length)html+='<div>'+hw.map(a=>'<span class="hwchip'+(a.done?" done":"")+'">'+(SPK_L[a.course]||a.course)+' U'+a.unit+' '+(a.done?"✓":"⏳")+'<button class="del sp-delhw" data-id="'+a.id+'">✕</button></span>').join("")+'</div>';
      html+='<div class="lbl2">МАТЕРИАЛ (ссылка)</div><div class="r"><input class="sp-mtitle" placeholder="название"><input class="sp-murl" placeholder="https://…"><button class="go sp-addmat">Добавить</button></div>';
      if(mats.length)html+='<div>'+mats.map(m=>'<span class="hwchip">🔗 '+esc(m.title)+'<button class="del sp-delmat" data-id="'+m.id+'">✕</button></span>').join("")+'</div>';
      html+='<div class="lbl2">РЕЗУЛЬТАТЫ (нажми юнит — увидишь ответы)</div>';
      html+= sum.length ? sum.map(r=>'<button class="resbtn sp-res" data-c="'+r.course+'" data-u="'+r.unit+'">'+(SPK_L[r.course]||r.course)+' · Unit '+r.unit+' — <b>'+r.correct+'/'+r.attempts+'</b> верно · ⏱ '+fmtMs(r.total_ms)+'</button>').join("")
                          : '<div class="lbl2" style="color:#a99a86">Пока нет выполненных упражнений.</div>';
      html+='<div class="sp-detail"></div>';
      el.innerHTML=html;
      el.querySelector(".sp-savecourse").onclick=async(e)=>{e.target.textContent="…";const r=await SM.enrolCourse(sid,el.querySelector(".sp-course").value);e.target.textContent=r.ok?"Готово ✓":"Назначить курс";};
      el.querySelector(".sp-addhw").onclick=async(e)=>{e.target.textContent="…";const c=el.querySelector(".sp-course").value;const u=+el.querySelector(".sp-unit").value;const n=el.querySelector(".sp-note").value;const r=await SM.addHW(sid,c,u,n);if(r.ok)loadSpk(sid);else{e.target.textContent="Задать ДЗ";alert(r.error||"Ошибка");}};
      el.querySelector(".sp-addmat").onclick=async(e)=>{const t=el.querySelector(".sp-mtitle").value.trim();const url=el.querySelector(".sp-murl").value.trim();if(!t||!url){alert("Впиши название и ссылку");return;}e.target.textContent="…";const r=await SM.addMaterial(sid,t,url,"");if(r.ok)loadSpk(sid);else{e.target.textContent="Добавить";alert(r.error||"Ошибка");}};
      el.querySelectorAll(".sp-delhw").forEach(b=>b.onclick=async()=>{await SM.deleteHW(b.dataset.id);loadSpk(sid);});
      el.querySelectorAll(".sp-delmat").forEach(b=>b.onclick=async()=>{await SM.deleteMaterial(b.dataset.id);loadSpk(sid);});
      el.querySelectorAll(".sp-res").forEach(b=>b.onclick=async()=>{
        const det=el.querySelector(".sp-detail");det.innerHTML='<div class="lbl2">Загрузка…</div>';
        const rows=await SM.studentHwResults(sid,b.dataset.c,+b.dataset.u);
        det.innerHTML = rows.length ? ('<div class="lbl2">'+(SPK_L[b.dataset.c]||b.dataset.c)+' · Unit '+b.dataset.u+' — ответы ученика</div>'+
          rows.map(a=>'<div class="att '+(a.correct?"ok":"no")+'"><div>'+(a.correct?"✅":"❌")+' '+esc(stripTags(a.question))+'</div><div class="qa">ответ: <b>'+esc(a.answer||"—")+'</b></div></div>').join(""))
          : '<div class="lbl2" style="color:#a99a86">Нет данных.</div>';
      });
    }

    async function route(){ const user=await SM.getUser(); if(user)renderDash(user); else renderAuth(); }
    route();
  </script>
</body>
</html>
