<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Комната урока · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#e9dfca;color:#1c1310}
  button,select,a{font-family:inherit}
  #top{height:52px;background:#7c2340;display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff}
  #top a.home{color:#fff;text-decoration:none;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;font:800 13px 'Nunito',sans-serif;white-space:nowrap}
  #top .title{font:800 16px 'Nunito',sans-serif;white-space:nowrap}
  #top .rc{margin-left:auto;display:flex;align-items:center;gap:8px}
  #top .room{background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;font:800 13px 'Nunito',sans-serif;white-space:nowrap}
  #top .room .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f0c96b;margin-right:5px}
  #top .room.on .dot{background:#7ee787}
  #invite{background:#e0952a;color:#fff;border:none;cursor:pointer;padding:8px 14px;border-radius:999px;font:800 13px 'Nunito',sans-serif}
  #top button.tb{background:rgba(255,255,255,.16);color:#fff;border:none;cursor:pointer;padding:8px 12px;border-radius:999px;font:800 13px 'Nunito',sans-serif;white-space:nowrap}
  #panel.collapsed{display:none}
  #panelShow{display:none;position:fixed;right:12px;bottom:12px;z-index:20;background:#7c2340;color:#fff;border:none;cursor:pointer;padding:11px 16px;border-radius:999px;font:800 14px 'Nunito',sans-serif;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  #panelShow.on{display:block}
  #videoWrap{position:fixed;top:64px;left:16px;width:340px;z-index:40;background:#111;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.45);display:none}
  #videoWrap.on{display:block}
  #vidHead{display:flex;align-items:center;justify-content:space-between;background:#7c2340;color:#fff;font:800 12px 'Nunito',sans-serif;padding:6px 10px;cursor:move;user-select:none}
  #vidHead button{background:rgba(255,255,255,.2);color:#fff;border:none;cursor:pointer;width:22px;height:22px;border-radius:6px;font-size:15px;line-height:1}
  #vidBody{width:340px;height:250px;background:#111}
  #vidBody iframe{width:100%!important;height:100%!important;border:none;display:block}

  #main{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex}
  #boardCol{flex:1.7;min-width:0;border-right:3px solid #d9c9ac}
  #boardCol iframe{width:100%;height:100%;border:none;display:block}
  #panel{flex:1;min-width:280px;max-width:440px;background:#fff;display:flex;flex-direction:column}
  .prow{padding:12px 14px;border-bottom:2px solid #f1e7d5}
  .lbl{font:900 11px 'Nunito',sans-serif;color:#8a7a68;letter-spacing:.6px;margin-bottom:8px}
  select#unit,select#course{width:100%;border:2px solid #e3d3ba;border-radius:12px;padding:11px;font:800 15px 'Nunito',sans-serif;color:#1c1310;background:#fdfbf7}
  .acts{display:flex;gap:8px;margin-top:10px}
  .act{flex:1;border:2px solid #e3d3ba;background:#fff;border-radius:12px;padding:10px;font:800 14px 'Nunito',sans-serif;color:#5a4f47;cursor:pointer}
  .act.on{background:#7c2340;border-color:#7c2340;color:#fff}
  .openbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .open{background:#f4e9d8;border:none;border-radius:999px;padding:8px 14px;font:800 12.5px 'Nunito',sans-serif;color:#7c2340;cursor:pointer;text-decoration:none}
  #frameWrap{flex:1;min-height:0}
  #frameWrap iframe{width:100%;height:100%;border:none;display:block;background:#f4e9d8}
  .hint{font:700 12px 'Nunito',sans-serif;color:#a99a86;margin-top:8px;line-height:1.4}
  @media(max-width:820px){#main{flex-direction:column}#boardCol{flex:none;height:52%;border-right:none;border-bottom:3px solid #d9c9ac}#panel{max-width:none;height:48%}}
</style>
</head>
<body>
  <div id="top">
    <a class="home" href="course.html">← Домой</a>
    <span class="title">🧑‍🏫 Комната урока</span>
    <span class="rc">
      <span class="room" id="room"><span class="dot"></span><span id="roomTxt">…</span></span>
      <button class="tb" id="vidBtn">📹 Видео</button>
      <button class="tb" id="panelBtn">⟨ Панель</button>
      <button id="invite">🔗 Позвать ученика</button>
    </span>
  </div>

  <div id="main">
    <div id="boardCol"><iframe id="board" title="Доска"></iframe></div>
    <div id="panel">
      <div class="prow">
        <div class="lbl">КУРС</div>
        <select id="course"></select>
        <div class="lbl" style="margin-top:10px">ЮНИТ УРОКА</div>
        <select id="unit"></select>
        <div class="acts">
          <button class="act on" id="aTrainer" data-k="trainer">🎯 Тренажёр</button>
          <button class="act" id="aGames" data-k="games">🎮 Игры</button>
        </div>
        <div class="openbtns">
          <a class="open" id="openTr" target="_blank">Тренажёр ↗</a>
          <a class="open" id="openGm" target="_blank">Игры ↗</a>
          <a class="open" id="openWs" target="_blank">✏️ Лист ↗</a>
          <a class="open" id="openLesson" target="_blank" style="display:none">Открыть урок ↗</a>
          <button class="open" id="toBoard">＋ Слова на доску</button>
          <button class="open" id="tbToggle">📖 Скрыть учебник</button>
        </div>
        <div class="hint">Юнит и задание видят оба. Рисуйте вместе на доске слева. «Позвать ученика» — отправь ссылку, он войдёт в эту же комнату.</div>
      </div>
      <div id="frameWrap"><iframe id="frame" title="Задание"></iframe></div>
    </div>
  </div>
  <div id="videoWrap"><div id="vidHead"><span>📹 Видео с учеником</span><button id="vidClose" aria-label="Закрыть">×</button></div><div id="vidBody"></div></div>
  <button id="panelShow">⟩ Показать панель</button>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="words.js"></script>
  <script>
    const params=new URLSearchParams(location.search);
    let room=params.get("room");
    if(!room){ room=Math.random().toString(36).slice(2,7).toUpperCase(); history.replaceState(null,"","?room="+room); }

    // доска в iframe (сама синхронизируется по board:room)
    document.getElementById("board").src="board.html?room="+encodeURIComponent(room);

    // выбор курса + юнита + задания
    const COURSES=[{id:"sm",label:"🧒 Super Minds 1"},{id:"speakout-b1",label:"🗣️ Speakout B1"},{id:"speakout-b1plus",label:"🗣️ Speakout B1+"}];
    const courseSel=document.getElementById("course");
    const unitSel=document.getElementById("unit");
    COURSES.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=c.label;courseSel.appendChild(o);});
    let course="sm", kind="trainer", unit="";
    function buildUnits(){
      unitSel.innerHTML="";
      if(course==="sm"){
        SM_UNITS.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.emoji+" "+u.unit+" · "+u.title;unitSel.appendChild(o);});
        unit=SM_UNITS[0].id;
      } else {
        for(let n=1;n<=8;n++){const o=document.createElement("option");o.value=String(n);o.textContent="Unit "+n;unitSel.appendChild(o);}
        unit="1";
      }
    }
    buildUnits();

    function frameSrc(){ return course==="sm" ? ((kind==="games"?"games.html?u=":"trainer.html?unit=")+unit) : (course+"-u"+unit+".html"); }
    function apply(broadcast){
      const isSM=course==="sm";
      document.getElementById("frame").src=frameSrc();
      document.querySelector(".acts").style.display=isSM?"flex":"none";
      document.getElementById("aTrainer").classList.toggle("on",kind==="trainer");
      document.getElementById("aGames").classList.toggle("on",kind==="games");
      ["openTr","openGm","openWs","toBoard"].forEach(id=>document.getElementById(id).style.display=isSM?"":"none");
      document.getElementById("openLesson").style.display=isSM?"none":"";
      if(isSM){
        document.getElementById("openTr").href="trainer.html?unit="+unit;
        document.getElementById("openGm").href="games.html?u="+unit;
        document.getElementById("openWs").href="worksheet.html?u="+unit;
      } else {
        document.getElementById("openLesson").href=course+"-u"+unit+".html";
      }
      courseSel.value=course; unitSel.value=unit;
      if(broadcast) send({course:course,unit:unit,kind:kind});
    }
    courseSel.onchange=()=>{course=courseSel.value;buildUnits();apply(true);};
    unitSel.onchange=()=>{unit=unitSel.value;apply(true);};
    document.getElementById("aTrainer").onclick=()=>{kind="trainer";apply(true);};
    document.getElementById("aGames").onclick=()=>{kind="games";apply(true);};
    document.getElementById("toBoard").onclick=()=>{
      const bf=document.getElementById("board");
      try{ bf.contentWindow.postMessage({type:"sm-add",unit:unit}, location.origin); }catch(e){}
    };

    // синхронизация панели урока через Supabase Realtime
    const SB_URL="https://kdzpmbuohfjbtjpqrdfx.supabase.co";
    const SB_KEY="sb_publishable_K8vhCVG_jiEyHYQOgp3XWQ_bWobdeBG";
    let channel=null, online=false;
    function setOnline(on){document.getElementById("room").classList.toggle("on",on);document.getElementById("roomTxt").textContent=(on?"комната ":"оффлайн · ")+room;}
    setOnline(false);
    (function(){try{
      const sb=window.supabase.createClient(SB_URL,SB_KEY);
      channel=sb.channel("lesson:"+room,{config:{broadcast:{self:false}}});
      channel.on("broadcast",{event:"op"},({payload})=>{
        if(payload.t==="state"){ if(payload.course&&payload.course!==course){course=payload.course;buildUnits();} unit=payload.unit;kind=payload.kind;apply(false);}
        else if(payload.t==="hello"){send({unit:unit,kind:kind});}
      });
      channel.subscribe(st=>{ if(st==="SUBSCRIBED"){online=true;setOnline(true);channel.send({type:"broadcast",event:"op",payload:{t:"hello"}});} });
    }catch(e){}})();
    function send(s){ if(channel&&online){try{channel.send({type:"broadcast",event:"op",payload:{t:"state",course:s.course,unit:s.unit,kind:s.kind}});}catch(e){}} }

    document.getElementById("invite").onclick=()=>{
      const url=location.origin+location.pathname+"?room="+room;
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert("Ссылка на урок скопирована!\nОтправь ученику:\n\n"+url),()=>prompt("Скопируй ссылку:",url));
      else prompt("Скопируй ссылку:",url);
    };

    // Видеозвонок (Jitsi External API) — маленькое плавающее окно поверх доски
    var jitsiApi=null;
    function vidOpen(on){
      var w=document.getElementById("videoWrap"),body=document.getElementById("vidBody"),b=document.getElementById("vidBtn");
      if(on){
        if(jitsiApi)return;
        if(typeof JitsiMeetExternalAPI==="undefined"){ body.innerHTML='<div style="color:#fff;padding:16px;font:700 13px Nunito,sans-serif">Видео ещё грузится, нажми ещё раз через секунду.</div>'; w.classList.add("on"); return; }
        try{
          jitsiApi=new JitsiMeetExternalAPI("meet.jit.si",{
            roomName:"ewa-lesson-"+room,
            parentNode:body, width:"100%", height:"100%",
            userInfo:{displayName:"Учитель"},
            configOverwrite:{prejoinPageEnabled:false, prejoinConfig:{enabled:false}, startWithAudioMuted:false, startWithVideoMuted:false, disableDeepLinking:true}
          });
        }catch(e){ body.innerHTML='<div style="color:#fff;padding:16px;font:700 13px Nunito,sans-serif">Не удалось открыть видео. Обнови страницу.</div>'; }
        w.classList.add("on"); b.textContent="📹 Скрыть видео";
      } else {
        if(jitsiApi){try{jitsiApi.dispose();}catch(e){} jitsiApi=null;}
        w.classList.remove("on"); body.innerHTML=""; b.textContent="📹 Видео";
      }
    }
    document.getElementById("vidBtn").onclick=function(){ vidOpen(!document.getElementById("videoWrap").classList.contains("on")); };
    document.getElementById("vidClose").onclick=function(){ vidOpen(false); };
    (function(){ var w=document.getElementById("videoWrap"),h=document.getElementById("vidHead"),body=document.getElementById("vidBody"),dx=0,dy=0,drag=false;
      h.addEventListener("mousedown",function(e){drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;body.style.pointerEvents="none";e.preventDefault();});
      document.addEventListener("mousemove",function(e){if(!drag)return;w.style.left=Math.max(0,Math.min(window.innerWidth-w.offsetWidth,e.clientX-dx))+"px";w.style.top=Math.max(52,Math.min(window.innerHeight-40,e.clientY-dy))+"px";});
      document.addEventListener("mouseup",function(){if(drag){drag=false;body.style.pointerEvents="";}});
    })();
    // Сворачивание правой панели
    document.getElementById("panelBtn").onclick=function(){
      var p=document.getElementById("panel"),c=p.classList.toggle("collapsed");
      document.getElementById("panelBtn").textContent=c?"⟩ Панель":"⟨ Панель";
      document.getElementById("panelShow").classList.toggle("on",c);
    };
    document.getElementById("tbToggle").onclick=function(){
      var f=document.getElementById("frameWrap"),b=document.getElementById("tbToggle");
      var hidden=(f.style.display==="none");
      f.style.display=hidden?"":"none";
      b.textContent=hidden?"📖 Скрыть учебник":"📖 Показать учебник";
    };
    document.getElementById("panelShow").onclick=function(){
      document.getElementById("panel").classList.remove("collapsed");
      document.getElementById("panelBtn").textContent="⟨ Панель";
      document.getElementById("panelShow").classList.remove("on");
    };

    apply(false);
  </script>
</body>
</html>
