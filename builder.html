  .exrow .t{flex:1;font:800 13.5px 'Archivo',sans-serif;min-width:130px}
  .exrow .badge{background:#cfcecd;color:#4a4644;border-radius:999px;padding:3px 8px;font:900 10px 'Archivo',sans-serif}

<body>

  <div class="wrap">
    <h1>🛠 Конструктор упражнений</h1>
    <div class="sub" id="sub">создавай свои упражнения — как на edvibe</div>
    <div id="root"></div>
    <div class="foot">Made for @english.with_asya</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="words.js?v=c350045e"></script>
<script src="course-words.js?v=442908de"></script>
<script src="speakout-words.js?v=3094c556"></script>
  <script src="sm-auth.js?v=f191dd29"></script>
  <script>
    function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    const TYPES={
      choice:{label:"✅ Выбор ответа"},
      gap:{label:"✍️ Впиши слово"},
      match:{label:"🔗 Найди пару"},
      order:{label:"🔀 Порядок слов"},
      tf:{label:"🟢 Верно / Неверно"},
      listen:{label:"🎧 Аудирование"},
      multi:{label:"☑️ Несколько ответов"},
      categorize:{label:"🗂 Категории"},
      cloze:{label:"🔽 Пропуски-выбор"},
      letters:{label:"🔡 Собери слово"},
      fillbox:{label:"📦 Впиши из банка слов"},
      text:{label:"📖 Текст / статья"},
      image:{label:"🖼 Картинка"},
      video:{label:"🎬 Видео (YouTube)"},
      embed:{label:"🌐 Интерактив по ссылке (Wordwall, LearningApps…)"},
      shadow:{label:"🗣 Shadowing (фразы для повторения вслух)"},
      reading:{label:"📖 Экзамен: чтение с вопросами"},
      tfns:{label:"🔍 Экзамен: True / False / Not stated"},
      wordform:{label:"🔤 Экзамен: словообразование"},
      headings:{label:"📰 Экзамен: подбери заголовки"},
      audio:{label:"🔊 Аудио (озвучка)"},
      dialogue:{label:"💬 Диалог"},
      note:{label:"🗒 Заметка / правило"},
      open:{label:"📝 Открытый вопрос"}
    };
    // const на верхнем уровне скрипта не попадает в window — а модулям он нужен
    window.TYPES=TYPES;
    // типы, где в одном упражнении можно добавлять несколько заданий-вопросов
    const QREPEAT=new Set(["choice","gap","order","tf","listen","multi","cloze","letters","open"]);
    let editId=null;

    /* ---- медиа: файл с компьютера → хранилище ex-media, в упражнение идёт ссылка ----
       Раньше картинка сохранялась как base64 прямо в базу и раздувала упражнение
       на 100–200 КБ. Теперь файл лежит в хранилище, кэшируется браузером,
       а в базе только короткая ссылка. Аудио и видео иначе хранить и нельзя. */
    function busy(btn,on,txt){ if(!btn)return; btn.disabled=on; btn.textContent=on?(txt||"загружаю…"):(btn.dataset.lbl||btn.textContent); }
    function fail(m){ const el=document.getElementById("msg"); if(el){el.className="msg err";el.textContent=m;} else alert(m); }

    async function putFile(file,kind,btn){
      busy(btn,true);
      const r=await SM.uploadMedia(file,kind);
      busy(btn,false);
      if(!r.ok){ fail("Не удалось загрузить файл: "+(r.error||"попробуй ещё раз")); return null; }
      return r.url;
    }

    /* Картинка: сначала ужимаем до 1000px, потом кладём в хранилище */
    function pickImage(input,cb,btn){
      const fi=document.createElement("input");fi.type="file";fi.accept="image/*";
      fi.onchange=()=>{const file=fi.files&&fi.files[0];if(!file)return;
        const rd=new FileReader();
        rd.onload=()=>{const img=new Image();
          img.onload=()=>{const max=1000;let w=img.width,h=img.height;
            if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
            const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
            cv.toBlob(async blob=>{
              const url=await putFile(new File([blob],(file.name||"img").replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}),"img",btn);
              if(url){ input.value=url; if(cb)cb(); }
            },"image/jpeg",0.85);};
          img.onerror=async()=>{ const url=await putFile(file,"img",btn); if(url){input.value=url;if(cb)cb();} };
          img.src=rd.result;};
        rd.readAsDataURL(file);};
      fi.click();
    }

    /* Аудио или видео: кладём как есть */
    function pickMedia(input,accept,kind,cb,btn){
      const fi=document.createElement("input");fi.type="file";fi.accept=accept;
      fi.onchange=async()=>{const file=fi.files&&fi.files[0];if(!file)return;
        const url=await putFile(file,kind,btn); if(url){ input.value=url; if(cb)cb(); }};
      fi.click();
    }

    /* Запись голосом с микрофона — для своей озвучки и образцов произношения */
    let REC=null;
    async function toggleRecord(input,btn,cb){
      if(REC){ REC.stop(); return; }
      if(!navigator.mediaDevices||!window.MediaRecorder){ fail("Браузер не умеет записывать звук — загрузи файл."); return; }
      let stream;
      try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e){ fail("Не дали доступ к микрофону."); return; }
      const chunks=[];
      REC=new MediaRecorder(stream);
      REC.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      REC.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        const type=REC.mimeType||"audio/webm"; REC=null;
        btn.classList.remove("rec"); btn.textContent="🎙 записать";
        const blob=new Blob(chunks,{type});
        const url=await putFile(new File([blob],"voice.webm",{type}),"audio",btn);
        if(url){ input.value=url; if(cb)cb(); }
      };
      REC.start();
      btn.classList.add("rec"); btn.textContent="⏹ остановить";
    }
    /* dataURL → File, чтобы нарисованную картинку положить в то же хранилище,
       что и загруженную с компьютера. В базе останется короткая ссылка. */
    function dataUrlToFile(durl,name){
      const [head,b64]=durl.split(",");
      const mime=(head.match(/data:([^;]+)/)||[])[1]||"image/png";
      const bin=atob(b64); const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      return new File([arr],name||"drawn.png",{type:mime});
    }

    /* Стиль картинок. Детские курсы и взрослые рисуются по-разному, поэтому
       стиль предлагается по курсу, но его можно сменить перед генерацией. */
    const IMG_STYLES=[["modern","современная иллюстрация"],["kids","детская картинка"],["photo","фотореалистично"],["soft","мягкая акварель"]];
    const KIDS_COURSES=["sm1","sm2","gateway-a1p"];
    function defaultStyle(){
      const cid=(document.getElementById("course")||{}).value||"";
      return KIDS_COURSES.indexOf(cid)>=0?"kids":"modern";
    }
    function currentStyle(){
      const s=document.getElementById("imgStyle");
      return (s&&s.value)||defaultStyle();
    }
    function styleSelectHTML(){
      const cur=defaultStyle();
      return '<label style="margin-top:10px">🎨 СТИЛЬ КАРТИНОК</label>'+
        '<select id="imgStyle">'+IMG_STYLES.map(s=>'<option value="'+s[0]+'"'+(s[0]===cur?" selected":"")+'>'+s[1]+'</option>').join("")+'</select>'+
        '<div class="hinttext">Подставлен по курсу. Для Super Minds и Gateway — детский, для остальных — взрослый.</div>';
    }

    /* Нарисовать картинку по описанию. Описание подставляется из вопроса,
       который учитель уже написал — чаще всего править не придётся. */
    async function genImage(inp,cb,btn){
      if(typeof SM_AI==="undefined"||!SM_AI.call){ fail("Ассистент недоступен — обнови страницу"); return; }
      const scope=btn.closest(".qblock")||document.getElementById("fields");
      let hint="";
      const src=scope&&scope.querySelector(".q,.statement,.word,.answer");
      if(src) hint=(src.value||"").trim();
      const desc=prompt("Что нарисовать? Можно по-русски.\n\nНапример: мальчик кормит кота","(hint)".replace("(hint)",hint));
      if(!desc||!desc.trim()) return;
      busy(btn,true,"🎨 рисую…");
      let res=null;
      try{ res=await SM_AI.call("image",{en:desc.trim(),ru:"",style:currentStyle()}); }catch(e){ res={ok:false,error:"не получилось"}; }
      if(!res||!res.ok||!res.image){ busy(btn,false); fail(res&&res.error?res.error:"Картинка не нарисовалась — попробуй ещё раз"); return; }
      /* сжимаем перед загрузкой, иначе в хранилище уедет мегабайт */
      const small=await new Promise(ok=>{ try{ SM_AI.compress(res.image,ok); }catch(e){ ok(res.image); } });
      /* compress отдаёт jpeg — расширение должно совпасть, uploadMedia берёт его из имени */
      const ext=(small.indexOf("data:image/png")===0)?"png":"jpg";
      const url=await putFile(dataUrlToFile(small,"drawn-"+Date.now()+"."+ext),"img",btn);
      busy(btn,false);
      if(url){ inp.value=url; if(cb)cb(); const m=document.getElementById("msg"); if(m){m.className="msg ok";m.textContent="Картинка готова — если не нравится, нарисуй ещё раз";} }
    }

    function wireImageIn(scope){
      const inp=scope.querySelector(".img");if(!inp)return;
      const btn=scope.querySelector(".upl"),gen=scope.querySelector(".gen"),prev=scope.querySelector(".imgprev");
      function showPrev(){ if(prev) prev.innerHTML=inp.value?('<img src="'+inp.value.replace(/"/g,"&quot;")+'" alt="">'):""; }
      if(btn){ btn.dataset.lbl=btn.textContent; btn.onclick=()=>pickImage(inp,showPrev,btn); }
      if(gen){ gen.dataset.lbl=gen.textContent; gen.onclick=()=>genImage(inp,showPrev,gen); }
      inp.addEventListener("input",showPrev);showPrev();
    }
    function imageFieldHTML(val,idAttr){
      return '<label>🖼 КАРТИНКА (необязательно — можно вместо текста)</label>'+
        '<div class="imgrow"><input '+(idAttr?'id="'+idAttr+'" ':'')+'class="img" placeholder="вставь ссылку, загрузи или нарисуй →" value="'+esc(val||"")+'"><button class="upl" type="button">📁 файл</button><button class="upl gen" type="button">🎨 нарисовать</button></div>'+
        '<div class="imgprev"></div>';
    }

    /* Поле аудио: ссылка, файл с компьютера или запись голосом */
    function audioFieldHTML(val,idAttr,label){
      return '<label>'+(label||"🔊 АУДИОФАЙЛ")+'</label>'+
        '<div class="imgrow"><input '+(idAttr?'id="'+idAttr+'" ':'')+'class="aud" placeholder="ссылка на mp3, файл или запись →" value="'+esc(val||"")+'">'+
        '<button class="upl aupl" type="button">📁 файл</button><button class="upl arec" type="button">🎙 записать</button></div>'+
        '<div class="audprev"></div>';
    }
    function wireAudioIn(scope){
      const inp=scope.querySelector(".aud");if(!inp)return;
      const up=scope.querySelector(".aupl"),rec=scope.querySelector(".arec"),prev=scope.querySelector(".audprev");
      function showPrev(){ if(prev) prev.innerHTML=inp.value?('<audio controls src="'+inp.value.replace(/"/g,"&quot;")+'" style="width:100%;margin-top:8px"></audio>'):""; }
      if(up){ up.dataset.lbl=up.textContent; up.onclick=()=>pickMedia(inp,"audio/*","audio",showPrev,up); }
      if(rec){ rec.dataset.lbl=rec.textContent; rec.onclick=()=>toggleRecord(inp,rec,showPrev); }
      inp.addEventListener("input",showPrev);showPrev();
    }

    /* ---------- ряды для под-элементов (по контейнеру, не по id) ---------- */
    function optRow(box,val,checked,radioName){
      const d=document.createElement("div");d.className="optrow";
      d.innerHTML='<label class="corr"><input type="radio" name="'+radioName+'" style="width:auto"'+(checked?" checked":"")+'>верный</label><input type="text" class="otext" placeholder="вариант" value="'+esc(val)+'"><button class="rm" type="button">✕</button>';
      d.querySelector(".rm").onclick=()=>{ if(box.children.length>2) d.remove(); };
      box.appendChild(d);
    }
    function optRowM(box,val,checked){
      const d=document.createElement("div");d.className="optrow";
      d.innerHTML='<label class="corr"><input type="checkbox" class="ochk" style="width:auto"'+(checked?" checked":"")+'>верный</label><input type="text" class="otext" placeholder="вариант" value="'+esc(val)+'"><button class="rm" type="button">✕</button>';
      d.querySelector(".rm").onclick=()=>{ if(box.children.length>2) d.remove(); };
      box.appendChild(d);
    }
    /* Пара может быть не только «слово ↔ перевод», но и «картинка ↔ слово».
       Поля картинок скрыты, пока не нажали 🖼 — чтобы список пар не разбухал. */
    function pairRow(box,a,b,ia,ib){
      const d=document.createElement("div");d.className="pairwrap";
      const open=!!(ia||ib);
      d.innerHTML=
        '<div class="optrow" style="margin-bottom:0">'+
          '<input type="text" class="pa" placeholder="dog" value="'+esc(a)+'">'+
          '<input type="text" class="pb" placeholder="собака" value="'+esc(b)+'">'+
          '<button class="pimg" type="button" title="картинки к паре">🖼</button>'+
          '<button class="rm" type="button">✕</button>'+
        '</div>'+
        '<div class="pimgbox"'+(open?"":' style="display:none"')+'>'+
          '<div class="pimg-a">'+imageFieldHTML(ia)+'</div>'+
          '<div class="pimg-b">'+imageFieldHTML(ib)+'</div>'+
        '</div>';
      d.querySelector(".rm").onclick=()=>{ if(box.children.length>2) d.remove(); };
      const bx=d.querySelector(".pimgbox");
      d.querySelector(".pimg").onclick=()=>{ bx.style.display=bx.style.display==="none"?"block":"none"; };
      /* каждой стороне — своё поле картинки со своими кнопками */
      wireImageIn(d.querySelector(".pimg-a"));
      wireImageIn(d.querySelector(".pimg-b"));
      const la=d.querySelector(".pimg-a label"); if(la) la.textContent="🖼 КАРТИНКА К ЛЕВОЙ СТОРОНЕ";
      const lb=d.querySelector(".pimg-b label"); if(lb) lb.textContent="🖼 КАРТИНКА К ПРАВОЙ СТОРОНЕ";
      box.appendChild(d);
    }
    function catRow(box,name,items){
      const d=document.createElement("div");d.style.cssText="border:2px solid #cfcecd;border-radius:12px;padding:10px;margin-bottom:8px";
      d.innerHTML='<div style="display:flex;gap:8px;align-items:center"><input class="cname" type="text" placeholder="Название (напр. Животные)" value="'+esc(name)+'"><button class="rm" type="button">✕</button></div>'+
        '<textarea class="citems" rows="3" placeholder="dog\ncat\nbird" style="margin-top:6px">'+esc(items)+'</textarea>';
      d.querySelector(".rm").onclick=()=>{ if(box.children.length>2) d.remove(); };
      box.appendChild(d);
    }
    function lineRow(box,who,text){
      const d=document.createElement("div");d.className="optrow";
      d.innerHTML='<input class="who" type="text" placeholder="A" value="'+esc(who)+'" style="max-width:64px"><input class="dtext" type="text" placeholder="реплика" value="'+esc(text)+'"><button class="rm" type="button">✕</button>';
      d.querySelector(".rm").onclick=()=>{ if(box.children.length>1) d.remove(); };
      box.appendChild(d);
    }

    /* ---------- блок одного вопроса (для многозадачных типов) ---------- */
    function renumber(){ [...document.querySelectorAll("#blocks .qblock .bh .n")].forEach((n,i)=>n.textContent="ЗАДАНИЕ "+(i+1)); }
    function addBlock(type,d){

    /* ---------- чтение одного блока-вопроса ---------- */
    function readItem(type,b){
      const imgEl=b.querySelector(".img");
      const img=imgEl?imgEl.value.trim():"";
      const hasImg=!!img;
      function ret(data){ if(img) data.img=img; return {data}; }
      if(type==="choice"){
        const q=b.querySelector(".q").value.trim();
        const rows=[...b.querySelectorAll(".opts .optrow")].map(r=>({t:r.querySelector(".otext").value.trim(),c:r.querySelector('input[type=radio]').checked}));
        const kept=rows.filter(x=>x.t);
        if(!q&&!hasImg) return {err:"впиши вопрос или добавь картинку"};
        if(kept.length<2) return {err:"нужно минимум 2 варианта"};
        const correct=kept.findIndex(x=>x.c);
        if(correct<0) return {err:"отметь правильный вариант"};
        return ret({q,opts:kept.map(x=>x.t),correct});
      }
      if(type==="multi"){
        const q=b.querySelector(".q").value.trim();
        const rows=[...b.querySelectorAll(".opts .optrow")].map(r=>({t:r.querySelector(".otext").value.trim(),c:r.querySelector('input[type=checkbox]').checked}));
        const kept=rows.filter(x=>x.t);
        if(!q&&!hasImg) return {err:"впиши вопрос или добавь картинку"};
        if(kept.length<2) return {err:"нужно минимум 2 варианта"};
        const correct=[]; kept.forEach((x,i)=>{ if(x.c) correct.push(i); });
        if(!correct.length) return {err:"отметь хотя бы один правильный"};
        return ret({q,opts:kept.map(x=>x.t),correct});
      }
      if(type==="gap"){
        const q=b.querySelector(".q").value.trim();const answer=b.querySelector(".answer").value.trim();
        if(!q||q.indexOf("___")<0) return {err:"впиши предложение с ___"};
        if(!answer) return {err:"впиши ответ"};
        return ret({q,answer});
      }
      if(type==="order"){
        const answer=b.querySelector(".answer").value.trim();
        if(answer.split(/\s+/).filter(Boolean).length<2) return {err:"впиши предложение из 2+ слов"};
        return ret({answer});
      }
      if(type==="tf"){
        const statement=b.querySelector(".statement").value.trim();
        if(!statement&&!hasImg) return {err:"впиши утверждение или добавь картинку"};
        return ret({statement,correct:b.querySelector(".correct").value==="true"});
      }
      if(type==="listen"){
        const audio=b.querySelector(".audio").value.trim();const answer=b.querySelector(".answer").value.trim();
        const sEl=b.querySelector(".aud"); const src=sEl?sEl.value.trim():"";
        if(!audio&&!src) return {err:"впиши текст для озвучки или загрузи аудиофайл"};
        if(!answer) return {err:"впиши ответ"};
        const o={audio,answer}; if(src) o.src=src;
        return ret(o);
      }
      if(type==="cloze"){
        const q=b.querySelector(".q").value.trim();
        if(!/\[\[.*?\]\]/.test(q)) return {err:"добавь хотя бы один пропуск [[a|b]]"};
        return ret({q});
      }
      if(type==="letters"){
        const word=b.querySelector(".word").value.trim();
        if(!word) return {err:"впиши слово"};
        return ret({word,hint:b.querySelector(".hint").value.trim()});
      }
      if(type==="open"){
        const q=b.querySelector(".q").value.trim();
        if(!q&&!hasImg) return {err:"впиши вопрос или добавь картинку"};
        return ret({q,model:b.querySelector(".model").value.trim()});
      }
      return {err:"?"};
    }

    function readForm(type){
      if(type==="reading"){
        const text=document.getElementById("rtext").value.trim();
        if(!text) return {err:"Впиши текст"};
        const qs=[];
        for(const line of document.getElementById("rqs").value.split("\n").map(x=>x.trim()).filter(Boolean)){
          const parts=line.split("|").map(x=>x.trim()).filter(Boolean);
          if(parts.length<3) return {err:"В вопросе нужно 2+ варианта: "+line.slice(0,40)};
          const q=parts[0];let correct=-1;
          const opts=parts.slice(1).map((o,i)=>{if(o.endsWith("*")){correct=i;return o.slice(0,-1).trim();}return o;});
          if(correct<0) return {err:"Пометь верный вариант звёздочкой *: "+q.slice(0,40)};
          qs.push({q,opts,correct});
        }
        if(!qs.length) return {err:"Добавь хотя бы один вопрос"};
        return {data:{text,qs}};
      }
      if(type==="tfns"){
        const text=document.getElementById("ttext").value.trim();
        if(!text) return {err:"Впиши текст"};
        const sts=[];
        for(const line of document.getElementById("tsts").value.split("\n").map(x=>x.trim()).filter(Boolean)){
          const i=line.lastIndexOf("|");
          if(i<0) return {err:"Формат: утверждение | T, F или N"};
          const st=line.slice(0,i).trim(), a=line.slice(i+1).trim().toUpperCase();
          if(!["T","F","N"].includes(a)) return {err:"Ответ должен быть T, F или N: "+st.slice(0,40)};
          sts.push({s:st,a});
        }
        if(!sts.length) return {err:"Добавь хотя бы одно утверждение"};
        return {data:{text,sts}};
      }
      if(type==="wordform"){
        const items=[];
        for(const line of document.getElementById("wlines").value.split("\n").map(x=>x.trim()).filter(Boolean)){
          const p=line.split("|").map(x=>x.trim());
          if(p.length<3||p[0].indexOf("___")<0) return {err:"Формат: предложение с ___ | СЛОВО | ответ"};
          items.push({q:p[0],base:p[1].toUpperCase(),answer:p[2]});
        }
        if(!items.length) return {err:"Добавь хотя бы одну строку"};
        return {data:{items}};
      }
      if(type==="headings"){
        const paras=document.getElementById("hparas").value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
        const heads=document.getElementById("hheads").value.split("\n").map(x=>x.trim()).filter(Boolean);
        if(paras.length<2) return {err:"Нужно 2+ абзаца (разделяй пустой строкой)"};
        if(heads.length<paras.length) return {err:"Заголовков должно быть не меньше, чем абзацев"};
        return {data:{paras,heads}};
      }
      if(type==="shadow"){
        const lines=document.getElementById("lines").value.split("\n").map(x=>x.trim()).filter(Boolean);
        if(!lines.length) return {err:"Впиши хотя бы одну фразу"};
        return {data:{lines}};
      }
      if(type==="embed"){
        const url=document.getElementById("url").value.trim();
        if(!url) return {err:"Вставь ссылку на материал"};
        const e=window.SM_embed(url);
        if(!e) return {err:"Не удалось разобрать ссылку"};
        const h=parseInt(document.getElementById("h").value,10);
        return {data:{url:url,src:e.src,ratio:e.ratio||null,h:(h||e.h||null),name:e.name}};
      }
      if(QREPEAT.has(type)){
        const blocks=[...document.querySelectorAll("#blocks .qblock")];
        const items=[];
        for(let i=0;i<blocks.length;i++){ const r=readItem(type,blocks[i]); if(r.err) return {err:"Задание "+(i+1)+": "+r.err}; items.push(r.data); }
        if(!items.length) return {err:"Добавь хотя бы одно задание"};
        return {data:{items}};
      }
      if(type==="match"){
        const rows=[...document.querySelectorAll("#pairs .pairwrap")];
        const pairs=rows.map(r=>{
          const ia=r.querySelector(".pimg-a .img"), ib=r.querySelector(".pimg-b .img");
          const p={a:r.querySelector(".pa").value.trim(),b:r.querySelector(".pb").value.trim()};
          if(ia&&ia.value.trim()) p.ia=ia.value.trim();
          if(ib&&ib.value.trim()) p.ib=ib.value.trim();
          return p;
        /* сторона считается заполненной, если есть текст ИЛИ картинка */
        }).filter(p=>(p.a||p.ia)&&(p.b||p.ib));
        if(pairs.length<2) return {err:"Нужно минимум 2 пары"};
        return {data:{pairs}};
      }
      if(type==="categorize"){
        const cats=[...document.querySelectorAll("#cats > div")].map(d=>({name:d.querySelector(".cname").value.trim(),items:d.querySelector(".citems").value.split("\n").map(s=>s.trim()).filter(Boolean)})).filter(c=>c.name&&c.items.length);
        if(cats.length<2) return {err:"Нужно 2+ категории со словами"};
        return {data:{cats}};
      }
      if(type==="dialogue"){
        const lines=[...document.querySelectorAll("#lines .optrow")].map(r=>({who:r.querySelector(".who").value.trim()||"•",text:r.querySelector(".dtext").value.trim()})).filter(l=>l.text);
        if(!lines.length) return {err:"Добавь хотя бы одну реплику"};
        return {data:{lines}};
      }
      if(type==="fillbox"){
        const q=document.getElementById("q").value.trim();
        const answers=document.getElementById("answers").value.split(",").map(s=>s.trim()).filter(Boolean);
        const extra=document.getElementById("extra").value.split(",").map(s=>s.trim()).filter(Boolean);
        const gaps=(q.match(/___/g)||[]).length;
        if(!gaps) return {err:"Добавь пропуски ___"};
        if(answers.length!==gaps) return {err:"Слов должно быть столько же, сколько пропусков ("+gaps+")"};
        return {data:{q,answers,extra}};
      }
      if(type==="text"){
        const body=document.getElementById("body").value.trim();
        if(!body) return {err:"Впиши текст"};
        return {data:{title:document.getElementById("ttl").value.trim(),body}};
      }
      if(type==="image"){
        const url=document.getElementById("url").value.trim();
        if(!/^(https?:\/\/|data:image\/)/.test(url)) return {err:"Вставь ссылку на картинку или загрузи файл"};
        return {data:{url,caption:document.getElementById("caption").value.trim()}};
      }
      if(type==="video"){
        const url=document.getElementById("url").value.trim();
        if(!url) return {err:"Вставь ссылку на видео или загрузи файл"};
        const caption=document.getElementById("caption").value.trim();
        if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url)) return {data:{url,file:url,caption}};
        const e=window.SM_embed(url);
        if(!e) return {err:"Ссылка на видео не распознана"};
        return {data:{url,src:e.src,name:e.name,caption}};
      }
      if(type==="audio"){
        const src=document.getElementById("asrc").value.trim();
        const body=document.getElementById("body").value.trim();
        if(!src&&!body) return {err:"Загрузи аудиофайл или впиши текст для озвучки"};
        return {data:{src,body,caption:document.getElementById("caption").value.trim()}};
      }
      if(type==="note"){
        const body=document.getElementById("body").value.trim();
        if(!body) return {err:"Впиши заметку"};
        return {data:{body}};
      }
      return {err:"?"};
    }

    /* ---------- счётчик заданий в упражнении (для списка) ---------- */
    function itemCount(e){
      const d=e.data||{};
      if(d.items) return d.items.length;
      if(d.pairs) return d.pairs.length;
      if(d.cats) return d.cats.length;
      if(d.lines) return d.lines.length;
      return 1;
    }

    /* ---------- экраны ---------- */
    function renderLogin(){
      document.getElementById("sub").textContent="войди как учитель, чтобы создавать упражнения";
      document.getElementById("root").innerHTML='<div class="panel"><div class="empty">Сначала войди в <a href="teacher.html" style="color:#ec3013;text-decoration:underline">кабинет учителя</a>, потом вернись сюда.</div></div>';
    }
    /* Курс, на котором сейчас работает конструктор. Раньше он молча брался из
       последнего открытого учебника и сменить его было нельзя. */
    let CID=(window.SM_COURSE&&SM_COURSE.id)||null;
    const BOOKS=[["sb","📗 Student Book"],["wb","📒 Workbook"],["extra","➕ Доп. материал"]];

    function courseList(){
      return (window.SM_COURSES||[]).filter(c=>c.id!=="own"&&(window.SM_COURSE_DATA||{})[c.id]);
    }
    function unitsOf(cid){ return (window.SM_COURSE_DATA||{})[cid]||[]; }

    function fillUnits(){
      const sel=document.getElementById("unit");
      const us=unitsOf(CID);
      sel.innerHTML=us.length
        ? us.map(u=>'<option value="'+esc(u.id)+'">'+(u.emoji||"")+' '+esc(u.title)+'</option>').join("")
        : '<option value="">— в этом курсе нет юнитов —</option>';
    }

    async function renderBuilder(user){
      const cs=courseList();
      if(!CID||!unitsOf(CID).length) CID=(cs[0]||{}).id||CID;
      const cur=cs.filter(c=>c.id===CID)[0]||SM_COURSE||{};
      document.getElementById("sub").textContent="выбери курс, юнит и книгу — и собирай упражнения";
      /* Два учебника могут называться одинаково. Тогда к названию добавляем
         ключ и число юнитов — иначе не отличить, куда сохраняешь. */
      const titleCount={};
      cs.forEach(c=>{const t=(c.title||"").trim();titleCount[t]=(titleCount[t]||0)+1;});
      const courseOpts=cs.map(c=>{
        const t=(c.title||"").trim();
        const extra=titleCount[t]>1?(" · "+c.id+" · юнитов "+unitsOf(c.id).length):"";
        return '<option value="'+esc(c.id)+'"'+(c.id===CID?" selected":"")+'>'+(c.emoji||"📘")+' '+esc(t)+esc(extra)+'</option>';
      }).join("");
      const bookOpts=BOOKS.map(b=>'<option value="'+b[0]+'">'+b[1]+'</option>').join("");
      const typeOpts=Object.keys(TYPES).map(k=>'<option value="'+k+'">'+TYPES[k].label+'</option>').join("");
      document.getElementById("root").innerHTML=
        '<div class="panel">'+
          '<label>КУРС</label><select id="course">'+courseOpts+'</select>'+
          '<div class="row2"><div style="flex:1"><label>ЮНИТ</label><select id="unit"></select></div>'+
          '<div style="flex:1"><label>КНИГА</label><select id="book">'+bookOpts+'</select></div></div>'+
          '<label>ТИП УПРАЖНЕНИЯ</label><select id="type">'+typeOpts+'</select>'+
          '<label>НАЗВАНИЕ / ИНСТРУКЦИЯ (необязательно)</label><input id="title" placeholder="Прочитай и выбери ответ">'+
          '<label>РАЗДЕЛ УРОКА (необязательно)</label><input id="section" list="seclist" placeholder="Лексика / Грамматика / Видео…"><datalist id="seclist"><option>Лексика</option><option>Грамматика</option><option>Аудирование</option><option>Чтение</option><option>Видео</option><option>Говорение</option><option>Игры</option><option>Домашка</option></datalist>'+
          styleSelectHTML()+
          '<div id="fields"></div>'+
          '<div class="row2" style="margin-top:16px"><button class="primary" id="prev" style="flex:1;margin:0;background:#eae9e9;color:#4a4644;box-shadow:0 5px 0 #cfcecd">👁 Как увидит ученик</button>'+
          '<button class="primary" id="save" style="flex:1;margin:0">💾 Сохранить</button></div>'+
          /* Задания обычно делают пачкой в один раздел — эта кнопка не сбрасывает
             тип и раздел, чтобы не выбирать их заново на каждом заходе. */
          '<button class="primary" id="saveMore" style="width:100%;margin-top:10px;background:#4a8b34;box-shadow:0 5px 0 #2c5716">💾 Сохранить и создать ещё</button>'+
          '<div class="msg" id="msg"></div>'+
        '</div>'+
        '<div class="sec-title">МОИ УПРАЖНЕНИЯ</div><div id="list"><div class="empty">Загрузка…</div></div>';

      fillUnits();
      const courseSel=document.getElementById("course");
      courseSel.onchange=()=>{
        CID=courseSel.value; editId=null;
        if(window.SM_useCourse){ try{ SM_useCourse(CID); }catch(e){} }
        /* стиль картинок зависит от курса — пересобираем предложение */
        const st=document.getElementById("imgStyle");
        if(st) st.value=defaultStyle();
        fillUnits(); loadList();
        const m=document.getElementById("msg"); m.className="msg ok";
        m.textContent="Курс: "+courseSel.options[courseSel.selectedIndex].text.trim()+" · юнитов "+unitsOf(CID).length;
      };
      const typeSel=document.getElementById("type");
      typeSel.onchange=()=>{editId=null;document.getElementById("title").value="";renderForm(typeSel.value);};
      renderForm(typeSel.value);
      const q=new URLSearchParams(location.search);
      const pu=q.get("u");
      if(pu&&unitsOf(CID).some(x=>x.id===pu)) document.getElementById("unit").value=pu;
      if(q.get("book")) document.getElementById("book").value=q.get("book");
      document.getElementById("save").onclick=()=>save(false);
      document.getElementById("saveMore").onclick=()=>save(true);
      document.getElementById("prev").onclick=preview;
      loadList();
    }
    async function save(keepGoing){
      const msg=document.getElementById("msg");msg.className="msg";msg.textContent="…";
      const type=document.getElementById("type").value;
      const r=readForm(type); if(r.err){msg.className="msg err";msg.textContent=r.err;return;}
      const exImg=document.getElementById("exImg");
      if(exImg&&exImg.value.trim()&&r.data&&!r.data.items) r.data.img=exImg.value.trim();
      const uidSel=document.getElementById("unit").value;
      if(!uidSel){msg.className="msg err";msg.textContent="В этом курсе нет юнитов — выбери другой курс.";return;}
      const res=await SM.saveExercise({id:editId,course:CID,unit_id:uidSel,book:document.getElementById("book").value,type,title:document.getElementById("title").value.trim(),section:document.getElementById("section").value.trim(),data:r.data});
      if(res.ok){
        const uid=document.getElementById("unit").value;
        const wasEdit=!!editId;
        editId=null;
        document.getElementById("title").value="";
        /* при «создать ещё» раздел остаётся — следующее задание чаще всего в него же */
        if(!keepGoing) document.getElementById("section").value="";
        renderForm(type);
        loadList();
        msg.className="msg ok";
        msg.innerHTML=keepGoing
          ? "Сохранено ✓ — форма готова к следующему заданию"+(document.getElementById("section").value?(', раздел «'+esc(document.getElementById("section").value)+'»'):"")
          : (wasEdit?"Обновлено ✓":"Сохранено ✓")+' — <a href="exercises.html?u='+uid+'" target="_blank" style="color:inherit;font-weight:800">открыть юнит и проверить →</a>';
        if(keepGoing){ const f=document.getElementById("fields"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); }
      }
      else{msg.className="msg err";msg.textContent=res.error||"Ошибка";}
    }
    /* ---------- предпросмотр: показать упражнение так, как увидит ученик ----------
       Показываем ДО сохранения, чтобы не бегать между вкладками. Внутри iframe
       живёт настоящая страница exercises.html — значит видно ровно то же, что и ученик. */
    function preview(){
      const msg=document.getElementById("msg"); msg.className="msg"; msg.textContent="";
      const type=document.getElementById("type").value;
      const r=readForm(type);
      if(r.err){ msg.className="msg err"; msg.textContent=r.err; return; }
      const exImg=document.getElementById("exImg");
      if(exImg&&exImg.value.trim()&&r.data&&!r.data.items) r.data.img=exImg.value.trim();

      const ex={id:"preview",type:type,title:document.getElementById("title").value.trim(),
                section:document.getElementById("section").value.trim(),data:r.data};

      let ov=document.getElementById("prevOv");
      if(ov) ov.remove();
      ov=document.createElement("div"); ov.id="prevOv";
      ov.style.cssText="position:fixed;inset:0;z-index:80;background:rgba(32,30,29,.55);display:flex;align-items:center;justify-content:center;padding:18px";
      ov.innerHTML='<div style="background:#f3f2f2;border-radius:20px;max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 0 rgba(0,0,0,.2)">'+
        '<div style="display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:2px solid #cfcecd">'+
          '<b style="font:900 15px \'Archivo\',sans-serif">👁 Как увидит ученик</b>'+
          '<span style="flex:1"></span>'+
          '<button id="prevClose" style="background:#ec3013;color:#fff;border-radius:999px;padding:7px 15px;font:800 13px \'Archivo\',sans-serif">закрыть</button>'+
        '</div>'+
        '<iframe id="prevFrame" style="flex:1;width:100%;border:0;background:#f3f2f2" src="exercises.html?preview=1"></iframe>'+
      '</div>';
      document.body.appendChild(ov);
      ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
      ov.querySelector("#prevClose").onclick=()=>ov.remove();
      document.addEventListener("keydown",function esc2(e){ if(e.key==="Escape"){ const o=document.getElementById("prevOv"); if(o)o.remove(); document.removeEventListener("keydown",esc2); } });

      const fr=ov.querySelector("#prevFrame");
      fr.onload=()=>{ try{ fr.contentWindow.postMessage({smPreview:ex},"*"); }
        catch(err){ msg.className="msg err"; msg.textContent="Предпросмотр не открылся — сохрани и проверь в юните."; } };
    }

    async function loadList(){
      const list=document.getElementById("list");
      const ex=await SM.myExercises(CID);
      if(!ex.length){list.innerHTML='<div class="empty">В этом курсе упражнений пока нет. Создай первое 👆</div>';return;}
      const bookName={sb:"📗 SB",wb:"📒 WB",extra:"➕ доп"};
      list.innerHTML=ex.map(e=>{const uu=unitsOf(CID).find(x=>x.id===e.unit_id);const un=uu?uu.title:e.unit_id;const n=itemCount(e);
        return '<div class="exrow"><span class="badge">'+(TYPES[e.type]?TYPES[e.type].label:e.type)+'</span>'+
          '<span class="cnt">'+(bookName[e.book]||bookName.sb)+'</span>'+
          (e.section?'<span class="cnt">'+esc(e.section)+'</span>':'')+
          (n>1?'<span class="cnt">'+n+' заданий</span>':'')+
          '<span class="t">'+esc(e.title||un)+' · '+esc(un)+'</span>'+
          '<button class="ed" data-id="'+e.id+'">✎</button><button class="de" data-id="'+e.id+'">🗑</button></div>';
      }).join("");
      list.querySelectorAll(".ed").forEach(b=>b.onclick=()=>{const e=ex.find(x=>x.id===b.dataset.id);loadForEdit(e);});
      list.querySelectorAll(".de").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить упражнение?"))return;await SM.deleteExercise(b.dataset.id);loadList();});
      const ep=new URLSearchParams(location.search).get("edit");
      if(ep&&!window.__editHandled){window.__editHandled=true;const e2=ex.find(x=>x.id===ep);if(e2)loadForEdit(e2);}
    }
    function loadForEdit(e){
      editId=e.id;
      document.getElementById("unit").value=e.unit_id;
      document.getElementById("book").value=e.book||"sb";
      document.getElementById("type").value=e.type;
      document.getElementById("title").value=e.title||"";
      document.getElementById("section").value=e.section||"";
      renderForm(e.type,e.data);
      window.scrollTo({top:0,behavior:"smooth"});
      const m=document.getElementById("msg");m.className="msg ok";m.textContent="Редактируешь упражнение — измени и сохрани";
    }

    (async function(){
      /* Курсы Speakout, Solutions, Focus, Gateway подтягиваются асинхронно.
         Без этого ожидания в списке оказывались только Super Minds. */
      try { await (window.SM_ready || Promise.resolve()); } catch(e){}
      const u=await SM.getUser();
      if(u&&SM.isCloud) renderBuilder(u); else renderLogin();
    })();
  </script>
