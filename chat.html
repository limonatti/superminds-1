  <nav class="side" id="side"></nav>

      <div class="list" id="peopleWrap">
        <div class="people-heading"><h1>Сообщения</h1><p id="peopleCount">Личная переписка с учениками</p></div>
        <div class="people-mobile"><label for="chatPerson">Собеседник</label><select id="chatPerson"></select></div>
        <div id="people"></div>

      <div class="pane" id="pane"></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=95220d51"></script>

<script>
const esc = SMUI.esc, icon = SMUI.icon;
function chatIcon(name){
  const paths={
    smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
    clip:'<path d="m21 11-8 8a6 6 0 0 1-8.5-8.5l8-8a4 4 0 0 1 5.7 5.7l-8 8a2 2 0 0 1-2.8-2.8L15 6"/>',
    send:'<path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/>',
    trash:'<path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/>'
  };
  return '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+paths[name]+'</svg>';
}

function closeMessagePopover(restoreFocus=false){
  document.querySelectorAll('.rxpick').forEach(box=>{
    if(typeof box.hidePopover==='function'&&box.matches(':popover-open'))box.hidePopover();
    box.remove();
    if(restoreFocus&&box.returnFocus?.isConnected)box.returnFocus.focus({preventScroll:true});
  });
}
function showMessagePopover(box,bubble){
  closeMessagePopover();
  box.returnFocus=document.activeElement;
  box.setAttribute('role','dialog');
  box.setAttribute('aria-label',box.classList.contains('delete-confirm')?'Удаление сообщения':'Реакция на сообщение');
  box.setAttribute('popover','auto');
  document.body.appendChild(box);
  if(typeof box.showPopover==='function')box.showPopover();else box.classList.add('fallback');
  const anchor=bubble.getBoundingClientRect(),rect=box.getBoundingClientRect();
  box.style.left=Math.max(12,Math.min(anchor.right-rect.width,innerWidth-rect.width-12))+'px';
  box.style.top=Math.max(12,Math.min(anchor.bottom+6,innerHeight-rect.height-12))+'px';
  box.querySelector('button')?.focus({preventScroll:true});
}
document.addEventListener('click',e=>{if(!e.target.closest('.rxpick,.rx-open,.del'))closeMessagePopover();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMessagePopover(true);});
document.addEventListener('scroll',e=>{if(!e.target.closest?.('.rxpick'))closeMessagePopover();},true);
window.addEventListener('resize',closeMessagePopover);

let ME = null, ROLE = "student";
let PEOPLE = [];        // [{id, name, unread}]
let sel = 0;

/* Состояние открытой переписки */
let MSGS = [];          // то, что уже отрисовано
let SEEN = new Set();   // id, чтобы не задваивать
let chatSession=null, chatGeneration=0, readBusy=false;
function stopChat(){
  chatGeneration++;chatSession?.stop();chatSession=null;readBusy=false;
  MSGS=[];SEEN=new Set();
}

/* teacherId/studentId для текущей пары — зависит от роли */
function pairFor(person){
  return ROLE === "teacher"
    ? { teacherId: ME.id,   studentId: person.id }
    : { teacherId: person.id, studentId: ME.id };
}

/* ---------- отрисовка ---------- */

function dayLabel(d){
  const today = new Date(); const y = new Date(); y.setDate(y.getDate()-1);
  const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if (same(d,today)) return "сегодня";
  if (same(d,y)) return "вчера";
  return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
}
function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* Один пузырёк. Раньше вся переписка перерисовывалась через innerHTML на
   каждом цикле опроса — из-за этого слетало выделение текста и дёргалась
   прокрутка. Теперь узлы добавляются по одному и живут дальше сами. */
function human(n){
  if (!n) return "";
  if (n < 1024) return n + " Б";
  if (n < 1024*1024) return Math.round(n/1024) + " КБ";
  return (n/1024/1024).toFixed(1) + " МБ";
}

/* Вложение внутри пузырька: картинку и видео показываем сразу,
   остальное — строкой со ссылкой на скачивание. */
function attEl(m){
  const wrap = document.createElement("div");
  wrap.className = "att";
  if (m.att_kind === "image"){
    const img = document.createElement("img");
    img.src = m.att_url; img.alt = m.att_name || "";
    img.loading = "lazy";
    img.onclick = () => openLink(m.att_url);
    wrap.appendChild(img);
  } else if (m.att_kind === "video"){
    const v = document.createElement("video");
    v.src = m.att_url; v.controls = true; v.preload = "metadata";
    wrap.appendChild(v);
  } else if (m.att_kind === "audio"){
    const a = document.createElement("audio");
    a.src = m.att_url; a.controls = true; a.preload = "metadata";
    wrap.appendChild(a);
  } else {
    const a = document.createElement("a");
    a.className = "file"; a.href = m.att_url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = icon("file", 20);
    a.appendChild(document.createTextNode(m.att_name || "Файл"));
    const sz = document.createElement("span");
    sz.className = "fsz"; sz.textContent = human(m.att_size);
    a.appendChild(sz);
    wrap.appendChild(a);
  }
  return wrap;
}
function openLink(u){ window.open(u, "_blank", "noopener"); }

const RX = ["👍","❤️","😂","👏","🔥","😮","😢","🎉"];

function bubbleEl(m){
  const mine = m.sender_id === ME.id;
  const el = document.createElement("div");
  el.className = "bub " + (mine ? "me" : "them") + (m.__pending ? " pending" : "");
  el.dataset.id = m.id;

  if (m.deleted_at){ fillGone(el, m); return el; }

  if (m.att_url) el.appendChild(attEl(m));
  if (m.body){
    el.appendChild(SMChatContent.render(m.body));
  }

  const tm = document.createElement("span");
  tm.className = "tm";
  tm.textContent = m.__pending ? "отправляю…" : (hhmm(m.created_at) + (mine ? (m.read_at ? " ✓✓" : " ✓") : ""));
  el.appendChild(tm);

  const rx = document.createElement("div");
  rx.className = "rx";
  el.appendChild(rx);

  /* реакцию и удаление можно навесить только на сохранённое сообщение */
  if (!m.__pending) el.appendChild(toolsEl(el, m, mine));
  return el;
}

/* Кнопки у края пузырька: реакция всем, корзина — только автору */
function toolsEl(bubble, m, mine){
  const box = document.createElement("div");
  box.className = "tools";

  const rb = document.createElement("button");
  rb.className = "rx-open"; rb.type = "button"; rb.title = "Добавить реакцию"; rb.setAttribute("aria-label", rb.title); rb.innerHTML = chatIcon("smile");
  rb.onclick = (e) => { e.stopPropagation(); openPicker(bubble, m.id); };
  box.appendChild(rb);

  if (mine){
    const db = document.createElement("button");
    db.className = "del"; db.type = "button"; db.title = "Удалить сообщение"; db.setAttribute("aria-label", db.title); db.innerHTML = chatIcon("trash");
    db.onclick = (e) => { e.stopPropagation(); askDelete(bubble, m); };
    box.appendChild(db);
  }
  return box;
}

/* Спрашиваем прямо у пузырька, а не системным окном:
   удаление видно обоим, поэтому лучше не промахнуться мимо кнопки. */
function askDelete(bubble, m){
  const old = document.querySelector(".rxpick"); if (old) old.remove();
  const box = document.createElement("div");
  box.className = "rxpick delete-confirm";
  box.style.fontSize = "12px";
  const q = document.createElement("span");
  q.style.cssText = "font:800 12px 'Nunito',sans-serif;padding:2px 4px;white-space:nowrap";
  q.textContent = "Удалить у обоих?";
  const yes = document.createElement("button"); yes.type = "button"; yes.textContent = "да";
  const no  = document.createElement("button"); no.type  = "button"; no.textContent = "нет";
  yes.style.cssText = no.style.cssText = "font:800 12px 'Nunito',sans-serif;padding:2px 6px";
  yes.style.color = "#c0392b";
  no.onclick = (e) => { e.stopPropagation(); box.remove(); };
  yes.onclick = async (e) => {
    e.stopPropagation();
    yes.disabled = no.disabled = true; yes.textContent = "…";
    const r = await SM.chatDelete(m.id, m.att_url);
    box.remove();
    if (!r.ok){ showError(r.error || "Не удалось удалить сообщение"); return; }
    clearError();
    applyDeleted(m.id);
  };
  box.appendChild(q); box.appendChild(yes); box.appendChild(no);
  showMessagePopover(box,bubble);
}

/* Превращаем пузырёк в надгробие: содержимое стёрто и на сервере тоже */
function fillGone(el, m){
  el.className = "bub " + (m.sender_id === ME.id ? "me" : "them") + " gone";
  el.innerHTML = "";
  const t = document.createElement("span");
  t.textContent = "сообщение удалено";
  el.appendChild(t);
  const tm = document.createElement("span");
  tm.className = "tm"; tm.textContent = hhmm(m.created_at);
  el.appendChild(tm);
}

function applyDeleted(id){
  const i = MSGS.findIndex(x => x.id === id);
  if (i >= 0){
    MSGS[i].deleted_at = new Date().toISOString();
    MSGS[i].body = ""; MSGS[i].att_url = null;
  }
  const el = document.querySelector('.bub[data-id="'+id+'"]');
  if (el) fillGone(el, MSGS[i] || { id: id, sender_id: ME.id, created_at: new Date().toISOString() });
}

function openPicker(bubble, msgId){
  const old = document.querySelector(".rxpick"); if (old) old.remove();
  const pick = document.createElement("div");
  pick.className = "rxpick";
  RX.forEach(r => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = r;b.setAttribute('aria-label','Реакция '+r);
    b.onclick = async (e) => {
      e.stopPropagation(); pick.remove();
      await SM.chatReact(msgId, r);
      await loadReactions([msgId]);
    };
    pick.appendChild(b);
  });
  showMessagePopover(pick,bubble);
}

/* Сводка реакций под сообщением: смайлик и сколько раз поставили */
async function loadReactions(ids){
  if (!ids || !ids.length) return;
  let map = {};
  try { map = await SM.chatReactions(ids); } catch(e){ return; }
  ids.forEach(id => {
    const box = document.querySelector('.bub[data-id="'+id+'"] .rx');
    if (!box) return;
    const list = map[id] || [];
    const counts = {};
    list.forEach(x => { counts[x.r] = (counts[x.r] || 0) + 1; });
    box.innerHTML = "";
    Object.keys(counts).forEach(r => {
      const s = document.createElement("span");
      s.textContent = r + (counts[r] > 1 ? " " + counts[r] : "");
      box.appendChild(s);
    });
  });
}

function atBottom(scroll){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60; }

function appendMsg(m, force){
  const scroll = document.getElementById("chatScroll");
  if (!scroll) return;
  if (m.id && SEEN.has(m.id)) return;
  if (m.id) SEEN.add(m.id);

  const stick = force || atBottom(scroll);
  const empty = scroll.querySelector(".chat-empty");
  if (empty) empty.remove();

  const last = MSGS[MSGS.length-1];
  if (!last || dayKey(last.created_at) !== dayKey(m.created_at)){
    const sep = document.createElement("div");
    sep.className = "daysep";
    sep.textContent = dayLabel(new Date(m.created_at));
    scroll.appendChild(sep);
  }
  scroll.appendChild(bubbleEl(m));
  MSGS.push(m);
  if (stick) scroll.scrollTop = scroll.scrollHeight;
}

/* Строка изменилась: либо её прочитали, либо автор удалил сообщение */
function applyUpdate(m){
  const bub = document.querySelector('.bub[data-id="'+m.id+'"]');
  if (!bub) return;
  if (m.deleted_at){
    const i = MSGS.findIndex(x => x.id === m.id);
    if (i >= 0) MSGS[i] = m;
    fillGone(bub, m);
    return;
  }
  if (m.sender_id !== ME.id || !m.read_at) return;
  const tm = bub.querySelector(".tm");
  if (tm) tm.textContent = hhmm(m.created_at) + " ✓✓";
}

function showError(txt,id="chatErr"){
  const wrap = document.querySelector(".chatwrap"); if (!wrap) return;
  let box = document.getElementById(id);
  if (!box){ box = document.createElement("div"); box.id=id; box.className="chat-err"; wrap.parentNode.insertBefore(box, wrap); }
  box.setAttribute("role", "alert");
  box.textContent = txt;
}
function clearError(id="chatErr"){ const b=document.getElementById(id); if (b) b.remove(); }

function initials(name){ return String(name).trim().split(/\s+/).slice(0,2).map(s=>Array.from(s)[0]||'').join('').toUpperCase(); }
function drawPeople(){
  const wrap=document.getElementById('peopleWrap'),box=document.getElementById('people');
  document.querySelector('.cols').classList.toggle('solo',ROLE==='student');
  wrap.style.display=ROLE==='student'?'none':'';
  if(ROLE==='student')return;
  document.getElementById('peopleCount').textContent='Ученики · '+PEOPLE.length;
  box.innerHTML=PEOPLE.length?PEOPLE.map((p,i)=>
    '<button class="li'+(i===sel?' on':'')+'" data-i="'+i+'" aria-current="'+(i===sel?'true':'false')+'">'+
    '<span class="chat-avatar" aria-hidden="true">'+esc(initials(p.name))+'</span><span class="t">'+esc(p.name)+'</span>'+
    (p.unread?'<span class="unread" aria-label="Непрочитанных: '+p.unread+'">'+p.unread+'</span>':'')+'</button>').join(''):
    '<div class="chat-empty">Пока нет учеников. Пригласи их по коду на странице «Мои ученики».</div>';
  box.querySelectorAll('.li').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;drawPane();drawPeople();});
  const select=document.getElementById('chatPerson');
  select.innerHTML=PEOPLE.map((p,i)=>'<option value="'+i+'">'+esc(p.name)+(p.unread?' ('+p.unread+' новых)':'')+'</option>').join('');
  select.value=String(sel);select.disabled=!PEOPLE.length;
  select.onchange=()=>{sel=+select.value;drawPane();drawPeople();};
}

function drawPane(){
  document.querySelectorAll('.rxpick').forEach(p=>p.remove());
  const pane = document.getElementById("pane");
  const person = PEOPLE[sel];
  if (!person){
    stopChat();
    pane.innerHTML = '<div class="pane-hd"><span>Сообщения</span></div>' +
      SMUI.empty(
        ROLE === "teacher" ? "Выбери ученика" : "Учитель не привязан",
        ROLE === "teacher"
          ? "Выбери ученика, чтобы открыть переписку."
          : "Чтобы написать учителю, сначала привяжись к нему по коду на странице «Мои курсы».");
    return;
  }
  pane.innerHTML =
    '<div class="pane-hd chat-header"><span class="chat-avatar" aria-hidden="true">'+esc(initials(person.name))+'</span>'+
      '<div class="chat-heading"><h2>'+esc(person.name)+'</h2><p>'+(ROLE==='teacher'?'Личная переписка':'Твой преподаватель')+'</p></div>'+
      '<span id="chatState" role="status">подключаюсь…</span></div>' +
    '<div class="chatwrap">' +
      '<button class="b sm" id="chatOlder" hidden>Загрузить предыдущие сообщения</button>' +
      '<div class="chat-scroll" id="chatScroll" role="region" aria-label="Переписка" tabindex="0"><div class="chat-empty">Загружаю…</div></div>' +
      '<div class="emopan" id="emoPan" role="region" aria-label="Эмодзи"></div>' +
      '<div class="gifpan" id="gifPan" role="region" aria-label="Гифки">' +
        '<label for="gifQ">Найти гифку</label><input id="gifQ" placeholder="Hello, well done, thanks…" maxlength="60">' +
        '<div class="gifgrid" id="gifGrid"></div><div class="gifmsg" id="gifMsg" role="status">Загружаю популярные…</div>' +
        '<div class="gifmsg">Powered by GIPHY</div></div>' +
      '<div class="upbar" id="upBar" role="status"></div>' +
      '<div class="chat-composer"><label for="chatText">Сообщение</label><div class="chat-in">' +
        '<textarea id="chatText" rows="1" placeholder="Напиши сообщение…" maxlength="2000" aria-describedby="composerHint"></textarea>'+
        '<div class="composer-tools">'+
          '<button class="tool" id="btnEmo" type="button" title="Эмодзи" aria-label="Эмодзи" aria-expanded="false" aria-controls="emoPan">'+chatIcon('smile')+'</button>'+
          '<button class="tool gif" id="btnGif" type="button" title="Гифки" aria-label="Гифки" aria-expanded="false" aria-controls="gifPan">GIF</button>'+
          '<button class="tool" id="btnClip" type="button" title="Прикрепить файл" aria-label="Прикрепить файл">'+chatIcon('clip')+'</button>'+
          '<button class="go" id="chatSend" type="button" aria-label="Отправить"><span>Отправить</span>'+chatIcon('send')+'</button>'+
        '</div></div><p class="composer-hint" id="composerHint">Enter: отправить · Shift + Enter: новая строка</p></div>'+
    '</div><div class="chat-note">'+icon('lock',12)+'<span>Переписку видите только вы и собеседник</span></div>';
  startChat(person);
}

/* ---------- первая загрузка и живой канал ---------- */

function renderMessages(rows,meta={}){
  const scroll=document.getElementById('chatScroll');if(!scroll)return;
  const stick=atBottom(scroll),height=scroll.scrollHeight,top=scroll.scrollTop;
  const confirmed=new Set(rows.map(m=>m.id));
  const pending=MSGS.filter(m=>(m.__pending||m.__failed)&&!confirmed.has(m.id.replace(/^tmp-/,'')));
  const byId=new Map([...rows,...pending].map(m=>[m.id,m]));
  const ordered=[...byId.values()].sort(SMChat.compare);
  const existing=new Map([...scroll.querySelectorAll('.bub[data-id]')].map(el=>[el.dataset.id,el]));
  scroll.querySelectorAll('.daysep,.chat-empty').forEach(el=>el.remove());
  for(const [id,el]of existing)if(!byId.has(id))el.remove();
  let anchor=scroll.firstElementChild,lastDay=null;
  for(const m of ordered){
    let el=existing.get(m.id);
    if(!el)el=bubbleEl(m);
    else if(m.deleted_at&&!el.classList.contains('gone'))fillGone(el,m);
    else if(m.read_at&&m.sender_id===ME.id&&!m.__pending){const tm=el.querySelector('.tm');if(tm)tm.textContent=hhmm(m.created_at)+' ✓✓';}
    if(el!==anchor)scroll.insertBefore(el,anchor);
    anchor=el.nextElementSibling;
    const day=dayKey(m.created_at);if(day!==lastDay){const sep=document.createElement('div');sep.className='daysep';sep.textContent=dayLabel(new Date(m.created_at));scroll.insertBefore(sep,el);lastDay=day;}
  }
  MSGS=ordered;SEEN=new Set(ordered.map(m=>m.id));
  if(!ordered.length){const empty=document.createElement('div');empty.className='chat-empty';empty.textContent=meta.loaded?'Сообщений пока нет. Напиши первым':'Загружаю…';scroll.append(empty);}
  const older=document.getElementById('chatOlder');if(older)older.hidden=!meta.hasOlder;
  if(meta.reason==='older'||!stick)scroll.scrollTop=top+(scroll.scrollHeight-height);else scroll.scrollTop=scroll.scrollHeight;
}
async function markIncomingRead(person){
  if(readBusy||!MSGS.some(m=>m.sender_id!==ME.id&&!m.read_at))return;
  readBusy=true;const generation=chatGeneration,{teacherId,studentId}=pairFor(person);
  try{
    const result=await SM.chatMarkRead(teacherId,studentId);if(generation!==chatGeneration||!result?.ok)return;
    MSGS.forEach(m=>{if(m.sender_id!==ME.id&&!m.read_at)m.read_at=new Date().toISOString();});
    if(ROLE==='teacher'&&person.unread){person.unread=0;drawPeople();}
    if(window.SM_shellRefreshUnread)SM_shellRefreshUnread();
  }catch(error){}finally{if(generation===chatGeneration)readBusy=false;}
}

function setState(txt){ const s=document.getElementById("chatState"); if (s) s.textContent = txt; }

function startChat(person){
  stopChat();
  const inp = document.getElementById("chatText"), snd = document.getElementById("chatSend");
  if (!inp || !snd) return;
  const { teacherId, studentId } = pairFor(person);

  const generation=chatGeneration,active=()=>generation===chatGeneration;
  chatSession=SMChat.connect({api:SM,teacherId,studentId,
    onRows(rows,meta){if(!active())return;renderMessages(rows,meta);markIncomingRead(person);if(meta.reason==='initial'||meta.reason==='older')loadReactions(rows.map(m=>m.id));},
    onState(state){if(active())setState({online:'подключено',connecting:'подключаемся…',polling:'обновление раз в 10 сек',offline:'нет связи · повторяем подключение'}[state]);},
    onError(error){if(!active())return;if(error)showError('Не удалось обновить переписку. Подключение восстановится автоматически.','chatSyncErr');else clearError('chatSyncErr');}
  });
  document.getElementById('chatOlder').onclick=async function(){this.disabled=true;try{await chatSession?.older();}finally{if(active())this.disabled=false;}};

  /* ---------- смайлы ---------- */
  const EMO = [
    ['Настроение', [['🥰','Тепло'],['😍','Восторг'],['🤩','Восхищение'],['😂','Смех'],['🥹','Тронута'],['😊','Улыбка'],['😎','Круто'],['🤗','Обнимаю'],['🤔','Думаю'],['😅','Неловко'],['🙃','Ирония'],['🥳','Праздник']]],
    ['Поддержка', [['❤️','Сердце'],['🔥','Огонь'],['👏','Аплодисменты'],['🙌','Ура'],['💪','Сила'],['✨','Искры'],['🎉','Поздравляю'],['💯','Отлично'],['🏆','Победа'],['👍','Нравится'],['🫶','Поддержка'],['🌟','Звезда']]],
    ['Учёба и планы', [['👋','Привет'],['☕','Кофе'],['📚','Книги'],['📝','Заметки'],['🎧','Слушаем'],['💬','Обсуждаем'],['💡','Идея'],['✅','Готово'],['📌','Важно'],['🗓️','Расписание'],['🚀','Вперёд'],['🤞','Удачи']]]
  ];
  const emoPan=document.getElementById('emoPan'),btnEmo=document.getElementById('btnEmo');
  function resizeInput(){inp.style.height='auto';inp.style.height=Math.min(144,Math.max(44,inp.scrollHeight))+'px';}
  inp.addEventListener('input',resizeInput);
  EMO.forEach(([name,items])=>{
    const section=document.createElement('section');section.className='emoji-section';
    const heading=document.createElement('h3');heading.textContent=name;section.appendChild(heading);
    const grid=document.createElement('div');grid.className='emoji-grid';section.appendChild(grid);
    items.forEach(([emoji,label])=>{
      const b=document.createElement('button');b.type='button';b.textContent=emoji;b.title=label;b.setAttribute('aria-label',label+' '+emoji);
      b.onclick=()=>{
        const start=inp.selectionStart??inp.value.length,end=inp.selectionEnd??start;
        if(inp.value.length-(end-start)+emoji.length>inp.maxLength)return;
        inp.setRangeText(emoji,start,end,'end');inp.focus();resizeInput();
      };
      grid.appendChild(b);
    });
    emoPan.appendChild(section);
  });

  /* ---------- гифки ---------- */
  const gifPan = document.getElementById("gifPan"), btnGif = document.getElementById("btnGif");
  const gifQ = document.getElementById("gifQ"), gifGrid = document.getElementById("gifGrid"), gifMsg = document.getElementById("gifMsg");
  let gifTimer = null, gifSeq = 0, gifLoaded = false;

  function gifSay(t){ if (gifMsg){ gifMsg.textContent = t || ""; gifMsg.style.display = t ? "block" : "none"; } }

  async function gifLoad(q){
    if (!gifGrid) return;
    const seq = ++gifSeq;                 /* ответ на устаревший запрос не рисуем */
    gifSay(q ? "Ищу…" : "Загружаю популярные…");
    const r = await SM.gifSearch(q);
    if (seq !== gifSeq || !document.body.contains(gifGrid)) return;
    if (!r.ok){ gifGrid.innerHTML = ""; gifSay(r.error); return; }
    if (!r.items.length){ gifGrid.innerHTML = ""; gifSay("Ничего не нашлось. Попробуй другое слово на английском."); return; }
    gifSay("");
    gifGrid.innerHTML = "";
    r.items.forEach(g => {
      const b = document.createElement("button");
      b.type = "button"; b.title = g.alt;
      const im = document.createElement("img");
      im.src = g.preview; im.alt = g.alt; im.loading = "lazy";
      b.appendChild(im);
      b.onclick = () => {
        gifPan.classList.remove("on");
        send({ url: g.url, kind: "image", name: (g.alt || "gif") + ".gif", size: g.size || null });
      };
      gifGrid.appendChild(b);
    });
  }

  if (gifQ) gifQ.oninput = () => {
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => gifLoad(gifQ.value.trim()), 400);
  };

  function closePanels(){
    emoPan.classList.remove('on');gifPan.classList.remove('on');
    btnEmo.setAttribute('aria-expanded','false');btnGif.setAttribute('aria-expanded','false');
  }
  btnEmo.onclick=()=>{
    const open=!emoPan.classList.contains('on');closePanels();
    if(open){emoPan.classList.add('on');btnEmo.setAttribute('aria-expanded','true');emoPan.querySelector('button')?.focus();}
  };
  btnGif.onclick=()=>{
    const open=!gifPan.classList.contains('on');closePanels();
    if(open){gifPan.classList.add('on');btnGif.setAttribute('aria-expanded','true');if(!gifLoaded){gifLoaded=true;gifLoad('');}gifQ.focus();}
  };
  document.getElementById('pane').onkeydown=e=>{
    if(e.key==='Escape'){
      const trigger=emoPan.classList.contains('on')?btnEmo:gifPan.classList.contains('on')?btnGif:null;
      closePanels();trigger?.focus();
    }
  };

  /* ---------- скрепка ---------- */
  const upBar = document.getElementById("upBar"), btnClip = document.getElementById("btnClip");
  function say(t){ if (upBar) upBar.textContent = t || ""; }
  if (btnClip) btnClip.onclick = () => {
    const fi = document.createElement("input");
    fi.type = "file";
    fi.accept = "image/*,video/*,audio/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip";
    fi.onchange = async () => {
      const file = fi.files && fi.files[0]; if (!file) return;
      clearError();
      say("Загружаю «" + file.name + "»…");
      btnClip.disabled = true;
      const up = await SM.chatUpload(file);
      btnClip.disabled = false; say("");
      if (!up.ok){ showError(up.error || "Файл не загрузился"); return; }
      send(up);
    };
    fi.click();
  };

  async function send(att,retry){
    if(!active())return;
    const v = retry?retry.text:(inp.value||"").trim();
    if (!v && !att) return;
    if(!retry)inp.value = ""; inp.focus();resizeInput();closePanels();
    clearError();

    /* Оптимистичная отправка: пузырёк виден сразу, не дожидаясь сервера */
    const clientId=retry?.id||crypto.randomUUID();
    const tempId = "tmp-" + clientId;
    appendMsg({ id: tempId, sender_id: ME.id, body: v, created_at: new Date().toISOString(), __pending: true,
                att_url: att && att.url, att_kind: att && att.kind, att_name: att && att.name, att_size: att && att.size }, true);

    let r;try{r=await SM.chatSend(teacherId,studentId,v,att,clientId,ME.id);}catch(error){r={ok:false,error:error.message};}
    if(!active())return;
    if(!r.ok){const saved=chatSession?.values().find(m=>m.id===clientId);if(saved)r={ok:true,msg:saved};}
    const el = document.querySelector('.bub[data-id="'+tempId+'"]');

    if (!r.ok){
      const pending=MSGS.find(m=>m.id===tempId);if(pending){pending.__failed=true;pending.__pending=false;}
      if (el){
        el.classList.remove("pending"); el.classList.add("failed");
        const tm = el.querySelector(".tm");
        if (tm){
          tm.textContent = "не отправлено";
          const again = document.createElement("button");
          again.className = "again"; again.textContent = "повторить";
          again.onclick = function(){
            el.remove();
            MSGS = MSGS.filter(x => x.id !== tempId);
            SEEN.delete(tempId);
            send(att,{id:clientId,text:v});
          };
          tm.appendChild(again);
        }
      }
      showError(r.error || "Сообщение не ушло. Проверь связь и попробуй ещё раз.");
      return;
    }

    const real=r.msg;
    if(real){el?.remove();MSGS=MSGS.filter(m=>m.id!==tempId);SEEN.delete(tempId);chatSession.merge([real],'sent');}

  }

  snd.onclick = () => send();
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
}

async function boot(){
  const pane = document.getElementById("pane");
  // роль определяем по профилю
  let prof = null;
  try { prof = await SM.myProfile(); } catch(e){}
  ROLE = (prof && prof.role === "teacher") ? "teacher" : "student";

  ME = await SMUI.requireAuth(pane, ROLE);
  if (!ME){ SMUI.mount({ role: ROLE, active: "chat" }); return; }

  SMUI.mount({ role: ROLE, active: "chat" });

  if (ROLE === "teacher"){
    let students = [], unread = {};
    try { students = await SM.myStudents(); } catch(e){}
    try { unread = await SM.teacherUnread(); } catch(e){}
    PEOPLE = (students||[]).map(s => ({ id: s.student_id, name: s.name || "Ученик", unread: unread[s.student_id] || 0 }));
    // сначала — у кого есть непрочитанные
    PEOPLE.sort((a,b) => b.unread - a.unread);
  } else {
    let t = null;
    try { t = await SM.myTeacher(); } catch(e){}
    PEOPLE = t ? [{ id: t.teacher_id, name: t.name || "Учитель", unread: 0 }] : [];
  }
  drawPeople();
  drawPane();
}

SM.watchPresentationAuth(user=>{
  if(ME&&user?.id!==ME.id){stopChat();document.getElementById('pane').innerHTML='<div class="empty"><div class="p">Аккаунт изменился. Обновите страницу, чтобы открыть свою переписку.</div></div>';}
});
// перерисовать бейдж непрочитанных в меню при уходе со страницы
window.addEventListener("beforeunload", stopChat);
boot();
</script>
