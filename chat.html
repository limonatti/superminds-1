<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сообщения · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sm-warm.css?v=b4490901">
<style>
  /* Чат — те же классы, что в кабинете учителя, для единого вида */
  .chatwrap{padding:0 28px 10px}
  .chat-scroll{min-height:280px;max-height:min(60vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 0}
  .bub{max-width:78%;padding:9px 13px;font:600 14px "Nunito",sans-serif;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;border-radius:14px}
  .bub.me{align-self:flex-end;background:var(--color-accent);color:#fff}
  .bub.them{align-self:flex-start;background:var(--color-neutral-200,#eee);color:var(--color-text);border:1px solid var(--color-divider)}
  .bub .tm{display:block;font:700 10px "Nunito",sans-serif;opacity:.65;margin-top:3px;text-align:right}
  .bub.them .tm{text-align:left}
  /* сообщение ещё летит на сервер — показываем блёклым */
  .bub.pending{opacity:.55}
  .bub.failed{background:var(--color-neutral-200,#eee);color:var(--color-text);border:2px solid #c0392b}
  .bub .again{margin-left:8px;background:none;border:0;color:#c0392b;font:800 11px "Nunito",sans-serif;cursor:pointer;text-decoration:underline;padding:0}
  .daysep{align-self:center;background:var(--color-neutral-200,#eee);color:var(--color-neutral-700);border-radius:999px;padding:3px 12px;font:800 11px "Nunito",sans-serif;margin:6px 0}
  .chat-empty{padding:18px 0;color:var(--color-neutral-700);font:600 13px "Nunito",sans-serif;text-align:center}
  .chat-in{display:flex;gap:8px;padding:8px 0 4px}
  .chat-in input{flex:1;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);padding:12px 13px;font:600 14px "Nunito",sans-serif;border-radius:12px}
  .chat-in input:focus{outline:none;border-color:var(--color-accent)}
  .chat-in .go{border:0;background:var(--color-accent);color:#fff;padding:0 20px;font-size:16px;font-weight:800;cursor:pointer;border-radius:12px}
  .li .unread{display:inline-block;margin-left:6px;background:var(--color-accent);color:#fff;border-radius:999px;font:800 11px "Nunito",sans-serif;padding:1px 7px;vertical-align:middle}
  .chat-note{padding:2px 28px 14px;color:var(--color-neutral-700);font:600 12px "Nunito",sans-serif}
  .chat-err{margin:0 28px 10px;background:#fff2ef;border:2px solid #ffc9c0;color:#7b190d;border-radius:12px;padding:9px 12px;font:700 12px "Nunito",sans-serif}
  #chatState{font:700 11px "Nunito",sans-serif}
  /* вложения */
  .bub .att{display:block;margin:2px 0 4px;max-width:100%}
  .bub .att img,.bub .att video{max-width:100%;max-height:260px;border-radius:10px;display:block;cursor:pointer}
  .bub .att audio{width:220px;display:block}
  .bub .file{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.08);border-radius:10px;padding:8px 10px;text-decoration:underline}
  .bub.me .file{background:rgba(255,255,255,.2);color:#fff}
  .bub .fsz{opacity:.7;font-size:11px}
  /* реакции — кнопка и панель висят у края пузырька, поэтому он должен быть точкой отсчёта */
  .bub{position:relative}
  .rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .rx span{background:rgba(0,0,0,.1);border-radius:999px;padding:1px 7px;font-size:12px;line-height:1.5}
  .bub.me .rx span{background:rgba(255,255,255,.25)}
  .tools{position:absolute;top:-11px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
  .bub.me .tools{left:-12px}
  .bub.them .tools{right:-12px}
  .bub:hover .tools,.tools:focus-within{opacity:1}
  .tools button{background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;width:24px;height:24px;font-size:12px;cursor:pointer;line-height:1;padding:0;color:var(--color-text)}
  .tools button.del:hover{border-color:#c0392b;color:#c0392b}
  /* удалённое сообщение — след остаётся, содержимое стёрто */
  .bub.gone{background:transparent;border:2px dashed var(--color-divider);color:var(--color-neutral-700);font-style:italic;font-weight:700}
  .bub.gone .tm{opacity:.6}
  .rxpick{position:absolute;top:-40px;display:flex;gap:2px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;padding:3px 6px;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.08)}
  .bub.me .rxpick{left:-12px}
  .bub.them .rxpick{right:-12px}
  .rxpick button{background:none;border:0;font-size:18px;cursor:pointer;padding:1px 3px;line-height:1}
  /* панель смайлов и скрепка */
  .chat-in .tool{border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);padding:0 12px;font-size:17px;cursor:pointer;border-radius:12px;flex:none}
  .emopan{display:none;flex-wrap:wrap;gap:3px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:12px;padding:8px;margin-bottom:6px;max-height:170px;overflow-y:auto}
  .emopan.on{display:flex}
  .emopan button{background:none;border:0;font-size:21px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:8px}
  .emopan button:hover{background:var(--color-neutral-200,#eee)}
  .upbar{font:700 12px "Nunito",sans-serif;color:var(--color-neutral-700);padding:0 0 6px}
  /* каталог гифок */
  .chat-in .tool.gif{font:900 12px "Nunito",sans-serif;letter-spacing:.03em}
  .gifpan{display:none;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:12px;padding:8px;margin-bottom:6px}
  .gifpan.on{display:block}
  .gifpan input{width:100%;border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);padding:9px 11px;font:600 13px "Nunito",sans-serif;border-radius:10px;margin-bottom:7px}
  .gifpan input:focus{outline:none;border-color:var(--color-accent)}
  .gifgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px;max-height:210px;overflow-y:auto}
  .gifgrid button{border:0;padding:0;background:var(--color-neutral-200,#eee);border-radius:9px;overflow:hidden;cursor:pointer;aspect-ratio:1/1}
  .gifgrid img{width:100%;height:100%;object-fit:cover;display:block}
  .gifmsg{font:700 12px "Nunito",sans-serif;color:var(--color-neutral-700);padding:8px 2px}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="cols">
      <div class="list" id="peopleWrap">
        <div class="step">Шаг 1 · Выбери собеседника</div>
        <div id="people"></div>
      </div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=f191dd29"></script>
<script src="sm-shell.js?v=29cfb3d6"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;

let ME = null, ROLE = "student";
let PEOPLE = [];        // [{id, name, unread}]
let sel = 0;

/* Состояние открытой переписки */
let MSGS = [];          // то, что уже отрисовано
let SEEN = new Set();   // id, чтобы не задваивать
let unsub = null;       // отписка от живого канала
let pollTimer = null;   // запасной опрос, если канал не поднялся

function stopChat(){
  if (unsub){ try{ unsub(); }catch(e){} unsub = null; }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  MSGS = []; SEEN = new Set();
}

/* teacherId/studentId для текущей пары — зависит от роли */
function pairFor(person){
  return ROLE === "teacher"
    ? { teacherId: ME.id,   studentId: person.id }
    : { teacherId: person.id, studentId: ME.id };
}

/* ---------- отрисовка ---------- */

function dayLabel(d){
  const today = new Date(); const y = new Date(); y.setDate(y.getDate()-1);
  const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if (same(d,today)) return "сегодня";
  if (same(d,y)) return "вчера";
  return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
}
function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* Один пузырёк. Раньше вся переписка перерисовывалась через innerHTML на
   каждом цикле опроса — из-за этого слетало выделение текста и дёргалась
   прокрутка. Теперь узлы добавляются по одному и живут дальше сами. */
function human(n){
  if (!n) return "";
  if (n < 1024) return n + " Б";
  if (n < 1024*1024) return Math.round(n/1024) + " КБ";
  return (n/1024/1024).toFixed(1) + " МБ";
}

/* Вложение внутри пузырька: картинку и видео показываем сразу,
   остальное — строкой со ссылкой на скачивание. */
function attEl(m){
  const wrap = document.createElement("div");
  wrap.className = "att";
  if (m.att_kind === "image"){
    const img = document.createElement("img");
    img.src = m.att_url; img.alt = m.att_name || "";
    img.loading = "lazy";
    img.onclick = () => openLink(m.att_url);
    wrap.appendChild(img);
  } else if (m.att_kind === "video"){
    const v = document.createElement("video");
    v.src = m.att_url; v.controls = true; v.preload = "metadata";
    wrap.appendChild(v);
  } else if (m.att_kind === "audio"){
    const a = document.createElement("audio");
    a.src = m.att_url; a.controls = true; a.preload = "metadata";
    wrap.appendChild(a);
  } else {
    const a = document.createElement("a");
    a.className = "file"; a.href = m.att_url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "📄 " + (m.att_name || "файл");
    const sz = document.createElement("span");
    sz.className = "fsz"; sz.textContent = human(m.att_size);
    a.appendChild(sz);
    wrap.appendChild(a);
  }
  return wrap;
}
function openLink(u){ window.open(u, "_blank", "noopener"); }

const RX = ["👍","❤️","😂","👏","🔥","😮","😢","🎉"];

function bubbleEl(m){
  const mine = m.sender_id === ME.id;
  const el = document.createElement("div");
  el.className = "bub " + (mine ? "me" : "them") + (m.__pending ? " pending" : "");
  el.dataset.id = m.id;

  if (m.deleted_at){ fillGone(el, m); return el; }

  if (m.att_url) el.appendChild(attEl(m));
  if (m.body){
    const txt = document.createElement("span");
    txt.textContent = m.body;
    el.appendChild(txt);
  }

  const tm = document.createElement("span");
  tm.className = "tm";
  tm.textContent = m.__pending ? "отправляю…" : (hhmm(m.created_at) + (mine ? (m.read_at ? " ✓✓" : " ✓") : ""));
  el.appendChild(tm);

  const rx = document.createElement("div");
  rx.className = "rx";
  el.appendChild(rx);

  /* реакцию и удаление можно навесить только на сохранённое сообщение */
  if (!m.__pending) el.appendChild(toolsEl(el, m, mine));
  return el;
}

/* Кнопки у края пузырька: реакция всем, корзина — только автору */
function toolsEl(bubble, m, mine){
  const box = document.createElement("div");
  box.className = "tools";

  const rb = document.createElement("button");
  rb.className = "rx-open"; rb.type = "button"; rb.title = "реакция"; rb.textContent = "☺";
  rb.onclick = (e) => { e.stopPropagation(); openPicker(bubble, m.id); };
  box.appendChild(rb);

  if (mine){
    const db = document.createElement("button");
    db.className = "del"; db.type = "button"; db.title = "удалить"; db.textContent = "🗑";
    db.onclick = (e) => { e.stopPropagation(); askDelete(bubble, m); };
    box.appendChild(db);
  }
  return box;
}

/* Спрашиваем прямо у пузырька, а не системным окном:
   удаление видно обоим, поэтому лучше не промахнуться мимо кнопки. */
function askDelete(bubble, m){
  const old = document.querySelector(".rxpick"); if (old) old.remove();
  const box = document.createElement("div");
  box.className = "rxpick";
  box.style.fontSize = "12px";
  const q = document.createElement("span");
  q.style.cssText = "font:800 12px 'Nunito',sans-serif;padding:2px 4px;white-space:nowrap";
  q.textContent = "Удалить у обоих?";
  const yes = document.createElement("button"); yes.type = "button"; yes.textContent = "да";
  const no  = document.createElement("button"); no.type  = "button"; no.textContent = "нет";
  yes.style.cssText = no.style.cssText = "font:800 12px 'Nunito',sans-serif;padding:2px 6px";
  yes.style.color = "#c0392b";
  no.onclick = (e) => { e.stopPropagation(); box.remove(); };
  yes.onclick = async (e) => {
    e.stopPropagation();
    yes.disabled = no.disabled = true; yes.textContent = "…";
    const r = await SM.chatDelete(m.id, m.att_url);
    box.remove();
    if (!r.ok){ showError(r.error || "Не удалось удалить сообщение"); return; }
    clearError();
    applyDeleted(m.id);
  };
  box.appendChild(q); box.appendChild(yes); box.appendChild(no);
  bubble.appendChild(box);
  setTimeout(() => document.addEventListener("click", function once(){ box.remove(); document.removeEventListener("click", once); }), 0);
}

/* Превращаем пузырёк в надгробие: содержимое стёрто и на сервере тоже */
function fillGone(el, m){
  el.className = "bub " + (m.sender_id === ME.id ? "me" : "them") + " gone";
  el.innerHTML = "";
  const t = document.createElement("span");
  t.textContent = "сообщение удалено";
  el.appendChild(t);
  const tm = document.createElement("span");
  tm.className = "tm"; tm.textContent = hhmm(m.created_at);
  el.appendChild(tm);
}

function applyDeleted(id){
  const i = MSGS.findIndex(x => x.id === id);
  if (i >= 0){
    MSGS[i].deleted_at = new Date().toISOString();
    MSGS[i].body = ""; MSGS[i].att_url = null;
  }
  const el = document.querySelector('.bub[data-id="'+id+'"]');
  if (el) fillGone(el, MSGS[i] || { id: id, sender_id: ME.id, created_at: new Date().toISOString() });
}

function openPicker(bubble, msgId){
  const old = document.querySelector(".rxpick"); if (old) old.remove();
  const pick = document.createElement("div");
  pick.className = "rxpick";
  RX.forEach(r => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = r;
    b.onclick = async (e) => {
      e.stopPropagation(); pick.remove();
      await SM.chatReact(msgId, r);
      await loadReactions([msgId]);
    };
    pick.appendChild(b);
  });
  bubble.appendChild(pick);
  setTimeout(() => document.addEventListener("click", function once(){ pick.remove(); document.removeEventListener("click", once); }), 0);
}

/* Сводка реакций под сообщением: смайлик и сколько раз поставили */
async function loadReactions(ids){
  if (!ids || !ids.length) return;
  let map = {};
  try { map = await SM.chatReactions(ids); } catch(e){ return; }
  ids.forEach(id => {
    const box = document.querySelector('.bub[data-id="'+id+'"] .rx');
    if (!box) return;
    const list = map[id] || [];
    const counts = {};
    list.forEach(x => { counts[x.r] = (counts[x.r] || 0) + 1; });
    box.innerHTML = "";
    Object.keys(counts).forEach(r => {
      const s = document.createElement("span");
      s.textContent = r + (counts[r] > 1 ? " " + counts[r] : "");
      box.appendChild(s);
    });
  });
}

function atBottom(scroll){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60; }

function appendMsg(m, force){
  const scroll = document.getElementById("chatScroll");
  if (!scroll) return;
  if (m.id && SEEN.has(m.id)) return;
  if (m.id) SEEN.add(m.id);

  const stick = force || atBottom(scroll);
  const empty = scroll.querySelector(".chat-empty");
  if (empty) empty.remove();

  const last = MSGS[MSGS.length-1];
  if (!last || dayKey(last.created_at) !== dayKey(m.created_at)){
    const sep = document.createElement("div");
    sep.className = "daysep";
    sep.textContent = dayLabel(new Date(m.created_at));
    scroll.appendChild(sep);
  }
  scroll.appendChild(bubbleEl(m));
  MSGS.push(m);
  if (stick) scroll.scrollTop = scroll.scrollHeight;
}

/* Строка изменилась: либо её прочитали, либо автор удалил сообщение */
function applyUpdate(m){
  const bub = document.querySelector('.bub[data-id="'+m.id+'"]');
  if (!bub) return;
  if (m.deleted_at){
    const i = MSGS.findIndex(x => x.id === m.id);
    if (i >= 0) MSGS[i] = m;
    fillGone(bub, m);
    return;
  }
  if (m.sender_id !== ME.id || !m.read_at) return;
  const tm = bub.querySelector(".tm");
  if (tm) tm.textContent = hhmm(m.created_at) + " ✓✓";
}

function showError(txt){
  const wrap = document.querySelector(".chatwrap"); if (!wrap) return;
  let box = document.getElementById("chatErr");
  if (!box){ box = document.createElement("div"); box.id="chatErr"; box.className="chat-err"; wrap.parentNode.insertBefore(box, wrap); }
  box.textContent = txt;
}
function clearError(){ const b=document.getElementById("chatErr"); if (b) b.remove(); }

function drawPeople(){
  const box = document.getElementById("people");
  if (ROLE === "student"){
    // ученику список не нужен — прячем колонку
    document.getElementById("peopleWrap").style.display = "none";
    return;
  }
  if (!PEOPLE.length){
    box.innerHTML = '<div class="chat-empty" style="text-align:left;padding:14px 4px">Пока нет учеников. Позови их по коду на странице «Мой класс».</div>';
    return;
  }
  box.innerHTML = PEOPLE.map((p,i) =>
    '<button class="li'+(i===sel?" on":"")+'" data-i="'+i+'">' +
      '<span class="t">'+esc(p.name)+(p.unread?'<span class="unread">'+p.unread+'</span>':'')+'</span>' +
      '<span class="s">'+(p.unread?('новых: '+p.unread):'нет новых')+'</span></button>').join("");
  box.querySelectorAll(".li").forEach(b => b.onclick = () => { sel = +b.dataset.i; drawPane(); drawPeople(); });
}

function drawPane(){
  const pane = document.getElementById("pane");
  const person = PEOPLE[sel];
  if (!person){
    stopChat();
    pane.innerHTML = '<div class="pane-hd"><span>Сообщения</span></div>' +
      SMUI.empty(
        ROLE === "teacher" ? "Выбери ученика" : "Учитель не привязан",
        ROLE === "teacher"
          ? "Слева выбери ученика, чтобы открыть переписку."
          : "Чтобы написать учителю, сначала привяжись к нему по коду на странице «Мои курсы» (кнопка «У меня есть код учителя»).");
    return;
  }
  const title = ROLE === "teacher" ? person.name : ("Учитель · " + person.name);
  pane.innerHTML =
    '<div class="pane-hd"><span>'+esc(title)+'</span><span id="chatState">подключаюсь…</span></div>' +
    '<div class="chatwrap">' +
      '<div class="chat-scroll" id="chatScroll"><div class="chat-empty">Загружаю…</div></div>' +
      '<div class="emopan" id="emoPan"></div>' +
      '<div class="gifpan" id="gifPan">' +
        '<input id="gifQ" placeholder="Поиск гифок по-английски: hello, well done, thanks…" maxlength="60">' +
        '<div class="gifgrid" id="gifGrid"></div>' +
        '<div class="gifmsg" id="gifMsg">Загружаю популярные…</div>' +
        '<div class="gifmsg" style="opacity:.6;font-size:11px">Powered by GIPHY</div></div>' +
      '<div class="upbar" id="upBar"></div>' +
      '<div class="chat-in">' +
        '<button class="tool" id="btnEmo" type="button" title="смайлы">🙂</button>' +
        '<button class="tool gif" id="btnGif" type="button" title="гифки">GIF</button>' +
        '<button class="tool" id="btnClip" type="button" title="фото, видео или файл">📎</button>' +
        '<input id="chatText" placeholder="Написать '+esc(person.name)+'…" maxlength="2000">' +
        '<button class="go" id="chatSend" aria-label="Отправить">➤</button></div>' +
    '</div>' +
    '<div class="chat-note">Сообщения приходят сразу. Видит только ваша пара — переписка защищена.</div>';
  startChat(person);
}

/* ---------- первая загрузка и живой канал ---------- */

async function firstLoad(person){
  const scroll = document.getElementById("chatScroll");
  const { teacherId, studentId } = pairFor(person);
  let msgs = [];
  try { msgs = await SM.chatMessages(teacherId, studentId); }
  catch(e){ if (scroll) scroll.innerHTML = '<div class="chat-empty">Не удалось загрузить переписку. Обнови страницу.</div>'; return; }
  if (!scroll || !document.body.contains(scroll)) return;

  scroll.innerHTML = "";
  MSGS = []; SEEN = new Set();
  if (!msgs.length){
    scroll.innerHTML = '<div class="chat-empty">Сообщений пока нет. Напиши первым</div>';
  } else {
    msgs.forEach(m => appendMsg(m, true));
    loadReactions(msgs.map(m => m.id));
  }
  await markIncomingRead(person);
}

async function markIncomingRead(person){
  const { teacherId, studentId } = pairFor(person);
  const unreadIn = MSGS.some(m => m.sender_id !== ME.id && !m.read_at);
  if (!unreadIn) return;
  try { await SM.chatMarkRead(teacherId, studentId); } catch(e){}
  MSGS.forEach(m => { if (m.sender_id !== ME.id && !m.read_at) m.read_at = new Date().toISOString(); });
  if (ROLE === "teacher" && person.unread){ person.unread = 0; drawPeople(); }
  if (window.SM_shellRefreshUnread) SM_shellRefreshUnread();
}

function setState(txt){ const s=document.getElementById("chatState"); if (s) s.textContent = txt; }

function startChat(person){
  stopChat();
  const inp = document.getElementById("chatText"), snd = document.getElementById("chatSend");
  if (!inp || !snd) return;
  const { teacherId, studentId } = pairFor(person);

  firstLoad(person);

  /* Живой канал: база присылает новое сообщение сама, ждать нечего */
  unsub = SM.chatSubscribe(teacherId, studentId,
    function(m){
      appendMsg(m);
      if (m.sender_id !== ME.id) markIncomingRead(person);
    },
    function(m){ applyUpdate(m); }
  );

  if (unsub){
    setState("онлайн");
  } else {
    /* Канал не поднялся — запасной опрос, но реже и только за новыми */
    setState("обновление раз в 10 сек");
    pollTimer = setInterval(async function(){
      const last = MSGS[MSGS.length-1];
      let fresh = [];
      try { fresh = await SM.chatMessages(teacherId, studentId, last && last.created_at); } catch(e){ return; }
      fresh.forEach(m => appendMsg(m));
      if (fresh.some(m => m.sender_id !== ME.id)) markIncomingRead(person);
    }, 10000);
  }

  /* ---------- смайлы ---------- */
  const EMO = ["😀","😃","😄","😁","😊","🙂","😉","😍","🥰","😘","😎","🤓","🤗","🤔","😐","😴","😅","😂","🤣","😭",
               "😢","😳","😱","🤯","🥳","😇","🙃","😜","🤪","😬","👍","👎","👏","🙌","🙏","💪","✌️","🤝","👋","🤞",
               "❤️","💛","💚","💙","💜","🧡","✨","⭐","🌟","🔥","🎉","🎊","🏆","🥇","💯","✅","❌","❗","❓","💡",
               "📚","📖","✏️","📝","🎒","🍎","🐱","🐶","🦊","🐻","🌞","🌈","🌸","🍀","⚽","🎵","🎨","🚀","🎁","☕"];
  const emoPan = document.getElementById("emoPan"), btnEmo = document.getElementById("btnEmo");
  if (emoPan && !emoPan.dataset.built){
    emoPan.dataset.built = "1";
    EMO.forEach(e => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = e;
      b.onclick = () => {
        const pos = inp.selectionStart || inp.value.length;
        inp.value = inp.value.slice(0, pos) + e + inp.value.slice(pos);
        inp.focus(); inp.selectionStart = inp.selectionEnd = pos + e.length;
      };
      emoPan.appendChild(b);
    });
  }

  /* ---------- гифки ---------- */
  const gifPan = document.getElementById("gifPan"), btnGif = document.getElementById("btnGif");
  const gifQ = document.getElementById("gifQ"), gifGrid = document.getElementById("gifGrid"), gifMsg = document.getElementById("gifMsg");
  let gifTimer = null, gifSeq = 0, gifLoaded = false;

  function gifSay(t){ if (gifMsg){ gifMsg.textContent = t || ""; gifMsg.style.display = t ? "block" : "none"; } }

  async function gifLoad(q){
    if (!gifGrid) return;
    const seq = ++gifSeq;                 /* ответ на устаревший запрос не рисуем */
    gifSay(q ? "Ищу…" : "Загружаю популярные…");
    const r = await SM.gifSearch(q);
    if (seq !== gifSeq || !document.body.contains(gifGrid)) return;
    if (!r.ok){ gifGrid.innerHTML = ""; gifSay(r.error); return; }
    if (!r.items.length){ gifGrid.innerHTML = ""; gifSay("Ничего не нашлось. Попробуй другое слово — каталог англоязычный."); return; }
    gifSay("");
    gifGrid.innerHTML = "";
    r.items.forEach(g => {
      const b = document.createElement("button");
      b.type = "button"; b.title = g.alt;
      const im = document.createElement("img");
      im.src = g.preview; im.alt = g.alt; im.loading = "lazy";
      b.appendChild(im);
      b.onclick = () => {
        gifPan.classList.remove("on");
        send({ url: g.url, kind: "image", name: (g.alt || "gif") + ".gif", size: g.size || null });
      };
      gifGrid.appendChild(b);
    });
  }

  if (gifQ) gifQ.oninput = () => {
    clearTimeout(gifTimer);
    gifTimer = setTimeout(() => gifLoad(gifQ.value.trim()), 400);
  };

  /* панели смайлов и гифок не открываем разом — вдвоём они закрывают переписку */
  if (btnEmo) btnEmo.onclick = () => {
    if (gifPan) gifPan.classList.remove("on");
    emoPan.classList.toggle("on");
  };
  if (btnGif) btnGif.onclick = () => {
    if (emoPan) emoPan.classList.remove("on");
    const on = gifPan.classList.toggle("on");
    if (on && !gifLoaded){ gifLoaded = true; gifLoad(""); }
    if (on && gifQ) gifQ.focus();
  };

  /* ---------- скрепка ---------- */
  const upBar = document.getElementById("upBar"), btnClip = document.getElementById("btnClip");
  function say(t){ if (upBar) upBar.textContent = t || ""; }
  if (btnClip) btnClip.onclick = () => {
    const fi = document.createElement("input");
    fi.type = "file";
    fi.accept = "image/*,video/*,audio/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip";
    fi.onchange = async () => {
      const file = fi.files && fi.files[0]; if (!file) return;
      clearError();
      say("Загружаю «" + file.name + "»…");
      btnClip.disabled = true;
      const up = await SM.chatUpload(file);
      btnClip.disabled = false; say("");
      if (!up.ok){ showError(up.error || "Файл не загрузился"); return; }
      send(up);
    };
    fi.click();
  };

  async function send(att){
    const v = (inp.value||"").trim();
    if (!v && !att) return;
    inp.value = ""; inp.focus();
    if (emoPan) emoPan.classList.remove("on");
    if (gifPan) gifPan.classList.remove("on");
    clearError();

    /* Оптимистичная отправка: пузырёк виден сразу, не дожидаясь сервера */
    const tempId = "tmp-" + Date.now();
    appendMsg({ id: tempId, sender_id: ME.id, body: v, created_at: new Date().toISOString(), __pending: true,
                att_url: att && att.url, att_kind: att && att.kind, att_name: att && att.name, att_size: att && att.size }, true);

    const r = await SM.chatSend(teacherId, studentId, v, att);
    const el = document.querySelector('.bub[data-id="'+tempId+'"]');

    if (!r.ok){
      if (el){
        el.classList.remove("pending"); el.classList.add("failed");
        const tm = el.querySelector(".tm");
        if (tm){
          tm.textContent = "не отправлено";
          const again = document.createElement("button");
          again.className = "again"; again.textContent = "повторить";
          again.onclick = function(){
            el.remove();
            MSGS = MSGS.filter(x => x.id !== tempId);
            SEEN.delete(tempId);
            inp.value = v; send(att);
          };
          tm.appendChild(again);
        }
      }
      showError(r.error || "Сообщение не ушло. Проверь связь и попробуй ещё раз.");
      return;
    }

    /* Пришёл настоящий id — подменяем черновик, чтобы канал не задвоил сообщение */
    const real = r.msg;
    if (el && real){
      el.dataset.id = real.id;
      el.classList.remove("pending");
      const tm = el.querySelector(".tm");
      if (tm) tm.textContent = hhmm(real.created_at) + " ✓";
      SEEN.delete(tempId); SEEN.add(real.id);
      const i = MSGS.findIndex(x => x.id === tempId);
      if (i >= 0) MSGS[i] = real;
      /* черновик рисовался без кнопок — теперь id настоящий, добавляем */
      if (!el.querySelector(".tools")) el.appendChild(toolsEl(el, real, true));
    }
  }

  snd.onclick = () => send();
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); send(); } });
}

async function boot(){
  const pane = document.getElementById("pane");
  // роль определяем по профилю
  let prof = null;
  try { prof = await SM.myProfile(); } catch(e){}
  ROLE = (prof && prof.role === "teacher") ? "teacher" : "student";

  ME = await SMUI.requireAuth(pane, ROLE);
  if (!ME){ SMUI.mount({ role: ROLE, active: "chat" }); return; }

  SMUI.mount({ role: ROLE, active: "chat" });

  if (ROLE === "teacher"){
    let students = [], unread = {};
    try { students = await SM.myStudents(); } catch(e){}
    try { unread = await SM.teacherUnread(); } catch(e){}
    PEOPLE = (students||[]).map(s => ({ id: s.student_id, name: s.name || "Ученик", unread: unread[s.student_id] || 0 }));
    // сначала — у кого есть непрочитанные
    PEOPLE.sort((a,b) => b.unread - a.unread);
  } else {
    let t = null;
    try { t = await SM.myTeacher(); } catch(e){}
    PEOPLE = t ? [{ id: t.teacher_id, name: t.name || "Учитель", unread: 0 }] : [];
  }
  drawPeople();
  drawPane();
}

// перерисовать бейдж непрочитанных в меню при уходе со страницы
window.addEventListener("beforeunload", stopChat);
boot();
</script>
