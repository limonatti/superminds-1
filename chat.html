<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сообщения · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css?v=6f7808f9">
<link rel="stylesheet" href="sm-ui.css?v=073c02c6">
<style>
  /* Чат — те же классы, что в кабинете учителя, для единого вида */
  .chatwrap{padding:0 28px 10px}
  .chat-scroll{min-height:280px;max-height:min(60vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 0}
  .bub{max-width:78%;padding:9px 13px;font:600 14px "Archivo",sans-serif;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;border-radius:14px}
  .bub.me{align-self:flex-end;background:var(--color-accent);color:#fff}
  .bub.them{align-self:flex-start;background:var(--color-neutral-200,#eee);color:var(--color-text);border:2px solid var(--color-divider)}
  .bub .tm{display:block;font:700 10px "Archivo",sans-serif;opacity:.65;margin-top:3px;text-align:right}
  .bub.them .tm{text-align:left}
  /* сообщение ещё летит на сервер — показываем блёклым */
  .bub.pending{opacity:.55}
  .bub.failed{background:var(--color-neutral-200,#eee);color:var(--color-text);border:2px solid #c0392b}
  .bub .again{margin-left:8px;background:none;border:0;color:#c0392b;font:800 11px "Archivo",sans-serif;cursor:pointer;text-decoration:underline;padding:0}
  .daysep{align-self:center;background:var(--color-neutral-200,#eee);color:var(--color-neutral-700);border-radius:999px;padding:3px 12px;font:800 11px "Archivo",sans-serif;margin:6px 0}
  .chat-empty{padding:18px 0;color:var(--color-neutral-700);font:600 13px "Archivo",sans-serif;text-align:center}
  .chat-in{display:flex;gap:8px;padding:8px 0 4px}
  .chat-in input{flex:1;border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);padding:12px 13px;font:600 14px "Archivo",sans-serif;border-radius:12px}
  .chat-in input:focus{outline:none;border-color:var(--color-accent)}
  .chat-in .go{border:0;background:var(--color-accent);color:#fff;padding:0 20px;font-size:16px;font-weight:800;cursor:pointer;border-radius:12px}
  .li .unread{display:inline-block;margin-left:6px;background:var(--color-accent);color:#fff;border-radius:999px;font:800 11px "Archivo",sans-serif;padding:1px 7px;vertical-align:middle}
  .chat-note{padding:2px 28px 14px;color:var(--color-neutral-700);font:600 12px "Archivo",sans-serif}
  .chat-err{margin:0 28px 10px;background:#fff2ef;border:2px solid #ffc9c0;color:#7b190d;border-radius:12px;padding:9px 12px;font:700 12px "Archivo",sans-serif}
  #chatState{font:700 11px "Archivo",sans-serif}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="cols">
      <div class="list" id="peopleWrap">
        <div class="step">Шаг 1 · Выбери собеседника</div>
        <div id="people"></div>
      </div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=7a245cdd"></script>
<script src="sm-shell.js?v=4b1f197b"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;

let ME = null, ROLE = "student";
let PEOPLE = [];        // [{id, name, unread}]
let sel = 0;

/* Состояние открытой переписки */
let MSGS = [];          // то, что уже отрисовано
let SEEN = new Set();   // id, чтобы не задваивать
let unsub = null;       // отписка от живого канала
let pollTimer = null;   // запасной опрос, если канал не поднялся

function stopChat(){
  if (unsub){ try{ unsub(); }catch(e){} unsub = null; }
  if (pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  MSGS = []; SEEN = new Set();
}

/* teacherId/studentId для текущей пары — зависит от роли */
function pairFor(person){
  return ROLE === "teacher"
    ? { teacherId: ME.id,   studentId: person.id }
    : { teacherId: person.id, studentId: ME.id };
}

/* ---------- отрисовка ---------- */

function dayLabel(d){
  const today = new Date(); const y = new Date(); y.setDate(y.getDate()-1);
  const same = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if (same(d,today)) return "сегодня";
  if (same(d,y)) return "вчера";
  return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
}
function dayKey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function hhmm(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

/* Один пузырёк. Раньше вся переписка перерисовывалась через innerHTML на
   каждом цикле опроса — из-за этого слетало выделение текста и дёргалась
   прокрутка. Теперь узлы добавляются по одному и живут дальше сами. */
function bubbleEl(m){
  const mine = m.sender_id === ME.id;
  const el = document.createElement("div");
  el.className = "bub " + (mine ? "me" : "them") + (m.__pending ? " pending" : "");
  el.dataset.id = m.id;
  el.textContent = m.body;
  const tm = document.createElement("span");
  tm.className = "tm";
  tm.textContent = m.__pending ? "отправляю…" : (hhmm(m.created_at) + (mine ? (m.read_at ? " ✓✓" : " ✓") : ""));
  el.appendChild(tm);
  return el;
}

function atBottom(scroll){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60; }

function appendMsg(m, force){
  const scroll = document.getElementById("chatScroll");
  if (!scroll) return;
  if (m.id && SEEN.has(m.id)) return;
  if (m.id) SEEN.add(m.id);

  const stick = force || atBottom(scroll);
  const empty = scroll.querySelector(".chat-empty");
  if (empty) empty.remove();

  const last = MSGS[MSGS.length-1];
  if (!last || dayKey(last.created_at) !== dayKey(m.created_at)){
    const sep = document.createElement("div");
    sep.className = "daysep";
    sep.textContent = dayLabel(new Date(m.created_at));
    scroll.appendChild(sep);
  }
  scroll.appendChild(bubbleEl(m));
  MSGS.push(m);
  if (stick) scroll.scrollTop = scroll.scrollHeight;
}

/* Пришло подтверждение чтения — меняем галочку, не трогая остальное */
function markReadInPlace(m){
  if (m.sender_id !== ME.id || !m.read_at) return;
  const el = document.querySelector('.bub[data-id="'+m.id+'"] .tm');
  if (el) el.textContent = hhmm(m.created_at) + " ✓✓";
}

function showError(txt){
  const wrap = document.querySelector(".chatwrap"); if (!wrap) return;
  let box = document.getElementById("chatErr");
  if (!box){ box = document.createElement("div"); box.id="chatErr"; box.className="chat-err"; wrap.parentNode.insertBefore(box, wrap); }
  box.textContent = txt;
}
function clearError(){ const b=document.getElementById("chatErr"); if (b) b.remove(); }

function drawPeople(){
  const box = document.getElementById("people");
  if (ROLE === "student"){
    // ученику список не нужен — прячем колонку
    document.getElementById("peopleWrap").style.display = "none";
    return;
  }
  if (!PEOPLE.length){
    box.innerHTML = '<div class="chat-empty" style="text-align:left;padding:14px 4px">Пока нет учеников. Позови их по коду на странице «Мой класс».</div>';
    return;
  }
  box.innerHTML = PEOPLE.map((p,i) =>
    '<button class="li'+(i===sel?" on":"")+'" data-i="'+i+'">' +
      '<span class="t">'+esc(p.name)+(p.unread?'<span class="unread">'+p.unread+'</span>':'')+'</span>' +
      '<span class="s">'+(p.unread?('новых: '+p.unread):'нет новых')+'</span></button>').join("");
  box.querySelectorAll(".li").forEach(b => b.onclick = () => { sel = +b.dataset.i; drawPane(); drawPeople(); });
}

function drawPane(){
  const pane = document.getElementById("pane");
  const person = PEOPLE[sel];
  if (!person){
    stopChat();
    pane.innerHTML = '<div class="pane-hd"><span>Сообщения</span></div>' +
      SMUI.empty(
        ROLE === "teacher" ? "Выбери ученика" : "Учитель не привязан",
        ROLE === "teacher"
          ? "Слева выбери ученика, чтобы открыть переписку."
          : "Чтобы написать учителю, сначала привяжись к нему по коду на странице «Мои курсы» (кнопка «У меня есть код учителя»).");
    return;
  }
  const title = ROLE === "teacher" ? person.name : ("Учитель · " + person.name);
  pane.innerHTML =
    '<div class="pane-hd"><span>'+esc(title)+'</span><span id="chatState">подключаюсь…</span></div>' +
    '<div class="chatwrap">' +
      '<div class="chat-scroll" id="chatScroll"><div class="chat-empty">Загружаю…</div></div>' +
      '<div class="chat-in"><input id="chatText" placeholder="Написать '+esc(person.name)+'…" maxlength="2000"><button class="go" id="chatSend" aria-label="Отправить">➤</button></div>' +
    '</div>' +
    '<div class="chat-note">Сообщения приходят сразу. Видит только ваша пара — переписка защищена.</div>';
  startChat(person);
}

/* ---------- первая загрузка и живой канал ---------- */

async function firstLoad(person){
  const scroll = document.getElementById("chatScroll");
  const { teacherId, studentId } = pairFor(person);
  let msgs = [];
  try { msgs = await SM.chatMessages(teacherId, studentId); }
  catch(e){ if (scroll) scroll.innerHTML = '<div class="chat-empty">Не удалось загрузить переписку. Обнови страницу.</div>'; return; }
  if (!scroll || !document.body.contains(scroll)) return;

  scroll.innerHTML = "";
  MSGS = []; SEEN = new Set();
  if (!msgs.length){
    scroll.innerHTML = '<div class="chat-empty">Сообщений пока нет. Напиши первым</div>';
  } else {
    msgs.forEach(m => appendMsg(m, true));
  }
  await markIncomingRead(person);
}

async function markIncomingRead(person){
  const { teacherId, studentId } = pairFor(person);
  const unreadIn = MSGS.some(m => m.sender_id !== ME.id && !m.read_at);
  if (!unreadIn) return;
  try { await SM.chatMarkRead(teacherId, studentId); } catch(e){}
  MSGS.forEach(m => { if (m.sender_id !== ME.id && !m.read_at) m.read_at = new Date().toISOString(); });
  if (ROLE === "teacher" && person.unread){ person.unread = 0; drawPeople(); }
  if (window.SM_shellRefreshUnread) SM_shellRefreshUnread();
}

function setState(txt){ const s=document.getElementById("chatState"); if (s) s.textContent = txt; }

function startChat(person){
  stopChat();
  const inp = document.getElementById("chatText"), snd = document.getElementById("chatSend");
  if (!inp || !snd) return;
  const { teacherId, studentId } = pairFor(person);

  firstLoad(person);

  /* Живой канал: база присылает новое сообщение сама, ждать нечего */
  unsub = SM.chatSubscribe(teacherId, studentId,
    function(m){
      appendMsg(m);
      if (m.sender_id !== ME.id) markIncomingRead(person);
    },
    function(m){ markReadInPlace(m); }
  );

  if (unsub){
    setState("онлайн");
  } else {
    /* Канал не поднялся — запасной опрос, но реже и только за новыми */
    setState("обновление раз в 10 сек");
    pollTimer = setInterval(async function(){
      const last = MSGS[MSGS.length-1];
      let fresh = [];
      try { fresh = await SM.chatMessages(teacherId, studentId, last && last.created_at); } catch(e){ return; }
      fresh.forEach(m => appendMsg(m));
      if (fresh.some(m => m.sender_id !== ME.id)) markIncomingRead(person);
    }, 10000);
  }

  async function send(){
    const v = (inp.value||"").trim(); if (!v) return;
    inp.value = ""; inp.focus();
    clearError();

    /* Оптимистичная отправка: пузырёк виден сразу, не дожидаясь сервера */
    const tempId = "tmp-" + Date.now();
    appendMsg({ id: tempId, sender_id: ME.id, body: v, created_at: new Date().toISOString(), __pending: true }, true);

    const r = await SM.chatSend(teacherId, studentId, v);
    const el = document.querySelector('.bub[data-id="'+tempId+'"]');

    if (!r.ok){
      if (el){
        el.classList.remove("pending"); el.classList.add("failed");
        const tm = el.querySelector(".tm");
        if (tm){
          tm.textContent = "не отправлено";
          const again = document.createElement("button");
          again.className = "again"; again.textContent = "повторить";
          again.onclick = function(){
            el.remove();
            MSGS = MSGS.filter(x => x.id !== tempId);
            SEEN.delete(tempId);
            inp.value = v; send();
          };
          tm.appendChild(again);
        }
      }
      showError(r.error || "Сообщение не ушло. Проверь связь и попробуй ещё раз.");
      return;
    }

    /* Пришёл настоящий id — подменяем черновик, чтобы канал не задвоил сообщение */
    const real = r.msg;
    if (el && real){
      el.dataset.id = real.id;
      el.classList.remove("pending");
      const tm = el.querySelector(".tm");
      if (tm) tm.textContent = hhmm(real.created_at) + " ✓";
      SEEN.delete(tempId); SEEN.add(real.id);
      const i = MSGS.findIndex(x => x.id === tempId);
      if (i >= 0) MSGS[i] = real;
    }
  }

  snd.onclick = send;
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); send(); } });
}

async function boot(){
  const pane = document.getElementById("pane");
  // роль определяем по профилю
  let prof = null;
  try { prof = await SM.myProfile(); } catch(e){}
  ROLE = (prof && prof.role === "teacher") ? "teacher" : "student";

  ME = await SMUI.requireAuth(pane, ROLE);
  if (!ME){ SMUI.mount({ role: ROLE, active: "chat" }); return; }

  SMUI.mount({ role: ROLE, active: "chat" });

  if (ROLE === "teacher"){
    let students = [], unread = {};
    try { students = await SM.myStudents(); } catch(e){}
    try { unread = await SM.teacherUnread(); } catch(e){}
    PEOPLE = (students||[]).map(s => ({ id: s.student_id, name: s.name || "Ученик", unread: unread[s.student_id] || 0 }));
    // сначала — у кого есть непрочитанные
    PEOPLE.sort((a,b) => b.unread - a.unread);
  } else {
    let t = null;
    try { t = await SM.myTeacher(); } catch(e){}
    PEOPLE = t ? [{ id: t.teacher_id, name: t.name || "Учитель", unread: 0 }] : [];
  }
  drawPeople();
  drawPane();
}

// перерисовать бейдж непрочитанных в меню при уходе со страницы
window.addEventListener("beforeunload", stopChat);
boot();
</script>
</body>
</html>
