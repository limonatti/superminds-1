<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Статуя с твоим лицом — Cloudflare Workers AI</title>
<style>
  body { margin: 0; padding: 32px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f4f0; color: #1a1a1a; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p.sub { font-size: 14px; color: #6b6a66; margin: 0 0 24px; }
  .card { background: #fff; border: 1px solid #e2e1db; border-radius: 12px; padding: 16px; }
  img { width: 100%; border-radius: 8px; display: block; background: #efeee9; min-height: 200px; }
  .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  button, a.btn { font: inherit; font-size: 14px; text-decoration: none; color: #1a1a1a; border: 1px solid #c9c8c2; border-radius: 8px; padding: 8px 14px; background: #fff; cursor: pointer; }
  button:hover, a.btn:hover { background: #f0efec; }
  .note { font-size: 13px; color: #6b6a66; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Статуя с твоим лицом</h1>
  <p class="sub">FLUX.2 klein 9B, два референса: сцена + портрет. Воркер statue, Cloudflare Workers AI</p>
  <div class="card">
    <img id="pic" alt="Мраморная статуя за макбуком с лицом Аси">
    <div class="row">
      <button id="again">Другой вариант</button>
      <a class="btn" id="full" href="#" target="_blank">Открыть в полном размере</a>
      <span class="note" id="status">seed 200</span>
    </div>
  </div>
</div>
<script>
  var BASE = 'https://statue.limonatti.workers.dev/statue';
  var FACE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3F1b5KRx5p4EogfpaQRR3sEXIP5/9f6bb772-ef7f-467d-96d1-5487c05a1f81.jpg';
  var PROMPT = 'A classical grey marble statue of the woman from image 1, sculpted in exactly the same composition, pose and style as image 0: seated on an office chair, holding a laptop, draped marble robe, sculpted hair in a bun, soft studio lighting, plain background, photorealistic stone sculpture';

  function build(seed) {
    return BASE + '?u=kv:scene&u2=' + encodeURIComponent(FACE) + '&seed=' + seed + '&w=768&h=1152&p=' + encodeURIComponent(PROMPT);
  }
  function show(seed) {
    var url = build(seed);
    document.getElementById('pic').src = url;
    document.getElementById('full').href = url;
    document.getElementById('status').textContent = 'seed ' + seed + ' — генерация занимает 10–20 секунд';
  }
  show(200);
  document.getElementById('again').addEventListener('click', function () {
    show(Math.floor(Math.random() * 100000));
  });
</script>
</body>
</html>
