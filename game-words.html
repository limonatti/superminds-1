<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игры со словами · English with Asya</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#efeaf6;font-family:'Nunito',system-ui,sans-serif;color:#2b2450}
  .page{max-width:1100px;margin:0 auto;padding:20px 16px 50px}

  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .home{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
    padding:9px 18px;text-decoration:none;font:700 14px 'Nunito',sans-serif;color:#5b3fa0;
    box-shadow:0 4px 0 #d8cdf0}
  select{border:0;border-radius:999px;padding:10px 16px;background:#fff;
    font:700 14px 'Nunito',sans-serif;color:#3b2a5e;box-shadow:0 4px 0 #d8cdf0;cursor:pointer}
  .cnt{font:700 13px 'Nunito',sans-serif;color:#7a7396}

  .g{position:relative;height:620px;border-radius:24px;overflow:hidden;
     box-shadow:0 14px 36px rgba(50,30,90,.26);
     background:#2b2a55 center/cover no-repeat url("game/bg/park.jpg")}

  .hud{position:absolute;inset:16px 16px auto 16px;display:flex;gap:10px;align-items:center;z-index:9}
  .chip{padding:10px 18px;border-radius:999px;font:800 18px 'Baloo 2',sans-serif;color:#3b2a5e;
    background:rgba(255,255,255,.93);box-shadow:0 4px 0 rgba(60,40,110,.28);white-space:nowrap}
  .chip.combo{background:#ffb02e;color:#5b2c00;box-shadow:0 4px 0 #c97d0e;
    transform:scale(0);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
  .chip.combo.on{transform:scale(1)}
  .grow{flex:1}
  .clock{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 18px;border-radius:999px;
    background:rgba(255,255,255,.93);box-shadow:0 4px 0 rgba(60,40,110,.28)}
  .clock b{font:800 22px 'Baloo 2',sans-serif;color:#3b2a5e;min-width:34px;text-align:right}
  .tbar{width:140px;height:12px;border-radius:999px;background:#ded8f0;overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;border-radius:999px;background:#6b4fd0;
    transition:width .25s linear,background .3s}
  .clock.warn b{color:#c23b12} .clock.warn .tbar i{background:#e8562a}
  .clock.warn{animation:pulse .55s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* задание: картинка слова и перевод */
  .quest{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:8;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font:700 18px 'Baloo 2',sans-serif;color:#fff;background:rgba(45,30,90,.55);
    padding:7px 22px;border-radius:999px;backdrop-filter:blur(6px)}
  .ask{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.95);
    border-radius:22px;padding:10px 24px 10px 12px;box-shadow:0 6px 0 rgba(60,40,110,.3)}
  .ask .pic{width:96px;height:96px;object-fit:contain;border-radius:16px}
  .ask .em{width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:60px}
  .ask b{font:800 30px 'Baloo 2',sans-serif;color:#3b2a5e}

  /* шарики */
  .pop{position:absolute;z-index:5;cursor:pointer;text-align:center;transition:transform .12s}
  .pop:hover{transform:scale(1.06)}
  .pop .b{position:relative;width:126px;height:126px;
    background:center/contain no-repeat;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 6px 12px rgba(30,10,60,.34))}
  .pop .wt{position:relative;background:rgba(255,255,255,.94);border-radius:999px;
    padding:6px 14px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font:800 20px 'Baloo 2',sans-serif;color:#3b2a5e;box-shadow:0 3px 0 rgba(60,40,110,.2)}
  .pop.gone{pointer-events:none}
  .miss{position:absolute;z-index:9;font:800 22px 'Baloo 2',sans-serif;color:#ffb8c8;
    pointer-events:none;animation:pl 900ms ease-out forwards}

  /* кот */
  .cat{position:absolute;left:18px;bottom:18px;width:290px;height:290px;z-index:6;
    background-repeat:no-repeat;background-size:2048px 256px;background-position:0 0;
    background-image:url("game/cat/idle.png")}
  .say{position:absolute;left:238px;bottom:250px;z-index:9;padding:12px 20px;border-radius:20px;
    font:700 19px 'Baloo 2',sans-serif;color:#3b2a5e;background:#fff;white-space:nowrap;
    box-shadow:0 6px 0 rgba(60,40,110,.3);transition:opacity .2s,transform .2s}
  .say::after{content:"";position:absolute;left:-10px;bottom:14px;border:10px solid transparent;border-right-color:#fff}
  .say.off{opacity:0;transform:translateY(8px)}

  .plus{position:absolute;z-index:10;font:800 28px 'Baloo 2',sans-serif;color:#fff;
    text-shadow:0 3px 0 #6b4fd0;pointer-events:none;animation:pl 1000ms ease-out forwards}
  @keyframes pl{0%{transform:translateY(0) scale(.5);opacity:0}
    25%{transform:translateY(-12px) scale(1.2);opacity:1}
    100%{transform:translateY(-74px) scale(1);opacity:0}}

  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;
    background:rgba(38,26,74,.74);backdrop-filter:blur(4px);color:#fff;padding:20px}
  .screen.off{display:none}
  .screen h2{margin:0;font:700 40px 'Baloo 2',sans-serif}
  .screen p{margin:0;font:700 17px 'Nunito',sans-serif;color:#ddd6f5;max-width:560px}
  .games{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .gcard{width:250px;background:rgba(255,255,255,.96);border-radius:20px;padding:16px 14px;
    border:0;cursor:pointer;text-align:left;transition:transform .15s}
  .gcard:hover{transform:translateY(-5px)}
  .gcard b{display:block;font:700 19px 'Baloo 2',sans-serif;color:#3b2a5e;margin-bottom:4px}
  .gcard span{font:600 13px 'Nunito',sans-serif;color:#6b6390;line-height:1.5}
  .res{display:flex;gap:26px;justify-content:center;margin:4px 0}
  .res div{background:rgba(255,255,255,.96);border-radius:18px;padding:14px 24px;min-width:110px}
  .res b{display:block;font:800 34px 'Baloo 2',sans-serif;color:#6b4fd0}
  .res span{font:700 13px 'Nunito',sans-serif;color:#6b6390}
  .go{border:0;cursor:pointer;border-radius:999px;padding:14px 34px;
    font:700 18px 'Baloo 2',sans-serif;background:#ffb02e;color:#5b2c00;box-shadow:0 6px 0 #c97d0e}
  .go.ghost{background:rgba(255,255,255,.92);color:#3b2a5e;box-shadow:0 6px 0 rgba(60,40,110,.3)}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="home" href="trainer.html">← В тренажёр</a>
    <select id="unitSel"></select>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="g" id="g">
    <div class="hud">
      <span class="chip">⭐ <span id="pts">0</span></span>
      <span class="chip combo" id="combo">🔥 ×2</span>
      <span class="grow"></span>
      <span class="clock" id="clock"><span class="tbar"><i id="tbar"></i></span><b id="secs">45</b></span>
    </div>

    <div class="quest" id="quest"></div>
    <div class="cat" id="cat"></div>
    <div class="say off" id="say"></div>

    <div class="screen" id="menu">
      <h2>Игры со словами</h2>
      <p id="lead">Выбери игру. Слова берутся из юнита, который выбран сверху.</p>
      <div class="games">
        <button class="gcard" data-g="pop">
          <b>🎈 Лопни слово</b>
          <span>Наверху картинка и перевод. Снизу всплывают английские слова — лопай нужное.</span>
        </button>
      </div>
    </div>

    <div class="screen off" id="over">
      <h2 id="overTitle">Время вышло!</h2>
      <div class="res">
        <div><b id="rPts">0</b><span>очков</span></div>
        <div><b id="rStreak">0</b><span>лучшая серия</span></div>
        <div><b id="rBest">0</b><span>рекорд</span></div>
      </div>
      <div class="games" style="gap:10px">
        <button class="go" id="again">Ещё раз 🔁</button>
        <button class="go ghost" id="toMenu">В меню</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js?v=c350045e"></script>
<script src="speakout-words.js?v=3094c556"></script>
<script src="course-words.js?v=442908de"></script>
<script src="sm-auth.js?v=1a8f02f9"></script>
<script src="sm-play.js?v=dd356834"></script>
<script>
/* ===========================================================================
   Игры со словами курса. Движок тот же, что в играх фоникса: большой экран,
   фон, кот-ведущий, серии и комбо. Слова и картинки берутся из учебника,
   а не из фиксированного набора — поэтому игра работает на любом юните.
   =========================================================================== */

var ROUND=45, ADD=4, FRAMES=8, FW=256;

var g=document.getElementById("g"), cat=document.getElementById("cat"), say=document.getElementById("say"),
    quest=document.getElementById("quest"), sel=document.getElementById("unitSel"),
    ptsEl=document.getElementById("pts"), comboEl=document.getElementById("combo"),
    secsEl=document.getElementById("secs"), tbar=document.getElementById("tbar"),
    clock=document.getElementById("clock"), cntEl=document.getElementById("cnt"),
    menuS=document.getElementById("menu"), overS=document.getElementById("over");

var WORDS=[], mode="pop", pts=0, streak=0, bestStreak=0, best={}, playing=false,
    left=ROUND, tick=null, want=null;

/* ---------- список юнитов ---------- */
function fillUnits(){
  var prev=sel.value;
  sel.innerHTML="";
  (window.SM_UNITS||[]).forEach(function(u){
    var o=document.createElement("option");
    o.value=u.id; o.textContent=(u.emoji||"📘")+" "+u.title;
    sel.appendChild(o);
  });
  var q=new URLSearchParams(location.search).get("u");
  var want=prev||q;
  if(want && [].some.call(sel.options,function(o){ return o.value===want; })) sel.value=want;
  loadWords();
}
function loadWords(){
  WORDS=(window.SMP ? SMP.words(sel.value) : []).filter(function(w){ return w.en && w.ru; });
  cntEl.textContent = WORDS.length ? ("слов в юните: "+WORDS.length) : "в этом юните нет слов";
  document.getElementById("lead").textContent = WORDS.length>=4
    ? "Выбери игру. Слова берутся из юнита, который выбран сверху."
    : "В этом юните меньше четырёх слов — выбери другой, иначе играть не из чего.";
}
sel.onchange=function(){ loadWords(); backToMenu(); };

/* ---------- кот ---------- */
var frame=0, fps=10, acc=0, last=0, once=false, nextClip="idle";
function setCat(name, playOnce, back){
  frame=0; once=!!playOnce; nextClip=back||"idle";
  cat.style.backgroundImage='url("game/cat/'+name+'.png")';
}
function anim(ts){
  if(!last) last=ts;
  acc+=ts-last; last=ts;
  var step=1000/fps;
  while(acc>=step){
    acc-=step; frame++;
    if(frame>=FRAMES){ if(once){ once=false; setCat(nextClip); } else frame=0; }
  }
  cat.style.backgroundPosition=(-frame*FW)+"px 0";
  requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

/* ---------- отложенные действия с отменой ---------- */
var ROUND_ID=0, TIMERS=[];
function stopPending(){
  ROUND_ID++;
  TIMERS.forEach(clearTimeout); TIMERS=[];
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function later(fn, ms){
  var id=ROUND_ID;
  var t=setTimeout(function(){ if(id===ROUND_ID) fn(); }, ms||0);
  TIMERS.push(t); return t;
}
function voice(txt, delay){ later(function(){ try{ SMP.say(txt); }catch(e){} }, delay||0); }
function speak(txt,ms){
  say.innerHTML=txt; say.classList.remove("off");
  clearTimeout(speak.t); speak.t=setTimeout(function(){ say.classList.add("off"); }, ms||2000);
}

/* ---------- колода вместо кубика ----------
   Тот же приём, что в играх фоникса: слово не повторится, пока не выйдут
   все остальные из юнита. На юните в десять слов это особенно заметно. */
var DECKS={};
function shuffle(a){ return a.slice().sort(function(){ return Math.random()-.5; }); }
function deck(key, list){
  if(!list || !list.length) return null;
  var d=DECKS[key];
  if(!d || d.size!==list.length){ d=DECKS[key]={size:list.length, left:[], last:null}; }
  if(!d.left.length) d.left=shuffle(list);
  var w=d.left.pop();
  if(list.length>1 && w===d.last && d.left.length){ var alt=d.left.pop(); d.left.push(w); w=alt; }
  d.last=w; return w;
}

/* ---------- общий раунд ---------- */
function setClock(){
  secsEl.textContent=Math.max(0,Math.ceil(left));
  tbar.style.width=Math.max(0,Math.min(100,left/ROUND*100))+"%";
  clock.classList.toggle("warn", left<=10);
}
function start(which){
  if(WORDS.length<4){ speak("Мало слов в юните",2200); return; }
  mode=which; pts=0; streak=0; bestStreak=0; left=ROUND; playing=true;
  ptsEl.textContent=0; comboEl.classList.remove("on");
  menuS.classList.add("off"); overS.classList.add("off");
  DECKS={};
  clearPop(); setClock(); setCat("idle"); dealPop();
  clearInterval(tick);
  tick=setInterval(function(){
    if(!playing) return;
    left-=.1;
    if(left<=10 && Math.abs(left-Math.round(left))<.06 && left>0) SMP.sfx("tick");
    if(left<=0){ left=0; setClock(); finish(); return; }
    setClock();
  },100);
}
function finish(){
  stopPending();
  playing=false; clearInterval(tick); clearPop();
  quest.innerHTML="";
  if(!best[mode] || pts>best[mode]) best[mode]=pts;
  document.getElementById("rPts").textContent=pts;
  document.getElementById("rStreak").textContent=bestStreak;
  document.getElementById("rBest").textContent=best[mode];
  document.getElementById("overTitle").textContent = pts>=10 ? "Отлично!" : "Время вышло!";
  overS.classList.remove("off"); SMP.sfx("lose"); setCat(pts>=10?"celebrate":"idle");
}
function backToMenu(){
  stopPending(); playing=false; clearInterval(tick); clearPop();
  quest.innerHTML=""; setCat("idle");
  overS.classList.add("off"); menuS.classList.remove("off");
}

function reward(x,y,mult){
  var p=document.createElement("div");
  p.className="plus"; p.style.left=(x-26)+"px"; p.style.top=(y-20)+"px";
  p.textContent="+"+mult+"  ⏱+"+ADD; p.style.fontSize="21px"; g.appendChild(p);
  setTimeout(function(){ p.remove(); },1000);
  try{ SMP.burst(x,y); }catch(e){}
}

/* сохраняем попытку так же, как остальные игры платформы */
function saveTry(ok){
  if(window.SM && SM.isCloud){
    try{ SM.saveAttempt({course:sel.value, unit_id:sel.value, ex_type:"game-pop", correct:ok}); }catch(e){}
  }
}

/* ---------- игра: лопни слово ----------
   Наверху картинка и русский перевод, снизу всплывают английские слова.
   Правило то же, что в фониксе: нужное слово обязано быть на экране,
   а при смене задания старые шарики убираются — иначе ребёнок читает
   новый вопрос, а ответы на экране от предыдущего. */
var pops=[], popSpawn=null, popRaf=false;

function clearPop(){
  pops.forEach(function(p){ p.el.remove(); }); pops=[];
  if(popSpawn){ clearInterval(popSpawn); popSpawn=null; }
}

function dealPop(){
  stopPending();
  /* убираем шарики от прошлого слова вместе с вопросом */
  pops.forEach(function(z){
    z.dead=true;
    z.el.animate([{opacity:1},{opacity:0,transform:"scale(.7)"}],{duration:240,fill:"forwards"});
    (function(el){ setTimeout(function(){ el.remove(); },250); })(z.el);
  });
  pops=[];

  want=deck("w:"+sel.value, WORDS);
  var pic = want.img
    ? '<img class="pic" src="'+want.img+'" alt="">'
    : '<div class="em">'+(want.emoji||"❓")+'</div>';
  quest.innerHTML='<span class="cap">Найди это слово по-английски</span>'+
    '<div class="ask">'+pic+'<b>'+esc(want.ru)+'</b></div>';
  var a=quest.querySelector(".ask");
  if(a) a.animate([{transform:"scale(.6)",opacity:0},
                   {transform:"scale(1.08)",opacity:1,offset:.6},
                   {transform:"scale(1)"}],{duration:420});
  setCat("thinking",true,"idle");

  if(!popSpawn) popSpawn=setInterval(spawnPop, 1500);
  spawnPop();
  if(!popRaf){ popRaf=true; requestAnimationFrame(popLoop); }
}

function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function spawnPop(){
  if(!playing) return;
  var live=pops.filter(function(z){ return !z.dead; });
  if(live.length>=3) return;

  /* нужное слово всегда должно быть на экране */
  var hasOk=live.some(function(z){ return z.ok; });
  var ok = !hasOk || Math.random()<.4;
  var w = ok ? want
             : deck("x:"+sel.value, WORDS.filter(function(x){ return x.en!==want.en; }));
  if(!w) return;
  if(!ok && w.en===want.en) return;

  var el=document.createElement("div");
  el.className="pop";
  el.innerHTML='<div class="b" style="background-image:url(\'game/ui/b'+
    (1+Math.floor(Math.random()*6))+'.png\')"><span class="wt">'+esc(w.en)+'</span></div>';
  var x=40+Math.random()*Math.max(60, g.clientWidth-260);
  el.style.left=x+"px"; el.style.top=g.clientHeight+"px";
  g.appendChild(el);

  var p={el:el, x0:x, y:g.clientHeight, w:w, ok:(w.en===want.en), dead:false, sway:Math.random()*6.28};
  el.onclick=function(){ hitPop(p); };
  pops.push(p);
}

function hitPop(p){
  if(!playing || p.dead) return;
  var r=p.el.getBoundingClientRect(), gr=g.getBoundingClientRect();
  var x=r.left-gr.left+r.width/2, y=r.top-gr.top+40;

  if(p.ok){
    p.dead=true; p.el.classList.add("gone");
    streak++; if(streak>bestStreak) bestStreak=streak;
    var mult=streak>=3?2:1;
    comboEl.classList.toggle("on", streak>=3);
    pts+=mult; ptsEl.textContent=pts;
    left=Math.min(ROUND,left+ADD); setClock();
    reward(x,y,mult); SMP.sfx("ok");
    setCat(mult>1?"celebrate":"happy",true,"idle");
    voice(p.w.en, 80);
    if(mult>1){ SMP.sfx("streak"); speak("Серия "+streak+"! 🔥",1500); }
    else speak("Верно! 👏",1400);
    saveTry(true);
    pops=pops.filter(function(z){ return z!==p; });
    p.el.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.6)",opacity:0}],
                 {duration:260,fill:"forwards"});
    setTimeout(function(){ p.el.remove(); },280);
    later(function(){ if(playing) dealPop(); }, 1100);
  } else {
    streak=0; comboEl.classList.remove("on");
    SMP.sfx("no"); setCat("sad",true,"idle");
    voice(p.w.en, 60);
    speak("«"+esc(p.w.en)+"» — это "+esc(p.w.ru), 2100);
    saveTry(false);
    p.el.animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},
                  {transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:270});
  }
}

function popLoop(ts){
  if(!popLoop.t) popLoop.t=ts;
  var dt=Math.min(60, ts-popLoop.t); popLoop.t=ts;
  if(playing){
    var speed=72+pts*3;
    for(var i=pops.length-1;i>=0;i--){
      var p=pops[i];
      p.y -= speed*dt/1000;
      p.sway += dt/420;
      p.el.style.top=p.y+"px";
      p.el.style.left=(p.x0 + Math.sin(p.sway)*16)+"px";
      if(p.y < -160){
        if(p.ok && !p.dead){
          var m=document.createElement("div");
          m.className="miss"; m.style.left=Math.max(10,p.x0)+"px"; m.style.top="130px";
          m.textContent="уплыло…"; g.appendChild(m);
          (function(el){ setTimeout(function(){ el.remove(); },900); })(m);
        }
        p.el.remove(); pops.splice(i,1);
      }
    }
  }
  requestAnimationFrame(popLoop);
}

/* ---------- запуск ---------- */
document.querySelectorAll(".gcard").forEach(function(b){
  b.onclick=function(){ start(b.dataset.g); };
});
document.getElementById("again").onclick=function(){ start(mode); };
document.getElementById("toMenu").onclick=backToMenu;
setClock();

fillUnits();
/* курсы догружаются из базы — тогда список юнитов надо собрать заново */
if(window.SM_ready && SM_ready.then) SM_ready.then(fillUnits).catch(function(){});
document.addEventListener("sm-course-changed", fillUnits);
</script>
</body>
</html>
