<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игры со словами · English with Asya</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#efeaf6;font-family:'Nunito',system-ui,sans-serif;color:#2b2450}
  .page{max-width:1100px;margin:0 auto;padding:20px 16px 50px}

  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .home{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
    padding:9px 18px;text-decoration:none;font:700 14px 'Nunito',sans-serif;color:#5b3fa0;
    box-shadow:0 4px 0 #d8cdf0}
  select{border:0;border-radius:999px;padding:10px 16px;background:#fff;
    font:700 14px 'Nunito',sans-serif;color:#3b2a5e;box-shadow:0 4px 0 #d8cdf0;cursor:pointer}
  .cnt{font:700 13px 'Nunito',sans-serif;color:#7a7396}

  .g{position:relative;height:620px;border-radius:24px;overflow:hidden;
     box-shadow:0 14px 36px rgba(50,30,90,.26);
     background:#2b2a55 center/cover no-repeat url("game/bg/park.jpg")}

  .hud{position:absolute;inset:16px 16px auto 16px;display:flex;gap:10px;align-items:center;z-index:9}
  .chip{padding:10px 18px;border-radius:999px;font:800 18px 'Baloo 2',sans-serif;color:#3b2a5e;
    background:rgba(255,255,255,.93);box-shadow:0 4px 0 rgba(60,40,110,.28);white-space:nowrap}
  .chip.combo{background:#ffb02e;color:#5b2c00;box-shadow:0 4px 0 #c97d0e;
    transform:scale(0);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
  .chip.combo.on{transform:scale(1)}
  .grow{flex:1}
  .clock{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 18px;border-radius:999px;
    background:rgba(255,255,255,.93);box-shadow:0 4px 0 rgba(60,40,110,.28)}
  .clock b{font:800 22px 'Baloo 2',sans-serif;color:#3b2a5e;min-width:34px;text-align:right}
  .tbar{width:140px;height:12px;border-radius:999px;background:#ded8f0;overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;border-radius:999px;background:#6b4fd0;
    transition:width .25s linear,background .3s}
  .clock.warn b{color:#c23b12} .clock.warn .tbar i{background:#e8562a}
  .clock.warn{animation:pulse .55s ease-in-out infinite}
  .clock.count .tbar{display:none} .clock.count{animation:none}
  .clock.count b{min-width:auto;font-size:19px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* задание: картинка слова и перевод */
  .quest{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:8;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .cap{font:700 18px 'Baloo 2',sans-serif;color:#fff;background:rgba(45,30,90,.55);
    padding:7px 22px;border-radius:999px;backdrop-filter:blur(6px)}
  .ask{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.95);
    border-radius:22px;padding:10px 24px 10px 12px;box-shadow:0 6px 0 rgba(60,40,110,.3)}
  .ask .pic{width:96px;height:96px;object-fit:contain;border-radius:16px}
  .ask .em{width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:60px}
  /* цвет — кружком, число — цифрой: рисунок для «фиолетового» всегда спорный,
     ребёнок запомнит нарисованный предмет, а не сам цвет */
  .ask .sw{width:88px;height:88px;border-radius:50%;box-shadow:inset 0 -6px 14px rgba(0,0,0,.18),
    0 0 0 4px #fff, 0 0 0 6px rgba(60,40,110,.15)}
  .ask .num{width:96px;height:96px;display:flex;align-items:center;justify-content:center;
    font:800 68px 'Baloo 2',sans-serif;color:#6b4fd0}
  .ask b{font:800 30px 'Baloo 2',sans-serif;color:#3b2a5e}

  /* ─── «Найди пару»: доска карточек ─── */
  .board{position:absolute;left:300px;right:26px;top:150px;bottom:26px;z-index:7;
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .mc{position:relative;border-radius:18px;cursor:pointer;overflow:hidden;
    background:rgba(255,255,255,.95);box-shadow:0 6px 0 rgba(60,40,110,.3);
    display:flex;align-items:center;justify-content:center;padding:6px;
    transition:transform .15s;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
  .mc:hover{transform:translateY(-4px)}
  /* рубашка — деревянная плашка из набора, а не плоская заливка */
  .mc.down{background:#7a5ad8 center/cover no-repeat url("game/tw/panel.png")}
  .mc.down::after{content:"?";font:800 40px 'Baloo 2',sans-serif;color:#b9aee0}
  .mc img{max-width:100%;max-height:100%;object-fit:contain}
  .mc b{font:800 22px 'Baloo 2',sans-serif;color:#3b2a5e;text-align:center;line-height:1.2}
  .mc .sw{width:62px;height:62px}
  .mc .num{width:auto;height:auto;font-size:46px}
  .mc .em{width:auto;height:auto;font-size:44px}
  .mc.done{background:#d9f7c9;box-shadow:0 6px 0 #7cb95c;pointer-events:none}
  .mc.miss{background:#ffd9d2;box-shadow:0 6px 0 #d98b7a}

  /* шарики */
  .pop{position:absolute;z-index:5;cursor:pointer;text-align:center;transition:transform .12s}
  .pop:hover{transform:scale(1.06)}
  .pop .b{position:relative;width:126px;height:126px;
    background:center/contain no-repeat;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 6px 12px rgba(30,10,60,.34))}
  .pop .wt{position:relative;background:rgba(255,255,255,.94);border-radius:999px;
    padding:6px 14px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font:800 20px 'Baloo 2',sans-serif;color:#3b2a5e;box-shadow:0 3px 0 rgba(60,40,110,.2)}
  .pop.gone{pointer-events:none}
  .miss{position:absolute;z-index:9;font:800 22px 'Baloo 2',sans-serif;color:#ffb8c8;
    pointer-events:none;animation:pl 900ms ease-out forwards}

  /* кот */
  .cat{position:absolute;left:18px;bottom:18px;width:290px;height:290px;z-index:6;
    background-repeat:no-repeat;background-size:2048px 256px;background-position:0 0;
    background-image:url("game/cat/idle.png")}
  .say{position:absolute;left:238px;bottom:250px;z-index:9;padding:12px 20px;border-radius:20px;
    font:700 19px 'Baloo 2',sans-serif;color:#3b2a5e;background:#fff;white-space:nowrap;
    box-shadow:0 6px 0 rgba(60,40,110,.3);transition:opacity .2s,transform .2s}
  .say::after{content:"";position:absolute;left:-10px;bottom:14px;border:10px solid transparent;border-right-color:#fff}
  .say.off{opacity:0;transform:translateY(8px)}

  .plus{position:absolute;z-index:10;font:800 28px 'Baloo 2',sans-serif;color:#fff;
    text-shadow:0 3px 0 #6b4fd0;pointer-events:none;animation:pl 1000ms ease-out forwards}
  @keyframes pl{0%{transform:translateY(0) scale(.5);opacity:0}
    25%{transform:translateY(-12px) scale(1.2);opacity:1}
    100%{transform:translateY(-74px) scale(1);opacity:0}}

  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;
    background:rgba(38,26,74,.74);backdrop-filter:blur(4px);color:#fff;padding:20px}
  .screen.off{display:none}
  .screen h2{margin:0;font:700 40px 'Baloo 2',sans-serif}
  .screen p{margin:0;font:700 17px 'Nunito',sans-serif;color:#ddd6f5;max-width:560px}
  .games{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .gcard{width:250px;background:rgba(255,255,255,.96);border-radius:20px;padding:16px 14px;
    border:0;cursor:pointer;text-align:left;transition:transform .15s}
  .gcard:hover{transform:translateY(-5px)}
  .gcard b{display:block;font:700 19px 'Baloo 2',sans-serif;color:#3b2a5e;margin-bottom:4px}
  .gcard span{font:600 13px 'Nunito',sans-serif;color:#6b6390;line-height:1.5}
  .res{display:flex;gap:26px;justify-content:center;margin:4px 0}
  .res div{background:rgba(255,255,255,.96);border-radius:18px;padding:14px 24px;min-width:110px}
  .res b{display:block;font:800 34px 'Baloo 2',sans-serif;color:#6b4fd0}
  .res span{font:700 13px 'Nunito',sans-serif;color:#6b6390}
  /* Кнопки и значки — настоящие файлы из набора Words Twister, а не их
     приближение стилями: нарисованные объём и блики так не повторить. */
  .imgbtn{border:0;background:none;padding:0;cursor:pointer;transition:transform .13s}
  .imgbtn:hover{transform:translateY(-3px) scale(1.04)}
  .imgbtn:active{transform:translateY(1px) scale(.99)}
  .imgbtn img{display:block;height:64px}
  .imgbtn.sm img{height:52px}
  .coin{height:30px;vertical-align:-7px;margin-right:2px}
  .mark{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);
    z-index:15;opacity:0;pointer-events:none;height:150px}
  .mark.on{animation:markPop .85s ease-out forwards}
  @keyframes markPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
  .badges{display:flex;gap:10px;justify-content:center;margin:2px 0 4px}
  .badges img{height:76px;filter:drop-shadow(0 6px 10px rgba(20,8,50,.4))}
  .badges img.off{filter:grayscale(1);opacity:.32}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a class="home" href="trainer.html">← В тренажёр</a>
    <select id="courseSel"></select>
    <select id="unitSel"></select>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="g" id="g">
    <div class="hud">
      <span class="chip"><img class="coin" src="game/tw/coin.png" alt=""><span id="pts">0</span></span>
      <span class="chip combo" id="combo">🔥 ×2</span>
      <span class="grow"></span>
      <span class="clock" id="clock"><span class="tbar"><i id="tbar"></i></span><b id="secs">45</b></span>
    </div>

    <img class="mark" id="mark" alt="">
    <div class="quest" id="quest"></div>
    <div class="cat" id="cat"></div>
    <div class="say off" id="say"></div>

    <div class="screen" id="menu">
      <h2>Игры со словами</h2>
      <p id="lead">Выбери игру. Слова берутся из юнита, который выбран сверху.</p>
      <div class="games">
        <button class="gcard" data-g="pop">
          <b>🎈 Лопни слово</b>
          <span>Наверху картинка и перевод. Снизу всплывают английские слова — лопай нужное.</span>
        </button>
        <button class="gcard" data-g="memo">
          <b>🧠 Найди пару</b>
          <span>Карточки рубашкой вверх: картинка и её английское слово. Слова выбранного юнита, без таймера, три доски.</span>
        </button>
      </div>
    </div>

    <div class="screen off" id="over">
      <h2 id="overTitle">Время вышло!</h2>
      <div class="res">
        <div><b id="rPts">0</b><span>очков</span></div>
        <div><b id="rStreak">0</b><span>лучшая серия</span></div>
        <div><b id="rBest">0</b><span>рекорд</span></div>
      </div>
      <div class="badges" id="badges"></div>
      <div class="games" style="gap:16px">
        <button class="imgbtn" id="again"><img src="game/tw/playnew.png" alt="Ещё раз"></button>
        <button class="imgbtn sm" id="toMenu"><img src="game/tw/back.png" alt="В меню"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js?v=6dc57848"></script>
<script src="speakout-words.js?v=3094c556"></script>
<script src="course-words.js?v=442908de"></script>
<script src="sm-auth.js?v=1a8f02f9"></script>
<script src="sm-play.js?v=dd356834"></script>
<script>
/* ===========================================================================
   Игры со словами курса. Движок тот же, что в играх фоникса: большой экран,
   фон, кот-ведущий, серии и комбо. Слова и картинки берутся из учебника,
   а не из фиксированного набора — поэтому игра работает на любом юните.
   =========================================================================== */

var ROUND=45, ADD=4, FRAMES=8, FW=256;

var g=document.getElementById("g"), cat=document.getElementById("cat"), say=document.getElementById("say"),
    quest=document.getElementById("quest"), sel=document.getElementById("unitSel"),
    csel=document.getElementById("courseSel"),
    ptsEl=document.getElementById("pts"), comboEl=document.getElementById("combo"),
    secsEl=document.getElementById("secs"), tbar=document.getElementById("tbar"),
    clock=document.getElementById("clock"), cntEl=document.getElementById("cnt"),
    menuS=document.getElementById("menu"), overS=document.getElementById("over");

var NO_TIMER={memo:1};
var WORDS=[], mode="pop", pts=0, streak=0, bestStreak=0, best={}, playing=false,
    left=ROUND, tick=null, want=null;

/* ---------- курс и юнит ----------
   Раньше страница молча брала курс, запомненный в браузере: заходишь играть
   в Super Minds, а открывается Solutions. Теперь курс выбирается явно. */
function fillCourses(){
  csel.innerHTML="";
  (window.SM_COURSES||[]).forEach(function(c){
    if(c.id==="own" && !(window.SM_MY_WORDS||[]).length) return;
    var o=document.createElement("option");
    o.value=c.id; o.textContent=(c.emoji||"📘")+" "+c.title;
    csel.appendChild(o);
  });
  var q=new URLSearchParams(location.search).get("course");
  var cur=q || (window.SM_COURSE && SM_COURSE.id);
  if(cur && [].some.call(csel.options,function(o){ return o.value===cur; })) csel.value=cur;
  if(q && window.SM_useCourse) SM_useCourse(q);
}
csel.onchange=function(){
  if(window.SM_useCourse) SM_useCourse(csel.value);
  try{ localStorage.setItem("sm-course", csel.value); }catch(e){}
  fillUnits(); backToMenu();
};

/* Для шариков годятся только короткие слова: «What are you going to do?»
   на шарик не поместится и читается ребёнком не как слово, а как текст. */
function игровое(w){
  return w.en && w.ru && w.en.length<=16 && w.en.trim().split(/\s+/).length<=2;
}

function fillUnits(){
  var prev=sel.value;
  sel.innerHTML="";
  (window.SM_UNITS||[]).forEach(function(u){
    var o=document.createElement("option");
    o.value=u.id; o.textContent=(u.emoji||"📘")+" "+u.title;
    sel.appendChild(o);
  });
  /* принимаем и ?u=, и ?unit= — по платформе встречаются оба написания */
  var qs=new URLSearchParams(location.search);
  var q=qs.get("unit")||qs.get("u");

  /* Ссылка может вести в юнит другого учебника. Раньше игра искала его
     только в текущем курсе и, не найдя, молча открывала первый попавшийся:
     просишь Gateway Unit 5, получаешь Solutions Introduction. */
  if(q && !(window.SM_UNITS||[]).some(function(u){ return u.id===q; }) && window.SM_courseOfUnit){
    var slug=SM_courseOfUnit(q);
    if(slug && window.SM_useCourse){
      SM_useCourse(slug);
      try{ localStorage.setItem("sm-course", slug); }catch(e){}
      if([].some.call(csel.options,function(o){ return o.value===slug; })) csel.value=slug;
      sel.innerHTML="";
      (window.SM_UNITS||[]).forEach(function(u){
        var o=document.createElement("option");
        o.value=u.id; o.textContent=(u.emoji||"📘")+" "+u.title;
        sel.appendChild(o);
      });
    }
  }
  /* Курсы догружаются из базы, поэтому fillUnits зовётся дважды. Со второго
     раза юнит из ссылки уже должен найтись — и он важнее того, что успело
     выбраться на первом, неполном списке. */
  var есть=function(v){ return v && [].some.call(sel.options,function(o){ return o.value===v; }); };
  var want = есть(q) ? q : (есть(prev) ? prev : null);
  if(want) sel.value=want;
  loadWords();
}
function loadWords(){
  var все=(window.SMP ? SMP.words(sel.value) : []).filter(function(w){ return w.en && w.ru; });
  WORDS=все.filter(игровое);
  var отсеяно=все.length-WORDS.length;
  cntEl.textContent = WORDS.length
    ? ("слов: "+WORDS.length + (отсеяно ? " · длинных фраз пропущено: "+отсеяно : ""))
    : "в этом юните нет коротких слов";
  прогреть(WORDS);
  document.getElementById("lead").textContent = WORDS.length>=4
    ? "Выбери игру. Слова берутся из юнита, который выбран сверху."
    : "В этом юните меньше четырёх коротких слов — для шариков не хватит. Выбери другой юнит.";
}
sel.onchange=function(){ loadWords(); backToMenu(); };

/* ---------- кот ---------- */
var frame=0, fps=10, acc=0, last=0, once=false, nextClip="idle";
function setCat(name, playOnce, back){
  frame=0; once=!!playOnce; nextClip=back||"idle";
  cat.style.backgroundImage='url("game/cat/'+name+'.png")';
}
function anim(ts){
  if(!last) last=ts;
  acc+=ts-last; last=ts;
  var step=1000/fps;
  while(acc>=step){
    acc-=step; frame++;
    if(frame>=FRAMES){ if(once){ once=false; setCat(nextClip); } else frame=0; }
  }
  cat.style.backgroundPosition=(-frame*FW)+"px 0";
  requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

/* ---------- отложенные действия с отменой ---------- */
var ROUND_ID=0, TIMERS=[];
function stopPending(){
  ROUND_ID++;
  TIMERS.forEach(clearTimeout); TIMERS=[];
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}
function later(fn, ms){
  var id=ROUND_ID;
  var t=setTimeout(function(){ if(id===ROUND_ID) fn(); }, ms||0);
  TIMERS.push(t); return t;
}
function voice(txt, delay){ later(function(){ try{ SMP.say(txt); }catch(e){} }, delay||0); }
function speak(txt,ms){
  say.innerHTML=txt; say.classList.remove("off");
  clearTimeout(speak.t); speak.t=setTimeout(function(){ say.classList.add("off"); }, ms||2000);
}

/* ---------- колода вместо кубика ----------
   Тот же приём, что в играх фоникса: слово не повторится, пока не выйдут
   все остальные из юнита. На юните в десять слов это особенно заметно. */
var DECKS={};
function shuffle(a){ return a.slice().sort(function(){ return Math.random()-.5; }); }
function deck(key, list){
  if(!list || !list.length) return null;
  var d=DECKS[key];
  if(!d || d.size!==list.length){ d=DECKS[key]={size:list.length, left:[], last:null}; }
  if(!d.left.length) d.left=shuffle(list);
  var w=d.left.pop();
  if(list.length>1 && w===d.last && d.left.length){ var alt=d.left.pop(); d.left.push(w); w=alt; }
  d.last=w; return w;
}

/* ---------- общий раунд ---------- */
function setClock(){
  if(NO_TIMER[mode]) return;                 /* там счётчик досок, а не часы */
  secsEl.textContent=Math.max(0,Math.ceil(left));
  tbar.style.width=Math.max(0,Math.min(100,left/ROUND*100))+"%";
  clock.classList.toggle("warn", left<=10);
}
function start(which){
  if(WORDS.length<4){ speak("Мало слов в юните",2200); return; }
  mode=which; pts=0; streak=0; bestStreak=0; left=ROUND; playing=true;
  ptsEl.textContent=0; comboEl.classList.remove("on");
  menuS.classList.add("off"); overS.classList.add("off");
  DECKS={}; memoBoard=0;
  clock.classList.toggle("count", !!NO_TIMER[which]);
  clearPop(); clearMemo(); setClock(); setCat("idle");
  if(ВИДЫ[which]) dealMemo(); else dealPop();
  clearInterval(tick);
  if(NO_TIMER[which]) return;
  tick=setInterval(function(){
    if(!playing) return;
    left-=.1;
    if(left<=10 && Math.abs(left-Math.round(left))<.06 && left>0) SMP.sfx("tick");
    if(left<=0){ left=0; setClock(); finish(); return; }
    setClock();
  },100);
}
function finish(){
  stopPending();
  playing=false; clearInterval(tick); clearPop(); clearMemo();
  quest.innerHTML="";
  if(!best[mode] || pts>best[mode]) best[mode]=pts;
  document.getElementById("rPts").textContent=pts;
  document.getElementById("rStreak").textContent=bestStreak;
  document.getElementById("rBest").textContent=best[mode];
  document.getElementById("overTitle").textContent =
    NO_TIMER[mode] ? "Все пары собраны!" : (pts>=10 ? "Отлично!" : "Время вышло!");
  /* три ступени: пять очков, десять, двадцать — видно, до чего дотянулся */
  var box=document.getElementById("badges");
  if(box) box.innerHTML=[5,10,20].map(function(порог,i){
    return '<img src="game/tw/b'+(i+2)+'.png" class="'+(pts>=порог?"":"off")+'" alt="">';
  }).join("");
  overS.classList.remove("off"); SMP.sfx("lose"); setCat(pts>=10?"celebrate":"idle");
}
function backToMenu(){
  stopPending(); playing=false; clearInterval(tick); clearPop();
  quest.innerHTML=""; setCat("idle");
  overS.classList.add("off"); menuS.classList.remove("off");
}

/* Крупный знак поверх поля: нарисованные галочка и крест из набора
   читаются мгновенно, ребёнку не нужно вчитываться в подпись. */
var markEl=document.getElementById("mark");
function знак(ok){
  if(ВИДЫ[mode]) return;        /* в мемори отклик живёт на самих карточках */
  markEl.src = ok ? "game/tw/check.png" : "game/tw/close.png";
  markEl.classList.remove("on"); void markEl.offsetWidth; markEl.classList.add("on");
}

function reward(x,y,mult){
  var p=document.createElement("div");
  p.className="plus"; p.style.left=(x-26)+"px"; p.style.top=(y-20)+"px";
  p.textContent="+"+mult+"  ⏱+"+ADD; p.style.fontSize="21px"; g.appendChild(p);
  setTimeout(function(){ p.remove(); },1000);
  try{ SMP.burst(x,y); }catch(e){}
}

/* сохраняем попытку так же, как остальные игры платформы */
function saveTry(ok){
  if(window.SM && SM.isCloud){
    try{ SM.saveAttempt({course:sel.value, unit_id:sel.value, ex_type:"game-pop", correct:ok}); }catch(e){}
  }
}

/* ---------- игра: лопни слово ----------
   Наверху картинка и русский перевод, снизу всплывают английские слова.
   Правило то же, что в фониксе: нужное слово обязано быть на экране,
   а при смене задания старые шарики убираются — иначе ребёнок читает
   новый вопрос, а ответы на экране от предыдущего. */
var pops=[], popSpawn=null, popRaf=false;

function clearPop(){
  pops.forEach(function(p){ p.el.remove(); }); pops=[];
  if(popSpawn){ clearInterval(popSpawn); popSpawn=null; }
}

function dealPop(){
  stopPending();
  /* убираем шарики от прошлого слова вместе с вопросом */
  pops.forEach(function(z){
    z.dead=true;
    z.el.animate([{opacity:1},{opacity:0,transform:"scale(.7)"}],{duration:240,fill:"forwards"});
    (function(el){ setTimeout(function(){ el.remove(); },250); })(z.el);
  });
  pops=[];

  want=deck("w:"+sel.value, WORDS);
  var pic = картинкаДля(want);
  quest.innerHTML='<span class="cap">Найди это слово по-английски</span>'+
    '<div class="ask">'+pic+'<b>'+esc(want.ru)+'</b></div>';
  var a=quest.querySelector(".ask");
  if(a) a.animate([{transform:"scale(.6)",opacity:0},
                   {transform:"scale(1.08)",opacity:1,offset:.6},
                   {transform:"scale(1)"}],{duration:420});
  setCat("thinking",true,"idle");

  if(!popSpawn) popSpawn=setInterval(spawnPop, 1500);
  spawnPop();
  if(!popRaf){ popRaf=true; requestAnimationFrame(popLoop); }
}

function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* Цвета и числа рисуем сами. Они и составляли все девятнадцать слов курса
   без картинки — и как раз им картинка вредна: «purple» модель нарисует
   фиолетовым цветком, и запомнится цветок. */
var ЦВЕТА={red:"#e6392f", blue:"#2f7fe6", yellow:"#f5d020", green:"#4caf50",
  orange:"#f28b1e", purple:"#8e5bd0", pink:"#f078a8", brown:"#8a5a3b",
  black:"#2b2450", white:"#ffffff", grey:"#9aa0ab", gray:"#9aa0ab"};
var ЧИСЛА={one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",
  eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12"};

/* Картинки для курсов, где их не хранят, рисует тот же сервис, которым
   уже пользуются сорок страниц уроков Focus 1, Gateway и Solutions.
   Проверка на шестидесяти случайных словах: ошибок ноль, в среднем 0,9 с.
   Поэтому хранить тысячу двести картинок не нужно — достаточно спросить. */
var IMG_SERVICE="https://img-gen.limonatti.workers.dev/card?w=";
var КЭШ={};                       /* слово -> готовый адрес или "нет" */

function адресКартинки(w){
  if(w.img) return w.img;
  return IMG_SERVICE+encodeURIComponent(w.en);
}

/* Заранее тянем картинки всего юнита: тогда к моменту вопроса они уже
   в кэше браузера и появляются мгновенно, без подмигивания. */
function прогреть(список){
  список.slice(0,60).forEach(function(w){
    var k=(w.en||"").toLowerCase().trim();
    if(ЦВЕТА[k]||ЧИСЛА[k]||КЭШ[w.en]) return;
    var i=new Image();
    i.onload =function(){ КЭШ[w.en]=i.src; };
    i.onerror=function(){ КЭШ[w.en]="нет"; };
    i.src=адресКартинки(w);
  });
}

function картинкаДля(w){
  var k=(w.en||"").toLowerCase().trim();
  if(ЦВЕТА[k]) return '<div class="sw" style="background:'+ЦВЕТА[k]+'"></div>';
  if(ЧИСЛА[k]) return '<div class="num">'+ЧИСЛА[k]+'</div>';
  if(КЭШ[w.en]==="нет") return '<div class="em">'+(w.emoji||"❓")+'</div>';
  /* одна повторная попытка: сервис изредка отвечает не сразу */
  return '<img class="pic" alt="" src="'+адресКартинки(w)+'"'+
         ' data-w="'+encodeURIComponent(w.en)+'" onerror="сноваКартинка(this)">';
}

function сноваКартинка(img){
  if(img.dataset.tried){
    img.outerHTML='<div class="em">🖼️</div>';
    return;
  }
  img.dataset.tried="1";
  img.src=IMG_SERVICE+img.dataset.w+"&r="+Date.now();
}

function spawnPop(){
  if(!playing) return;
  var live=pops.filter(function(z){ return !z.dead; });
  if(live.length>=3) return;

  /* нужное слово всегда должно быть на экране */
  var hasOk=live.some(function(z){ return z.ok; });
  var ok = !hasOk || Math.random()<.4;
  var w = ok ? want
             : deck("x:"+sel.value, WORDS.filter(function(x){ return x.en!==want.en; }));
  if(!w) return;
  if(!ok && w.en===want.en) return;

  var el=document.createElement("div");
  el.className="pop";
  el.innerHTML='<div class="b" style="background-image:url(\'game/ui/b'+
    (1+Math.floor(Math.random()*6))+'.png\')"><span class="wt">'+esc(w.en)+'</span></div>';
  var x=40+Math.random()*Math.max(60, g.clientWidth-260);
  el.style.left=x+"px"; el.style.top=g.clientHeight+"px";
  g.appendChild(el);

  var p={el:el, x0:x, y:g.clientHeight, w:w, ok:(w.en===want.en), dead:false, sway:Math.random()*6.28};
  el.onclick=function(){ hitPop(p); };
  pops.push(p);
}

function hitPop(p){
  if(!playing || p.dead) return;
  var r=p.el.getBoundingClientRect(), gr=g.getBoundingClientRect();
  var x=r.left-gr.left+r.width/2, y=r.top-gr.top+40;

  if(p.ok){
    p.dead=true; p.el.classList.add("gone");
    streak++; if(streak>bestStreak) bestStreak=streak;
    var mult=streak>=3?2:1;
    comboEl.classList.toggle("on", streak>=3);
    pts+=mult; ptsEl.textContent=pts;
    left=Math.min(ROUND,left+ADD); setClock();
    reward(x,y,mult); знак(true); SMP.sfx("ok");
    setCat(mult>1?"celebrate":"happy",true,"idle");
    voice(p.w.en, 80);
    if(mult>1){ SMP.sfx("streak"); speak("Серия "+streak+"! 🔥",1500); }
    else speak("Верно! 👏",1400);
    saveTry(true);
    pops=pops.filter(function(z){ return z!==p; });
    p.el.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.6)",opacity:0}],
                 {duration:260,fill:"forwards"});
    setTimeout(function(){ p.el.remove(); },280);
    later(function(){ if(playing) dealPop(); }, 1100);
  } else {
    streak=0; comboEl.classList.remove("on");
    знак(false); SMP.sfx("no"); setCat("sad",true,"idle");
    voice(p.w.en, 60);
    speak("«"+esc(p.w.en)+"» — это "+esc(p.w.ru), 2100);
    saveTry(false);
    p.el.animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},
                  {transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:270});
  }
}

function popLoop(ts){
  if(!popLoop.t) popLoop.t=ts;
  var dt=Math.min(60, ts-popLoop.t); popLoop.t=ts;
  if(playing){
    var speed=72+pts*3;
    for(var i=pops.length-1;i>=0;i--){
      var p=pops[i];
      p.y -= speed*dt/1000;
      p.sway += dt/420;
      p.el.style.top=p.y+"px";
      p.el.style.left=(p.x0 + Math.sin(p.sway)*16)+"px";
      if(p.y < -160){
        if(p.ok && !p.dead){
          var m=document.createElement("div");
          m.className="miss"; m.style.left=Math.max(10,p.x0)+"px"; m.style.top="130px";
          m.textContent="уплыло…"; g.appendChild(m);
          (function(el){ setTimeout(function(){ el.remove(); },900); })(m);
        }
        p.el.remove(); pops.splice(i,1);
      }
    }
  }
  requestAnimationFrame(popLoop);
}

/* ---------- игра 2: найди пару ----------
   Без таймера: под тикающие часы ребёнок перестаёт запоминать и начинает
   тыкать наугад, а это ровно то, чего игра на память поощрять не должна. */
var memoOpen=[], memoLeft=0, memoBusy=false, memoBoard=0, MEMO_BOARDS=3, доска=null;


function clearMemo(){
  if(доска){ доска.remove(); доска=null; }
  memoOpen=[]; memoBusy=false; ждутЗакрытия=null;
}

/* Слова берём из выбранного юнита — игра идёт к уроку, а не вместо него.
   Во вступительном юните Super Minds все слова цвета, и это не сбой: там
   и урок про цвета. К учебнику целиком отступаем, только если в юните
   не набирается четырёх пар. */
function словаКурса(){
  var все=[];
  (window.SM_UNITS||[]).forEach(function(u){
    (u.words||[]).forEach(function(w,i){
      if(w.en && w.ru) все.push({id:u.id+"-"+i, en:w.en, ru:w.ru, emoji:w.emoji, img:w.img||null});
    });
  });
  return все.filter(игровое);
}

function dealMemo(){
  clearMemo();
  var банк = WORDS.length>=4 ? WORDS : словаКурса();
  var ключ = WORDS.length>=4 ? ("memo:"+sel.value) : "memoAll";
  var пул=[], попыток=0;
  while(пул.length<4 && попыток<200){
    попыток++;
    var w=deck(ключ, банк);
    if(!w) break;
    /* Не берём на одну доску слова с одинаковым написанием или одинаковым
       переводом: «orange» в учебнике дважды — цвет и фрукт, и пару из них
       не различить ни по картинке, ни по слову. */
    var столкновение=пул.some(function(x){
      return x.en.toLowerCase()===w.en.toLowerCase() ||
             (x.ru && w.ru && x.ru.toLowerCase()===w.ru.toLowerCase());
    });
    if(!столкновение) пул.push(w);
  }
  if(пул.length<4){ speak("Мало слов в юните",2000); return; }

  memoOpen=[]; memoLeft=4; memoBusy=true; memoBoard++;
  secsEl.textContent=memoBoard+" / "+MEMO_BOARDS;
  var виды=ВИДЫ[mode]||ВИДЫ.memo;
  quest.innerHTML='<span class="cap">Открой картинку и её слово</span>';
  setCat("thinking",true,"idle");

  var номер=memoBoard;
  готовитьКартинки(виды.indexOf("img")>-1 ? пул : []).then(function(){
    if(!playing || номер!==memoBoard) return;     /* доску успели сменить */
    var карты=[];
    пул.forEach(function(w){
      карты.push({w:w,вид:виды[0]}); карты.push({w:w,вид:виды[1]});
    });
    доска=document.createElement("div"); доска.className="board";
    shuffle(карты).forEach(function(c,i){
      var el=document.createElement("div");
      el.className="mc down"; el.style.animationDelay=(i*.045)+"s";
      el.onclick=function(){ flipMemo(el,c); };
      доска.appendChild(el); c.el=el;
    });
    g.appendChild(доска);
    memoBusy=false;
  });
}

var ждутЗакрытия=null;
function закрытьПару(){
  if(!ждутЗакрытия) return;
  ждутЗакрытия.forEach(function(x){
    x.el.classList.remove("miss"); x.el.classList.add("down"); x.el.innerHTML="";
  });
  ждутЗакрытия=null; memoOpen=[];
}

function flipMemo(el,c){
  if(!playing || memoBusy) return;
  if(el.classList.contains("done")) return;
  if(ждутЗакрытия){                      /* сначала убираем прошлую пару */
    if(ждутЗакрытия.indexOf(c)>-1) return;
    закрытьПару();
  }
  if(memoOpen.indexOf(c)>-1) return;
  el.classList.remove("down");
  el.innerHTML = c.вид==="img" ? картинкаДля(c.w) : '<b>'+esc(c.w.en)+'</b>';
  el.animate([{transform:"rotateY(80deg)"},{transform:"rotateY(0)"}],{duration:220});
  memoOpen.push(c);
  if(memoOpen.length<2) return;

  memoBusy=true;
  var a=memoOpen[0], b=memoOpen[1];
  if(a.w.en===b.w.en && a.вид!==b.вид){
    a.el.classList.add("done"); b.el.classList.add("done");
    memoOpen=[]; memoBusy=false; memoLeft--;
    streak++; if(streak>bestStreak) bestStreak=streak;
    var mult=streak>=3?2:1;
    comboEl.classList.toggle("on", streak>=3);
    pts+=mult; ptsEl.textContent=pts;
    /* без знака во весь экран: он закрывал бы собранную пару */
    SMP.sfx("ok"); setCat(mult>1?"celebrate":"happy",true,"idle");
    voice(a.w.en, 80); speak("Пара! 👏",1300); saveTry(true);
    if(memoLeft===0) later(function(){
      if(!playing) return;
      if(memoBoard>=MEMO_BOARDS){ speak("Все доски собраны! 🎉",1500); finish(); }
      else { speak("Доска собрана! 🎉",1400); dealMemo(); }
    },1300);
  } else {
    /* Порядок важен. Сначала ребёнок молча смотрит на то, что открыл:
       ни звука, ни красного, ни знака во весь экран — иначе он реагирует
       на сигнал, а не разглядывает две карточки. Через полторы секунды
       приходит отклик, и только потом доска закрывается под новый выбор. */
    streak=0; comboEl.classList.remove("on"); saveTry(false);
    memoBusy=true;
    later(function(){
      a.el.classList.add("miss"); b.el.classList.add("miss");
      SMP.sfx("no"); setCat("sad",true,"idle");
      voice(a.w.en); voice(b.w.en, 750);
      later(function(){
        ждутЗакрытия=[a,b]; закрытьПару(); memoBusy=false;
      }, 1500);
    }, 1500);
  }
}

/* ---------- запуск ---------- */
document.querySelectorAll(".gcard").forEach(function(b){
  b.onclick=function(){ start(b.dataset.g); };
});
document.getElementById("again").onclick=function(){ start(mode); };
document.getElementById("toMenu").onclick=backToMenu;
setClock();

fillCourses(); fillUnits();
/* курсы догружаются из базы — тогда список юнитов надо собрать заново */
if(window.SM_ready && SM_ready.then) SM_ready.then(function(){ fillCourses(); fillUnits(); }).catch(function(){});
document.addEventListener("sm-course-changed", function(){ fillCourses(); fillUnits(); });
</script>
