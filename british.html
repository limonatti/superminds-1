<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Британский акцент · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sm-warm.css?v=1c9436fd">
<style>
  :root{--ipa:"Noto Sans","Charis SIL","Doulos SIL","Gentium Plus","Segoe UI","Lucida Grande","DejaVu Sans",sans-serif}
  .ipa,.wi{font-family:var(--ipa)}

  /* левая колонка */
  .who{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--color-divider);
    background:var(--color-surface);padding:11px 20px;cursor:pointer;color:var(--color-text)}
  .who:hover{background:var(--color-accent-100)}
  .who.on{background:var(--color-accent-100);box-shadow:inset 5px 0 0 var(--color-accent)}
  .who .t{font:800 14.5px "Nunito",sans-serif}
  .who .d{display:block;margin-top:2px;font:600 12px "Nunito",sans-serif;color:var(--color-neutral-700)}
  .who .kd{float:right;font:800 9.5px "Nunito",sans-serif;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 6px;border:1px solid var(--color-divider);color:var(--color-neutral-700);margin-left:8px}
  .who .kd.m{border-color:var(--color-accent);color:var(--color-accent)}
  .grp{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--color-surface-deep);
    padding:13px 20px 10px;border-bottom:1px solid var(--color-divider);color:var(--color-text)}
  .grp .t{font:900 11px "Nunito",sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .grp .d{display:block;font:600 11.5px "Nunito",sans-serif;color:var(--color-neutral-700);margin-top:2px}
  .grp.on{box-shadow:inset 5px 0 0 var(--color-accent)}

  .box{padding:20px 28px;border-bottom:1px solid var(--color-divider)}
  .box h2{font:900 clamp(24px,3.2vw,34px) "Nunito",sans-serif;letter-spacing:-.02em;margin:0 0 6px}
  .box h3{font:900 18px "Nunito",sans-serif;margin:0 0 8px}
  .box p{font:600 14.5px "Nunito",sans-serif;line-height:1.6;margin:0 0 8px;color:var(--color-neutral-800)}
  .lab{font:800 10.5px "Nunito",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-600)}
  .muted{color:var(--color-neutral-700)}
  .honest{margin:16px 28px;padding:13px 15px;border-left:5px solid #8a6d00;background:#fdf6e3;
    font:600 13.5px "Nunito",sans-serif;line-height:1.55}
  .src{font:600 12.5px "Nunito",sans-serif;color:var(--color-neutral-700);line-height:1.6}
  .src a{word-break:break-all}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--color-divider);
    border-bottom:1px solid var(--color-divider)}
  .bcard{background:var(--color-bg);padding:16px 18px;text-align:left;border:0;cursor:pointer;color:var(--color-text);display:block}
  .bcard:hover{background:var(--color-accent-100)}
  .bcard.vid{background-size:cover;background-position:center;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:18px}
  .bcard.vid:hover{filter:brightness(1.08)}
  .bcard.vid .k{color:#ffd9c2}
  .bcard.vid .t{font-size:19px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  .bcard.vid .d{color:#f0e6df;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .bcard.vid .d.n{margin-top:8px;font-weight:800;color:#ffd9c2}
  .bcard .t{font:900 16px "Nunito",sans-serif;display:block}
  .bcard .d{font:600 12.5px "Nunito",sans-serif;color:var(--color-neutral-700);display:block;margin-top:4px;line-height:1.45}
  .bcard .k{font:800 10px "Nunito",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent);display:block;margin-bottom:6px}

  /* черты акцента в профиле */
  .feats{list-style:none;margin:0;padding:0}
  .feats li{display:grid;grid-template-columns:170px 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--color-divider)}
  .feats .fn{font:900 14px "Nunito",sans-serif}
  .feats .fi{display:block;font:700 13px var(--ipa);color:var(--color-accent-600);margin-top:2px}
  .feats .fx{font:600 14px "Nunito",sans-serif;line-height:1.55}
  .feats .ex{display:block;font:700 13px "Nunito",sans-serif;color:var(--color-neutral-700);margin-top:3px}
  .badge2{display:inline-block;font:800 9.5px "Nunito",sans-serif;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 6px;margin:4px 6px 0 0;border:1px solid var(--color-divider);color:var(--color-neutral-700)}
  .badge2.s{border-color:#1f7a3d;color:#1f7a3d}
  .badge2.c{border-color:var(--color-accent);color:var(--color-accent)}
  @media(max-width:560px){.feats li{grid-template-columns:1fr}}

  .vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .vid{border:1px solid var(--color-divider);background:var(--color-bg)}
  .vid .frame{position:relative;aspect-ratio:16/9;background:#111 center/cover no-repeat;display:flex;align-items:center;justify-content:center;
    border:0;width:100%;cursor:pointer;color:#fff}
  .vid .frame span{background:rgba(0,0,0,.65);padding:9px 14px;font:800 13px "Nunito",sans-serif}
  .vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
  .vid .cap{padding:9px 11px;font:700 12.5px "Nunito",sans-serif;line-height:1.4}
  .vid .cap i{font-style:normal;display:block;color:var(--color-neutral-700);font-weight:600}

  /* проигрыватель платформы */
  .pl{border:1px solid var(--color-divider);background:var(--color-bg)}
  .pl-dock{background:var(--color-bg)}
  .pl-screen{position:relative;aspect-ratio:16/9;overflow:hidden;
    background:linear-gradient(135deg,var(--color-canvas) 0,var(--color-accent-800) 100%)}
  .pl-screen iframe,.pl-screen>div{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pl-start{position:absolute;inset:0;width:100%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background-color:var(--color-canvas);background-position:center;background-size:cover;background-repeat:no-repeat}
  .pl-start span{background:var(--color-accent);color:#fff;padding:11px 18px;font:900 14px "Nunito",sans-serif;letter-spacing:.04em}
  .pl-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--color-divider);background:var(--color-surface-warm)}
  .pl-bar[hidden],.pl-bar [hidden]{display:none!important}
  .pl-bar button{border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);padding:5px 9px;font:800 12px "Nunito",sans-serif;cursor:pointer;min-width:34px}
  .pl-bar button[aria-pressed="true"]{background:var(--color-text);border-color:var(--color-text);color:#fff}
  .pl-bar .pl-play{background:var(--color-accent);border-color:var(--color-accent);color:#fff;min-width:42px}
  .pl-bar .pl-time{font:800 12px "Nunito",sans-serif;color:var(--color-neutral-700);font-variant-numeric:tabular-nums;margin:0 4px}
  .pl-bar .pl-sep{width:1px;height:20px;background:var(--color-divider);margin:0 2px}
  .pl-bar .pl-loop{color:var(--color-accent);border-color:var(--color-accent)}
  .pl-bar .pl-close{margin-left:auto}
  .pl-note{padding:10px 12px;border-top:1px solid var(--color-divider);background:#fdf6e3;
    font:600 12.5px "Nunito",sans-serif;line-height:1.5;border-left:4px solid #8a6d00}
  .pl .cap{padding:9px 11px;font:700 12.5px "Nunito",sans-serif;line-height:1.4}
  .pl .cap i{font-style:normal;display:block;color:var(--color-neutral-700);font-weight:600}
  .pl.docked .pl-dock{position:fixed;right:18px;bottom:18px;width:min(400px,calc(100vw - 36px));z-index:60;
    box-shadow:0 14px 40px rgba(20,10,8,.35);border:1px solid var(--color-divider)}
  @media(max-width:700px){.pl.docked .pl-dock{right:8px;left:8px;bottom:8px;width:auto}}
  .tasks{list-style:none;margin:0;padding:0}
  .tasks li{padding:9px 0;border-top:1px solid var(--color-divider)}
  .tasks label{display:flex;gap:10px;align-items:flex-start;font:600 14px "Nunito",sans-serif;line-height:1.5;cursor:pointer}
  .tasks input{margin-top:4px;accent-color:var(--color-accent);width:17px;height:17px;flex:none}

  /* панель слоёв */
  .vidwrap{padding:0 28px 16px;max-width:720px}
  .chipsbox{border-bottom:1px solid var(--color-divider)}
  .chipsbox>summary{padding:11px 28px;cursor:pointer;font:800 11px "Nunito",sans-serif;letter-spacing:.12em;text-transform:uppercase;
    color:var(--color-neutral-700);background:var(--color-surface-warm)}
  .chipsbox>summary:hover{color:var(--color-accent)}
  .chipsbox .chips{border-bottom:0}
  @media(max-width:700px){.vidwrap{padding-left:16px;padding-right:16px}.chipsbox>summary{padding-left:16px;padding-right:16px}}

  /* ======= четыре вида разбора: A нотный стан · B карточки · C два столбца · D караоке ======= */
  .viewbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 28px;border-bottom:1px solid var(--color-divider);
    background:var(--color-surface-warm)}
  .viewbar .lab{margin-right:4px}
  .viewbar button{border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-neutral-700);
    padding:6px 11px;font:800 12px "Nunito",sans-serif;cursor:pointer}
  .viewbar button[aria-pressed="true"]{background:var(--color-text);border-color:var(--color-text);color:#fff}
  .mono-grid{display:block}
  .mono-side{padding:0}
  .steps{display:flex;border-bottom:1px solid var(--color-divider);background:var(--color-surface-warm)}
  .steps button{flex:1;border:0;border-right:1px solid var(--color-divider);background:transparent;cursor:pointer;
    padding:12px 14px;text-align:left;color:var(--color-text)}
  .steps button:last-child{border-right:0}
  .steps .n{display:block;font:900 10px "Nunito",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-400)}
  .steps .t{display:block;font:900 15px "Nunito",sans-serif;margin-top:3px}
  .steps .d{display:block;font:600 11.5px "Nunito",sans-serif;color:var(--color-neutral-600);margin-top:2px}
  .steps button[aria-pressed="true"]{background:var(--color-bg);box-shadow:inset 0 -3px 0 var(--color-accent)}
  .steps button[aria-pressed="true"] .n{color:var(--color-accent)}
  .stepnote{padding:13px 28px;font:600 13px/1.55 "Nunito",sans-serif;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider)}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1px;background:var(--color-divider);
    border-bottom:1px solid var(--color-divider)}
  .unit-card{background:var(--color-bg);padding:12px 13px}
  .unit-card:hover{background:var(--color-surface-warm)}
  .unit-card .cw{font:800 19px/1.2 "Nunito",sans-serif}
  .unit-card .ci{font:500 14px var(--ipa);color:var(--color-neutral-600);margin-top:4px}
  .unit-card .cf{display:block;font:700 11.5px/1.45 "Nunito",sans-serif;color:var(--color-neutral-700);margin-top:8px}
  .unit-card .cf i{font-style:normal;font-family:var(--ipa);color:var(--color-accent)}
  .unit-card .cb{display:flex;gap:6px;margin-top:10px}
  .unit-card .cb button{border:1px solid var(--color-divider);background:var(--color-bg);font:800 11px "Nunito",sans-serif;
    padding:5px 9px;cursor:pointer;color:var(--color-text)}
  .unit-card .cb button:hover{border-color:var(--color-accent)}
  .unit-card .res{margin-top:8px;font-size:13px}

  /* пометки формой, а не цветом */
  .wt .el{text-decoration:line-through;text-decoration-thickness:2px;opacity:.45}
  .wt .wk{border-bottom:1px dotted currentColor}
  .wt sup{font-family:var(--ipa);font-size:.58em;line-height:1}
  .hide-tags .wt .el{text-decoration:none;opacity:1}
  .hide-tags .wt .wk{border-bottom:0}
  .hide-tags .wt sup{display:none}

  /* A · нотный стан: кнопки строки только при наведении */
  .mv-A .brs .sh{opacity:.25;transition:opacity .15s}
  .mv-A .brs:hover .sh,.mv-A .brs.act .sh{opacity:1}
  .mv-A .vidwrap{max-width:640px}

  /* B · карточки: раскрыта одна фраза */
  .mv-B .mono-side{position:sticky;top:0;z-index:6;background:var(--color-bg);border-bottom:1px solid var(--color-divider)}
  .mv-B .vidwrap{max-width:420px;padding-bottom:10px}
  .mv-B #segs{padding:10px 18px 20px;display:grid;gap:8px;background:var(--color-surface)}
  .mv-B .brs{border:1px solid var(--color-divider);background:var(--color-bg);padding:12px 16px;cursor:pointer}
  .mv-B .brs:not(.act) .line .wi,.mv-B .brs:not(.act) .line .brp,.mv-B .brs:not(.act) .nts,
  .mv-B .brs:not(.act) .sh .sb,.mv-B .brs:not(.act) .res{display:none}
  .mv-B .brs:not(.act) .wt{font-size:17px;color:var(--color-neutral-600);font-weight:700}
  .mv-B .brs:not(.act) .line{row-gap:2px}
  .mv-B .brs.act{border-color:var(--color-accent);box-shadow:0 6px 22px rgba(33,26,25,.10)}

  /* C · два столбца */
  @media(min-width:1000px){
    .mv-C .mono-grid{display:grid;grid-template-columns:minmax(320px,400px) 1fr;align-items:start}
    .mv-C .mono-side{position:sticky;top:0;background:var(--color-surface-deep);padding:18px 18px 22px;border-right:1px solid var(--color-divider)}
    .mv-C .vidwrap{padding:0;max-width:none}
    .mv-C .tools{position:static;background:transparent;border-bottom:0;padding:14px 0 0}
    .mv-C .mono-main{min-width:0}
  }

  /* D · караоке */
  .mv-D{background:#1b1512;color:#f3ece7}
  .mv-D .vidwrap{max-width:720px;margin:0 auto;padding:16px 18px}
  .mv-D .steps,.mv-D .viewbar,.mv-D .tools,.mv-D .stepnote,.mv-D .legend{background:#241d1a;border-color:#3a2f2b;color:#cdbfb7}
  .mv-D .steps button,.mv-D .viewbar button,.mv-D .tg{color:#f3ece7;border-color:#4a3c37;background:transparent}
  .mv-D .steps button[aria-pressed="true"]{background:#1b1512;box-shadow:inset 0 -3px 0 var(--color-accent-300)}
  .mv-D .viewbar button[aria-pressed="true"],.mv-D .tg[aria-pressed="true"]{background:#f3ece7;color:#1b1512;border-color:#f3ece7}
  .mv-D .cardgrid{background:#3a2f2b}
  .mv-D .unit-card{background:#241d1a;color:#f3ece7}
  .mv-D .unit-card .ci,.mv-D .unit-card .cf{color:#bdafa7}
  .mv-D .unit-card .cb button{background:transparent;color:#f3ece7;border-color:#4a3c37}
  .mv-D .brs{border-bottom:0;padding:10px 28px;text-align:center;opacity:.32;transition:opacity .2s;cursor:pointer}
  .mv-D .brs.act{opacity:1}
  .mv-D .brs .line{justify-content:center}
  .mv-D .brs:not(.act) .wi,.mv-D .brs:not(.act) .brp,.mv-D .brs:not(.act) .nts,.mv-D .brs:not(.act) .sh .sb,.mv-D .brs:not(.act) .res{display:none}
  .mv-D .brs:not(.act) .wt{font-size:18px;font-weight:700}
  .mv-D .wt{color:#fff}
  .mv-D .wi{color:rgba(243,236,231,.62)}
  .mv-D .sh .ru{color:rgba(243,236,231,.6)}
  .mv-D .nts li{color:#cdbfb7}
  .mv-D .sh{justify-content:center}
  .mv-D .sb{background:transparent;color:#f3ece7;border-color:#4a3c37}
  .mv-D .sb.voice{background:var(--color-accent);border-color:var(--color-accent)}
  .mv-D .brs.done{background:none;box-shadow:inset 3px 0 0 #1f7a3d}
  @media(max-width:700px){.viewbar,.stepnote{padding-left:16px;padding-right:16px}.steps button{padding:10px}}
  .tools{position:sticky;top:0;z-index:5;background:var(--color-bg);border-bottom:1px solid var(--color-divider);padding:10px 28px;
    display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .tools .lab{margin-right:4px}
  .tg{border:1px solid var(--color-divider);background:var(--color-bg);padding:6px 10px;font:800 12px "Nunito",sans-serif;cursor:pointer;color:var(--color-neutral-700)}
  .tg[aria-pressed="true"]{background:var(--color-text);border-color:var(--color-text);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 28px 16px;border-bottom:1px solid var(--color-divider)}
  .chip{border:1px solid var(--color-divider);background:var(--color-bg);padding:6px 10px 6px 8px;cursor:pointer;
    font:700 12.5px "Nunito",sans-serif;color:var(--color-text);display:inline-flex;gap:7px;align-items:center}
  .chip b{font:700 12px var(--ipa);min-width:18px;text-align:center;padding:1px 4px;color:#fff}
  .chip em{font-style:normal;color:var(--color-neutral-700);font-weight:800}
  .chip[aria-pressed="true"]{outline:2px solid var(--color-text);outline-offset:-1px}

  /* сегмент */
  .brs{padding:18px 28px 16px;border-bottom:1px solid var(--color-divider);scroll-margin-top:60px}
  .brs.done{background:linear-gradient(90deg,#e4f2e5 0,#e4f2e5 5px,transparent 5px)}
  .brs.flash{animation:fl 1.6s ease-out}
  @keyframes fl{0%{background:var(--color-accent-100)}100%{background:transparent}}
  .sh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
  .sh .num{font:900 13px "Nunito",sans-serif;color:var(--color-accent)}
  .sh .ru{font:600 13.5px "Nunito",sans-serif;color:var(--color-neutral-700);flex:1 1 240px}
  .sb{border:1px solid var(--color-divider);background:var(--color-bg);padding:6px 10px;font:800 11.5px "Nunito",sans-serif;
    cursor:pointer;color:var(--color-text);letter-spacing:.03em}
  .sb:hover{border-color:var(--color-accent)}
  .sb.rec{background:#8a1400;border-color:#8a1400;color:#fff}
  .sb.ok{background:#1f7a3d;border-color:#1f7a3d;color:#fff}
  .sb.voice{background:var(--color-text);border-color:var(--color-text);color:#fff}
  .sb.off,.unit-card .cb .off{border:1px dashed var(--color-divider);background:transparent;color:var(--color-neutral-700);
    padding:6px 10px;font:800 11.5px "Nunito",sans-serif;border-radius:999px;display:inline-block}
  .unit-card .cb .voice{background:var(--color-text);border-color:var(--color-text);color:#fff}
  .brs.marking{background:var(--color-accent-100)}
  .markbar{position:sticky;top:0;z-index:6;background:var(--color-text);color:#fff;padding:12px 28px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
    font:700 13px "Nunito",sans-serif}
  .markbar b{font:900 14px "Nunito",sans-serif}
  .markbar button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:7px 12px;font:800 12.5px "Nunito",sans-serif;cursor:pointer}
  .markbar button.go{background:var(--color-accent);border-color:var(--color-accent)}
  .markbar .hint{font-weight:600;color:var(--color-onink-muted);flex:1 1 240px}

  .line{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:14px}
  .un{display:inline-flex;flex-direction:column;margin-right:2px}
  .uw{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:10px}
  .brp{height:16px;width:calc(100% + 10px);margin:0 -5px;overflow:visible;display:block}
  .brp path{fill:none;stroke:var(--color-accent-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .brp .hd{stroke:var(--color-neutral-400);stroke-width:1.6}
  .brp .tl{stroke:var(--color-accent-2-300);stroke-width:1.8}
  .ub{align-self:flex-start;font:900 22px "Nunito",sans-serif;color:var(--color-neutral-400);padding:0 8px;line-height:1.15}
  .bw{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:0 1px;border-radius:3px;transition:opacity .15s}
  .wt{font:800 clamp(18px,2.3vw,23px) "Nunito",sans-serif;line-height:1.3;white-space:nowrap;position:relative;color:var(--color-text)}
  .wt .p{color:var(--color-neutral-500);font-weight:700}
  .nuc{position:relative;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--color-accent-2)}
  .nuc::before{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font:900 13px "Noto Sans",sans-serif;color:var(--color-accent-2);white-space:nowrap}

<script>
const esc = SMUI.esc;
const D = window.BR_DATA, F = BR.FEAT, LK = BR.LINK;
const ROLE = /[?&]t=1/.test(location.search) ? "teacher" : "student";
const PEOPLE = {}; D.people.forEach(p => PEOPLE[p.id] = p);
const MONOS = {}; D.monos.forEach(m => MONOS[m.id] = m);
const GROUP = {}; D.groups.forEach(g => GROUP[g.id] = g);

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let LAYERS = Object.assign({ ipa:true, tags:true, links:true, tone:true, ru:true, notes:true, weak:false, nor:false }, store.get("br_layers", {}));
let FOCUS = null, SLOW = false, MARK = null, ACTIVE = 0, WANT_MARK = false;
let VIEW = store.get("br_view", "C"), STEP = 0;
const VIEWS = [["A","Лента"],["B","Карточки"],["C","Два столбца"],["D","Караоке"]];
const STEPS = [
  { n:"Шаг 1", t:"Слова", d:"звук в одном слове" },
  { n:"Шаг 2", t:"Куски", d:"по 2–4 слова, со сцеплениями" },
  { n:"Шаг 3", t:"Предложения", d:"как в видео, целиком" }
];   /* MARK — режим разметки времени фраз */
/* времена начала фраз в ролике: из данных или из разметки учителя (браузер) */
function times(m){
  const local = store.get("br_times_" + m.id, null);
  if (local && local.length) return local;
  const fromData = m.segs.map(s => (s.t0 == null ? null : s.t0));   /* метки времени из данных */
  return fromData.some(x => x != null) ? fromData : null;
}
function segTime(m, si){
  const s = m.segs[si];
  if (s && s.t0 != null) return { start: s.t0, end: (s.t1 != null ? s.t1 : null) };
  const T = times(m); if (!T || T[si] == null) return null;
  let end = null;
  for (let i = si + 1; i < T.length; i++) if (T[i] != null) { end = T[i]; break; }
  return { start: T[si], end: end };
}

/* ---------- кэш разбора ---------- */
const STEPDATA = {};
function stepsOf(m){
  if (STEPDATA[m.id]) return STEPDATA[m.id];
  const PP = parsed(m), words = [], chunks = [], seen = {};
  const PRIO = ["glottal","elide","weak","hdrop","th-front","lvoc","strut-north","bath-short","goat-mono","face-mono","rhotic","syll","bath-long","happy-tense","happy-lax","smooth","yod","ng-g","goose-front","velar","link"];
  PP.forEach((P, si) => {
    let cur = [];
    P.words.forEach((w, i) => {
      cur.push(w);
      const nx = P.words[i + 1];
      const brk = !nx || nx.unit !== w.unit || (!w.linkNext && cur.length >= 3) || cur.length >= 5;
      if (brk){ if (cur.length > 1 || w.tags.length) chunks.push({ si, words: cur }); cur = []; }
      const tg = w.tags.filter(t => t !== "nor" && F[t]);
      if (!tg.length) return;
      const key = w.text.toLowerCase() + "|" + w.ipa;
      if (seen[key]) return;
      seen[key] = 1;
      words.push({ si, w: w, tags: tg, rank: Math.min.apply(null, tg.map(t => { const k = PRIO.indexOf(t); return k < 0 ? 99 : k; })) });
    });
  });
  words.sort((a, b) => a.rank - b.rank || a.si - b.si);
  const cap = {}, pick = [];
  words.forEach(x => {
    const k = x.tags[0];
    if ((cap[k] = (cap[k] || 0) + 1) <= 3) pick.push(x);
  });
  return (STEPDATA[m.id] = { words: pick.slice(0, 18), chunks: chunks });
}

const PARSED = {};
function parsed(m){
  if (!PARSED[m.id]) PARSED[m.id] = m.segs.map(s => BR.parse(s));
  return PARSED[m.id];
}
let INDEX = null;
function index(){
  if (INDEX) return INDEX;
  INDEX = { feats:{}, links:{} };
  D.monos.forEach(m => parsed(m).forEach((P, si) => P.words.forEach((w, wi) => {
    w.tags.forEach(t => (INDEX.feats[t] = INDEX.feats[t] || []).push({ m:m.id, si, wi, w }));
    if (w.linkNext) (INDEX.links[w.linkNext] = INDEX.links[w.linkNext] || []).push({ m:m.id, si, wi, w, next:P.words[wi+1] });
  })));
  return INDEX;
}
const done = id => store.get("br_done_" + id, {});

/* ---------- навигация ---------- */
function drawNav(route){
  const nav = document.getElementById("nav");
  let h = '<button class="grp'+(route.v==="home"?" on":"")+'" data-go="#"><span class="t">Британский акцент</span>' +
    '<span class="d">Разборы речи: видео + фразы по косточкам</span></button>';
  D.monos.forEach(m => {
    const p = PEOPLE[m.person], dn = Object.keys(done(m.id)).length;
    h += '<button class="who'+(route.v==="mono"&&route.id===m.id?" on":"")+'" data-go="#m/'+m.id+'">' +
      '<span class="kd m">'+(dn ? dn+' / '+m.segs.length : m.segs.length+' фраз')+'</span>' +
      '<span class="t">'+esc(p.ru)+'</span><span class="d">'+esc(m.title_ru)+'</span></button>';
  });
  h += '<button class="grp'+(route.v==="feat"?" on":"")+'" data-go="#f"><span class="t">Все звуки и сцепления</span>' +
    '<span class="d">Справочник: где что встречается</span></button>';
  nav.innerHTML = h;
  nav.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
}

function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [v, id, x] = h.split("/");
  if (v === "m" && MONOS[id]) return { v:"mono", id, seg: x != null ? +x : null };
  if (v === "f") return { v:"feat", id: id || null };
  return { v:"home" };
}

let LAST_MONO = null;
function render(){
  const r = route();
  if (r.v === "mono" && r.id !== LAST_MONO){ FOCUS = null; LAST_MONO = r.id; }
  stopSpeak();
  destroyPlayers();
  drawNav(r);
  const pane = document.getElementById("pane");
  if (r.v === "mono") pane.innerHTML = monoView(MONOS[r.id]);
  else if (r.v === "feat") pane.innerHTML = r.id ? featView(r.id) : featsView();
  else pane.innerHTML = homeView();
  bindPane(r);
  if (r.v === "mono" && r.seg != null){
    setTimeout(() => {
      const el = document.getElementById("s-" + r.seg);
      if (el){ el.scrollIntoView({ block:"center" }); el.classList.add("flash"); }
    }, 80);
  } else {
    pane.scrollTop = 0; window.scrollTo(0, 0);
  }
}

/* ---------- экраны ---------- */
const HONEST = '<div class="honest"><b>Как сделаны разборы.</b> Тексты — официальные стенограммы под открытой лицензией. ' +
  'Транскрипция, сцепления и интонация — фонетический разбор: как этот человек, судя по его акценту, произносит каждую фразу. ' +
  'Это не автоматическая расшифровка записи, поэтому слушай видео и сверяй. Черты с пометкой «подтверждено» описаны в исследованиях или у фонетистов.</div>';

function homeView(){
  return '<div class="pane-hd"><span>Британский акцент</span><span>'+D.monos.length+' '+SMUI.plural(D.monos.length,["разбор","разбора","разборов"])+'</span></div>' +
    '<div class="box"><div class="lab">British voices</div><h2>Как на самом деле говорят британцы</h2>' +
    '<p>Речь конкретных людей, разобранная по косточкам: транскрипция каждого слова, гортанные смычки, выпавшие звуки, ' +
    'связующий r, слабые формы, ударный слог и движение голоса. Каждую фразу слышно голосом самого говорящего — из его записи.</p>' +
    '<p class="muted">Три разбора для начала. Дальше добавим ещё — по одному, с видео и полной разметкой.</p></div>' +
    '<div class="cards">' + D.monos.map(m => {
      const p = PEOPLE[m.person], dn = Object.keys(done(m.id)).length;
      return '<button class="bcard vid" data-go="#m/'+m.id+'" style="background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55)),url(https://i.ytimg.com/vi/'+esc(m.video.yt)+'/hqdefault.jpg)">' +
        '<span class="k">'+esc(GROUP[p.group].title)+' · '+esc(m.date.slice(0,4))+'</span>' +
        '<span class="t">'+esc(p.ru)+'</span><span class="d">'+esc(m.title_ru)+'</span>' +
        '<span class="d n">'+m.segs.length+' фраз · '+(dn ? dn+' отработано' : 'начать')+'</span></button>';
    }).join("") + '</div>' + HONEST;
}

function ytId(u){ const m = (u||"").match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }
/* Видео играет только здесь, в проигрывателе платформы (YouTube-плеер без выхода на сайт) */
function videoHTML(v, auto){
  const id = v.yt || ytId(v.url);
  if (!id) return "";
  return '<div class="pl" data-pl="'+esc(id)+'"'+(auto ? ' data-auto="1"' : "")+'><div class="pl-dock">' +
    '<div class="pl-screen"><button class="pl-start" style="background-image:url(https://i.ytimg.com/vi/'+esc(id)+'/hqdefault.jpg)" aria-label="Смотреть: '+esc(v.title||"")+'"><span>▶ Смотреть</span></button></div>' +
    '<div class="pl-bar" hidden>' +
      '<button class="pl-play" data-a="toggle" aria-label="Пауза">❚❚</button>' +
      '<button data-a="back" title="Назад на 5 секунд">⟲ 5 с</button>' +
      '<span class="pl-time">0:00 / 0:00</span><span class="pl-sep"></span>' +
      '<button data-r="0.5">0.5×</button><button data-r="0.75">0.75×</button><button data-r="1" aria-pressed="true">1×</button><span class="pl-sep"></span>' +
      '<button data-a="A" title="Начало повтора">A</button><button data-a="B" title="Конец повтора">B</button>' +
      '<button class="pl-loop" data-a="loopoff" hidden>повтор ✕</button>' +
      '<button class="pl-close" data-a="undock" hidden aria-label="Свернуть проигрыватель">✕</button>' +
    '</div></div>' +
    '<div class="cap">'+esc(v.title || "Оригинальная запись")+'<i>'+esc(v.channel||"")+(v.year?' · '+esc(v.year):"")+'</i></div></div>';
}

let YT_READY = null, PLAYERS = [], PL_SEQ = 0;
const WEB = /^https?:$/.test(location.protocol);   /* YouTube не играет из локального файла (ошибка 153) */
function ytApi(){
  if (window.YT && YT.Player) return Promise.resolve();
  if (!YT_READY) YT_READY = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api"; sc.onerror = () => rej(new Error("api"));
    document.head.appendChild(sc);
    setTimeout(() => rej(new Error("timeout")), 9000);
  }).catch(e => { YT_READY = null; throw e; });
  return YT_READY;
}
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };

function destroyPlayers(){
  PLAYERS.forEach(P => { clearInterval(P.timer); if (P.io) P.io.disconnect(); try { P.yt && P.yt.destroy && P.yt.destroy(); } catch(e){} });
  PLAYERS = [];
}

function mountPlayer(box){
  const id = box.dataset.pl, screen = box.querySelector(".pl-screen"), bar = box.querySelector(".pl-bar");
  const P = { box, id, yt:null, A:null, B:null, timer:null, playing:false, dismissed:false };
  PLAYERS.push(P);
  const $ = sel => bar.querySelector(sel);

  function setDock(on){
    if (on === box.classList.contains("docked")) return;
    if (on){ box.style.minHeight = box.offsetHeight + "px"; box.classList.add("docked"); }
    else { box.classList.remove("docked"); box.style.minHeight = ""; }
    $('[data-a="undock"]').hidden = !on;
  }
  function paint(){
    if (!P.yt || !P.yt.getCurrentTime) return;
    const t = P.yt.getCurrentTime(), d = P.yt.getDuration ? P.yt.getDuration() : 0;
    $(".pl-time").textContent = fmt(t) + " / " + fmt(d);
    if (P.A != null && P.B != null && P.B > P.A && t >= P.B) P.yt.seekTo(P.A, true);
  }
  function fallback(autoplay){
    screen.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay='+(autoplay?1:0)+'&rel=0&playsinline=1' +
      (WEB ? '&origin=' + encodeURIComponent(location.origin) : "") + '" ' +
      'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Видео" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  }

  function start(autoplay){
    PLAYERS.forEach(o => { if (o !== P && o.yt && o.yt.pauseVideo) o.yt.pauseVideo(); });
    if (autoplay) stopSpeak();
    const holder = document.createElement("div");
    holder.id = "ytp-" + (++PL_SEQ);
    screen.innerHTML = ""; screen.appendChild(holder);
    ytApi().then(() => {
      P.yt = new YT.Player(holder.id, {
        host: "https://www.youtube-nocookie.com", videoId: id,
        playerVars: Object.assign({ autoplay: autoplay ? 1 : 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3 },
          WEB ? { origin: location.origin } : {}),
        events: {
          onReady: e => { bar.hidden = false; if (autoplay) { try { e.target.playVideo(); } catch(x){} } },
          onStateChange: e => {
            P.playing = e.data === 1;
            const b = $('[data-a="toggle"]'); b.textContent = P.playing ? "❚❚" : "▶"; b.setAttribute("aria-label", P.playing ? "Пауза" : "Играть");
            if (P.playing){ P.dismissed = false; PLAYERS.forEach(o => { if (o !== P && o.yt && o.yt.pauseVideo) o.yt.pauseVideo(); }); }
          }
        }
      });
      P.timer = setInterval(paint, 250);
      if ("IntersectionObserver" in window){
        P.io = new IntersectionObserver(en => {
          const out = !en[0].isIntersecting;
          setDock(out && P.playing && !P.dismissed);
        }, { threshold: 0.15 });
        P.io.observe(box);
      }
    }).catch(() => fallback(autoplay));
  }
  if (!WEB){
    const note = document.createElement("div");
    note.className = "pl-note";
    note.innerHTML = 'Файл открыт с диска, поэтому YouTube отвечает ошибкой 153 и не запускает ролик. ' +
      'Видео заработает, когда страница открыта по адресу сайта.';
    box.querySelector(".pl-dock").appendChild(note);
  }
  box.querySelector(".pl-start").onclick = () => start(true);
  if (box.dataset.auto && WEB) start(false);

  bar.onclick = e => {
    const b = e.target.closest("button"); if (!b || !P.yt) return;
    if (b.dataset.r){
      P.yt.setPlaybackRate(+b.dataset.r);
      bar.querySelectorAll("[data-r]").forEach(x => x.setAttribute("aria-pressed", x === b));
      return;
    }
    const a = b.dataset.a, t = P.yt.getCurrentTime();
    if (a === "toggle"){ P.playing ? P.yt.pauseVideo() : P.yt.playVideo(); }
    else if (a === "back"){ P.yt.seekTo(Math.max(0, t - 5), true); }
    else if (a === "A"){ P.A = t; P.B = null; b.textContent = "A " + fmt(t); $('[data-a="B"]').textContent = "B"; $('[data-a="loopoff"]').hidden = false; }
    else if (a === "B"){
      if (P.A == null || t <= P.A + 0.3) return;
      P.B = t; b.textContent = "B " + fmt(t); P.yt.seekTo(P.A, true); P.yt.playVideo();
    }
    else if (a === "loopoff"){ P.A = P.B = null; b.hidden = true; $('[data-a="A"]').textContent = "A"; $('[data-a="B"]').textContent = "B"; }
    else if (a === "undock"){ P.dismissed = true; P.yt.pauseVideo(); setDock(false); }
  };
}

/* --- разбор монолога --- */
function sylHTML(w){
  const t = w.text;
  if (!w.nuc) return esc(t);
  const r = BR.syllable(t, w.nuc.at);
  return esc(t.slice(0, r[0])) + '<span class="nuc '+w.nuc.tone+'">'+esc(t.slice(r[0], r[1]))+'</span>' + esc(t.slice(r[1]));
}

/* контур голоса под каждым словом: до ядра — ровная «голова», на ядре — тон, после — хвост */
function pitchSVG(u, w){
  const k = u.nuc ? u.words.indexOf(u.nuc) : -1, i = u.words.indexOf(w);
  const tone = u.nuc ? u.nuc.nuc.tone : null;
  let d, cls = "";
  if (k < 0 || i < k){ d = "M0 9 L100 11"; cls = "hd"; }
  else if (i === k){
    d = tone === "fall" ? "M0 4 L100 20" : tone === "rise" ? "M0 19 L100 5" : tone === "fallrise" ? "M0 4 L55 20 L100 12" : "M0 17 L50 3 L100 20";
  } else {
    d = tone === "fall" || tone === "risefall" ? "M0 20 L100 21" : tone === "rise" ? "M0 7 L100 3" : "M0 13 L100 6";
    cls = "tl";
  }
  return '<svg class="brp" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><path class="'+cls+'" d="'+d+'"/></svg>';
}

function wordHTML(w, u, P){
  let tx = sylHTML(w);
  if (w.tags.indexOf("elide") >= 0) tx = tx.replace(/(.)(<\/span>)?$/, '<span class="el">$1</span>$2');
  if (w.tags.indexOf("weak") >= 0) tx = '<span class="wk">' + tx + '</span>';
  if (w.tags.indexOf("glottal") >= 0) tx += '<sup>ʔ</sup>';
  const names = w.tags.filter(t => F[t]).map(t => F[t].n).join(" · ");
  return '<span class="bw" data-tags="'+w.tags.join(" ")+'" data-link="'+(w.linkNext||"")+'"'+(names?' title="'+esc(names)+'"':"")+'>' +
    '<span class="wt">'+tx+(w.punct ? '<span class="p">'+esc(w.punct)+'</span>' : "")+'</span>' +
    (u ? pitchSVG(u, w) : "") + '<span class="wi">'+esc(w.ipa)+'</span></span>';
}
function lineHTML(P){
  let line = "";
  P.units.forEach((u, ui) => {
    let ws = "";
    u.words.forEach(w => {
      ws += wordHTML(w, u, P);
      if (u.words[u.words.length - 1] === w) return;
      ws += w.linkNext
        ? '<span class="lk" data-lt="'+w.linkNext+'" title="'+esc(LK[w.linkNext].n+": "+LK[w.linkNext].d)+'">‿</span>'
        : '<span class="gap"></span>';
    });
    line += '<span class="un"><span class="uw">'+ws+'</span></span>';
    if (ui < P.units.length - 1) line += '<span class="ub'+(u.end==="||"?" big":"")+'" title="граница интонационной группы">'+(u.end==="||"?"||":"|")+'</span>';
  });
  return line;
}
function segHTML(m, s, P, si){
  const dn = done(m.id)[si], hasT = !!segTime(m, si);
  const line = P.ok ? lineHTML(P)
    : '<div><div class="wt">'+esc(s.t.replace(/[↘↗]/g,""))+'</div><div class="wi">'+esc(s.ipa)+'</div></div>';
  return '<article class="brs'+(dn?" done":"")+(si===ACTIVE?" act":"")+'" id="s-'+si+'" data-seg="'+si+'">' +
    '<div class="sh"><span class="num">'+String(si+1).padStart(2,"0")+'</span><span class="ru">'+esc(s.ru||"")+'</span>' +
      (hasT ? '<button class="sb voice" data-play="'+si+'">▶ Голос носителя</button>' : "") +
      '<button class="sb" data-rec="'+si+'">🎤 Повторить</button>' +
      '<button class="sb'+(dn?" ok":"")+'" data-done="'+si+'">'+(dn?"✓ Отработано":"Отработано")+'</button></div>' +
    '<div class="line">'+line+'</div>' +

function stopSpeak(){ try { if (window.SM_stopSpeak) SM_stopSpeak(); } catch(e){} }
function player(){ return PLAYERS.find(P => P.yt); }

/* Фраза звучит голосом самого говорящего: плеер играет кусок ролика от начала фразы до начала следующей */
let PLAY_WATCH = null;
function playSeg(m, si, btn, scroll){
  const t = segTime(m, si), P = player();
  if (!t) return;
  if (!P || !P.yt){ if (btn) setTimeout(() => btn.click(), 400); return; }
  stopSpeak();
  try { P.yt.setPlaybackRate(SLOW ? 0.75 : 1); } catch(e){}
  P.yt.seekTo(Math.max(0, t.start - 0.25), true);
  P.yt.playVideo();
  if (scroll){ const el = document.getElementById("s-" + si); if (el) el.scrollIntoView({ block:"center", behavior:"smooth" }); }
  clearInterval(PLAY_WATCH);
  if (t.end != null) PLAY_WATCH = setInterval(() => {
    if (!P.yt || !P.yt.getCurrentTime) return clearInterval(PLAY_WATCH);
    if (P.yt.getCurrentTime() >= t.end){ P.yt.pauseVideo(); clearInterval(PLAY_WATCH); }
  }, 120);
}
function plain(t){ return t.replace(/[↘↗]/g, "").replace(/\s*\|\|?\s*/g, " ").replace(/\s+/g, " ").trim(); }

let REC = null;
function bindPane(r){
  const pane = document.getElementById("pane");
  pane.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; });
  pane.querySelectorAll("[data-pl]").forEach(mountPlayer);
  if (r.v !== "mono") return;
  const m = MONOS[r.id], segs = document.getElementById("segs");

  /* переключатели вида и шага */
  pane.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    VIEW = b.dataset.view; store.set("br_view", VIEW); render();
  });
  pane.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { STEP = +b.dataset.step; render(); });

  /* слушать и повторять на шагах «слова» и «куски» */
  pane.querySelectorAll("[data-uplay]").forEach(b => b.onclick = () => playSeg(m, +b.dataset.uplay, b));
  pane.querySelectorAll("[data-urec]").forEach(b => b.onclick = async () => {
    const id = b.dataset.urec, out = document.getElementById("u-" + id);
    if (!(window.SMS && SMS.supported())){ out.textContent = "Проверка работает в Chrome, Edge и Safari."; return; }
    if (REC && REC.i === id){
      b.textContent = "🎤 Повторить"; b.classList.remove("rec"); out.textContent = "Считаю…";
      const res = await REC.sess.stop(); REC = null;
      if (!res){ out.textContent = "Не расслышала."; return; }
      out.innerHTML = '<b>'+res.score+' / 100</b> ' + res.words.map(w =>
        '<span class="'+(w.state==="ok"?"o":w.state==="near"?"n":"x")+'">'+esc(w.word)+'</span>').join("");
      return;
    }
    if (REC){ try { REC.sess.abort(); } catch(e){} }
    stopSpeak();
    const sess = SMS.session(b.dataset.text, { lang:"en-GB" });
    if (!sess){ out.textContent = "Микрофон занят."; return; }
    REC = { i: id, sess };
    b.textContent = "■ Стоп"; b.classList.add("rec"); out.textContent = "Говори…";
  });

  const markBtn0 = document.getElementById("markBtn");

    const [c, pos] = map[k];
    segs.classList.toggle(c, pos ? LAYERS[k] : !LAYERS[k]);
  });
  document.getElementById("slowBtn").onclick = e => { SLOW = !SLOW; e.currentTarget.setAttribute("aria-pressed", SLOW); };

      w.classList.toggle("hl", !!on);

      if (FOCUS === "nor" && !LAYERS.nor) { LAYERS.nor = true; segs.classList.add("show-nor"); pane.querySelector('[data-layer="nor"]').setAttribute("aria-pressed", true); }
    }

  /* Разметка времени: учитель слушает ролик и отмечает начало каждой фразы */
  const markBtn = document.getElementById("markBtn");
  if (markBtn) markBtn.onclick = () => startMarking(m);
  if (WANT_MARK){ WANT_MARK = false; setTimeout(() => startMarking(m), 600); }

  function startMarking(m){
    const P = player();
    if (!P || !P.yt){ markBtn.textContent = "Подожди, ролик ещё грузится…"; setTimeout(() => { markBtn.textContent = "Разметить время фраз"; }, 2000); return; }
    MARK = { i: 0, list: m.segs.map(() => null) };
    const bar = document.createElement("div");
    bar.className = "markbar";
    segs.parentNode.insertBefore(bar, segs);
    const draw = () => {
      const s = m.segs[MARK.i];
      bar.innerHTML = MARK.i < m.segs.length
        ? '<b>Фраза '+(MARK.i+1)+' из '+m.segs.length+':</b> <span>'+esc(plain(s.t).slice(0, 70))+'</span>' +
          '<button class="go" data-m="hit">Отметить (пробел)</button>' +
          '<button data-m="back">Назад</button><button data-m="minus">−0,3 с</button><button data-m="plus">+0,3 с</button>' +
          '<button data-m="stop">Прервать</button>' +
          '<span class="hint">Слушай ролик и жми «Отметить», когда фраза начинается. Кнопка сама переходит к следующей.</span>'
        : '<b>Готово: отмечены все '+m.segs.length+' фраз.</b>' +
          '<button class="go" data-m="save">Сохранить</button><button data-m="copy">Скопировать код</button><button data-m="stop">Отмена</button>' +
          '<span class="hint">«Сохранить» — и кнопка «Голос носителя» заиграет сразу. «Скопировать код» — пришли его мне, я вложу разметку в сайт для всех учеников.</span>';
      segs.querySelectorAll(".brs").forEach((el, k) => el.classList.toggle("marking", k === MARK.i));
    };
    const finish = save => {
      document.removeEventListener("keydown", key, true);
      bar.remove(); MARK = null;
      segs.querySelectorAll(".brs").forEach(el => el.classList.remove("marking"));
      if (save) render();
    };
    bar.onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      const a = b.dataset.m, P = player();
      if (a === "hit" && P && P.yt){ MARK.list[MARK.i] = +P.yt.getCurrentTime().toFixed(2); MARK.i++; draw(); }
      else if (a === "back"){ MARK.i = Math.max(0, MARK.i - 1); MARK.list[MARK.i] = null; draw(); }
      else if (a === "minus" || a === "plus"){
        const k = MARK.i - 1;
        if (k >= 0 && MARK.list[k] != null){ MARK.list[k] = Math.max(0, +(MARK.list[k] + (a === "plus" ? 0.3 : -0.3)).toFixed(2)); draw(); }
      }
      else if (a === "save"){ store.set("br_times_" + m.id, MARK.list); finish(true); }
      else if (a === "copy"){
        const code = JSON.stringify({ mono: m.id, times: MARK.list });
        navigator.clipboard && navigator.clipboard.writeText(code);
        b.textContent = "Скопировано";
      }
      else if (a === "stop") finish(false);
    };
    const key = e => {
      if (!MARK) return;
      if (e.code === "Space"){ e.preventDefault(); const h = bar.querySelector('[data-m="hit"]'); if (h) h.click(); }
    };
    document.addEventListener("keydown", key, true);
    draw();
    try { P.yt.seekTo(0, true); P.yt.playVideo(); } catch(e){}
    bar.scrollIntoView({ block: "start" });
  }
  segs.querySelectorAll("[data-done]").forEach(b => b.onclick = () => {
    const i = b.dataset.done, d = done(m.id);
    if (d[i]) delete d[i]; else d[i] = 1;
    store.set("br_done_" + m.id, d);
    b.classList.toggle("ok", !!d[i]); b.textContent = d[i] ? "✓ Отработано" : "Отработано";
    document.getElementById("s-" + i).classList.toggle("done", !!d[i]);
    const hd = pane.querySelector(".pane-hd span:last-child"); if (hd) hd.textContent = Object.keys(d).length + " / " + m.segs.length + " отработано";
  });
  segs.querySelectorAll("[data-rec]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.rec, out = document.getElementById("r-" + i), s = m.segs[i];
    if (!(window.SMS && SMS.supported())){ out.textContent = "Проверка произношения работает в Chrome, Edge и Safari."; return; }
    if (REC && REC.i === i){
      b.classList.remove("rec"); b.textContent = "🎤 Повторить"; out.textContent = "Считаю…";
      const res = await REC.sess.stop(); REC = null;
      if (!res){ out.textContent = "Не расслышала — говори ближе к микрофону."; return; }
      out.innerHTML = '<b>'+res.score+' / 100</b> &nbsp;' + res.words.map(w => '<span class="'+(w.state==="ok"?"o":w.state==="near"?"n":"x")+'">'+esc(w.word)+'</span>').join("") +
        '<div class="src" style="margin-top:4px">Браузер услышал: «'+esc(res.heard)+'»</div>';
      const best = store.get("br_best_" + m.id, {});
      if (best[i] == null || res.score > best[i]){ best[i] = res.score; store.set("br_best_" + m.id, best); }
      return;
    }
    if (REC){ try { REC.sess.abort(); } catch(e){} const pb = segs.querySelector('[data-rec="'+REC.i+'"]'); if (pb){ pb.classList.remove("rec"); pb.textContent = "🎤 Повторить"; } }
    stopSpeak();
    const sess = SMS.session(plain(s.t), { lang:"en-GB", onInterim: tx => { out.textContent = "Слышу: " + tx; } });
    if (!sess){ out.textContent = "Микрофон занят или недоступен."; return; }
    REC = { i, sess };
    b.classList.add("rec"); b.textContent = "■ Стоп"; out.textContent = "Говори фразу, потом нажми «Стоп».";
  });
}

/* ---------- запуск ---------- */
async function load(){
  const pane = document.getElementById("pane");
  const u = await SMUI.requireAuth(pane, ROLE);
  if (!u) return;
  SMUI.mount({ role: ROLE, active: "british" });
  render();
}
window.addEventListener("hashchange", render);
SMUI.mount({ role: ROLE, active: "british" });
load();
</script>
