<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои курсы · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css">
<link rel="stylesheet" href="sm-ui.css">
<style>
  /* ===== Главная: учитель по центру + курсы в колонке сбоку ===== */
  .home-hero{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:100vh}
  .home-hero .rail{border-left:2px solid var(--color-divider);background:var(--color-surface);
    display:flex;flex-direction:column;overflow-y:auto;max-height:100vh}
  .rail .rail-hd{padding:18px 22px 14px;border-bottom:2px solid var(--color-divider);
    font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);
    display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;
    background:var(--color-surface);z-index:2}
  .rail .rail-assigned{padding:18px 22px;background:var(--color-text);color:#fff}
  .rail .rail-assigned .k{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-300)}
  .rail .rail-assigned h3{margin:7px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .rail .rail-assigned p{margin:6px 0 12px;font-size:13px;font-weight:500;color:var(--color-neutral-400)}
  .rail .rail-assigned .go{display:inline-flex;align-items:center;gap:8px;background:var(--color-accent);color:#fff;
    padding:11px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .rail .rail-assigned .go:hover{background:var(--color-accent-600)}
  .rail .sect{padding:20px 22px 12px}
  .rail .crs{display:flex;flex-direction:column}
  .rail .crs-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;
    padding:14px 22px;border-bottom:2px solid var(--color-divider);border-left:5px solid transparent;
    transition:background .16s ease-out;text-decoration:none}
  .rail .crs-row:hover{background:var(--color-accent-100)}
  .rail .crs-row.assigned{background:var(--color-accent-100);border-left-color:var(--color-accent)}
  .rail .crs-row .num{font-size:24px;line-height:1}
  .rail .crs-row .t{font-size:15px;font-weight:800;letter-spacing:-.01em;display:block}
  .rail .crs-row .d{font-size:12px;font-weight:600;color:var(--color-neutral-700);display:block;margin-top:2px}
  .rail .crs-row .tag{display:inline-block;background:var(--color-accent);color:#fff;font-size:10px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;margin-left:6px;vertical-align:middle}
  /* адаптив: на узком экране курсы уходят под сцену */
  @media(max-width:960px){
    .home-hero{grid-template-columns:minmax(0,1fr)}
    .home-hero .rail{border-left:0;border-top:2px solid var(--color-divider);max-height:none}
    .rail .rail-hd{position:static}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="pane" id="pane"><div class="empty"><div class="p">Загрузка…</div></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js"></script>
<script src="sm-auth.js"></script>
<script src="sm-shell.js"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;
const COURSES = [
  { id:"speakout-b1plus", t:"Speakout B1+", d:"Курс по юнитам · грамматика, лексика, чанки, аудио", emoji:"🗣️",
    hub:"speakout-b1plus-course.html", book:"speakout-book.html?course=speakout-b1plus" },
  { id:"speakout-b1", t:"Speakout B1", d:"Курс по юнитам · грамматика, лексика, чанки", emoji:"💬",
    hub:"speakout-b1-course.html", book:"speakout-book.html?course=speakout-b1" },
  { id:"focus-1", t:"Focus 1", d:"A1–A2 · 8 юнитов · грамматика, лексика, аудио, Workbook", emoji:"🎯",
    hub:"focus-1-course.html", book:null },
  { id:"solutions-el", t:"Solutions Elementary", d:"Elementary · секции A–H · грамматика, лексика, Workbook", emoji:"📗",
    hub:"solutions-el-course.html", book:null },
  { id:"solutions-pi", t:"Solutions Pre-Int", d:"Pre-Intermediate · секции A–H · грамматика, лексика, Workbook", emoji:"📘",
    hub:"solutions-pi-course.html", book:null },
  { id:"gateway-a1p", t:"Gateway A1+", d:"A1+ · 2nd edition · юниты, лексика, грамматика, видео, IELTS", emoji:"🚪",
    hub:"gateway-a1p-course.html", book:null },
  { id:"superminds-1", t:"Super Minds 1", d:"Для детей 6–8 · юниты, слова, игры", emoji:"🧸",
    hub:"units.html", book:null },
  { id:"phonics", t:"Чтение · Phonics", d:"English Sounds · 42 звука Jolly Phonics · игры, worksheets, видео", emoji:"🔤",
    hub:"phonics.html", book:null }
];

async function load(){
  const pane = document.getElementById("pane");
  let user = null, assigned = null;
  try { user = await SMUI.user(); } catch(e){}
  if (user) { try { assigned = await SM.myCourse(); } catch(e){} }

  const cur = assigned ? (COURSES.filter(c=>c.id===assigned)[0] || null) : null;
  const ordered = COURSES.slice().sort((a,b)=> (b.id===assigned?1:0) - (a.id===assigned?1:0));

  // --- правая колонка: назначенный курс + список всех курсов ---
  let rail = '<div class="rail-hd"><span>Мои курсы / My courses</span><span>' +
    (user ? esc(user.name) : "войди в меню слева") + '</span></div>';

  if (cur){
    rail += '<div class="rail-assigned"><div class="k">Назначен тебе учителем</div><h3>' + esc(cur.t) + '</h3>' +
      '<p>' + esc(cur.d) + '</p><a class="go" href="' + (cur.book || cur.hub) + '">' +
      icon("play",14) + ' Продолжить</a></div>';
  }

  rail += '<div class="sect"><span>Все курсы</span><span>' + COURSES.length + '</span></div><div class="crs">' +
    ordered.map(c => {
      const on = (c.id===assigned) ? " assigned" : "";
      return '<a class="crs-row' + on + '" href="' + (c.book || c.hub) + '">' +
        '<span class="num">' + c.emoji + '</span>' +
        '<span><span class="t">' + esc(c.t) + (c.id===assigned ? '<span class="tag">назначен</span>' : '') + '</span>' +
        '<span class="d">' + esc(c.d) + '</span></span></a>';
    }).join("") + '</div>';

  // --- сцена учителя (слева) + колонка курсов (справа) ---
  pane.innerHTML =
    '<div class="home-hero">' +
      '<section class="teacher-stage" id="mascotStage" data-name="' + (user ? esc(user.name) : "") + '"></section>' +
      '<aside class="rail">' + rail + '</aside>' +
    '</div>';
}

SMUI.mount({ role:"student", active:"courses" });
load();
</script>
<!-- Анимированный маскот-учитель: заполняет сцену #mascotStage, следит за курсором. -->
<script src="sm-mascot.js"></script>
</body>
</html>
