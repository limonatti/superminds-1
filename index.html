<style>
  /* ===== Главная: учитель по центру + курсы в колонке сбоку ===== */
  .home-hero{display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:100vh}
  .home-hero .rail{border-left:2px solid var(--color-divider);background:var(--color-surface);
    display:flex;flex-direction:column;overflow-y:auto;max-height:100vh}
  .rail .rail-hd{padding:18px 22px 14px;border-bottom:2px solid var(--color-divider);
    font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);
    display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;
    background:var(--color-surface);z-index:2}
  .rail .rail-assigned{padding:18px 22px;background:var(--color-text);color:#fff}
  .rail .rail-assigned .k{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-300)}
  .rail .rail-assigned h3{margin:7px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .rail .rail-assigned p{margin:6px 0 12px;font-size:13px;font-weight:500;color:var(--color-neutral-400)}
  .rail .rail-assigned .go{display:inline-flex;align-items:center;gap:8px;background:var(--color-accent);color:#fff;
    padding:11px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .rail .rail-assigned .go:hover{background:var(--color-accent-600)}
  .rail .sect{padding:20px 22px 12px}
  .rail .crs{display:flex;flex-direction:column}
  .rail .crs-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:13px;align-items:center;
    padding:13px 22px;border-bottom:2px solid var(--color-divider);border-left:5px solid transparent;
    transition:background .16s ease-out;text-decoration:none}
  .rail .crs-row:hover{background:var(--color-accent-100)}
  .rail .crs-row.assigned{background:var(--color-accent-100);border-left-color:var(--color-accent)}
  .rail .crs-row .num{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    background:var(--color-accent-100);border-radius:13px;overflow:hidden}
  .rail .crs-row .num img{width:34px;height:34px;display:block;object-fit:contain}
  .rail .crs-row .t{font-size:15px;font-weight:800;letter-spacing:-.01em;display:block}
  .rail .crs-row .d{font-size:12px;font-weight:600;color:var(--color-neutral-700);display:block;margin-top:2px}
  .rail .crs-row .tag{display:inline-block;background:var(--color-accent);color:#fff;font-size:10px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;margin-left:6px;vertical-align:middle}
  /* ===== Оживление карточек курсов ===== */
  @keyframes crsIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes railIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .rail .rail-assigned{animation:railIn .5s cubic-bezier(.16,1,.3,1) both}
  .rail .crs-row{opacity:0;animation:crsIn .5s cubic-bezier(.16,1,.3,1) forwards;
    transition:background .18s ease-out,transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s ease-out}
  .rail .crs-row:nth-child(1){animation-delay:.05s}
  .rail .crs-row:nth-child(2){animation-delay:.10s}
  .rail .crs-row:nth-child(3){animation-delay:.15s}
  .rail .crs-row:nth-child(4){animation-delay:.20s}
  .rail .crs-row:nth-child(5){animation-delay:.25s}
  .rail .crs-row:nth-child(6){animation-delay:.30s}
  .rail .crs-row:nth-child(7){animation-delay:.35s}
  .rail .crs-row:nth-child(8){animation-delay:.40s}
  .rail .crs-row:nth-child(n+9){animation-delay:.45s}
  .rail .crs-row .num{transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .18s ease-out;will-change:transform}
  .rail .crs-row:hover{transform:translateX(4px);box-shadow:0 6px 18px rgba(0,0,0,.08);position:relative;z-index:1}
  .rail .crs-row:hover .num{transform:scale(1.1) rotate(-5deg);background:#fff}
  .rail .crs-row:hover .t{color:var(--color-accent-600)}
  .rail .crs-row:active{transform:translateX(2px) scale(.995)}
  @media(prefers-reduced-motion:reduce){
    .rail .rail-assigned,.rail .crs-row{animation:none;opacity:1;transform:none}
    .rail .crs-row,.rail .crs-row .num,.rail .crs-row:hover{transition:none;transform:none}
  }
  /* адаптив: на узком экране курсы уходят под сцену */
  @media(max-width:960px){
    .home-hero{grid-template-columns:minmax(0,1fr)}
    .home-hero .rail{border-left:0;border-top:2px solid var(--color-divider);max-height:none}
    .rail .rail-hd{position:static}
  }
</style>
<link rel="stylesheet" href="sm-warm-shell.css?v=89a4966d">
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="pane" id="pane"><div class="empty"><div class="p">Загрузка…</div></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js?v=c350045e"></script>
<script src="course-words.js?v=442908de"></script>
<script src="speakout-words.js?v=3094c556"></script>
<script src="sm-auth.js?v=1a8f02f9"></script>
<script src="sm-shell.js?v=29cfb3d6"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;
const COURSES = [
  { id:"speakout-b1plus", t:"Speakout B1+", d:"Курс по юнитам · грамматика, лексика, чанки, аудио", icon:"img/course-icons/speakout-b1plus.png",
    hub:"speakout-b1plus-course.html", book:"speakout-book.html?course=speakout-b1plus" },
  { id:"speakout-b1", t:"Speakout B1", d:"Курс по юнитам · грамматика, лексика, чанки", icon:"img/course-icons/speakout-b1.png",
    hub:"speakout-b1-course.html", book:"speakout-book.html?course=speakout-b1" },
  { id:"focus-1", t:"Focus 1", d:"A1–A2 · 8 юнитов · грамматика, лексика, аудио, Workbook", icon:"img/course-icons/focus-1.png",
    hub:"focus-1-course.html", book:null },
  { id:"solutions-el", t:"Solutions Elementary", d:"Elementary · секции A–H · грамматика, лексика, Workbook", icon:"img/course-icons/solutions-el.png",
    hub:"solutions-el-course.html", book:null },
  { id:"solutions-pi", t:"Solutions Pre-Int", d:"Pre-Intermediate · секции A–H · грамматика, лексика, Workbook", icon:"img/course-icons/solutions-pi.png",
    hub:"solutions-pi-course.html", book:null },
  { id:"gateway-a1p", t:"Gateway A1+", d:"A1+ · 2nd edition · юниты, лексика, грамматика, видео, IELTS", icon:"img/course-icons/gateway-a1p.png",
    hub:"gateway-a1p-course.html", book:null },
  { id:"superminds-1", t:"Super Minds 1", d:"Для детей 6–8 · юниты, слова, игры", icon:"img/course-icons/superminds-1.png",
    hub:"units.html", book:null },
  { id:"phonics", t:"Чтение · Phonics", d:"English Sounds · 42 звука Jolly Phonics · игры, worksheets, видео", icon:"img/course-icons/phonics.png",
    hub:"phonics.html", book:null }
];

async function load(){
  const pane = document.getElementById("pane");
  let user = null, assigned = null;
  try { user = await SMUI.user(); } catch(e){}
  if (user) { try { assigned = await SM.myCourse(); } catch(e){} }

  const cur = assigned ? (COURSES.filter(c=>c.id===assigned)[0] || null) : null;
  const ordered = COURSES.slice().sort((a,b)=> (b.id===assigned?1:0) - (a.id===assigned?1:0));

  // --- правая колонка: назначенный курс + список всех курсов ---
  let rail = '<div class="rail-hd"><span>Мои курсы / My courses</span><span>' +
    (user ? esc(user.name) : "войди в меню слева") + '</span></div>';

  if (cur){
    rail += '<div class="rail-assigned"><div class="k">Назначен тебе учителем</div><h3>' + esc(cur.t) + '</h3>' +
      '<p>' + esc(cur.d) + '</p><a class="go" href="' + (cur.book || cur.hub) + '">' +
      icon("play",14) + ' Продолжить</a></div>';
  }

  rail += '<div class="sect"><span>Все курсы</span><span>' + COURSES.length + '</span></div><div class="crs">' +
    ordered.map(c => {
      const on = (c.id===assigned) ? " assigned" : "";
      return '<a class="crs-row' + on + '" href="' + (c.book || c.hub) + '">' +
        '<span class="num"><img src="' + c.icon + '" alt="" loading="lazy" width="34" height="34"></span>' +
        '<span><span class="t">' + esc(c.t) + (c.id===assigned ? '<span class="tag">назначен</span>' : '') + '</span>' +
        '<span class="d">' + esc(c.d) + '</span></span></a>';
    }).join("") + '</div>';

  // --- сцена учителя (слева) + колонка курсов (справа) ---
  pane.innerHTML =
    '<div class="home-hero">' +
      '<section class="teacher-stage" id="mascotStage" data-name="' + (user ? esc(user.name) : "") + '"></section>' +
      '<aside class="rail">' + rail + '</aside>' +
    '</div>';
}

SMUI.mount({ role:"student", active:"courses" });
load();
</script>
<!-- Сцена на главной: вырезанный портрет на бордовом фоне + пилюли курсов.
     Прежний вариант — sm-mascot.js (портрет с бегающими зрачками), вернуть заменой строки. -->
<script src="sm-hero.js?v=20f4aa0d"></script>
</body>
