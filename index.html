<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои курсы · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css">
<link rel="stylesheet" href="sm-ui.css">
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="cols">
      <div class="list">
        <div class="step">Шаг 1 · Выбери курс</div>
        <div id="courseList"></div>
      </div>
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js"></script>
<script src="speakout-words.js"></script>
<script src="sm-auth.js"></script>
<script src="sm-shell.js"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;

/* ---------- реестр курсов ---------- */
const SPK_UNITS = 8;
function speakoutWords(course, unit){
  const src = (window.SPEAKOUT_WORDS || {})[course] || {};
  return (src[String(unit)] || []).map(p => ({ en: p[0], ru: p[1] }));
}
function speakoutTotal(course){
  const src = (window.SPEAKOUT_WORDS || {})[course] || {};
  return Object.keys(src).reduce((s,k) => s + src[k].length, 0);
}

const CATALOG = [];
/* учебники для детей из words.js (включая созданные в конструкторе) */
(window.SM_COURSES || []).forEach(c => {
  if (c.admin) return;
  const units = (window.SM_COURSE_DATA || {})[c.id] || [];
  if (!units.length) return;
  CATALOG.push({
    kind: "kids", id: c.id, title: c.title, sub: c.subtitle,
    units: units.length, words: units.reduce((s,u)=>s+u.words.length,0), data: units
  });
});
CATALOG.push({ kind: "phonics", id: "phonics", title: "Phonics Starter", sub: "звуки и чтение · 5–7 лет", units: 0, words: 0 });
CATALOG.push({ kind: "spk", id: "speakout-b1plus", title: "Speakout B1+", sub: "подростки и взрослые", units: SPK_UNITS, words: speakoutTotal("speakout-b1plus") });
CATALOG.push({ kind: "spk", id: "speakout-b1",     title: "Speakout B1",  sub: "подростки и взрослые", units: SPK_UNITS, words: speakoutTotal("speakout-b1") });
CATALOG.push({ kind: "own", id: "own", title: "Свой учебник", sub: "собери в конструкторе", units: 0, words: 0 });
["Super Minds 2","Kid's Box 1","Playway 1","Family & Friends 1"].forEach(t =>
  CATALOG.push({ kind: "soon", id: "soon-"+t, title: t, sub: "скоро", units: 0, words: 0 }));

/* ---------- прогресс ---------- */
let PROG = {};
function learnedIn(units){
  let n = 0;
  units.forEach(u => u.words.forEach((w,i) => {
    const k = u.id + "-" + i;
    if (PROG[k] && PROG[k].status === "learned") n++;
  }));
  return n;
}

/* ---------- состояние ---------- */
let sel = CATALOG[0];
let selUnit = 0;

/* ---------- список слева ---------- */
function drawList(){
  document.getElementById("courseList").innerHTML = CATALOG.map((c,i) => {
    const on = c === sel ? " on" : "";
    let pct = 0, sub = c.sub;
    if (c.kind === "kids" && c.words) { pct = Math.round(learnedIn(c.data)/c.words*100); sub = c.units + " юнитов · " + c.words + " слов"; }
    if (c.kind === "spk") sub = c.units + " юнитов · " + c.words + " слов";
    const bar = (c.kind === "kids" || c.kind === "spk")
      ? '<span class="bar"><i style="width:'+pct+'%"></i></span>' : "";
    return '<button class="li'+on+'" data-i="'+i+'"'+(c.kind==="soon"?" disabled":"")+'>' +
      '<span class="t">'+esc(c.title)+'</span><span class="s">'+esc(sub)+'</span>'+bar+'</button>';
  }).join("");
  document.querySelectorAll("#courseList .li").forEach(b => b.onclick = () => {
    sel = CATALOG[+b.dataset.i]; selUnit = 0;
    if (sel.kind === "kids") { try { localStorage.setItem("sm-course", sel.id); } catch(e){} }
    drawList(); drawPane();
  });
}

/* ---------- правая часть ---------- */
function unitStrip(labels, done, cur){
  return '<div class="units">' + labels.map((l,i) => {
    const cls = i === cur ? " now" : (done && i < done ? " done" : "");
    return '<button class="unit'+cls+'" data-u="'+i+'"><span class="k">Unit '+(i+1)+'</span><span class="n">'+esc(l)+'</span></button>';
  }).join("") + "</div>";
}
function rowsHtml(list){
  return '<div class="rows">' + list.map((r,i) =>
    '<a class="row'+(r.now?" now":"")+'" href="'+r.href+'"'+(r.blank?' target="_blank" rel="noopener"':'')+'>' +
      '<span class="num">'+String(i+1).padStart(2,"0")+'</span>' +
      '<span><span class="t">'+esc(r.t)+'</span><span class="d">'+esc(r.d)+'</span></span>' +
      '<span class="b'+(r.now?" pri":"")+' sm">'+esc(r.act||"Открыть")+'</span></a>').join("") + "</div>";
}
function wordsHtml(words, title){
  if (!words.length) return "";
  return '<div class="sect"><span>'+esc(title)+'</span><span>'+words.length+'</span></div>' +
    '<div class="wgrid">' + words.slice(0,60).map(w =>
      '<div class="w"><div class="en">'+esc(w.en)+'</div><div class="ru">'+esc(w.ru||"")+'</div></div>').join("") + "</div>";
}

function drawPane(){
  const p = document.getElementById("pane");
  const c = sel;

  if (c.kind === "soon"){
    p.innerHTML = '<div class="pane-hd"><span>Шаг 2 · '+esc(c.title)+'</span></div>' +
      SMUI.empty("Этого учебника пока нет",
        "Ася его ещё не заводила. Когда появится — курс встанет в этот же список, и юниты откроются здесь.");
    return;
  }

  if (c.kind === "phonics"){
    p.innerHTML = '<div class="pane-hd"><span>Шаг 2 · '+esc(c.title)+'</span><span>звуки / phonics</span></div>' +
      '<div class="ink"><div><div class="k">Курс / Course</div><h2>'+esc(c.title)+'</h2>' +
        '<p>Буквы, звуки и первые слова для чтения.</p></div>' +
        '<a class="go" href="phonics.html">'+icon("play",15)+' Открыть</a></div>' +
      rowsHtml([{ t:"Звуки и буквы", d:"тренажёр звуков, карточки и чтение по слогам", href:"phonics.html", act:"Открыть", now:true }]);
    return;
  }

  if (c.kind === "own"){
    p.innerHTML = '<div class="pane-hd"><span>Шаг 2 · Свой учебник</span></div>' +
      '<div class="ink"><div><div class="k">Конструктор / Builder</div><h2>Собери свой учебник</h2>' +
        '<p>Юниты, слова и картинки. Появится в этом же списке рядом с остальными.</p></div>' +
        '<a class="go" href="admin.html">'+icon("play",15)+' Открыть конструктор</a></div>' +
      rowsHtml([
        { t:"Учебники", d:"создать курс, юниты и слова", href:"admin.html", act:"Открыть", now:true },
        { t:"Конструктор заданий", d:"собрать упражнения к уроку", href:"builder.html", act:"Открыть" }
      ]);
    return;
  }

  if (c.kind === "spk"){
    const labels = Array.from({length:SPK_UNITS}, (_,i) => "Unit "+(i+1));
    const w = speakoutWords(c.id, selUnit+1);
    p.innerHTML =
      '<div class="pane-hd"><span>Шаг 2 · '+esc(c.title)+'</span><span>'+c.units+' юнитов</span></div>' +
      '<div class="ink"><div><div class="k">Курс / Course</div><h2>'+esc(c.title)+'</h2>' +
        '<p>Лексика, чанки и грамматика по каждому юниту.</p></div>' +
        '<a class="go" href="'+c.id+'-course.html">'+icon("play",15)+' Открыть курс</a></div>' +
      unitStrip(labels.map((_,i)=>"U"+(i+1)), 0, selUnit) +
      rowsHtml([
        { t:"Лексика и чанки", d:"слова и выражения юнита "+(selUnit+1), href:c.id+"-u"+(selUnit+1)+".html", act:"Учить", now:true },
        { t:"Грамматика", d:"правила и упражнения юнита "+(selUnit+1), href:c.id+"-u"+(selUnit+1)+"-grammar.html", act:"Открыть" },
        { t:"Все чанки курса", d:"выражения из всех юнитов одним списком", href:c.id+"-chunks.html", act:"Открыть" }
      ]) +
      wordsHtml(w, "Слова юнита "+(selUnit+1)+" / Unit words");
    bindUnits();
    return;
  }

  /* детский курс с юнитами */
  const units = c.data;
  const u = units[selUnit] || units[0];
  const learned = learnedIn(units);
  const pct = c.words ? Math.round(learned/c.words*100) : 0;
  const isSM1 = c.id === "sm1";
  p.innerHTML =
    '<div class="pane-hd"><span>Шаг 2 · '+esc(c.title)+'</span><span>'+esc(c.sub)+'</span></div>' +
    '<div class="ink"><div><div class="k">Курс / Course</div><h2>'+esc(c.title)+'</h2>' +
      '<p>Выучено '+learned+' из '+c.words+' слов · '+pct+'%</p></div>' +
      '<a class="go" href="trainer.html">'+icon("play",15)+' Продолжить</a></div>' +
    '<div class="tiles">' +
      '<div class="tile"><span class="k">Юнитов</span><span class="n">'+c.units+'</span></div>' +
      '<div class="tile"><span class="k">Слов в курсе</span><span class="n">'+c.words+'</span></div>' +
      '<div class="tile"><span class="k">Выучено</span><span class="n acc">'+learned+'</span></div>' +
    '</div>' +
    '<div class="sect"><span>Юниты / Units</span><span>нажми — откроется юнит</span></div>' +
    unitStrip(units.map(x => x.title), 0, selUnit) +
    '<div class="sect"><span>Разделы / Sections</span></div>' +
    rowsHtml([
      { t:"Тренажёр слов", d:"карточки и квиз по всем юнитам", href:"trainer.html", act:"Учить", now:true },
      { t:"Игры юнита", d:"колесо, мемори, гонка, молния и другие", href:"games.html?u="+u.id, act:"Играть" },
      { t:"Игротека", d:"анаграммы, поиск слов, «услышь и выбери»", href:"arcade.html", act:"Играть" },
      { t:"Student Book", d:"задания и карточки по юнитам", href: isSM1 ? "studentbook.html" : "units.html", act:"Открыть" },
      { t:"Work Book", d:"печатные листы с грамматикой", href: isSM1 ? "workbook.html" : "units.html", act:"Открыть" }
    ]) +
    wordsHtml(u.words, "Слова юнита «"+u.title+"» / Unit words");
  bindUnits();
}

function bindUnits(){
  document.querySelectorAll(".unit").forEach(b => b.onclick = () => { selUnit = +b.dataset.u; drawPane(); });
}

/* ---------- старт ---------- */
(async function(){
  try { const cid = localStorage.getItem("sm-course");
    const f = CATALOG.filter(c => c.id === cid)[0]; if (f) sel = f; } catch(e){}
  SMUI.mount({ role:"student", active:"courses" });
  try { PROG = (await SM.loadProgress()) || {}; } catch(e){ PROG = {}; }
  drawList(); drawPane();
  try {
    const hw = await SM.myAssignments();
    const spk = await SM.myHW();
    const n = (hw||[]).filter(a=>!a.done).length + (spk||[]).filter(a=>!a.done).length;
    if (n) SMUI.mount({ role:"student", active:"courses", counts:{ homework:n } });
  } catch(e){}
})();
</script>
</body>
</html>
