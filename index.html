<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои курсы · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css">
<link rel="stylesheet" href="sm-ui.css">
<style>
  .crs{display:grid;grid-template-columns:1fr;gap:0}
  a.row.crs-row{text-decoration:none}
  .crs-row .num{font-size:26px}
  .crs-row.assigned{background:var(--color-accent-100);border-left:4px solid var(--color-accent)}
  .tag{display:inline-block;background:var(--color-accent);color:#fff;font-size:11px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;margin-left:8px;vertical-align:middle}
  .altbtns{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px 18px}
  .altbtns a{border:2px solid var(--color-text);padding:9px 14px;font:800 12px "Archivo",sans-serif;
    text-transform:uppercase;letter-spacing:.06em;color:var(--color-text)}
  .altbtns a.acc{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="pane" id="pane"><div class="empty"><div class="p">Загрузка…</div></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="words.js"></script>
<script src="sm-auth.js"></script>
<script src="sm-shell.js"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;
const COURSES = [
  { id:"speakout-b1plus", t:"Speakout B1+", d:"Курс по юнитам · грамматика, лексика, чанки, аудио", emoji:"🗣️",
    hub:"speakout-b1plus-course.html", book:"speakout-book.html?course=speakout-b1plus" },
  { id:"speakout-b1", t:"Speakout B1", d:"Курс по юнитам · грамматика, лексика, чанки", emoji:"💬",
    hub:"speakout-b1-course.html", book:"speakout-book.html?course=speakout-b1" },
  { id:"focus-1", t:"Focus 1", d:"A1–A2 · 8 юнитов · грамматика, лексика, аудио, Workbook", emoji:"🎯",
    hub:"focus-1-course.html", book:null },
  { id:"solutions-el", t:"Solutions Elementary", d:"Elementary · секции A–H · грамматика, лексика, Workbook", emoji:"📗",
    hub:"solutions-el-course.html", book:null },
  { id:"solutions-pi", t:"Solutions Pre-Int", d:"Pre-Intermediate · секции A–H · грамматика, лексика, Workbook", emoji:"📘",
    hub:"solutions-pi-course.html", book:null },
  { id:"gateway-a1p", t:"Gateway A1+", d:"A1+ · 2nd edition · юниты, лексика, грамматика, видео, IELTS", emoji:"🚪",
    hub:"gateway-a1p-course.html", book:null },
  { id:"superminds-1", t:"Super Minds 1", d:"Для детей 6–8 · юниты, слова, игры", emoji:"🧸",
    hub:"units.html", book:null }
];

async function load(){
  const pane = document.getElementById("pane");
  let user = null, assigned = null;
  try { user = await SMUI.user(); } catch(e){}
  if (user) { try { assigned = await SM.myCourse(); } catch(e){} }

  const cur = assigned ? (COURSES.filter(c=>c.id===assigned)[0] || null) : null;
  const ordered = COURSES.slice().sort((a,b)=> (b.id===assigned?1:0) - (a.id===assigned?1:0));

  let html = '<div class="pane-hd"><span>Мои курсы / My courses</span><span>' +
    (user ? esc(user.name) : "войди в меню слева") + '</span></div>';

  if (cur){
    html += '<div class="ink"><div><div class="k">Назначен тебе учителем</div><h2>' + esc(cur.t) + '</h2>' +
      '<p>' + esc(cur.d) + '</p></div><a class="go" href="' + (cur.book || cur.hub) + '">' +
      icon("play",15) + ' Продолжить</a></div>';
    if (cur.book){
      html += '<div class="altbtns"><a class="acc" href="' + cur.book + '">📖 Книга (презентация)</a>' +
        '<a href="' + cur.hub + '">Список юнитов</a>' +
        '<a href="homework.html">Домашка</a></div>';
    }
  } else if (user) {
    html += '<div class="ink"><div><div class="k">Курс</div><h2>Курс ещё не назначен</h2>' +
      '<p>Учитель назначит тебе курс — он появится здесь. Пока можешь открыть любой из списка.</p></div></div>';
  }

  html += '<div class="sect"><span>Все курсы</span><span>' + COURSES.length + '</span></div><div class="crs">' +
    ordered.map(c => {
      const on = (c.id===assigned) ? " assigned" : "";
      return '<a class="row crs-row' + on + '" href="' + (c.book || c.hub) + '">' +
        '<span class="num">' + c.emoji + '</span>' +
        '<span><span class="t">' + esc(c.t) + (c.id===assigned ? '<span class="tag">назначен</span>' : '') + '</span>' +
        '<span class="d">' + esc(c.d) + '</span></span>' +
        '<span class="b sm">Открыть</span></a>';
    }).join("") + '</div>';

  pane.innerHTML = html;
}

SMUI.mount({ role:"student", active:"courses" });
load();
</script>
</body>
</html>
