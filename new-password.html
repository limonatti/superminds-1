<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css?v=6f7808f9">
<link rel="stylesheet" href="sm-ui.css?v=073c02c6">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .box{max-width:430px;width:100%;background:var(--color-surface);
    border:2px solid var(--color-divider);padding:30px 28px}
  .box h1{margin:0 0 6px;font:800 clamp(23px,4vw,30px) "Archivo",sans-serif;letter-spacing:-.02em}
  .box .lead{margin:0 0 20px;font:600 14px "Archivo",sans-serif;color:var(--color-neutral-700);line-height:1.55}
  .box label{display:block;font:800 10px "Archivo",sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:var(--color-neutral-700);margin:14px 0 6px}
  .box input{width:100%;border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);
    padding:13px 14px;font:700 15px "Archivo",sans-serif}
  .box input:focus{outline:none;border-color:var(--color-accent)}
  .box .go{width:100%;margin-top:20px;border:0;background:var(--color-accent);color:#fff;
    padding:15px;font:800 13px "Archivo",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .box .go:disabled{opacity:.55;cursor:default}
  .box .msg{margin-top:14px;font:700 13.5px "Archivo",sans-serif;line-height:1.5;min-height:20px}
  .box .msg.err{color:var(--color-accent)}
  .box .msg.ok{color:#1f7a3d}
  .box .back{display:inline-block;margin-top:16px;font:700 13px "Archivo",sans-serif;
    color:var(--color-accent);text-decoration:underline}
  .box .hint{margin-top:10px;font:600 12.5px "Archivo",sans-serif;color:var(--color-neutral-700)}
</style>
</head>
<body>
<div class="box">
  <h1 id="ttl">Новый пароль</h1>
  <p class="lead" id="lead">Проверяю ссылку из письма…</p>
  <div id="form" style="display:none">
    <label>Новый пароль</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="минимум 6 символов">
    <label>Ещё раз</label>
    <input id="p2" type="password" autocomplete="new-password" placeholder="повтори пароль">
    <button class="go" id="go">Сохранить пароль</button>
    <div class="hint">После сохранения войдёшь автоматически.</div>
  </div>
  <div class="msg" id="msg"></div>
  <a class="back" href="index.html">← На главную</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=f191dd29"></script>
<script>
const $ = id => document.getElementById(id);

function say(text, cls){
  const m = $("msg");
  m.className = "msg" + (cls ? " " + cls : "");
  m.textContent = text;
}

(async function(){
  /* Supabase кладёт токен в адрес страницы и сам поднимает сессию.
     Если ссылка старая или уже использована — сессии не будет. */
  let user = null;
  for (let i = 0; i < 12 && !user; i++){
    try { user = await SM.getUser(); } catch(e){}
    if (!user) await new Promise(r => setTimeout(r, 250));
  }

  if (!user){
    $("ttl").textContent = "Ссылка не сработала";
    $("lead").textContent =
      "Похоже, ссылка устарела или ей уже воспользовались. Такие письма живут около часа. " +
      "Запроси новое письмо: на странице входа нажми «Забыл пароль».";
    say("");
    return;
  }

  $("lead").textContent = "Задай новый пароль для " + (user.email || "своего аккаунта") + ".";
  $("form").style.display = "block";

  $("go").onclick = async () => {
    const a = $("p1").value, b = $("p2").value;
    if (a.length < 6){ say("Пароль должен быть не короче 6 символов.", "err"); return; }
    if (a !== b){ say("Пароли не совпадают — проверь второе поле.", "err"); return; }

    $("go").disabled = true; say("Сохраняю…");
    const r = await SM.setNewPassword(a);
    if (r.ok){
      say("Готово. Пароль изменён, сейчас откроется платформа.", "ok");
      setTimeout(() => { location.href = "index.html"; }, 1400);
    } else {
      $("go").disabled = false;
      say(r.error || "Не получилось сохранить пароль", "err");
    }
  };

  $("p2").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
})();
</script>
</body>
</html>
