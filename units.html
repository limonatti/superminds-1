<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4ece0;font-family:'Nunito',sans-serif;color:#241a18}
  a{color:inherit;text-decoration:none}
  .home{position:fixed;top:12px;left:12px;z-index:9;background:#7c2340;color:#fff;padding:9px 16px;border-radius:999px;font:800 14px 'Nunito',sans-serif;box-shadow:0 4px 0 #e0d5c2}
  .wrap{max-width:820px;margin:0 auto;padding:0 0 56px}
  .head{padding:52px 24px 8px;text-align:center}
  h1{margin:2px 0 0;font-size:clamp(30px,6vw,46px);font-weight:700;color:#7c2340;letter-spacing:-1px}
  .sub{margin:12px 0 0;font:800 15px 'Nunito',sans-serif;color:#5c534d}
  .list{padding:16px 24px 0;display:flex;flex-direction:column;gap:14px}
  .unit{background:#fffdf8;border-radius:22px;box-shadow:0 6px 0 #e0d5c2;padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .unit .ue{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .unit .info{flex:1;min-width:140px}
  .unit .u{font:900 11px 'Nunito',sans-serif;letter-spacing:1px;color:#b5654a}
  .unit .n{font-size:20px;font-weight:600}
  .unit .acts{display:flex;gap:8px;flex-wrap:wrap}
  .act{font:800 13px 'Nunito',sans-serif;padding:9px 14px;border-radius:999px;color:#fff;white-space:nowrap}
  .a-tr{background:#7c2340}.a-gm{background:#7c2340}.a-ws{background:#3f8f5c}.a-ex{background:#b5654a}.a-sp{background:#8e44ad}.a-qs{background:#7c2340}
  .toprow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
  .revlink{display:block;width:max-content;margin:0 auto 18px;background:#fffdf8;border:1px solid #e0d5c2;border-radius:999px;padding:10px 20px;font:800 14px 'Nunito',sans-serif;color:#7c2340;text-decoration:none;box-shadow:0 4px 0 #e0d5c2}
  .foot{text-align:center;font:700 13px 'Nunito',sans-serif;color:#7d726a;margin-top:34px}
</style>
<link rel="stylesheet" href="sm-skin.css?v=1d0ce501">
</head>
<body>
  <a class="home" href="course.html">← Домой</a>
  <div class="wrap">
    <div class="head">
      <h1 id="title">Юниты</h1>
      <div class="sub" id="sub">выбери юнит и занятие</div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">Made for @english.with_asya · англ + рус · для детей 6–8</div>
  </div>

  <script src="words.js?v=6dc57848"></script>
<script src="course-words.js?v=442908de"></script>
<script src="speakout-words.js?v=3094c556"></script>
  <script>
    document.getElementById("title").textContent = SM_COURSE.emoji + " " + SM_COURSE.title;
    /* в вкладке был жёстко зашит Super Minds 1 — какой бы учебник ни открыли */
    document.title = SM_COURSE.title + " — English with Asya";
    document.getElementById("sub").textContent = "Юниты · выбери занятие";
    function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    const list=document.getElementById("list");
    document.getElementById("list").insertAdjacentHTML("beforebegin",'<div class="toprow"><a class="revlink" style="margin:0" href="review.html">🧠 Мои слова</a><a class="revlink" style="margin:0" href="pet.html">🐣 Мой питомец</a><a class="revlink" style="margin:0" href="pronounce.html">🎙 Произношение</a></div>');
    SM_UNITS.forEach(u=>{
      const el=document.createElement("div");el.className="unit";
      el.innerHTML=
        /* обложка юнита вытесняет эмодзи, если учитель её задал */
        '<div class="ue" style="background:'+(u.color||"#ece2d3")+(u.img?';overflow:hidden;padding:0':'')+'">'+
          (u.img?'<img src="'+esc(u.img)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">':u.emoji)+
        '</div>'+
        '<div class="info"><div class="u">'+esc(u.unit)+'</div><div class="n">'+esc(u.title)+'</div></div>'+
        '<div class="acts">'+
          '<a class="act a-tr" href="trainer.html?unit='+u.id+'">🎯 Тренажёр</a>'+
          '<a class="act a-gm" href="games.html?u='+u.id+'">🎮 Игры</a>'+
          '<a class="act a-ws" href="worksheet.html?u='+u.id+'" target="_blank">✏️ Лист</a>'+
          '<a class="act a-ex" href="exercises.html?u='+u.id+'">🧩 Упражнения</a>'+
          '<a class="act a-sp" href="speak.html?u='+u.id+'">🗣 Речь</a>'+
          '<a class="act a-qs" href="quest.html?u='+u.id+'">🗺 Квест</a>'+
        '</div>';
      list.appendChild(el);
    });
  </script>
</body>
</html>
