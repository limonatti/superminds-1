<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway A1+ · Курс · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff6ef;font-family:'Nunito',sans-serif;color:#2a1f14;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 70px}
  .top{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .home{background:#e8581c;color:#fff;font:800 13px 'Nunito',sans-serif;padding:9px 16px;border-radius:999px}
  .home.alt{background:#2e6f4e}
  .head{text-align:center;margin:6px 0 26px}
  h1{margin:0;font-family:'Fredoka',sans-serif;font-size:clamp(28px,6vw,46px);font-weight:700;color:#e8581c;letter-spacing:-1px}
  .sub{font-weight:800;font-size:15px;color:#7a5a44;margin:10px 0 0}
  .lvl{display:inline-block;background:#f5a623;color:#fff;font:900 12px 'Nunito',sans-serif;padding:3px 12px;border-radius:999px;margin-top:10px;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .u{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 0 #f0d9c6;display:block;transition:transform .14s,box-shadow .14s}
  .u.ready:hover{transform:translateY(-6px);box-shadow:0 16px 22px rgba(232,88,28,.18)}
  .u.soon{opacity:.62}
  .u .cover{width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center}
  .u .cover span{font-size:clamp(46px,9vw,64px);filter:drop-shadow(0 5px 8px rgba(0,0,0,.28))}
  .u .b{padding:13px 16px 16px}
  .u .n{font:900 11px 'Nunito',sans-serif;color:#e8581c;letter-spacing:1px}
  .u .t{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:#c34710;margin:2px 0 4px}
  .u .d{font-size:12px;color:#7a5a44;font-weight:700;line-height:1.4;min-height:34px}
  .u .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .u .go{display:inline-block;background:#e8581c;color:#fff;font:800 11px 'Nunito',sans-serif;padding:7px 12px;border-radius:999px}
  .u .go.g2{background:#8a5a2a}
  .u .go.g3{background:#2e6f4e}
  .u .soonbadge{display:inline-block;margin-top:8px;background:#f4e7db;color:#7a5a44;font:800 11px 'Nunito',sans-serif;padding:7px 12px;border-radius:999px}
  .foot{text-align:center;font-weight:700;font-size:13px;color:#7a5a44;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html">🏠 Домой</a>
    <a class="home alt" href="cabinet.html">👤 Кабинет ученика</a>
  </div>
  <div class="head">
    <h1>🚪 Gateway A1+</h1>
    <div class="sub">Курс по юнитам · Vocabulary · Grammar · Reading · Listening · Speaking · Writing · Life skills · видео + IELTS</div>
    <div class="lvl">УРОВЕНЬ A1+ · 2nd EDITION</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">Made for @english.with_asya · авторские материалы по программе Gateway A1+ (2nd ed.)</div>
</div>
<script>
const UNITS=[
 {n:0,t:"Starter unit",e:"🎒",g:["#e8581c","#f5a623"],d:"класс · цвета · числа · дни · время · алфавит",ready:true},
 {n:1,t:"My ID",e:"🪪",g:["#e8581c","#f5a623"],d:"страны · национальности · семья · to be · have got",ready:true},
 {n:2,t:"School days",e:"⏰",g:["#2a6f8f","#3aa0c9"],d:"школьные предметы · this/that · Possessive 's",ready:false},
 {n:3,t:"24/7",e:"📱",g:["#7c4dff","#b39ddb"],d:"Present simple · наречия частоты · свободное время",ready:false},
 {n:4,t:"Home time",e:"🏠",g:["#2e7d32","#66bb6a"],d:"there is/are · some/any · дом и еда",ready:false},
 {n:5,t:"Connected",e:"💻",g:["#00838f","#4dd0e1"],d:"can · imperative · технологии · like + gerund",ready:false},
 {n:6,t:"Good buys",e:"🛍️",g:["#ef6c00","#ffb74d"],d:"Present continuous · магазины · одежда",ready:false},
 {n:7,t:"Teamwork",e:"⚽",g:["#1565c0","#64b5f6"],d:"Past simple (to be, regular/irregular) · спорт",ready:false},
 {n:8,t:"Great job!",e:"💼",g:["#455a64","#90a4ae"],d:"Past simple (вопросы, отрицание) · работа",ready:false},
 {n:9,t:"Mother nature",e:"🌿",g:["#6d4c41","#a1887f"],d:"comparatives · superlatives · Present perfect · природа",ready:false},
 {n:10,t:"Holiday planner",e:"✈️",g:["#0277bd","#4fc3f7"],d:"be going to · must/have to · погода · путешествия",ready:false}
];
const grid=document.getElementById("grid");
UNITS.forEach(u=>{const a=document.createElement("div");a.className="u "+(u.ready?"ready":"soon");
  const label=(u.n===0?"STARTER":"UNIT "+u.n);
  const cover='<div class="cover" style="background:linear-gradient(135deg,'+u.g[0]+','+u.g[1]+')"><span>'+u.e+'</span></div>';
  if(u.ready){
    a.innerHTML='<a href="gateway-a1p-u'+u.n+'.html">'+cover+'</a>'+
      '<div class="b"><div class="n">'+label+'</div><div class="t">'+u.t+'</div><div class="d">'+u.d+'</div>'+
      '<div class="links"><a class="go" href="gateway-a1p-u'+u.n+'.html">Урок →</a>'+
      '<a class="go g2" href="gateway-a1p-u'+u.n+'-grammar.html">Грамматика</a>'+
      '<a class="go g3" href="gateway-a1p-u'+u.n+'-workbook.html">Workbook</a></div></div>';
  } else {
    a.innerHTML=cover+'<div class="b"><div class="n">'+label+'</div><div class="t">'+u.t+'</div><div class="d">'+u.d+'</div>'+
      '<div class="soonbadge">🔨 скоро</div></div>';
  }
  grid.appendChild(a);});
</script>
</body>
</html>
