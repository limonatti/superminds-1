mplate-columns:1fr;padding:22px 14px;gap:0}aside{display:none}.panel{padding:18px}.nav{padding:8px 12px;gap:7px}.nav button{padding:8px 12px}.photo-pair{grid-template-columns:1fr}header{padding:14px 18px}.match-grid button{font-size:15px;padding:10px}.nav select{font-size:14px}}

<script>
'use strict';
const ROOT='speakout-b1plus-active-teach/';
const lex=[['be in a hurry / a rush','торопиться'],['get in the way','мешать, загораживать путь'],['get out of the way','уйти с дороги'],['hear public announcements','слышать объявления'],['ignore public announcements','игнорировать объявления'],['jump a queue','пройти без очереди'],['join a queue','встать в очередь'],['drop litter','бросать мусор'],['throw away litter','выбрасывать мусор'],['behave badly / well','вести себя плохо / хорошо'],['respond / react to a situation','реагировать на ситуацию'],['disagree / argue with someone','не соглашаться / спорить с кем-то']];
const tasks=[
{type:'choice',title:'Ситуации на фото',intro:'Посмотри на настоящие фотографии из 2C. Выбери подходящее описание.',hint:'litter = мусор; behave = вести себя.',qs:[{photo:'litter',q:'What is the person throwing out of the car?',options:['litter','a public announcement','a queue'],answer:0,why:'На фото мусор выбрасывают из машины: throw litter out of car windows.'},{photo:'child',q:'The child is shouting in a public place. Which phrase fits?',options:['join a queue','behave badly','be in a hurry'],answer:1,why:'В статье 1A: children behave really badly in a public place.'}]},
{type:'match',title:'Собери сочетания',intro:'Нажми на начало слева, затем на окончание справа. Можно использовать Tab и Enter.',hint:'Сначала найди jump a queue и drop litter.',pairs:[['be in','a hurry'],['get in','the way'],['hear','public announcements'],['jump','a queue'],['drop','litter'],['argue','with someone']]},
{type:'match',title:'Близкие по смыслу',intro:'Соедини четыре пары из word webs на странице 26.',hint:'rush и hurry означают спешку; react и respond означают реакцию.',pairs:[['be in a hurry','be in a rush'],['react to a situation','respond to a situation'],['drop litter','throw litter on the ground'],['disagree with someone','have a different opinion']]},
{type:'gap',title:'Карточки в пропуски',intro:'Выбери пропуск, затем карточку. Ничего печатать не нужно.',hint:'Смотри на предлог: in a rush, out of the way, with someone, to a situation.',bank:['with','out of','to','in'],qs:[{q:'I’m ___ a rush. My train leaves in two minutes.',answer:'in'},{q:'Please get ___ the way so I can pass.',answer:'out of'},{q:'I sometimes disagree ___ my friends.',answer:'with'},{q:'How do you react ___ a difficult situation?',answer:'to'}]},
{type:'choice',title:'Что не подходит?',intro:'Найди одно неправильное сочетание в каждой группе. Здесь повторяем все восемь word webs из 1B.',hint:'После behave нужно наречие. Listen требует to. С situation в этом упражнении: react/respond.',qs:[
{q:'be in …',options:['a hurry','a problem','a rush'],answer:1,why:'Верно: be in a hurry / be in a rush.'},
{q:'… the way',options:['get in','get out of','give'],answer:2,why:'В 1B: get in the way / get out of the way.'},
{q:'… public announcements',options:['listen','hear','ignore'],answer:0,why:'Верно: hear / ignore public announcements. Listen используется с to.'},
{q:'… a queue',options:['jump','slip','join'],answer:1,why:'Верно: jump a queue / join a queue.'},
{q:'… litter',options:['drop','throw away','lift'],answer:2,why:'Верно: drop litter / throw away litter.'},
{q:'behave …',options:['badly','rude','well'],answer:1,why:'Верно: behave badly / well. Rude — прилагательное; наречие — rudely.'},
{q:'… to a situation',options:['respond','react','reply'],answer:2,why:'Пары из 1B: respond / react to a situation.'},
{q:'… with someone',options:['annoy','disagree','argue'],answer:0,why:'Верно: disagree / argue with someone. Annoy someone используется без with.'}]},
{type:'build',title:'Собери фразы',intro:'Нажимай на слова по порядку. Нажми на уже выбранное слово, чтобы вернуть его.',hint:'Начни с People / Please / I. Предлог идёт перед существительным.',qs:[{words:['queue.','the','jump','People'],answer:['People','jump','the','queue.']},{words:['way.','the','of','get','Please','out'],answer:['Please','get','out','of','the','way.']},{words:['a','in','rush.','am','I'],answer:['I','am','in','a','rush.']}]},
{type:'sort',title:'Сортировка поведения',intro:'Это ситуации из общественного места. Отметь: действие мешает окружающим или помогает им.',hint:'Пройти без очереди и загораживать путь мешает; уступить дорогу и спокойно встать в очередь помогает.',qs:[{q:'Jump a queue ahead of people who are waiting.',answer:0},{q:'Join a queue and wait for your turn.',answer:1},{q:'Drop litter on the pavement.',answer:0},{q:'Get out of the way to let someone pass.',answer:1},{q:'Argue loudly with someone on your phone.',answer:0},{q:'Behave well in a public place.',answer:1}]},
{type:'listen',title:'Слушаем 2.07',intro:'Послушай оригинальный разговор. Отметь ВСЕ ситуации, которые испортили поездку. Можно повторять и открывать текст.',hint:'В разговоре четыре жалобы: очередь, еда рядом, громкое видео и открытые окна.',audio:'2-07',track:'2.07',options:['People jumped the queue.','Someone ate a burger next to the speaker.','Teenagers watched a football match loudly.','Someone opened the windows without asking.','Children dropped litter in a shop.'],answer:[0,1,2,3]},
{type:'gap',title:'Реакции из 2.08',intro:'Послушай пять коротких фрагментов. Заполни фразы карточками.',hint:'can’t stand = не выносить; get on my nerves = действовать на нервы; annoy / bug = раздражать.',audio:'2-08',track:'2.08',bank:['bugs','annoys','stand','nerves','when'],qs:[{q:'I can’t ___ it.',answer:'stand'},{q:'I hate it ___ that happens.',answer:'when'},{q:'It really got on my ___.',answer:'nerves'},{q:'It really ___ me when they do that.',answer:'annoys'},{q:'That sort of behaviour really ___ me.',answer:'bugs'}]},
{type:'personal',title:'Теперь о тебе',intro:'Выбери своё мнение и расскажи Асе. Здесь нет правильных и неправильных ответов.',hint:'I hate it when people … / That doesn’t bother me. / I don’t mind that.',qs:[{photo:'litter',q:'People throw litter out of car windows.'},{photo:'child',q:'Children behave badly on public transport.'},{q:'People jump the queue when you are in a hurry.'}]}
];
const transcript07=`A: Sorry I’m late. I had a really bad journey.
B: Why? Were there a lot of people on the train?
A: No, not many, but it’s just the way some people behave. I can’t stand it.
B: Why, what happened?
A: Everything. First I had to queue to buy a ticket because the ticket machines were broken.
B: I hate it when that happens.
A: And of course people were jumping the queue, saying they were in a hurry and could they please go in front of me.
B: Maybe they were in a hurry.
A: Right. Like I wasn’t?
B: All right.
A: Then I got on the train, sat down – there were lots of empty seats – and this guy sat down next to me, took out a burger and started to eat it.
B: Yuk! People are always doing that on trains! I expect it smelled bad.
A: Yeah, the smell was terrible! It really got on my nerves. I kept looking at him, you know like this, but he didn’t react. So annoying.
B: Sometimes it’s better if you don’t react.
A: You mean do nothing? Maybe. Anyway, after two stops he got off … but then three teenagers got on and they were watching a football match. Really loud.
B: You really did have a bad time.
A: And then one of them opened some windows and it was like a tornado. It blew my hair all over the place.
B: I know what you mean, without asking anyone?
A: Yeah, it really annoys me when they do that.
B: You’re always getting so upset about things. And you’re here now.
A: But that sort of behaviour really bugs me. And I’m not finished.
B: There’s more?
A: I was so annoyed that I didn’t pay attention to where we were, and I missed my stop.
B: It really doesn’t matter. Look, let’s get something to eat.
A: OK, sorry …`;
const transcript08=`1. B: Were there a lot of people on the train?
A: No, not many, but it’s just the way some people behave. I can’t stand it.
2. A: First I had to queue to buy a ticket because the ticket machines were broken.
B: I hate it when that happens.
3. B: People are always doing that on trains! I expect it smelled bad.
A: Yeah, the smell was terrible! It really got on my nerves.
4. B: I know what you mean, without asking anyone?
A: Yeah, it really annoys me when they do that.
5. B: You’re always getting so upset about things. And you’re here now.
A: But that sort of behaviour really bugs me.`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={};try{saved=JSON.parse(localStorage.getItem('asya-2c-v1')||'{}')}catch(e){}
let idx=Math.max(0,Math.min(9,Number(saved.idx)||0)),states=saved.states||{},chosen=null,slot=0;
function state(){return states[idx]||(states[idx]={answers:{},done:false,build:{},pairs:{}})}
function save(){try{localStorage.setItem('asya-2c-v1',JSON.stringify({idx,states}))}catch(e){}}
function photo(kind){return `<div role="img" aria-label="${kind==='child'?'A child shouting on a plane':'Someone throws a cup and bags out of a car window'}" class="scene ${kind==='child'?'child':''}"></div>`}
function options(q,i,arr){const s=state();return `<div class="choices">${arr.map((o,n)=>`<button data-choice="${i}" data-value="${n}" aria-pressed="${s.answers[i]===n}">${esc(o)}</button>`).join('')}</div>`}
function audio(t){return `<section data-audio="${t.track}" aria-label="Оригинальная запись ${t.track}"><strong>Оригинальная запись ${t.track} · Pearson</strong><audio controls preload="metadata" src="${ROOT}media/so3-b1-sb-2c-audio-${t.audio}.mp3"></audio><button id="repeat">↺ С начала</button><p id="audio-status" class="caption" role="status">Без автозапуска. Нажми Play, когда будешь готова.</p><details><summary>Расшифровка ${t.track}</summary><div class="transcript" lang="en">${esc(t.track==='2.07'?transcript07:transcript08)}</div></details></section>`}
function render(focus=false){let t=tasks[idx],s=state();const oldAudio=document.querySelector('[data-audio]');const keepAudio=oldAudio&&oldAudio.dataset.audio===t.track?oldAudio:null;chosen=null;slot=0;$('#prev').disabled=idx===0;$('#next').disabled=idx===9;$('#jump').innerHTML=tasks.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>${i+1} / 10 · ${esc(x.title)}${states[i]?.done?' ✓':''}</option>`).join('');$('#sections').innerHTML=tasks.map((x,i)=>`<button data-go="${i}" class="${i===idx?'active':''}" ${i===idx?'aria-current="step"':''}>${String(i+1).padStart(2,'0')} · ${esc(x.title)}${states[i]?.done?' ✓':''}</button>`).join('');$('#progress').textContent=`Завершено: ${Object.values(states).filter(x=>x.done).length} из 10 · в своём темпе`;
let body='';if(t.audio)body+=audio(t);
if(t.type==='match'){const order=t.pairs.map((_,i)=>(i+2)%t.pairs.length);body+=`<div class="match-grid"><div>${t.pairs.map((p,i)=>`<button data-left="${i}" ${s.pairs[i]!==undefined?'disabled class="matched"':''}>${esc(p[0])}${s.pairs[i]!==undefined?' ✓':''}</button>`).join('')}</div><div>${order.map(i=>`<button data-right="${i}" ${Object.values(s.pairs).includes(i)?'disabled class="matched"':''}>${esc(t.pairs[i][1])}</button>`).join('')}</div></div>`}
else if(t.type==='build'){body+=t.qs.map((q,i)=>{let seq=s.build[i]||[];return `<div class="question"><h3>Фраза ${i+1}</h3><div class="assembly" aria-label="Собранная фраза">${seq.map((n,j)=>`<button data-remove="${i}" data-pos="${j}">${esc(q.words[n])}</button>`).join('')}</div><div class="bank">${q.words.map((w,n)=>`<button data-word="${i}" data-value="${n}" ${seq.includes(n)?'disabled':''}>${esc(w)}</button>`).join('')}</div></div>`}).join('')}
else if(t.type==='gap'){body+=`<div class="bank" aria-label="Карточки слов">${t.bank.map(w=>`<button data-fill="${esc(w)}">${esc(w)}</button>`).join('')}</div>`+t.qs.map((q,i)=>`<div class="question" lang="en">${i+1}. ${esc(q.q).replace('___',`<button class="slot ${i===slot?'current':''}" data-slot="${i}" aria-label="Пропуск ${i+1}">${esc(s.answers[i]||'…')}</button>`)}</div>`).join('')}
else if(t.type==='listen'){body+=`<div class="choices">${t.options.map((o,i)=>`<button data-multi="${i}" aria-pressed="${!!s.answers[i]}">${s.answers[i]?'✓ ':''}${esc(o)}</button>`).join('')}</div>`}
else{body+=t.qs.map((q,i)=>`<div class="question">${q.photo?photo(q.photo):''}<h3 lang="en">${i+1}. ${esc(q.q)}</h3>${options(q,i,t.type==='sort'?['Мешает окружающим','Помогает окружающим']:t.type==='personal'?['That annoys me.','I don’t mind that.','It depends.']:q.options)}</div>`).join('');if(t.type==='personal')body+=`<label for="note">Твой пример (необязательно; можно сказать вслух)</label><textarea id="note" placeholder="I hate it when people …">${esc(s.note||'')}</textarea><p class="caption">Ответы остаются в этом браузере. Расскажи их Асе на уроке.</p>`}
$('#main').innerHTML=`<div class="eyebrow">Задание ${idx+1} из 10</div><h1>${esc(t.title)}</h1><p class="intro">${esc(t.intro)}</p><div class="panel">${body}<details><summary>Подсказка</summary><p>${esc(t.hint)}</p></details><div class="actions"><button class="primary" id="check">${t.type==='personal'?'Я рассказала об этом':t.type==='match'?'Проверить пары':'Проверить'}</button><button id="reset">Заново это задание</button></div><div id="feedback" class="feedback ${s.done?'good':''}" role="status" aria-live="polite">${s.done?(t.type==='personal'?'Твоё мнение сохранено. Спасибо, что поделилась!':'Задание выполнено. Можно повторить или идти дальше.'):''}</div></div>${Object.values(states).filter(x=>x.done).length===10?'<div class="done-banner">Все 10 заданий пройдены. Теперь попробуй использовать эти фразы в разговоре с Асей!</div>':''}<details class="source"><summary>Слова и источник</summary><p>Speakout B1+ Third Edition, Unit 2C “That’s annoying!”, Student’s Book pp. 26–27: Vocabulary 1A–1C; оригинальные записи 2.07 и 2.08, расшифровки p. 159. Новые задания для повторения по материалу урока.</p>${lex.map(p=>`<p><b>${esc(p[0])}</b> · ${esc(p[1])}</p>`).join('')}<a href="${ROOT}index.html">Открыть учебник</a></details>`;
if(keepAudio){document.querySelector('[data-audio]').replaceWith(keepAudio)}const a=$('audio');if(a){a.addEventListener('error',()=>{$('#audio-status').textContent='Аудио не загрузилось. Открой расшифровку и продолжай; попробуй загрузить запись снова.'});$('#repeat').onclick=()=>{a.pause();a.currentTime=0;$('#audio-status').textContent='Запись возвращена к началу. Нажми Play для повтора.'}}
$('#check').onclick=check;$('#reset').onclick=()=>{states[idx]={answers:{},done:false,build:{},pairs:{}};save();render()};if($('#note'))$('#note').oninput=e=>{s.note=e.target.value;save()};save();if(focus){$('#main').focus();window.scrollTo(0,0)}}
function feedback(text,good=false){$('#feedback').textContent=text;$('#feedback').classList.toggle('good',good)}
function check(){const t=tasks[idx],s=state();let correct=0,total=0,notes=[];
if(t.type==='personal'){if(Object.keys(s.answers).length<t.qs.length){feedback('Выбери своё мнение для каждой ситуации. Любой вариант подходит.');return}s.done=true;save();render();return}
if(t.type==='match'){total=t.pairs.length;correct=Object.keys(s.pairs).length}
else if(t.type==='listen'){total=t.options.length;correct=t.options.filter((_,i)=>!!s.answers[i]===t.answer.includes(i)).length;if(correct!==total)notes=['Послушай ещё раз: один вариант не звучит в записи.']}
else{total=t.qs.length;t.qs.forEach((q,i)=>{let ok=t.type==='build'?(s.build[i]||[]).map(n=>q.words[n]).join(' ')===q.answer.join(' '):s.answers[i]===q.answer;if(ok)correct++;else notes.push(`${i+1}: ${q.why||'Посмотри подсказку и попробуй ещё раз.'}`)})}
if(correct===total){s.done=true;save();render();feedback('Получилось! Всё верно. Переходи дальше или повтори ещё раз.',true)}else{feedback(`Уже верно: ${correct} из ${total}. Можно спокойно попробовать ещё. ${notes.join(' ')}`)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let s=state(),t=tasks[idx];if(b.dataset.go!==undefined){go(+b.dataset.go);return}if(b.dataset.choice!==undefined){s.done=false;s.answers[b.dataset.choice]=+b.dataset.value;save();const group=b.parentElement;group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));feedback('Выбор сохранён. Нажми «Проверить», когда закончишь.');return}if(b.dataset.left!==undefined){chosen=+b.dataset.left;document.querySelectorAll('[data-left]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}if(b.dataset.right!==undefined){if(chosen===null){feedback('Сначала выбери начало слева.');return}if(chosen===+b.dataset.right){s.pairs[chosen]=+b.dataset.right;save();render();feedback('Да, это подходящая пара!',true)}else feedback('Пока не эта пара. Попробуй другое окончание.');return}if(b.dataset.slot!==undefined){slot=+b.dataset.slot;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('current',+x.dataset.slot===slot));return}if(b.dataset.fill!==undefined){s.done=false;s.answers[slot]=b.dataset.fill;let next=(slot+1)%t.qs.length;save();render();slot=next;document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('current',+x.dataset.slot===slot));return}if(b.dataset.word!==undefined){s.done=false;let i=b.dataset.word;(s.build[i]||(s.build[i]=[])).push(+b.dataset.value);save();render();return}if(b.dataset.remove!==undefined){s.done=false;s.build[b.dataset.remove].splice(+b.dataset.pos,1);save();render();return}if(b.dataset.multi!==undefined){s.done=false;let i=b.dataset.multi;s.answers[i]=!s.answers[i];save();b.setAttribute('aria-pressed',s.answers[i]);b.textContent=(s.answers[i]?'✓ ':'')+t.options[i];return}});
