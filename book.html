<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учебник · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css?v=6f7808f9">
<link rel="stylesheet" href="sm-ui.css?v=073c02c6">
<style>
  /* ---------- панель книги ---------- */
  .bbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:12px 20px;background:var(--color-bg);border-bottom:2px solid var(--color-divider)}
  .bbar select{border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);
    border-radius:0;padding:9px 10px;font:700 12px "Archivo",sans-serif;max-width:230px}
  .bbar .t{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600)}
  .tool{border:2px solid var(--color-text);background:none;color:var(--color-text);border-radius:0;
    padding:9px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:7px}
  .tool:hover{background:var(--color-text);color:var(--color-bg)}
  .tool.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .tool.teach{border-color:var(--color-accent);color:var(--color-accent)}
  .tool.teach:hover,.tool.teach.on{background:var(--color-accent);color:#fff}
  .grow{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* ---------- цвет разворота ----------
     У каждого типа страницы свой оттенок — курс перестаёт быть одноцветным,
     и ученик по цвету понимает, где он: слушает, читает или выводит правило. */
  .book{--k:var(--color-accent);--k-soft:var(--color-accent-100)}
  .book[data-kind="cover"]    {--k:#ec3013;--k-soft:#fff2ef}
  .book[data-kind="words"]    {--k:#0e8f8f;--k-soft:#e6f6f6}
  .book[data-kind="listening"]{--k:#2563c9;--k-soft:#e8f0fc}
  .book[data-kind="podcast"]  {--k:#7b3fc4;--k-soft:#f2ebfb}
  .book[data-kind="reading"]  {--k:#c47a0a;--k-soft:#fdf3e2}
  .book[data-kind="pron"]     {--k:#0e8f8f;--k-soft:#e6f6f6}
  .book[data-kind="chunks"]   {--k:#0e8f8f;--k-soft:#e6f6f6}
  .book[data-kind="discovery"]{--k:#ec3013;--k-soft:#fff2ef}
  .book[data-kind="grammar"]  {--k:#201e1d;--k-soft:#eae9e9}
  .book[data-kind="gramprac"] {--k:#3f8f2f;--k-soft:#edf7ea}
  .book[data-kind="mc"],.book[data-kind="gap"],.book[data-kind="workbook"]{--k:#3f8f2f;--k-soft:#edf7ea}
  .book[data-kind="howto"]    {--k:#c47a0a;--k-soft:#fdf3e2}
  .book[data-kind="speaking"] {--k:#7b3fc4;--k-soft:#f2ebfb}
  .book[data-kind^="hw"]      {--k:#ec3013;--k-soft:#fff2ef}

  .kicker,.hwbadge{color:var(--k)}

  /* ---- цветная шапка разворота: как заголовок главы в бумажном учебнике ---- */
  .hdr{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
       background:var(--k-soft);border-left:10px solid var(--k);padding:14px 18px;margin:0 0 22px}
  .hdr::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.09;
       background:repeating-linear-gradient(135deg,var(--k) 0 2px,transparent 2px 11px)}
  .hdr .num{position:relative;z-index:1;font-size:32px;font-weight:900;line-height:1;
       color:var(--k);letter-spacing:-.05em;flex:none;font-variant-numeric:tabular-nums}
  .hdr .kicker{position:relative;z-index:1;margin:0}
  .hdr .chip{position:relative;z-index:1;margin-left:auto;background:var(--k);color:#fff;
       font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 11px}
  .book h1,.book h2{margin-top:0}
  .book h1{color:var(--color-text)}
  /* обложка юнита — во всю ширину, крупно */
  .book[data-kind="cover"] .hdr{border-left-width:14px;padding:20px 22px}
  .book[data-kind="cover"] .hdr .num{font-size:44px}
  .hwbadge{background:var(--k);color:#fff}
  .blk .h,.ex-src{color:var(--k)}
  .task::before,.wtask .n,.hwlist .it span:first-child,.q .num{color:var(--k)}
  .exline .who{color:var(--k)}
  .exline b{background:var(--k-soft);box-shadow:0 0 0 3px var(--k-soft)}
  .rule .h{color:var(--k)}
  .prose .g-ex{border-left-color:var(--k);background:var(--k-soft)}
  .key{border-left-color:var(--k)}
  .art{border-color:var(--k)}
  /* цветная лента сверху страницы */
  .ribbon{position:fixed;left:0;right:0;top:0;height:5px;background:var(--k);z-index:22;
    transition:background .35s ease-out}

  /* ---------- листание, как в презентации ---------- */
  @keyframes pgInR{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
  @keyframes pgInL{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
  @keyframes pgOutL{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-46px)}}
  @keyframes pgOutR{from{opacity:1;transform:none}to{opacity:0;transform:translateX(46px)}}
  .book.enter-r{animation:pgInR .34s cubic-bezier(.22,1,.36,1)}
  .book.enter-l{animation:pgInL .34s cubic-bezier(.22,1,.36,1)}
  .book.leave-l{animation:pgOutL .2s ease-in forwards}
  .book.leave-r{animation:pgOutR .2s ease-in forwards}

  /* содержимое проявляется по очереди */
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .book.enter-r > *,.book.enter-l > *{animation:rise .42s cubic-bezier(.22,1,.36,1) backwards;
    animation-delay:calc(var(--i,0) * 55ms)}

  /* живые реакции */
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opt.ok{animation:pop .34s ease-out}
  .opt.no{animation:shakeX .3s ease-out}
  .gapin.ok{animation:pop .34s ease-out}
  .gapin.no{animation:shakeX .3s ease-out}
  .why.on{animation:rise .3s ease-out}
  .rule.on{animation:rise .45s cubic-bezier(.22,1,.36,1)}
  .card2{transition:transform .16s ease-out,background .16s ease-out}
  .card2:hover{transform:translateY(-2px)}
  .opt{transition:transform .12s ease-out,background .16s ease-out}
  .opt:active{transform:scale(.985)}
  .tool{transition:background .16s ease-out,color .16s ease-out,transform .1s ease-out}
  .tool:active{transform:scale(.96)}

  @media (prefers-reduced-motion: reduce){
    .book,.book>*,.opt,.gapin,.why,.rule{animation:none !important}
  }

  /* ---------- разворот ---------- */
  .book{position:relative;width:100%;max-width:900px;margin:0 auto;align-self:center;padding:30px 28px 120px}
  .kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--color-accent)}
  .book h1{margin:10px 0 0;font-size:44px;font-weight:800;line-height:1.03;letter-spacing:-.02em}
  .book h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
  .lead{font-size:17px;font-weight:500;color:var(--color-neutral-700);line-height:1.5;margin-top:12px}
  .blk{margin-top:28px;border-top:2px solid var(--color-divider);padding-top:20px}
  .blk .h{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--color-neutral-600);margin-bottom:14px}

  .prose{font-size:17px;line-height:1.65}
  .prose p{margin:0 0 14px}
  .prose table{width:100%;border-collapse:collapse;margin:8px 0 16px}
  .prose th{text-align:left;background:var(--color-surface);font-size:11px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--color-divider)}
  .prose td{padding:10px 12px;border:2px solid var(--color-divider);font-size:15px}
  .prose .g-ex{padding:12px 14px;border-left:6px solid var(--color-accent);background:var(--color-accent-100);margin:0 0 10px}
  .prose .ru{color:var(--color-neutral-700);font-weight:600}

  /* слова и чанки */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0;
    border-top:2px solid var(--color-divider);border-left:2px solid var(--color-divider)}
  .card2{padding:14px 16px;border-right:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);
    display:flex;align-items:flex-start;gap:10px;background:var(--color-bg)}
  .card2:hover{background:var(--color-accent-100)}
  .card2 .en{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .card2 .ru{font-size:13px;font-weight:600;color:var(--color-neutral-700);margin-top:3px}
  .card2 .say{margin-left:auto;border:0;background:none;color:var(--color-neutral-600);padding:2px}
  .card2 .say:hover{color:var(--color-accent)}
  .card2 .pic{width:56px;height:56px;object-fit:cover;flex:none;background:var(--color-neutral-200);
    border:2px solid var(--color-divider)}
  .card2 .say.human{color:var(--color-accent)}
  .card2 .pic,.art{opacity:0;transition:opacity .3s ease-out}
  .card2 .pic.ready,.art.ready{opacity:1}

  /* иллюстрации разворота */
  .art{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--color-neutral-200);
    border:2px solid var(--color-divider);margin-bottom:20px}
  .art.sq{aspect-ratio:4/3}
  .artcap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--color-neutral-500);margin:-14px 0 20px}

  /* диалог */
  .dlg{border-top:2px solid var(--color-divider)}
  .line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:start;
    padding:14px 12px;border-bottom:2px solid var(--color-divider)}
  .line .who{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:3px}
  .line.f .who{color:var(--color-accent)}
  .line .tx{font-size:17px;line-height:1.5}
  .line .say{border:0;background:none;color:var(--color-neutral-500);padding:2px}
  .line .say:hover{color:var(--color-accent)}
  .line.now{background:var(--color-accent-100)}
  .line.hid .tx{filter:blur(5px);user-select:none}

  /* выведи правило сам */
  .ex-src{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--color-neutral-600);margin-bottom:14px}
  .exline{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:baseline;
    padding:13px 0;border-bottom:2px solid var(--color-divider);font-size:17px;line-height:1.5}
  .exline .who{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent)}
  .exline b{background:var(--color-accent-100);box-shadow:0 0 0 3px var(--color-accent-100);font-weight:800}
  .why{display:none;margin-top:10px;padding:11px 14px;background:var(--color-surface);
    border-left:6px solid var(--color-neutral-500);font-size:14px;font-weight:600;line-height:1.45}
  .why.on{display:block}
  .rule{display:none;margin-top:26px;padding:22px 24px;background:var(--color-text);color:#fff}
  .rule.on{display:block}
  .rule .h{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--color-accent-300);margin-bottom:10px}
  .rule .t{font-size:18px;line-height:1.5;font-weight:600}
  .ruleWait{margin-top:22px;font-size:13px;font-weight:700;color:var(--color-neutral-600)}

  /* домашка */
  .hwbadge{display:inline-block;background:var(--color-accent);color:#fff;padding:6px 12px;
    font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .hwlist{border-top:2px solid var(--color-divider)}
  .hwlist .it{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;align-items:baseline;
    padding:15px 0;border-bottom:2px solid var(--color-divider);font-size:17px;font-weight:700}
  .hwlist .it span:first-child{font-size:20px;font-weight:800;color:var(--color-accent)}
  .wtask{border-top:2px solid var(--color-divider);padding:20px 0}
  .wtask .n{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500)}
  .wtask .t{font-size:17px;line-height:1.5;font-weight:600;margin:6px 0 12px}
  .wtask textarea{width:100%;min-height:130px;border:2px solid var(--color-text);background:var(--color-bg);
    color:var(--color-text);padding:13px 14px;font:600 16px "Archivo",sans-serif;resize:vertical}
  .wtask textarea:focus{outline:none;border-color:var(--color-accent)}
  .wtask .sent{font-size:13px;font-weight:700;color:#4a8b34;margin-top:8px}

  /* упражнения */
  .q{border-top:2px solid var(--color-divider);padding:18px 0}
  .q .num{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-500)}
  .q .txt{font-size:18px;font-weight:600;line-height:1.45;margin:6px 0 14px}
  .opts{display:grid;gap:8px}
  .opt{border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);border-radius:0;
    padding:13px 16px;font:600 16px "Archivo",sans-serif;text-align:left;display:flex;align-items:center;gap:12px}
  .opt:hover{background:var(--color-accent-100)}
  .opt b{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--color-neutral-600);flex:none}
  .opt.ok{background:#4a8b34;border-color:#4a8b34;color:#fff}
  .opt.ok b{color:rgba(255,255,255,.75)}
  .opt.no{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
  .opt.no b{color:rgba(255,255,255,.75)}
  .opt[disabled]{cursor:default}
  .key{display:none;margin-top:10px;padding:10px 14px;background:var(--color-surface);
    border-left:6px solid var(--color-accent);font-size:14px;font-weight:700}
  body.keys .key{display:block}

  .gapin{border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);
    padding:12px 14px;font:600 17px "Archivo",sans-serif;width:min(340px,100%)}
  .gapin:focus{outline:none;border-color:var(--color-accent)}
  .gapin.ok{border-color:#4a8b34;background:#f0f7ee}
  .gapin.no{border-color:var(--color-accent);background:var(--color-accent-100)}
  .grow2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .tasks{counter-reset:t}
  .task{border-top:2px solid var(--color-divider);padding:16px 0 16px 44px;position:relative;font-size:17px;line-height:1.5}
  .task::before{counter-increment:t;content:counter(t);position:absolute;left:0;top:16px;
    font-size:20px;font-weight:800;color:var(--color-accent)}

  /* видео */
  .vid{border:2px solid var(--color-divider);background:var(--color-surface);padding:16px}
  .vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
  .vid input{width:100%;border:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);
    padding:11px 12px;font:600 14px "Archivo",sans-serif}

  /* заметки, шторка */
  .notes{position:fixed;right:0;top:0;bottom:0;width:320px;z-index:40;background:var(--color-text);color:#fff;
    padding:20px;display:none;flex-direction:column;gap:12px}
  .notes.on{display:flex}
  .notes textarea{flex:1;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);color:#fff;
    padding:12px;font:600 14px "Archivo",sans-serif;resize:none}
  .notes textarea:focus{outline:none;border-color:var(--color-accent)}
  .curtain{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--color-accent);display:none;
    align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;cursor:ns-resize;user-select:none}
  .curtain.on{display:flex}

  /* нижняя навигация */
  .pager{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:12px;
    padding:12px 20px;background:var(--color-bg);border-top:2px solid var(--color-divider)}
  .pager .mid{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:700;
    color:var(--color-neutral-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbar{position:fixed;left:0;right:0;bottom:57px;height:4px;background:var(--color-neutral-300);z-index:26}
  .pbar i{display:block;height:100%;background:var(--color-accent);transition:width .2s ease-out}

  /* ---- лента разворотов: видно, где ты в юните, и цвет каждого шага ---- */
  .rail{position:fixed;left:0;right:0;bottom:61px;z-index:24;display:flex;gap:2px;
        align-items:flex-end;padding:0 14px 4px;background:var(--color-bg);
        border-bottom:2px solid var(--color-divider)}
  .rail i{flex:1 1 0;min-width:3px;height:5px;background:var(--color-neutral-300);
          cursor:pointer;transition:height .16s ease-out,opacity .16s ease-out;opacity:.55}
  .rail i:hover{height:12px;opacity:1}
  .rail i.done{opacity:.85}
  .rail i.on{height:14px;opacity:1}
  @media(max-width:900px){.rail{display:none}}
  @media(max-width:640px){.rail{display:none}}

  @media(max-width:820px){
    .book{padding:22px 18px 130px}
    .book h1{font-size:32px}
    .line{grid-template-columns:70px minmax(0,1fr) auto;gap:10px}
    .notes{width:100%}
    .pager{left:64px}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="bbar" id="bbar" style="display:none">
      <a class="tool" href="index.html">← Курс</a>
      <select id="uSel" title="Юнит"></select>
      <select id="sSel" title="Разворот"></select>
      <span class="grow" id="tools"></span>
    </div>
    <div class="book" id="book"></div>
  </div>
</div>

<div class="ribbon" id="ribbon" style="display:none"></div>
<div class="pbar" id="pbarWrap" style="display:none"><i id="pbar"></i></div>
<div class="rail" id="rail" style="display:none"></div>
<div class="pager" id="pager" style="display:none">
  <button class="tool" id="prev">← Назад</button>
  <span class="mid" id="pmid"></span>
  <button class="tool" id="next" style="border-color:var(--color-accent);background:var(--color-accent);color:#fff">Вперёд →</button>
</div>
<div class="curtain" id="curtain" style="height:0">Шторка · тяни вверх</div>
<div class="notes" id="notes">
  <div style="font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6">Заметки к развороту</div>
  <textarea id="ntArea" placeholder="Что разобрать, на чём споткнулись, что задать…"></textarea>
  <button class="tool" id="ntSave" style="border-color:#fff;color:#fff">Сохранить</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=3b456779"></script>
<script src="sm-shell.js?v=4b1f197b"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;
const q = new URLSearchParams(location.search);
const COURSE = q.get("c") || "speakout-b1";

const SB_URL = "https://kdzpmbuohfjbtjpqrdfx.supabase.co";
const SB_KEY = "sb_publishable_K8vhCVG_jiEyHYQOgp3XWQ_bWobdeBG";
let sb = null;
try { sb = window.supabase.createClient(SB_URL, SB_KEY); } catch (e) {}

let BOOK = null, ui = 0, si = 0, isTeacher = false, ME = null;
let answered = {};           /* ключ разворота -> сохранённые ответы */
let started = Date.now();

/* ================= голоса для диалогов ================= */
const V = { m: null, f: null, ready: false };

/* Системные «шуточные» голоса — Grandma, Rocko, Zarvox и прочие: звучат ужасно,
   но браузер отдаёт их наравне с нормальными. Отсекаем жёстко. */
const BAD_VOICE = /eddy|flo|grandma|grandpa|rocko|sandy|shelley|bubbles|bells|boing|jester|organ|trinoids|whisper|wobble|zarvox|bahh|albert|junior|ralph|superstar|good news|bad news|cellos|deranged|hysterical|novelty|reed|kathy|princess|bruce|agnes|vicki|fred/i;
const GOOD_VOICE = /google|natural|neural|premium|enhanced|siri/i;
const FEM_VOICE  = /female|женск|serena|sonia|kate|libby|hazel|karen|samantha|victoria|susan|ava|emma|joanna|salli|stephanie|allison|michelle|clara|martha|tessa|moira|fiona|nicky|catherine|amy/i;
const MAL_VOICE  = /\bmale|мужск|daniel|дэниэл|arthur|oliver|george|james|thomas|brian|ryan|guy|alex|william|aaron|nathan|evan|\btom\b|matthew|christopher|eric|roger|rishi|callum/i;

function voiceScore(v, want){
  const name = (v.name || "");
  const lang = (v.lang || "").replace("_", "-");
  if (!/^en/i.test(lang)) return -999;
  let s = 0;
  if (/^en-GB/i.test(lang)) s += 40; else s += 8;      /* нужен британский */
  if (GOOD_VOICE.test(name)) s += 35;                   /* живые сетевые голоса */
  if (BAD_VOICE.test(name)) s -= 200;                   /* шуточные — вон */
  const fem = FEM_VOICE.test(name);
  const mal = MAL_VOICE.test(name.replace(/female|женск/gi, ""));
  if (want === "f"){ if (fem) s += 30; if (mal && !fem) s -= 40; }
  else { if (mal) s += 30; if (fem && !mal) s -= 40; }
  return s;
}
function bestVoice(all, want, exclude){
  let best = null, bs = -1000;
  all.forEach(v => {
    if (v === exclude) return;
    const s = voiceScore(v, want);
    if (s > bs){ bs = s; best = v; }
  });
  return bs > -100 ? best : null;
}
function pickVoices(){
  const all = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  if (!all.length) return;
  V.f = bestVoice(all, "f", null);
  V.m = bestVoice(all, "m", V.f) || V.f;
  V.ready = true;
}
if (window.speechSynthesis){ pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }

/* ================= ЖИВОЙ ГОЛОС (Kokoro) =================
   Открытая модель на 82 млн параметров, лицензия Apache-2.0. Работает прямо
   в браузере ученицы: ни ключей, ни аккаунтов, ни лимитов, ни оплаты.
   Первый запуск скачивает около 90 МБ — дальше браузер держит их у себя.
   Если модель не поднялась (старый браузер, нет сети) — молча падаем
   на системный синтез, тот самый, что был раньше. */
const LIVE = {
  on: localStorage.getItem("liveVoice") !== "off",
  tts: null, loading: null, failed: false,
  audio: null, baked: null, podcastVoice: "f",
  f: "bf_emma",    /* британские голоса под курс */
  m: "bm_george",
  mem: new Map()   /* короткий кэш в памяти на текущую сессию */
};

function liveStatus(t){
  const el = document.getElementById("liveBtn");
  if (el) el.textContent = t;
}

async function liveReady(){
  if (LIVE.tts) return LIVE.tts;
  if (LIVE.failed) return null;
  if (LIVE.loading) return LIVE.loading;
  LIVE.loading = (async () => {
    try{
      liveStatus("Голос грузится…");
      const { KokoroTTS } = await import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm");
      /* Всегда wasm + q8: около 90 МБ и работает везде.
         Вариант fp32 под webgpu весит втрое больше и на практике не поднялся. */
      LIVE.tts = await KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", {
        dtype: "q8", device: "wasm"
      });
      liveStatus("Живой голос");
      return LIVE.tts;
    }catch(e){
      LIVE.failed = true;
      liveStatus("Живой голос ✕");
      console.warn("Kokoro не поднялся, работаем системным синтезом:", e);
      return null;
    }finally{ LIVE.loading = null; }
  })();
  return LIVE.loading;
}

/* Float32 → WAV: не зависим от того, что именно вернёт версия библиотеки */
function pcmToWav(samples, rate){
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); put(8, "WAVE"); put(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); put(36, "data");
  v.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++){
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return new Blob([buf], { type: "audio/wav" });
}

function stopSpeak(){
  try { speechSynthesis.cancel(); } catch (e) {}
  if (LIVE.audio){ try { LIVE.audio.pause(); } catch (e) {} LIVE.audio = null; }
}

function saySystem(text, who, cb){
  if (!window.speechSynthesis) { if (cb) cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  const v = who === "f" ? V.f : who === "m" ? V.m : (V.f || V.m);
  if (v) u.voice = v;
  /* если голос один — разводим персонажей высотой и темпом */
  if (V.m === V.f) { u.pitch = who === "f" ? 1.25 : 0.8; u.rate = who === "f" ? 1.0 : 0.92; }
  else { u.pitch = who === "f" ? 1.05 : 0.95; u.rate = 0.95; }
  if (cb) u.onend = cb;
  speechSynthesis.speak(u);
}

/* Постоянное имя записи: одинаковый текст одним голосом = один файл */
async function voiceKey(text, voice){
  const s = voice + "|" + text.replace(/\s+/g, " ").trim();
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
}
function bakedUrl(key){
  return SB_URL + MINE + COURSE + "/audio/" + key + ".wav";
}

/* Что уже озвучено и лежит в хранилище — спрашиваем один раз за загрузку */
async function loadBaked(){
  if (!sb || LIVE.baked) return LIVE.baked;
  const set = new Set();
  try{
    for (let off = 0; ; off += 100){
      const l = await sb.storage.from("book-art").list(COURSE + "/audio", { limit: 100, offset: off });
      if (l.error || !l.data || !l.data.length) break;
      l.data.forEach(x => set.add(x.name.replace(/\.wav$/, "")));
      if (l.data.length < 100) break;
    }
  }catch(e){}
  LIVE.baked = set;
  return set;
}

/* Синтез одной реплики: сначала готовая запись, потом своя генерация */
async function voiceBlob(text, who){
  const voice = who === "m" ? LIVE.m : LIVE.f;
  const key = await voiceKey(text, voice);
  if (LIVE.mem.has(key)) return { key: key, url: LIVE.mem.get(key) };

  const baked = await loadBaked();
  if (baked && baked.has(key)){
    const url = bakedUrl(key);
    LIVE.mem.set(key, url);
    return { key: key, url: url };
  }
  const tts = await liveReady();
  if (!tts) return null;
  const out = await tts.generate(text, { voice: voice });
  const blob = (out && typeof out.toBlob === "function")
    ? out.toBlob()
    : pcmToWav(out.audio, out.sampling_rate || 24000);
  const url = URL.createObjectURL(blob);
  LIVE.mem.set(key, url);
  return { key: key, url: url, blob: blob };
}

/* Пока звучит одна реплика, тихо готовим следующие — чтобы не было пауз */
function prefetchLines(lines, from, count){
  if (!LIVE.on || LIVE.failed) return;
  const rest = (lines || []).slice(from, from + (count || 2));
  (async () => {
    for (const l of rest){
      const text = typeof l === "string" ? l : l.text;
      const who  = typeof l === "string" ? (LIVE.podcastVoice || "f") : l.who;
      if (!text) continue;
      try { await voiceBlob(text, who); } catch (e) { return; }
    }
  })();
}

function say(text, who, cb){
  stopSpeak();
  if (!LIVE.on || LIVE.failed){ saySystem(text, who, cb); return; }
  const play = url => {
    const a = new Audio(url);
    LIVE.audio = a;
    a.onended = () => { LIVE.audio = null; if (cb) cb(); };
    a.onerror  = () => { LIVE.audio = null; saySystem(text, who, cb); };
    a.play().catch(() => { LIVE.audio = null; saySystem(text, who, cb); });
  };
  (async () => {
    try{
      const got = await voiceBlob(text, who);
      if (!got){ saySystem(text, who, cb); return; }
      play(got.url);
    }catch(e){
      console.warn("Живой голос не справился, отдаём системному:", e);
      saySystem(text, who, cb);
    }
  })();
}

let playing = false;
function playDialog(lines, from){
  const box = document.getElementById("dlgBox");
  if (!box) return;
  if (playing){ playing = false; stopSpeak();
    box.querySelectorAll(".line").forEach(l => l.classList.remove("now"));
    const b = document.getElementById("playBtn"); if (b) b.classList.remove("on"), b.textContent = b.dataset.lbl || "Слушать диалог";
    return; }
  playing = true;
  const b = document.getElementById("playBtn");
  if (b){ b.dataset.lbl = b.dataset.lbl || b.textContent; b.classList.add("on"); b.textContent = "Стоп"; }
  let i = from || 0;
  (function step(){
    if (!playing || i >= lines.length){
      playing = false;
      box.querySelectorAll(".line").forEach(l => l.classList.remove("now"));
      if (b){ b.classList.remove("on"); b.textContent = b.dataset.lbl || "Слушать диалог"; }
      return;
    }
    box.querySelectorAll(".line").forEach(l => l.classList.remove("now"));
    const el = box.querySelector('.line[data-i="' + i + '"]');
    if (el){ el.classList.add("now"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    prefetchLines(lines, i + 1, 2);          /* следующие реплики готовим заранее */
    say(lines[i].text, lines[i].who, () => { i++; setTimeout(step, 260); });
  })();
}

/* ================= бережная загрузка картинок =================
   Бесплатный генератор отдаёт картинку по ссылке, но захлёбывается,
   если дёрнуть его двадцатью запросами разом. Ставим очередь по два
   и одну повторную попытку — иначе половина карточек остаётся пустой. */
const imgQ = []; let imgActive = 0;
function queueImg(el){
  imgQ.push(el); pumpImg();
}
function pumpImg(){
  while (imgActive < 2 && imgQ.length){
    const el = imgQ.shift();
    const src = el.dataset.src;
    if (!src) continue;

    /* очередь адресов: сначала своё хранилище, потом чужой сервер, потом повтор */
    const chain = [];
    const key = el.dataset.key;
    if (src.indexOf(MINE) >= 0) chain.push(src);
    else {
      if (key) chain.push(SB_URL + MINE + COURSE + "/" + key + ".jpg");
      chain.push(src);
      chain.push(src + "&r=1");
    }

    imgActive++;
    let step = 0;
    const done = () => { imgActive--; pumpImg(); };
    el.onload = () => { el.classList.add("ready"); done(); };
    el.onerror = () => {
      step++;
      if (step < chain.length){
        const wait = step === 1 ? 0 : 1200 + Math.random() * 1200;   /* своё не нашлось — сразу дальше */
        setTimeout(() => { el.src = chain[step]; }, wait);
      } else { el.remove(); done(); }
    };
    el.src = chain[0];
  }
}
/* Каждой картинке проставляем постоянный ключ. По нему читалка сначала ищет
   картинку в нашем хранилище и только потом идёт на чужой сервер. Благодаря этому
   пересборка книги больше не «теряет» перенесённые картинки. */
function armImages(root){
  const u = BOOK && BOOK.units[ui];
  root.querySelectorAll("img[data-src]").forEach(el => {
    if (u && !el.dataset.key){
      if (el.classList.contains("art")) el.dataset.key = "u" + u.n + "-s" + si;
      else {
        const card = el.closest(".card2");
        const en = card && card.querySelector(".en") ? card.querySelector(".en").textContent : "";
        if (en) el.dataset.key = "u" + u.n + "-w-" + en.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
      }
    }
    queueImg(el);
  });
}

/* ================= сохранение ответов ================= */
const pending = [];
function record(section, exIndex, question, answer, correct){
  pending.push({ course: COURSE, unit: BOOK.units[ui].n, ex_index: exIndex,
    section: section, question: question, answer: answer, correct: correct,
    duration_ms: Date.now() - started });
  if (pending.length >= 4) flush();
}
async function flush(){
  if (!pending.length || !window.SM || !SM.isCloud) return;
  const rows = pending.splice(0, pending.length);
  try { await SM.saveHwAttempts(rows); } catch (e) {}
}
window.addEventListener("beforeunload", flush);
setInterval(flush, 20000);

function bindMC(root, items, section){
  root.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, it = items[k];
    const wrap = root.querySelector('.q[data-k="' + k + '"]');
    if (wrap.dataset.done) return;
    wrap.dataset.done = "1";
    const right = j === it.a;
    b.classList.add(right ? "ok" : "no");
    if (!right){
      const good = wrap.querySelector('.opt[data-j="' + it.a + '"]');
      if (good) good.classList.add("ok");
    }
    wrap.querySelectorAll(".opt").forEach(x => x.disabled = true);
    record(section, k + 1, it.q || "", (it.o || [])[j] || "", right);
  });
}
function gapBlock(items){

      '<div class="num">Задание ' + (k + 1) + '</div>' +
      '<div class="txt">' + esc(it.q || "") + '</div>' +

function bindGap(root, items, section){
  function check(k){
    const inp = root.querySelector('.gapin[data-k="' + k + '"]');
    const wrap = root.querySelector('.q[data-k="' + k + '"]');
    if (!inp || wrap.dataset.done) return;
    const val = (inp.value || "").trim().toLowerCase();
    if (!val) return;
    const ok = (items[k].a || []).some(a => String(a).trim().toLowerCase() === val);
    inp.classList.add(ok ? "ok" : "no");
    wrap.dataset.done = "1"; inp.disabled = true;
    if (!ok) wrap.querySelector(".key").style.display = "block";
    record(section, k + 1, items[k].q || "", inp.value, ok);
  }
  root.querySelectorAll("[data-check]").forEach(b => b.onclick = () => check(+b.dataset.check));
  root.querySelectorAll(".gapin").forEach(i => i.onkeydown = e => { if (e.key === "Enter") check(+i.dataset.k); });
}

/* ---------- видео к юниту ---------- */
function ytEmbed(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? "https://www.youtube-nocookie.com/embed/" + m[1] : null;
}
function renderVideo(){
  const box = document.getElementById("vidBox");
  if (!box) return;
  const u = BOOK.units[ui];
  const emb = ytEmbed(u.video || "");
  if (emb){
    box.innerHTML = '<iframe src="' + emb + '" allowfullscreen loading="lazy"></iframe>' +
      (isTeacher ? '<div class="grow2" style="margin-top:10px"><button class="tool" id="vidEdit">Заменить ссылку</button></div>' : "");
    const e = document.getElementById("vidEdit");
    if (e) e.onclick = () => { u.video = ""; renderVideo(); };
    return;
  }
  if (!isTeacher){
    box.innerHTML = '<div style="font-size:14px;font-weight:600;color:var(--color-neutral-700)">Видео к этому юниту учитель ещё не добавил.</div>';
    return;
  }
  box.innerHTML = '<input id="vidUrl" placeholder="вставь ссылку на YouTube">' +
    '<div class="grow2" style="margin-top:10px"><button class="tool" id="vidSave">Сохранить видео</button>' +
    '<span style="font-size:12px;font-weight:600;color:var(--color-neutral-700)">видно только твоим ученикам</span></div>';
  document.getElementById("vidSave").onclick = async () => {
    const v = (document.getElementById("vidUrl").value || "").trim();
    if (!ytEmbed(v)) { alert("Не похоже на ссылку YouTube"); return; }
    u.video = v; renderVideo(); await saveBook();
  };
}

/* ---------- режим урока: ученик видит ту же страницу ---------- */
let lessonOn = false, chan = null;
function lessonChannel(){
  if (chan || !sb) return chan;
  chan = sb.channel("book-" + COURSE, { config: { broadcast: { self: false } } });
  chan.on("broadcast", { event: "page" }, ({ payload }) => {
    if (isTeacher || !lessonOn) return;
    if (payload && typeof payload.u === "number"){ ui = payload.u; si = payload.s || 0; fillSpreads(); renderSpread(); }
  });
  chan.subscribe();
  return chan;
}
function broadcast(){
  if (!isTeacher || !lessonOn || !chan) return;
  chan.send({ type: "broadcast", event: "page", payload: { u: ui, s: si } });
}

(function(){

/* ---------- селекторы и кнопки ---------- */
function fillSpreads(){
  const u = BOOK.units[ui];
  document.getElementById("uSel").value = String(ui);
  document.getElementById("sSel").innerHTML = u.spreads.map((s, i) =>
    '<option value="' + i + '">' + (i + 1) + ". " + esc(s.title).slice(0, 40) + "</option>").join("");
}
const REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let turning = false;

/* Листание, как в презентации: страница уезжает, новая приезжает,
   содержимое проявляется по очереди. */
function turn(dir, apply){
  const b = document.getElementById("book");
  if (REDUCE || !b){ apply(); renderSpread(); return; }
  if (turning) return;
  turning = true;
  b.classList.remove("enter-r", "enter-l");
  b.classList.add(dir > 0 ? "leave-l" : "leave-r");
  setTimeout(() => {
    b.classList.remove("leave-l", "leave-r");
    apply();
    renderSpread();
    b.classList.add(dir > 0 ? "enter-r" : "enter-l");
    setTimeout(() => { turning = false; }, 340);
  }, 190);
}

function go(du, ds){
  const dir = du !== null ? 1 : (ds > 0 ? 1 : -1);
  turn(dir, () => {
    if (du !== null){ ui = du; si = 0; fillSpreads(); }
    else {
      si += ds;
      if (si < 0){ if (ui > 0){ ui--; fillSpreads(); si = BOOK.units[ui].spreads.length - 1; } else si = 0; }
      if (si >= BOOK.units[ui].spreads.length){
        if (ui < BOOK.units.length - 1){ ui++; fillSpreads(); si = 0; } else si = BOOK.units[ui].spreads.length - 1;
      }
    }
  });
}
document.getElementById("prev").onclick = () => go(null, -1);
document.getElementById("next").onclick = () => go(null, 1);
/* свайп на планшете и телефоне */
(function(){
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){
      if (/input|textarea|button/i.test((e.target.tagName || ""))) return;
      go(null, dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

document.addEventListener("keydown", e => {
  if (/input|textarea/i.test((e.target.tagName || ""))) return;
  if (e.key === "ArrowLeft") go(null, -1);
  if (e.key === "ArrowRight") go(null, 1);
});

  };
  document.getElementById("mirrorBtn").onclick = e => mirrorArt(e.target);
  document.getElementById("bakeBtn").onclick = e => bakeVoice(e.target);
  document.getElementById("lessonBtn").onclick = e => {
    lessonOn = !lessonOn;
    e.target.classList.toggle("on", lessonOn);
    if (lessonOn){ lessonChannel(); broadcast(); }
  };
}

/* ---------- перенос картинок в своё хранилище ----------
   Пока картинки живут на чужом бесплатном сервисе: работают, но если он ляжет —
   учебник останется без иллюстраций. Кнопка скачивает их по одной и кладёт
   в бакет book-art, а ссылки в книге подменяет на свои. */
const MINE = "/storage/v1/object/public/book-art/";

function artUrls(){
  const list = [];
  BOOK.units.forEach((u, ui) => u.spreads.forEach((sp, si) => {
    if (sp.art && sp.art.indexOf(MINE) < 0) list.push({ set: v => sp.art = v, url: sp.art, key: "u" + u.n + "-s" + si });
    ["items", "extra"].forEach(f => (sp[f] || []).forEach((w, wi) => {
      if (w && w.img && w.img.indexOf(MINE) < 0)
        list.push({ set: v => w.img = v, url: w.img, key: "u" + u.n + "-w-" + String(w.en || wi).replace(/[^a-z0-9]+/gi, "-").toLowerCase() });
    }));
  }));
  return list;
}

/* Учительский инструмент: озвучить весь юнит заранее и сложить в хранилище.
   Ученица потом просто скачивает готовый файл — ни модели, ни ожидания. */
async function bakeVoice(btn){
  if (!isTeacher || !sb) return;
  const u = BOOK.units[ui];
  const jobs = [];
  u.spreads.forEach(sp => {
    (sp.lines || []).forEach(l => {
      if (typeof l === "string") jobs.push({ text: l, who: sp.voice || "f" });
      else if (l && l.text)      jobs.push({ text: l.text, who: l.who });
    });
    ["items", "extra"].forEach(f => (sp[f] || []).forEach(w => {
      if (w && w.en) jobs.push({ text: w.en, who: "f" });
    }));
  });
  if (!jobs.length){ btn.textContent = "Нечего озвучивать"; return; }

  btn.disabled = true;
  const tts = await liveReady();
  if (!tts){ btn.textContent = "Голос не поднялся"; btn.disabled = false; return; }
  const baked = await loadBaked();

  let done = 0, skip = 0, fail = 0;
  const tick = () => {
    const left = jobs.length - done - skip - fail;
    btn.textContent = "Озвучиваю " + (done + skip) + "/" + jobs.length +
      (fail ? " · сбоев " + fail : "") + (left ? " · ~" + Math.ceil(left * 5 / 60) + " мин" : "");
  };
  tick();

  for (const j of jobs){
    try{
      const voice = j.who === "m" ? LIVE.m : LIVE.f;
      const key = await voiceKey(j.text, voice);
      if (baked.has(key)){ skip++; tick(); continue; }
      const out = await tts.generate(j.text, { voice: voice });
      const blob = (out && typeof out.toBlob === "function")
        ? out.toBlob()
        : pcmToWav(out.audio, out.sampling_rate || 24000);
      const up = await sb.storage.from("book-art")
        .upload(COURSE + "/audio/" + key + ".wav", blob, { contentType: "audio/wav" });
      if (up.error && !/exists/i.test(up.error.message || "")) throw up.error;
      baked.add(key);
      LIVE.mem.set(key, bakedUrl(key));
      done++;
    }catch(e){ fail++; }
    tick();
  }
  btn.disabled = false;
  btn.textContent = "Готово: " + done + (skip ? " · было " + skip : "") + (fail ? " · не вышло " + fail : "");
  setTimeout(() => { btn.textContent = "Озвучка к себе"; }, 4000);
}

async function mirrorArt(btn){
  if (!isTeacher || !sb) return;
  const list = artUrls();
  if (!list.length){ btn.textContent = "Уже все свои"; return; }
  let done = 0, fail = 0;
  btn.disabled = true;
  const tick = () => {
    const left = list.length - done - fail;
    const mins = Math.ceil(left * 7 / 60);
    btn.textContent = "Переношу " + done + "/" + list.length +
      (fail ? " · сбоев " + fail : "") + (left ? " · ~" + mins + " мин" : "");
  };
  tick();

  for (const it of list){
    try{
      /* картинка рисуется в момент первого запроса — даём три попытки с паузой */
      let blob = null, last = null;
      for (let att = 0; att < 5 && !blob; att++){
        try{
          const r = await fetch(it.url);
          if (r.status === 429) throw new Error("429");        /* сервис просит подождать */
          if (!r.ok) throw new Error("http " + r.status);
          const bl = await r.blob();
          if (bl.size < 800) throw new Error("пусто");
          blob = bl;
        }catch(e){
          last = e;
          const wait = String(e.message).indexOf("429") >= 0 ? 30000 : 6000 * (att + 1);
          await new Promise(r2 => setTimeout(r2, wait));
        }
      }
      if (!blob) throw last || new Error("нет картинки");
      const path = COURSE + "/" + it.key + ".jpg";
      const up = await sb.storage.from("book-art")
        .upload(path, blob, { contentType: blob.type || "image/jpeg", upsert: true });
      if (up.error) throw up.error;
      const { data } = sb.storage.from("book-art").getPublicUrl(path);
      if (data && data.publicUrl) it.set(data.publicUrl);
      done++;
    }catch(e){ fail++; }
    tick();
    await new Promise(r => setTimeout(r, 5000));   /* бесплатный сервис не любит спешку */
    if ((done + fail) % 12 === 0) await saveBook();     /* промежуточное сохранение */
  }
  await saveBook();
  btn.disabled = false;
  btn.textContent = "Готово: " + done + (fail ? " · не вышло " + fail : "");
  setTimeout(() => { btn.textContent = "Картинки к себе"; renderSpread(); }, 2500);
}

/* ---------- загрузка и доступ ---------- */
async function saveBook(){
  if (!sb || !isTeacher) return;
  try { await sb.from("book_content").update({ data: BOOK }).eq("course", COURSE); } catch (e) {}
}

async function loadBook(){
  if (!sb) return null;
  const { data, error } = await sb.from("book_content").select("data").eq("course", COURSE).maybeSingle();
  if (error || !data) return null;
  return data.data;
}

function denied(title, text){
  document.getElementById("book").innerHTML =
    '<div class="kicker">Учебник / Coursebook</div><h1>' + esc(title) + '</h1>' +
    '<div class="lead">' + text + '</div>' +
    '<div class="blk"><a class="tool" href="index.html">← Вернуться к курсам</a></div>';
}

(async function(){
  SMUI.mount({ role: "student", active: "courses" });
  const pane = document.getElementById("book");
  pane.innerHTML = '<div class="kicker">Учебник</div><h1>Открываю…</h1>';

  ME = await SMUI.user();
  if (!ME){
    denied("Только для учеников курса",
      "Этот учебник открыт лишь тем, кто занимается со мной. Войди под своим аккаунтом — и страница откроется.");
    return;
  }

  /* учитель или ученик, записанный на этот курс */
  let prof = null, enrolled = null;
  try { prof = await SM.myProfile(); } catch (e) {}
  try { enrolled = await SM.myCourse(); } catch (e) {}
  isTeacher = !!(prof && prof.role === "teacher");
  if (!isTeacher && enrolled !== COURSE){
    denied("Курс тебе ещё не назначен",
      "Учебник открывается, когда учитель записывает тебя на этот курс. Напиши мне — открою доступ.");
    return;
  }

  BOOK = await loadBook();
  if (!BOOK || !BOOK.units || !BOOK.units.length){
    if (!isTeacher){
      denied("Учебник ещё не загружен",
        "Содержимое хранится в закрытой базе. Учитель загрузит его — и страница откроется.");
      return;
    }
    document.getElementById("book").innerHTML =
      '<div class="kicker">Учебник / Coursebook</div><h1>Загрузи содержимое</h1>' +
      '<div class="lead">Файл книги лежит в папке проекта: <b>' + esc(COURSE) + '-book.json</b>. ' +
      'Он попадёт в закрытую таблицу базы — на сайте его не будет, скачать со страницы нельзя.</div>' +
      '<div class="blk"><input type="file" id="bookFile" accept="application/json,.json" ' +
      'style="border:2px solid var(--color-text);padding:12px;width:100%;background:var(--color-bg)">' +
      '<div class="grow2" style="margin-top:12px"><button class="tool" id="bookGo">Загрузить в базу</button>' +
      '<span id="bookMsg" style="font-size:13px;font-weight:700"></span></div></div>';
    document.getElementById("bookGo").onclick = async () => {
      const f = (document.getElementById("bookFile").files || [])[0];
      const msg = document.getElementById("bookMsg");
      if (!f){ msg.textContent = "Выбери файл"; return; }
      msg.textContent = "Читаю…";
      let data;
      try { data = JSON.parse(await f.text()); }
      catch (e){ msg.textContent = "Не разобрать JSON"; return; }
      if (!data.units || !data.units.length){ msg.textContent = "В файле нет юнитов"; return; }
      msg.textContent = "Заливаю…";
      const { error } = await sb.from("book_content")
        .upsert({ course: data.course || COURSE, title: data.title || "", data: data }, { onConflict: "course" });
      if (error){ msg.textContent = "Ошибка: " + error.message; return; }
      msg.textContent = "Готово, открываю…";
      setTimeout(() => location.reload(), 700);
    };
    document.getElementById("bbar").style.display = "flex";
    return;
  }

  document.getElementById("uSel").innerHTML = BOOK.units.map((u, i) =>
    '<option value="' + i + '">Unit ' + u.n + " · " + esc(u.title) + "</option>").join("");
  document.getElementById("uSel").onchange = e => go(+e.target.value, 0);
  document.getElementById("sSel").onchange = e => {
    const v = +e.target.value;
    turn(v > si ? 1 : -1, () => { si = v; });
  };

  const wantU = +(q.get("u") || 1);
  ui = Math.max(0, BOOK.units.findIndex(x => x.n === wantU));
  if (ui < 0) ui = 0;

  buildTools();
  fillSpreads();
  renderSpread();
  if (!isTeacher) lessonChannel(), lessonOn = true;   /* ученик следует за учителем */

  document.getElementById("bbar").style.display = "flex";
  document.getElementById("pager").style.display = "flex";
  document.getElementById("pbarWrap").style.display = "block";
  document.getElementById("rail").style.display = "flex";
  document.getElementById("ribbon").style.display = "block";
})();
</script>
