<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплаты · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css?v=6f7808f9">
<link rel="stylesheet" href="sm-ui.css?v=073c02c6">
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="cols solo">
      <div class="pane" id="pane"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sm-auth.js?v=7a245cdd"></script>
<script src="sm-shell.js?v=4b1f197b"></script>
<script>
const esc = SMUI.esc, icon = SMUI.icon;

(async function(){
  SMUI.mount({ role:"teacher", active:"payments" });
  const pane = document.getElementById("pane");
  const me = await SMUI.requireAuth(pane, "teacher");
  if (!me) return;

  let students = [];
  try { students = (await SM.myStudents()) || []; } catch(e){}

  pane.innerHTML =
    '<div class="pane-hd"><span>Оплаты / Payments</span><span>учеников: '+students.length+'</span></div>' +
    '<div class="ink calm"><div><div class="k">Оплаты / Payments</div><h2>Раздел оплат ещё не заведён</h2>' +
      '<p>Чтобы здесь появились суммы, сроки и просрочки, нужно завести оплаты в базе. Скажи — сделаю: ' +
      'пакет уроков, дата оплаты, остаток и напоминание ученику.</p></div>' +
      '<a class="go" href="teacher-class.html">'+icon("play",15)+' Перейти в класс</a></div>' +
    '<div class="tiles">' +
      '<div class="tile"><span class="k">Просрочено</span><span class="n">—</span><span class="d">нет данных</span></div>' +
      '<div class="tile"><span class="k">Оплачено в месяце</span><span class="n">—</span><span class="d">нет данных</span></div>' +
      '<div class="tile"><span class="k">Ожидается</span><span class="n">—</span><span class="d">нет данных</span></div>' +
    '</div>' +
    '<div class="sect"><span>Ученики / Students</span><span>оплаты пока не ведутся</span></div>' +
    (students.length
      ? '<table class="tb"><thead><tr><th>Ученик</th><th>Пакет</th><th>Оплачено до</th><th>Статус</th></tr></thead><tbody>' +
        students.map(s => '<tr><td><b>'+esc(s.name)+'</b></td><td>—</td><td>—</td><td>нет данных</td></tr>').join("") +
        '</tbody></table>'
      : SMUI.empty("В классе пока никого",
          "Пригласи ученика в разделе «Мой класс» — он появится здесь, и можно будет вести оплаты."));
})();
</script>
</body>
</html>
