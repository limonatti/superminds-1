<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Доска · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#e9dfca;user-select:none}
  button,select{font-family:inherit;cursor:pointer}
  #bar{position:fixed;top:0;left:0;right:0;min-height:54px;background:#7c2340;display:flex;align-items:center;gap:5px;padding:6px 10px;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-wrap:wrap;row-gap:6px}
  #bar a.home{color:#fff;text-decoration:none;background:rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;font:800 13px 'Nunito',sans-serif;white-space:nowrap}
  .tool{background:rgba(255,255,255,.12);border:2px solid transparent;color:#fff;font-size:16px;padding:7px 10px;border-radius:11px;white-space:nowrap;line-height:1}
  .tool:hover{background:rgba(255,255,255,.22)}
  .tool.on{background:#fff;color:#7c2340;border-color:#fff}
  .tool[disabled]{opacity:.35;cursor:default}
  .sep{width:1px;height:28px;background:rgba(255,255,255,.25);margin:0 3px;flex:none}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;flex:none;cursor:pointer}
  .sw.on{outline:3px solid #ffd27a;outline-offset:1px}
  select{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:10px;padding:7px;font:800 12px 'Nunito',sans-serif}
  select option{color:#1c1310}
  #live{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  #status{color:#fff;font:800 12px 'Nunito',sans-serif;background:rgba(255,255,255,.14);padding:7px 11px;border-radius:999px;white-space:nowrap}
  #status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f0c96b;margin-right:5px}
  #status.on .dot{background:#7ee787}
  #invite{background:#e0952a;color:#fff}

  #stage{position:fixed;top:54px;left:0;right:0;bottom:0;overflow:hidden;background:#fdfaf0;
    background-image:radial-gradient(#00000010 1.2px,transparent 1.2px);background-size:26px 26px;touch-action:none;cursor:grab}
  #stage.draw{cursor:crosshair}#stage.del{cursor:none}#stage.panning{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0}
  #ink{position:absolute;overflow:visible;pointer-events:none;left:0;top:0;width:1px;height:1px}
  .obj{position:absolute;pointer-events:auto;cursor:grab}
  .note{width:150px;min-height:110px;border-radius:10px;padding:10px;font:700 16px 'Fredoka',sans-serif;color:#3a2a10;box-shadow:0 4px 12px rgba(0,0,0,.14);outline:none;overflow-wrap:anywhere}
  .txt{font:800 26px 'Fredoka',sans-serif;color:#1c1310;padding:2px 4px;outline:none;min-width:24px;white-space:pre-wrap}
  .card{background:#fff;border:2px solid #e3d3ba;border-radius:14px;padding:8px 10px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.12);min-width:78px}
  .card .em{font-size:32px;line-height:1}.card .en{font:800 15px 'Nunito',sans-serif;color:#7c2340;margin-top:2px}
  .obj .del-x{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#c0392b;color:#fff;font-size:12px;border:none;display:none;z-index:3}
  #world.del .obj .del-x{display:block}
  .shape{pointer-events:none}

  /* фото */
  .pic{border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden;background:#fff}
  .pic img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
  /* встроенный сервис */
  .emb{background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column}
  .emb .hd{background:#7c2340;color:#fff;font:800 12px 'Nunito',sans-serif;padding:6px 8px;display:flex;align-items:center;gap:6px;cursor:grab;flex:none}
  .emb .hd .nm{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .emb .hd a,.emb .hd button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:7px;padding:3px 7px;font:800 11px 'Nunito',sans-serif;text-decoration:none;cursor:pointer}
  .emb iframe{border:none;width:100%;flex:1;background:#f4e9d8}
  .rs{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;border-radius:5px;background:#7c2340;border:2px solid #fff;cursor:nwse-resize;z-index:3}

  #eraserDot{position:fixed;pointer-events:none;border:2px solid #c0392b;background:rgba(192,57,43,.12);border-radius:50%;z-index:26;display:none}
  #cursors{position:fixed;top:54px;left:0;right:0;bottom:0;pointer-events:none;z-index:20;overflow:hidden}
  .cur{position:absolute;transform:translate(-2px,-2px);transition:left .05s linear,top .05s linear}
  .cur svg{display:block}
  .zoom{position:fixed;left:12px;bottom:12px;z-index:25;display:flex;gap:6px;align-items:center;background:#7c2340;border-radius:999px;padding:6px 8px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .zoom button{background:rgba(255,255,255,.16);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}
  .zoom span{color:#fff;font:800 12px 'Nunito',sans-serif;min-width:42px;text-align:center}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:7px 16px;font:700 12px 'Nunito',sans-serif;color:#8a7a68;box-shadow:0 3px 10px rgba(0,0,0,.1);z-index:15;max-width:70vw;text-align:center}
  #drop{position:fixed;inset:0;z-index:40;background:rgba(124,35,64,.75);color:#fff;display:none;align-items:center;justify-content:center;font:800 22px 'Fredoka',sans-serif}
  #drop.on{display:flex}

  /* шторка */
  .curt{background:#7c2340;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
    color:#ffd27a;font:800 14px 'Nunito',sans-serif;text-align:center;padding:6px}
  .curt.open{background:transparent;box-shadow:none;border:2px dashed rgba(124,35,64,.45);color:transparent}
  /* выделение */
  .selbox{position:absolute;border:2px dashed #7c2340;background:rgba(124,35,64,.08);pointer-events:none;z-index:5}
  .obj.picked{outline:3px solid #e0952a;outline-offset:2px}
  #saveState{color:#ffd9a8;font:800 11.5px 'Nunito',sans-serif;background:rgba(255,255,255,.10);padding:6px 10px;border-radius:999px;white-space:nowrap}
  /* таймер и кубик */
  #timerBox{position:fixed;right:14px;bottom:14px;z-index:28;background:#7c2340;color:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;text-align:center}
  #timerBox.on{display:block}
  #timerBox .tm{font:800 34px 'Fredoka',sans-serif;letter-spacing:1px}
  #timerBox .rw{display:flex;gap:6px;justify-content:center;margin-top:8px}
  #timerBox button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:9px;padding:6px 10px;font:800 12px 'Nunito',sans-serif;cursor:pointer}
  #diceBox{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:29;background:#fff;border:4px solid #7c2340;border-radius:22px;width:130px;height:130px;
    display:none;align-items:center;justify-content:center;font:800 68px 'Fredoka',sans-serif;color:#7c2340;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  #diceBox.on{display:flex}
</style>
</head>
<body>
  <div id="bar">
    <a class="home" href="course.html">← Домой</a>
    <span class="sep"></span>
    <button class="tool on" data-t="pan" title="Рука — двигать холст">🖐</button>
    <button class="tool" data-t="pen" title="Ручка">✏️</button>
    <button class="tool" data-t="marker" title="Маркер — полупрозрачный">🖍</button>
    <button class="tool" data-t="del" title="Ластик — стирает по кусочкам">🧽</button>
    <span class="sep"></span>
    <button class="tool" data-t="note" title="Стикер">🟨</button>
    <button class="tool" data-t="text" title="Текст">🔤</button>
    <span class="sep"></span>
    <button class="tool" data-t="rect" title="Прямоугольник">▭</button>
    <button class="tool" data-t="ellipse" title="Овал">⬭</button>
    <button class="tool" data-t="tri" title="Треугольник">△</button>
    <button class="tool" data-t="star" title="Звезда">☆</button>
    <button class="tool" data-t="line" title="Линия">╱</button>
    <button class="tool" data-t="arrow" title="Стрелка">↗</button>
    <button class="tool" data-t="sel" title="Выделить рамкой">⬚</button>
    <span class="sep"></span>
    <button class="tool" id="undo" title="Отменить (Cmd+Z)" disabled>↩</button>
    <button class="tool" id="redo" title="Вернуть (Shift+Cmd+Z)" disabled>↪</button>
    <span class="sep"></span>
    <span id="palette" style="display:flex;gap:5px;align-items:center"></span>
    <select id="widthSel" title="Толщина линии">
      <option value="2">тонкая</option>
      <option value="4" selected>средняя</option>
      <option value="9">жирная</option>
      <option value="18">очень жирная</option>
    </select>
    <select id="eraseSel" title="Размер ластика">
      <option value="14">ластик S</option>
      <option value="28" selected>ластик M</option>
      <option value="60">ластик L</option>
    </select>
    <span class="sep"></span>
    <button class="tool" id="addPhoto" title="Добавить фото">📷 Фото</button>
    <button class="tool" id="addEmbed" title="Вставить YouTube, Wordwall, LearningApps и другое">🔗 Вставить</button>
    <span class="sep"></span>
    <select id="unitSel"></select>
    <button class="tool" id="addCards">＋ Слова</button>
    <span class="sep"></span>
    <button class="tool" id="curtain" title="Шторка — закрыть ответ">🪟 Шторка</button>
    <button class="tool" id="timerBtn" title="Таймер">⏱</button>
    <button class="tool" id="diceBtn" title="Кубик">🎲</button>
    <span class="sep"></span>
    <span id="pages" style="display:flex;gap:4px;align-items:center"></span>
    <button class="tool" id="addPage" title="Добавить страницу">＋</button>
    <span class="sep"></span>
    <button class="tool" id="savePng" title="Скачать доску картинкой">💾</button>
    <button class="tool" id="clear" title="Очистить">🧹</button>
    <span id="live"><span id="saveState" title="Доска сохраняется автоматически">сохранено</span><span id="status"><span class="dot"></span><span id="statusTxt">…</span></span><button class="tool" id="invite">🔗 Позвать</button></span>
  </div>

  <div id="stage">
    <div id="world"><svg id="ink"></svg></div>
  </div>
  <div id="eraserDot"></div>
  <div id="cursors"></div>
  <div id="drop">Отпусти — добавлю фото на доску</div>
  <div class="zoom"><button id="zout">−</button><span id="zlbl">100%</span><button id="zin">+</button><button id="zreset" title="Сброс">⌂</button></div>
  <div class="hint">🖐 двигай холст · колесо — зум · 🧽 стирает по кусочкам · 🪟 шторка прячет ответ · ⬚ выделяет группой · Cmd+Z — отменить</div>
  <input type="file" id="fileInp" accept="image/*" multiple style="display:none">
  <div id="timerBox"><div class="tm" id="tmTxt">05:00</div>
    <div class="rw"><button data-m="1">1м</button><button data-m="3">3м</button><button data-m="5">5м</button><button id="tmStop">стоп</button><button id="tmHide">✕</button></div></div>
  <div id="diceBox">?</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="words.js"></script>
  <script src="speakout-words.js"></script>
  <script>
    const COLORS=["#1c1310","#7c2340","#c0392b","#e0952a","#27ae60","#2980b9","#8e44ad","#ffffff"];
    const NOTE_COLORS={"#e0952a":"#ffe08a","#27ae60":"#c8efc0","#2980b9":"#bfe0ff","#8e44ad":"#e6cdf5","#c0392b":"#ffc9c0","#1c1310":"#fff3c4","#7c2340":"#f6cddb","#ffffff":"#ffffff"};
    let tool="pan", color="#1c1310", penW=4, eraseR=28;
    const NS="http://www.w3.org/2000/svg";

    const stage=document.getElementById("stage"), world=document.getElementById("world"), ink=document.getElementById("ink");
    const cursors=document.getElementById("cursors"), eraserDot=document.getElementById("eraserDot");
    const cam={x:0,y:0,s:1};

    /* высота панели меняется при переносе строк — подгоняем холст */
    function fitBar(){ const h=document.getElementById("bar").offsetHeight;
      stage.style.top=h+"px"; cursors.style.top=h+"px"; }
    window.addEventListener("resize",fitBar); setTimeout(fitBar,0); setTimeout(fitBar,300);

    function applyCam(){ world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+cam.s+")"; document.getElementById("zlbl").textContent=Math.round(cam.s*100)+"%"; drawCursors(); }
    function toWorld(sx,sy){ const r=stage.getBoundingClientRect(); return {x:(sx-r.left-cam.x)/cam.s, y:(sy-r.top-cam.y)/cam.s}; }
    function toScreen(wx,wy){ return {x:wx*cam.s+cam.x, y:wy*cam.s+cam.y}; }

    const objs={};
    function genId(){return Math.random().toString(36).slice(2,9);}
    let pages=[[]], pageIdx=0;   // страницы доски

    /* ---- Realtime ---- */
    const params=new URLSearchParams(location.search);
    let room=params.get("room"); if(!room){room=Math.random().toString(36).slice(2,7).toUpperCase();history.replaceState(null,"","?room="+room);}
    const SB_URL="https://kdzpmbuohfjbtjpqrdfx.supabase.co";
    const SB_KEY="sb_publishable_K8vhCVG_jiEyHYQOgp3XWQ_bWobdeBG";
    const myColor=["#e0952a","#2980b9","#27ae60","#8e44ad","#c0392b"][Math.floor(Math.random()*5)];
    const myId=genId();
    let channel=null, online=false, sb=null;
    function setStatus(t,on){document.getElementById("statusTxt").textContent=t;document.getElementById("status").classList.toggle("on",!!on);}
    (function(){try{
      sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:60}}});
      channel=sb.channel("board:"+room,{config:{broadcast:{self:false}}});
      channel.on("broadcast",{event:"op"},({payload})=>applyRemote(payload));
      channel.subscribe(st=>{ if(st==="SUBSCRIBED"){online=true;setStatus("комната "+room,true);send({t:"hello"});} else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){online=false;setStatus("оффлайн",false);} });
    }catch(e){setStatus("оффлайн",false);}})();

    /* ==================================================================
       СОХРАНЕНИЕ. Доска пишется в базу по номеру комнаты и подхватывается
       при следующем открытии — урок не пропадает, если закрыть вкладку.
       ================================================================== */
    const saveLbl=document.getElementById("saveState");
    let saveT=null, lastSaved="", loadedFromDb=false;
    function boardData(){ const p=pages.slice(); p[pageIdx]=serialize(); return {pages:p, page:pageIdx}; }
    function markDirty(){ if(!sb)return; saveLbl.textContent="сохраняю…"; clearTimeout(saveT); saveT=setTimeout(saveBoard,2000); }
    async function saveBoard(){
      if(!sb)return;
      try{
        const json=JSON.stringify(boardData());
        if(json===lastSaved){ saveLbl.textContent="сохранено"; return; }
        const {error}=await sb.from("boards").upsert({room:room,data:JSON.parse(json),updated_at:new Date().toISOString()},{onConflict:"room"});
        if(error){ saveLbl.textContent="не сохранено"; console.warn("save:",error.message); }
        else { lastSaved=json; saveLbl.textContent="сохранено"; }
      }catch(e){ saveLbl.textContent="не сохранено"; }
    }
    async function loadBoard(){
      if(!sb)return;
      try{
        const {data,error}=await sb.from("boards").select("data").eq("room",room).maybeSingle();
        if(error||!data||!data.data)return;
        const d=data.data;
        if(!d.pages||!d.pages.length)return;
        if(Object.keys(objs).length)return;      // с доски уже пришли данные от соседа
        loadedFromDb=true;
        pages=d.pages.map(x=>x||[]); pageIdx=Math.min(d.page||0,pages.length-1);
        (pages[pageIdx]||[]).forEach(o=>buildFrom(o,true));
        lastSaved=JSON.stringify(boardData()); renderPages(); saveLbl.textContent="сохранено";
      }catch(e){}
    }
    function send(op){ if(channel&&online){try{channel.send({type:"broadcast",event:"op",payload:op});}catch(e){}} }

    document.getElementById("invite").onclick=()=>{const url=location.origin+location.pathname+"?room="+room;
      if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert("Ссылка на доску скопирована!\nОтправь ученику:\n\n"+url),()=>prompt("Скопируй ссылку:",url));else prompt("Скопируй ссылку:",url);};

    /* ---- инструменты / палитра ---- */
    document.querySelectorAll(".tool[data-t]").forEach(b=>b.onclick=()=>setTool(b.dataset.t));
    const DRAW_TOOLS=["pen","marker","rect","ellipse","tri","star","line","arrow","note","text"];
    function setTool(t){tool=t;document.querySelectorAll(".tool[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
      stage.classList.toggle("draw",DRAW_TOOLS.includes(t));
      stage.classList.toggle("del",t==="del"); world.classList.toggle("del",t==="del");
      eraserDot.style.display="none";}
    const pal=document.getElementById("palette");
    COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===color?" on":"");b.style.background=c;
      b.onclick=()=>{color=c;[...pal.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");};pal.appendChild(b);});
    document.getElementById("widthSel").onchange=e=>penW=+e.target.value;
    document.getElementById("eraseSel").onchange=e=>eraseR=+e.target.value;

    /* ---- зум ---- */
    stage.addEventListener("wheel",e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;zoomAt(e.clientX,e.clientY,f);},{passive:false});
    function zoomAt(sx,sy,f){const r=stage.getBoundingClientRect();const px=sx-r.left,py=sy-r.top;const ns=Math.min(4,Math.max(.2,cam.s*f));
      cam.x=px-(px-cam.x)*(ns/cam.s);cam.y=py-(py-cam.y)*(ns/cam.s);cam.s=ns;applyCam();}
    document.getElementById("zin").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2);};
    document.getElementById("zout").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2);};
    document.getElementById("zreset").onclick=()=>{cam.x=0;cam.y=0;cam.s=1;applyCam();};

    /* ==================================================================
       ИСТОРИЯ: отмена и возврат.
       Перед каждым действием запоминаем снимок доски. Отмена сравнивает
       снимок с текущим состоянием и досылает соседу только разницу.
       ================================================================== */
    let past=[], future=[], histBusy=false;
    function serialize(){ return Object.keys(objs).map(id=>{const o=objs[id];
      if(o.type==="stroke")return{type:"stroke",id,color:o.color,w:o.w,op:o.op,pts:o.pts};
      if(o.type==="shape")return{type:"shape",id,shape:o.shape,x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1,color:o.color,w:o.w};
      if(o.type==="note")return{type:"note",id,x:o.x,y:o.y,color:o.color,text:txtOf(o.el)};
      if(o.type==="text")return{type:"text",id,x:o.x,y:o.y,color:o.color,text:txtOf(o.el)};
      if(o.type==="card")return{type:"card",id,x:o.x,y:o.y,en:o.en,emoji:o.emoji};
      if(o.type==="img") return{type:"img",id,x:o.x,y:o.y,w:o.w,h:o.h,src:o.src};
      if(o.type==="emb") return{type:"emb",id,x:o.x,y:o.y,w:o.w,h:o.h,src:o.src,name:o.name,link:o.link};
      if(o.type==="curt")return{type:"curt",id,x:o.x,y:o.y,w:o.w,h:o.h,open:!!o.open};
      return null;}).filter(Boolean); }
    function snapshot(){ if(histBusy)return; past.push(JSON.stringify(serialize())); if(past.length>40)past.shift(); future.length=0; updHist(); markDirty(); }
    function updHist(){ document.getElementById("undo").disabled=!past.length; document.getElementById("redo").disabled=!future.length; }
    function restore(json){
      histBusy=true;
      const list=JSON.parse(json), want={}; list.forEach(o=>want[o.id]=o);
      Object.keys(objs).forEach(id=>{ if(!want[id]){ removeObj(id); send({t:"rm",id}); } });
      list.forEach(o=>{ if(!objs[o.id]){ buildFrom(o,true); send({t:"any",o}); } });
      histBusy=false; updHist();
    }
    function doUndo(){ if(!past.length)return; future.push(JSON.stringify(serialize())); restore(past.pop()); }
    function doRedo(){ if(!future.length)return; past.push(JSON.stringify(serialize())); restore(future.pop()); }
    document.getElementById("undo").onclick=doUndo;
    document.getElementById("redo").onclick=doRedo;
    window.addEventListener("keydown",e=>{

    function distPt(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
    function objBox(o){
      if(o.type==="shape")return{x:Math.min(o.x0,o.x1),y:Math.min(o.y0,o.y1),w:Math.abs(o.x1-o.x0),h:Math.abs(o.y1-o.y0)};
      if(o.el&&o.el.offsetWidth!==undefined)return{x:o.x,y:o.y,w:o.el.offsetWidth||120,h:o.el.offsetHeight||80};
      return null;
    }
    let erasedAny=false;
    function eraseAt(sx,sy){
      const c=toWorld(sx,sy), r=eraseR/cam.s;
      Object.keys(objs).forEach(id=>{
        const o=objs[id]; if(!o)return;
        if(o.type==="stroke"){
          const keep=o.pts.map(p=>distPt(p,c)>r);
          if(keep.every(Boolean))return;
          erasedAny=true;
          const runs=[]; let curRun=[];
          o.pts.forEach((p,i)=>{ if(keep[i])curRun.push(p); else { if(curRun.length>1)runs.push(curRun); curRun=[]; } });
          if(curRun.length>1)runs.push(curRun);
          removeObj(id); send({t:"rm",id});
          runs.forEach(pts=>{ const nid=genId();
            const no={type:"stroke",id:nid,color:o.color,w:o.w,op:o.op,pts};
            objs[nid]=no; no.el=svgPath(no); ink.appendChild(no.el);
            send({t:"any",o:{type:"stroke",id:nid,color:o.color,w:o.w,op:o.op,pts}});
          });
          return;
        }
        const b=objBox(o); if(!b)return;
        const nx=Math.max(b.x,Math.min(c.x,b.x+b.w)), ny=Math.max(b.y,Math.min(c.y,b.y+b.h));
        if(distPt({x:nx,y:ny},c)<=r){ erasedAny=true; removeObj(id); send({t:"rm",id}); }
      });
    }

    function svgPath(o){ const p=document.createElementNS(NS,"path"); p.setAttribute("class","shape"); p.dataset.id=o.id;

    function starPts(cx,cy,R,r){ let s=""; for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2;const rad=i%2?r:R;s+=(i?" ":"")+(cx+Math.cos(a)*rad).toFixed(1)+","+(cy+Math.sin(a)*rad).toFixed(1);} return s; }
    function svgShape(o){ let el;
      if(o.shape==="ellipse")el=document.createElementNS(NS,"ellipse");
      else if(o.shape==="rect")el=document.createElementNS(NS,"rect");
      else if(o.shape==="tri"||o.shape==="star")el=document.createElementNS(NS,"polygon");
      else {el=document.createElementNS(NS,"line"); if(o.shape==="arrow")el.setAttribute("marker-end","url(#arrowh)");}

      else if(o.shape==="tri"){el.setAttribute("points",(x+w/2)+","+y+" "+(x+w)+","+(y+h)+" "+x+","+(y+h));}
      else if(o.shape==="star"){const R=Math.min(w,h)/2;el.setAttribute("points",starPts(x+w/2,y+h/2,R,R*.45));}

    /* Картинки живут в отдельном хранилище: в доску попадает только ссылка.
       Если хранилище недоступно — кладём картинку прямо в доску, но мельче. */
    function shrink(file,cb){
      const rd=new FileReader();
      rd.onload=()=>{ const im=new Image(); im.onload=()=>{
        let W=im.width,H=im.height; const MAX=1600;
        if(Math.max(W,H)>MAX){ const k=MAX/Math.max(W,H); W=Math.round(W*k); H=Math.round(H*k); }
        const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
        cv.getContext("2d").drawImage(im,0,0,W,H);
        cb(cv.toDataURL("image/jpeg",.85),W,H);
      }; im.src=rd.result; };
      rd.readAsDataURL(file);
    }
    function shrinkSmall(dataUrl,cb){
      const im=new Image(); im.onload=()=>{
        let W=im.width,H=im.height; const MAX=900;
        if(Math.max(W,H)>MAX){ const k=MAX/Math.max(W,H); W=Math.round(W*k); H=Math.round(H*k); }
        const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
        cv.getContext("2d").drawImage(im,0,0,W,H);
        let q=.7,u=cv.toDataURL("image/jpeg",q);
        while(u.length>140000&&q>.3){ q-=.12; u=cv.toDataURL("image/jpeg",q); }
        cb(u);
      }; im.src=dataUrl;
    }
    let warnedStore=false;
    async function uploadPic(dataUrl){

        const {error}=await sb.storage.from("board-images").upload(path,blob,{contentType:"image/jpeg",upsert:false});
        if(error){ console.warn("upload:",error.message); return null; }
        const {data}=sb.storage.from("board-images").getPublicUrl(path);
        return (data&&data.publicUrl)||null;
      }catch(e){ return null; }
    }

    /* ---- встроенные сервисы ---- */
    function embedInfo(url){
      url=(url||"").trim(); if(!url)return null;
      if(!/^https?:\/\//i.test(url)) url="https://"+url;
      let m;
      if((m=url.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/i)))
        return {src:"https://www.youtube-nocookie.com/embed/"+m[1],name:"YouTube",w:520,h:320,link:url};

      if((m=url.match(/wordwall\.net\/(?:[a-z]{2,3}\/)?(?:resource|play|embed)\/(\d+)/i)))
        return {src:"https://wordwall.net/embed/"+m[1],name:"Wordwall",w:560,h:460,link:url};

        return {src:"https://learningapps.org/watch?v="+m[1],name:"LearningApps",w:560,h:460,link:url};
      if((m=url.match(/learningapps\.org\/(\d+)/i)))
        return {src:"https://learningapps.org/watch?app="+m[1],name:"LearningApps",w:560,h:460,link:url};
      if(/liveworksheets\.com/i.test(url)) return {src:url,name:"LiveWorksheets",w:600,h:700,link:url};
      if((m=url.match(/quizlet\.com\/(\d+)/i))) return {src:"https://quizlet.com/"+m[1]+"/flashcards/embed?x=1jj1",name:"Quizlet",w:560,h:420,link:url};
      if(/baamboozle\.com/i.test(url)) return {src:url,name:"Baamboozle",w:600,h:460,link:url,risky:true};
      if(/genial\.?ly|view\.genially\.com/i.test(url)) return {src:url,name:"Genially",w:600,h:420,link:url};
      if((m=url.match(/miro\.com\/app\/board\/([\w=~-]+)/i))) return {src:"https://miro.com/app/live-embed/"+m[1]+"/",name:"Miro",w:600,h:420,link:url};
      if((m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/i))) return {src:"https://drive.google.com/file/d/"+m[1]+"/preview",name:"Google Drive",w:560,h:420,link:url};

      return {src:url,name:"сайт",w:600,h:440,link:url,risky:true};

      const f=document.createElement("iframe"); f.src=d.src; f.setAttribute("allow","camera; microphone; autoplay; fullscreen; clipboard-write"); f.setAttribute("allowfullscreen","");
      el.appendChild(hd); el.appendChild(f); world.appendChild(el);
      const o={type:"emb",id,x:d.x,y:d.y,w:d.w,h:d.h,src:d.src,name:d.name,link:d.link,el}; objs[id]=o;
      delX(el,id); dragObj(el,o,null,hd); resizer(el,o);
      if(!remote) send({t:"any",o:{type:"emb",id,x:d.x,y:d.y,w:d.w,h:d.h,src:d.src,name:d.name,link:d.link}}); }
    document.getElementById("addEmbed").onclick=()=>{
      const url=prompt("Вставь ссылку — YouTube, Wordwall, LearningApps, LiveWorksheets, Quizlet, Baamboozle, Genially, Google Диск:");
      if(!url)return;
      const inf=embedInfo(url); if(!inf)return;
      const r=stage.getBoundingClientRect(); const c=toWorld(r.left+r.width/2-inf.w/2,r.top+80);
      snapshot(); addEmb(genId(),{x:c.x,y:c.y,w:inf.w,h:inf.h,src:inf.src,name:inf.name,link:inf.link},false);
      if(inf.risky) setTimeout(()=>alert("Если окно осталось пустым — этот сервис запрещает показывать себя внутри других сайтов. Нажми ↗ в заголовке, чтобы открыть его в новой вкладке."),900);
    };

    /* ---- шторка: прячет ответ, клик открывает и закрывает ---- */
    function addCurt(id,d,remote){ if(objs[id])return;
      const el=document.createElement("div"); el.className="obj curt"+(d.open?" open":"");
      el.style.width=d.w+"px"; el.style.height=d.h+"px"; place(el,d.x,d.y);
      el.textContent="нажми, чтобы открыть"; world.appendChild(el);
      const o={type:"curt",id,x:d.x,y:d.y,w:d.w,h:d.h,open:!!d.open,el}; objs[id]=o;
      delX(el,id); resizer(el,o);
      dragObj(el,o,()=>{ o.open=!o.open; el.classList.toggle("open",o.open); send({t:"cu",id,open:o.open}); markDirty(); });
      if(!remote) send({t:"any",o:{type:"curt",id,x:d.x,y:d.y,w:d.w,h:d.h,open:o.open}}); }
    document.getElementById("curtain").onclick=()=>{ const r=stage.getBoundingClientRect();
      const c=toWorld(r.left+r.width/2-160,r.top+r.height/2-70); snapshot();
      addCurt(genId(),{x:c.x,y:c.y,w:320,h:140,open:false},false); };

    /* ---- страницы ---- */
    const pagesBox=document.getElementById("pages");
    function renderPages(){ pagesBox.innerHTML="";
      pages.forEach((p,i)=>{ const b=document.createElement("button"); b.className="tool"+(i===pageIdx?" on":"");
        b.textContent=(i+1); b.title="Страница "+(i+1); b.onclick=()=>gotoPage(i,true); pagesBox.appendChild(b); }); }
    function gotoPage(i,broadcast){ if(i===pageIdx||i<0||i>=pages.length)return;
      pages[pageIdx]=serialize(); doClear();
      pageIdx=i; (pages[i]||[]).forEach(o=>buildFrom(o,true));
      past.length=0; future.length=0; updHist(); renderPages(); markDirty();
      if(broadcast) send({t:"pg",i,list:pages[i]||[]}); }
    document.getElementById("addPage").onclick=()=>{ pages[pageIdx]=serialize(); pages.push([]); gotoPage(pages.length-1,true); };

    /* ---- таймер ---- */
    const tmBox=document.getElementById("timerBox"), tmTxt=document.getElementById("tmTxt");
    let tmEnd=0, tmInt=null;
    function tmRender(){ const left=Math.max(0,Math.round((tmEnd-Date.now())/1000));
      tmTxt.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
      if(left<=0){ clearInterval(tmInt); tmInt=null; tmTxt.textContent="00:00"; } }
    function tmStart(min,broadcast){ tmBox.classList.add("on"); tmEnd=Date.now()+min*60000; clearInterval(tmInt); tmInt=setInterval(tmRender,250); tmRender();
      if(broadcast) send({t:"tm",end:tmEnd}); }
    document.getElementById("timerBtn").onclick=()=>tmBox.classList.toggle("on");
    tmBox.querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>tmStart(+b.dataset.m,true));
    document.getElementById("tmStop").onclick=()=>{clearInterval(tmInt);tmInt=null;send({t:"tm",end:0});};
    document.getElementById("tmHide").onclick=()=>tmBox.classList.remove("on");

    /* ---- кубик ---- */
    const diceBox=document.getElementById("diceBox");
    function showDice(n){ diceBox.classList.add("on"); let i=0;
      const roll=setInterval(()=>{ diceBox.textContent=1+Math.floor(Math.random()*6); if(++i>8){ clearInterval(roll); diceBox.textContent=n;
        setTimeout(()=>diceBox.classList.remove("on"),1600); } },70); }
    document.getElementById("diceBtn").onclick=()=>{ const n=1+Math.floor(Math.random()*6); showDice(n); send({t:"dc",n}); };

    /* ---- сохранить картинкой ---- */
    document.getElementById("savePng").onclick=async()=>{
      if(typeof html2canvas==="undefined"){ alert("Не загрузилась библиотека для сохранения. Обнови страницу."); return; }
      const btn=document.getElementById("savePng"); const old=btn.textContent; btn.textContent="…";
      try{
        const cv=await html2canvas(stage,{backgroundColor:"#fdfaf0",useCORS:true,scale:2,logging:false});
        const a=document.createElement("a");
        a.download="доска-"+room+"-стр"+(pageIdx+1)+".png";
        a.href=cv.toDataURL("image/png"); a.click();
      }catch(e){ alert("Не получилось сохранить картинку. Попробуй ещё раз."); }
      btn.textContent=old;
    };

    /* ---- выделение рамкой и группа ---- */
    let picked=[];
    function clearPick(){ picked.forEach(id=>{const o=objs[id]; if(o&&o.el&&o.el.classList)o.el.classList.remove("picked");}); picked=[]; }
    function pickIn(a,b){ clearPick();
      const x0=Math.min(a.x,b.x),y0=Math.min(a.y,b.y),x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y);
      Object.keys(objs).forEach(id=>{ const o=objs[id]; let bx;
        if(o.type==="stroke"){ if(o.pts.some(p=>p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1)){picked.push(id);} return; }
        bx=objBox(o); if(!bx)return;
        if(bx.x<x1&&bx.x+bx.w>x0&&bx.y<y1&&bx.y+bx.h>y0){ picked.push(id); if(o.el&&o.el.classList)o.el.classList.add("picked"); }
      }); }
    function moveGroup(dx,dy){ picked.forEach(id=>{ const o=objs[id]; if(!o)return;
      if(o.type==="stroke"){ o.pts=o.pts.map(p=>({x:p.x+dx,y:p.y+dy})); o.el.setAttribute("d",dOf(o.pts));
        send({t:"rm",id}); send({t:"any",o:{type:"stroke",id,color:o.color,w:o.w,op:o.op,pts:o.pts}}); }
      else if(o.type==="shape"){ o.x0+=dx;o.y0+=dy;o.x1+=dx;o.y1+=dy; updShape(o);
        send({t:"rm",id}); send({t:"any",o:{type:"shape",id,shape:o.shape,x0:o.x0,y0:o.y0,x1:o.x1,y1:o.y1,color:o.color,w:o.w}}); }
      else if(o.el){ o.x+=dx;o.y+=dy; place(o.el,o.x,o.y); send({t:"mv",id,x:o.x,y:o.y}); } }); }
    window.addEventListener("keydown",e=>{
      const t=e.target; if(t&&(t.isContentEditable||t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
      if((e.key==="Delete"||e.key==="Backspace")&&picked.length){ e.preventDefault(); snapshot();
        picked.slice().forEach(id=>{removeObj(id);send({t:"rm",id});}); picked=[]; }
      if(e.key==="Escape") clearPick();
    });

    function removeObj(id){ const o=objs[id]; if(!o)return; if(o.el&&o.el.remove)o.el.remove(); delete objs[id]; }

    /* ---- слова на доску ---- */
    const sel=document.getElementById("unitSel");
    SM_UNITS.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=u.emoji+" "+u.title;sel.appendChild(o);});
    const SPK_LABEL={"speakout-b1":"Speakout B1","speakout-b1plus":"Speakout B1+"};
    if(window.SPEAKOUT_WORDS){ Object.keys(window.SPEAKOUT_WORDS).forEach(course=>{ Object.keys(window.SPEAKOUT_WORDS[course]).forEach(un=>{ const o=document.createElement("option");o.value=course+"|"+un;o.textContent="🗣️ "+(SPK_LABEL[course]||course)+" · U"+un;sel.appendChild(o); }); }); }
    function placeCards(list){ const r=stage.getBoundingClientRect(); const c=toWorld(r.left+60,r.top+40); snapshot();
      list.slice(0,8).forEach((w,i)=>addCard(genId(),{x:c.x+(i%4)*110,y:c.y+Math.floor(i/4)*120,en:w.en,emoji:w.emoji},false)); }
    function addCurrentWords(val){ val=val||sel.value;
      if(val && val.indexOf("|")>=0){ const parts=val.split("|"); const list=((window.SPEAKOUT_WORDS||{})[parts[0]]||{})[parts[1]]||[]; placeCards(list.map(w=>({en:w[0],emoji:"🗣️"}))); }
      else { const u=SM_UNITS.find(x=>x.id===val); if(u) placeCards(u.words.map(w=>({en:w.en,emoji:w.emoji}))); } }
    document.getElementById("addCards").onclick=()=>addCurrentWords(sel.value);
    window.addEventListener("message",e=>{ if(!e||!e.data)return;
      if(e.data.type==="sm-add"&&e.data.unit) addCurrentWords(e.data.unit);
      else if(e.data.type==="sm-add-current") addCurrentWords(sel.value);
      else if(e.data.type==="sm-set"&&e.data.val){ if([...sel.options].some(o=>o.value===e.data.val)) sel.value=e.data.val; }
    });

    document.getElementById("clear").onclick=()=>{ if(confirm("Очистить всю доску?")){ snapshot(); doClear(); send({t:"clr"}); } };
    function doClear(){ Object.keys(objs).forEach(removeObj); }

    /* ---- живые курсоры ---- */
    const peers={}; let lastCur=0;
    function cursorOut(sx,sy){ const now=Date.now(); if(now-lastCur<45)return; lastCur=now; const w=toWorld(sx,sy); send({t:"cur",id:myId,x:w.x,y:w.y,c:myColor}); }
    function drawCursors(){ Object.keys(peers).forEach(id=>{const p=peers[id];const s=toScreen(p.x,p.y);p.el.style.left=s.x+"px";p.el.style.top=s.y+"px";}); }
    function showPeer(id,x,y,c){ let p=peers[id]; if(!p){ const el=document.createElement("div"); el.className="cur"; el.innerHTML='<svg width="26" height="26" viewBox="0 0 26 26"><path d="M2 2 L2 20 L7 15 L11 23 L14 22 L10 14 L18 14 Z" fill="'+(c||"#e0952a")+'" stroke="#fff" stroke-width="1.5"/></svg>'; cursors.appendChild(el); p=peers[id]={el};} p.x=x;p.y=y; const s=toScreen(x,y); p.el.style.left=s.x+"px"; p.el.style.top=s.y+"px"; clearTimeout(p.to); p.to=setTimeout(()=>{p.el.remove();delete peers[id];},4000); }

    /* ---- сборка объекта из описания ---- */
    function buildFrom(o,remote){
      if(objs[o.id])return;
      if(o.type==="stroke"){ const so={type:"stroke",id:o.id,color:o.color,w:o.w,op:o.op,pts:o.pts}; objs[o.id]=so; so.el=svgPath(so); ink.appendChild(so.el); }
      else if(o.type==="shape"){ const so=Object.assign({type:"shape"},o); objs[o.id]=so; so.el=svgShape(so); ink.appendChild(so.el); updShape(so); }
      else if(o.type==="note") addNote(o.id,o,true);
      else if(o.type==="text") addText(o.id,o,true);
      else if(o.type==="card") addCard(o.id,o,true);
      else if(o.type==="img") addImg(o.id,o,true);
      else if(o.type==="emb") addEmb(o.id,o,true);
      else if(o.type==="curt") addCurt(o.id,o,true);
    }

    /* ---- приём ---- */
    function applyRemote(op){ switch(op.t){
      case "cur": showPeer(op.id,op.x,op.y,op.c); break;
      case "any": buildFrom(op.o,true); break;
      case "nt": { const o=objs[op.id]; if(o&&o.el&&document.activeElement!==o.el)setTxt(o.el,op.text); break; }
      case "tt": { const o=objs[op.id]; if(o&&o.el&&document.activeElement!==o.el)setTxt(o.el,op.text); break; }
      case "mv": { const o=objs[op.id]; if(o&&o.el&&o.el.style){o.x=op.x;o.y=op.y;place(o.el,op.x,op.y);} break; }
      case "sz": { const o=objs[op.id]; if(o&&o.el){o.w=op.w;o.h=op.h;o.el.style.width=op.w+"px";o.el.style.height=op.h+"px";} break; }
      case "cu": { const o=objs[op.id]; if(o&&o.el){o.open=op.open;o.el.classList.toggle("open",!!op.open);} break; }
      case "pg": { pages[pageIdx]=serialize(); while(pages.length<=op.i)pages.push([]);
        pages[op.i]=op.list||pages[op.i]||[]; doClear(); pageIdx=op.i;
        (pages[op.i]||[]).forEach(o=>buildFrom(o,true)); past.length=0; future.length=0; updHist(); renderPages(); break; }
      case "tm": { if(op.end){ tmBox.classList.add("on"); tmEnd=op.end; clearInterval(tmInt); tmInt=setInterval(tmRender,250); tmRender(); }
        else { clearInterval(tmInt); tmInt=null; } break; }
      case "dc": showDice(op.n); break;
      case "rm": removeObj(op.id); break;
      case "clr": doClear(); break;
      case "hello": sendSnapshot(); break;
      case "snap": applySnapshot(op); break;
      /* старый протокол — на случай, если у кого-то открыта прежняя версия */
      case "ss": { const o={type:"stroke",id:op.id,color:op.c,w:4,op:1,pts:[]}; objs[op.id]=o; o.el=svgPath(o); ink.appendChild(o.el); break; }
      case "sp": { const o=objs[op.id]; if(o&&o.type==="stroke"){o.pts.push({x:op.x,y:op.y});o.el.setAttribute("d",dOf(o.pts));} break; }
      case "sa": buildFrom(Object.assign({type:"shape"},op.o),true); break;
      case "na": addNote(op.o.id,op.o,true); break;
      case "ta": addText(op.o.id,op.o,true); break;
      case "ca": addCard(op.o.id,op.o,true); break;
    } }
    function sendSnapshot(){ send({t:"snap",list:serialize(),pages:pages,page:pageIdx}); }
    let gotSnap=false;
    function applySnapshot(op){ if(gotSnap||!op.list)return; gotSnap=true;
      if(op.pages){ pages=op.pages.map(x=>x||[]); pageIdx=op.page||0; renderPages(); }
      op.list.forEach(o=>buildFrom(o,true)); }

    /* любое входящее изменение тоже надо сохранить */
    const _applyRemote=applyRemote;
    applyRemote=function(op){ _applyRemote(op); if(["any","rm","clr","mv","sz","nt","tt","cu","pg"].includes(op.t)) markDirty(); };

    applyCam(); updHist(); renderPages();
    setTimeout(loadBoard,1200);
    window.addEventListener("beforeunload",()=>{ if(saveT){ clearTimeout(saveT); saveBoard(); } });
  </script>
</body>
</html>
