<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет ученика · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="modernist.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Archivo',sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 32px;
    border-bottom:2px solid var(--color-divider);background:var(--color-bg);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .brand i{width:24px;height:24px;background:var(--color-accent);display:block}
  .nav{display:flex}
  .nav a{position:relative;padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--color-neutral-800)}
  .nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--color-accent)}
  .nav a:hover{background:var(--color-accent-100)}

  .wrap{max-width:820px;margin:0 auto;padding:44px 32px 64px}
  h1{margin:0;font-size:56px;line-height:1;font-weight:800;letter-spacing:-.02em}
  .sub{margin:12px 0 28px;font-size:18px;font-weight:500;color:var(--color-neutral-700)}

  .panel{border:2px solid var(--color-divider);background:var(--color-surface);padding:0}
  .panel>*{padding-left:26px;padding-right:26px}
  .tabs{display:flex;padding:0!important;border-bottom:2px solid var(--color-divider)}
  .tab{flex:1;background:none;border:0;border-right:2px solid var(--color-divider);padding:14px;
    font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)}
  .tab:last-child{border-right:0}
  .tab.on{background:var(--color-accent);color:#fff}
  label{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin:18px 0 7px}
  input{width:100%;border:2px solid var(--color-text);border-radius:0;padding:13px 14px;font:600 16px 'Archivo',sans-serif;color:var(--color-text);background:var(--color-bg)}
  input:focus{outline:none;border-color:var(--color-accent)}
  .primary{width:100%;margin:22px 0 0;background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:16px;
    font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .primary:hover{background:var(--color-accent-700)}
  .msg{margin:12px 0 0;font-size:13px;font-weight:700;min-height:18px}
  .msg.err{color:var(--color-accent)} .msg.ok{color:var(--color-neutral-800)}
  .note{font-size:12px;font-weight:600;color:var(--color-neutral-600);margin:14px 0 0;line-height:1.5;padding-bottom:22px}
  #root .panel>.msg,#root .panel>.note{padding-bottom:20px}
  .panel>.tabs+label,.panel>label:first-child{padding-top:4px}
  .primary+.msg{padding-bottom:22px}

  .who{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px;border-bottom:2px solid var(--color-divider)}
  .who .name{font-size:30px;font-weight:800;letter-spacing:-.01em}
  .logout{background:none;border:2px solid var(--color-text);border-radius:0;padding:9px 16px;
    font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text)}
  .logout:hover{background:var(--color-text);color:var(--color-bg)}

  .cards2{display:grid;grid-template-columns:1fr 1fr;padding:0!important;border-bottom:2px solid var(--color-divider)}
  .bigcard{padding:22px 26px;border-right:2px solid var(--color-divider)}
  .bigcard:last-child{border-right:0}
  .bigcard .n{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .bigcard .l{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-top:8px}
  .c-streak .n{color:var(--color-accent)}

  .total{padding:20px 26px;border-bottom:2px solid var(--color-divider);display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .total .big{font-size:30px;font-weight:800;letter-spacing:-.01em}
  .total .lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600)}

  .sec-title{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-neutral-600);padding-top:22px;padding-bottom:12px}
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:22px}
  .badge{text-align:center}
  .badge .m{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid var(--color-divider)}
  .badge.earned .m{background:var(--color-accent);border-color:var(--color-accent)}
  .badge.locked .m{background:var(--color-neutral-200);filter:grayscale(1);opacity:.5}
  .badge .cap{font-size:11px;font-weight:700;color:var(--color-neutral-700);margin-top:7px;line-height:1.2;display:block}
  .badge.earned .cap{color:var(--color-text)}

  .urow{display:flex;align-items:center;gap:14px;padding:12px 26px;margin:0 -26px;border-bottom:2px solid var(--color-divider)}
  .urow .ue{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:19px;border:2px solid var(--color-divider);flex:none}
  .urow .ut{font-size:14px;font-weight:700;flex:none;width:120px}
  .urow .ub{flex:1;height:8px;background:var(--color-neutral-300);overflow:hidden}
  .urow .ub > i{display:block;height:100%;background:var(--color-accent);width:0}
  .urow .un{font-size:12px;font-weight:800;color:var(--color-neutral-700);width:48px;text-align:right;flex:none}

  .lb{padding-bottom:8px}
  .lbrow{display:flex;align-items:center;gap:14px;padding:11px 26px;margin:0 -26px;border-bottom:2px solid var(--color-divider)}
  .lbrow.me{background:var(--color-accent-100);border-left:6px solid var(--color-accent);padding-left:20px}
  .lbrow .rk{font-size:16px;width:26px;text-align:center;flex:none;font-weight:800;color:var(--color-neutral-600)}
  .lbrow .nm{flex:1;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lbrow .pt{font-size:14px;font-weight:800;flex:none}
  .lbempty{font-size:13px;font-weight:600;color:var(--color-neutral-600);padding:12px 0}

  .classbox{border:2px solid var(--color-text);padding:16px;margin-bottom:20px}
  .classbox.joined{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--color-accent-100);border-color:var(--color-accent)}
  .classrow{display:flex;gap:0}
  .classrow input{flex:1;border-right:0;text-transform:uppercase;font-weight:700}
  .classrow button{background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:0 20px;
    font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

  .hwbox{margin-bottom:20px;border-top:2px solid var(--color-divider)}
  .hwrow{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:2px solid var(--color-divider);flex-wrap:wrap}
  .hwrow.done{opacity:.6}
  .hwrow .hwt{flex:1;font-size:14px;font-weight:700;min-width:130px}
  .hwrow .hwopen{background:var(--color-text)!important;color:var(--color-bg);border-radius:0;padding:8px 14px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
  .hwrow .hwopen:hover{background:var(--color-accent)!important}
  .hwrow .hwbtn{background:var(--color-accent);color:#fff;border:0;border-radius:0;padding:8px 14px;
    font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .hwrow .hwdone{font-size:16px}

  .pill{border:2px solid var(--color-text);padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--color-text);text-decoration:none;background:none}
  .pill:hover{background:var(--color-text);color:var(--color-bg)}

  .cta{display:block;text-align:center;margin:0 -26px;padding:20px;background:var(--color-accent);color:#fff;
    font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .cta:hover{background:var(--color-accent-700)}
  .foot{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:18px;border-top:2px solid var(--color-divider);
    font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-600)}
  @media(max-width:640px){
    .nav{display:none}.bar{padding:14px 20px}.wrap{padding:30px 20px 48px}h1{font-size:38px}
    .badges{grid-template-columns:repeat(3,1fr)}.urow .ut{width:92px}.foot{flex-direction:column;gap:6px}
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand"><i></i>English with Asya</span>
    <nav class="nav">
      <a href="index.html">Учебники</a>
      <a href="course.html">Курс</a>
      <a class="on" href="cabinet.html">Кабинет ученика</a>
      <a href="teacher.html">Кабинет учителя</a>
    </nav>
    <a class="pill" href="course.html">← К курсу</a>
  </div>
  <div class="wrap">
    <div style="font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent);margin-bottom:14px">Ученик / Student</div>
    <h1>Кабинет</h1>
    <div class="sub" id="sub">Вход и твой прогресс</div>
    <div id="root"></div>
    <div class="foot"><span>Made for @english.with_asya</span><span>англ + рус</span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="words.js"></script>
  <script src="sm-auth.js"></script>
  <script>
    let authTab="in";
    const INVITE=(new URLSearchParams(location.search)).get("code")||"";
    function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    function renderAuth(){
      document.getElementById("sub").textContent = SM.isCloud ? "Войди, чтобы прогресс сохранялся на всех устройствах" : "Введи имя — прогресс сохранится на этом устройстве";
      const cloud=SM.isCloud;
      document.getElementById("root").innerHTML=
        '<div class="panel">'+
        (cloud?'<div class="tabs"><button class="tab '+(authTab==="in"?"on":"")+'" onclick="setTab(\'in\')">Вход</button><button class="tab '+(authTab==="up"?"on":"")+'" onclick="setTab(\'up\')">Регистрация</button></div>':'')+
        ((!cloud||authTab==="up")?'<label>ИМЯ</label><input id="fName" placeholder="Например, Маша">':'')+
        (cloud?'<label>EMAIL (родителя)</label><input id="fEmail" type="email" placeholder="mail@example.com"><label>ПАРОЛЬ</label><input id="fPass" type="password" placeholder="минимум 6 символов">':'')+
        '<button class="primary" id="go">'+(cloud?(authTab==="in"?"Войти":"Создать аккаунт"):"Начать")+'</button>'+
        '<div class="msg" id="msg"></div>'+
        (cloud?'':'<div class="note">Настоящие аккаунты включаются подключением Supabase — см. SETUP-SUPABASE.md</div>')+
        '</div>';
      document.getElementById("go").onclick=submit;
    }
    function setTab(t){authTab=t;renderAuth();}
    async function submit(){
      const msg=document.getElementById("msg");msg.className="msg";msg.textContent="…";
      const name=(document.getElementById("fName")||{}).value||"";
      const email=(document.getElementById("fEmail")||{}).value||"";
      const pass=(document.getElementById("fPass")||{}).value||"";
      let res;
      if(!SM.isCloud)res=await SM.signUp(name,"","");
      else if(authTab==="up")res=await SM.signUp(name,email,pass);
      else res=await SM.signIn(email,pass);
      if(!res.ok){msg.className="msg err";msg.textContent=res.error||"Ошибка";return;}
      if(res.needConfirm){msg.className="msg ok";msg.textContent="Аккаунт создан! Проверь почту и подтверди email, потом войди.";return;}
      route();
    }

    function unitStats(progress){
      return SM_UNITS.map(u=>{const ids=u.words.map((w,i)=>u.id+"-"+i);
        const learned=ids.filter(id=>progress[id]&&progress[id].status==="learned").length;
        return {u,learned,total:ids.length,done:learned===ids.length};});
    }

    async function renderDash(user){
      document.getElementById("sub").textContent="Твой прогресс, серия и бейджи";
      const progress=await SM.loadProgress()||{};
      const meta=progress.__meta||{};
      const stats=unitStats(progress);
      const totalLearned=stats.reduce((s,x)=>s+x.learned,0);
      const totalWords=stats.reduce((s,x)=>s+x.total,0);
      const dayStreak=meta.dayStreak||0;
      const points=meta.totalPoints||0;
      const earnedCount=stats.filter(x=>x.done).length;

      const badges=stats.map(x=>
        '<div class="badge '+(x.done?"earned":"locked")+'"><div class="m">'+(x.done?x.u.emoji:"🔒")+'</div><span class="cap">'+esc(x.u.title)+'</span></div>'
      ).join("");
      const rows=stats.map(x=>
        '<div class="urow"><div class="ue">'+x.u.emoji+'</div><div class="ut">'+esc(x.u.title)+'</div><div class="ub"><i style="width:'+(x.total?x.learned/x.total*100:0)+'%"></i></div><div class="un">'+x.learned+'/'+x.total+'</div></div>'
      ).join("");

      // Класс: привязка к учителю
      let classHtml="";
      if(SM.isCloud){
        let prof=null; try{ prof=await SM.myProfile(); }catch(e){}
        if(prof && !prof.teacher_id && INVITE){ try{ const jr=await SM.joinTeacher(INVITE); if(jr.ok){ prof=await SM.myProfile(); } }catch(e){} }
        if(prof && prof.teacher_id){
          classHtml='<div class="classbox joined">👩‍🏫 Ты в классе учителя ✓</div>';
        } else {
          classHtml='<div class="classbox"><div class="sec-title">КОД УЧИТЕЛЯ</div>'+
            '<div class="classrow"><input id="tcode" placeholder="напр. AB12CD" maxlength="8" value="'+esc(INVITE)+'"><button id="tjoin">Войти в класс</button></div>'+
            '<div class="msg" id="tmsg"></div></div>';
        }
      }

      // Домашка от учителя
      let hwHtml="";
      if(SM.isCloud){
        let hw=[]; try{ hw=await SM.myAssignments(); }catch(e){}
        if(hw.length){
          const kinds={trainer:{i:"🎯",l:"Тренажёр",href:"trainer.html?unit="},games:{i:"🎮",l:"Игры",href:"games.html?u="},worksheet:{i:"✏️",l:"Лист",href:"worksheet.html?u="}};
          const rows=hw.map(a=>{const k=kinds[a.kind]||kinds.trainer;const uu=SM_UNITS.find(x=>x.id===a.unit_id);const lbl=uu?(uu.emoji+" "+esc(uu.title)):esc(a.unit_id);
            return '<div class="hwrow'+(a.done?" done":"")+'"><span class="hwt">'+k.i+' '+lbl+' · '+k.l+'</span>'+
              '<a class="hwopen" href="'+k.href+a.unit_id+'"'+(a.kind==="worksheet"?' target="_blank"':'')+'>Открыть</a>'+
              (a.done?'<span class="hwdone">✅</span>':'<button class="hwbtn" data-id="'+a.id+'">Выполнено</button>')+'</div>';
          }).join("");
          hwHtml='<div class="sec-title">📚 ДОМАШКА ОТ УЧИТЕЛЯ</div><div class="hwbox">'+rows+'</div>';
        }
      }

      // Speakout: курс, ДЗ по юнитам, материалы от учителя
      let spkHtml="";
      if(SM.isCloud){
        let course=null,shw=[],mats=[];
        try{course=await SM.myCourse();}catch(e){}
        try{shw=await SM.myHW();}catch(e){}
        try{mats=await SM.myMaterials();}catch(e){}
        const cL={"speakout-b1":"Speakout B1","speakout-b1plus":"Speakout B1+"};
        if(course||shw.length||mats.length){
          let p="";
          if(course)p+='<div class="hwrow"><span class="hwt">📘 Курс: '+(cL[course]||course)+'</span><a class="hwopen" href="'+course+'-course.html">Открыть</a></div>';
          shw.forEach(a=>{p+='<div class="hwrow'+(a.done?" done":"")+'"><span class="hwt">'+(cL[a.course]||a.course)+' · Unit '+a.unit+(a.note?' — '+esc(a.note):'')+'</span>'+
            '<a class="hwopen" href="'+a.course+'-u'+a.unit+'-grammar.html" style="background:#7c2340">📝 Грамматика</a>'+
            '<a class="hwopen" href="'+a.course+'-u'+a.unit+'.html" style="background:#2e6f4e">📚 Лексика/чанки</a>'+
            (a.done?'<span class="hwdone">✅</span>':'<button class="hwbtn spkdone" data-id="'+a.id+'">Выполнено</button>')+'</div>';});
          mats.forEach(m=>{p+='<div class="hwrow"><span class="hwt">🔗 '+esc(m.title)+(m.note?' — '+esc(m.note):'')+'</span><a class="hwopen" href="'+esc(m.url)+'" target="_blank" rel="noopener">Открыть</a></div>';});
          spkHtml='<div class="sec-title">🎓 SPEAKOUT — ОТ УЧИТЕЛЯ</div><div class="hwbox">'+p+'</div>';
        } else {
          let prof2=null; try{ prof2=await SM.myProfile(); }catch(e){}
          if(prof2 && prof2.teacher_id)
            spkHtml='<div class="sec-title">🎓 КУРС</div><div class="hwbox"><div class="hwrow"><span class="hwt">Учитель ещё не назначил курс. Загляни сюда позже 🙂</span></div></div>';
        }
      }

      // Таблица лидеров за неделю
      let board=[]; try{ board=await SM.leaderboard(); }catch(e){}
      const medals=["🥇","🥈","🥉"];
      let lb;
      if(!SM.isCloud){ lb=""; }
      else if(!board.length){ lb='<div class="sec-title">🏆 ТАБЛИЦА ЛИДЕРОВ · ЗА НЕДЕЛЮ</div><div class="lb"><div class="lbempty">Пока никто не набрал очков на этой неделе. Будь первым! 💪</div></div>'; }
      else {
        let mine=false;
        const items=board.map((r,i)=>{
          const me=(!mine && r.name===user.name); if(me)mine=true;
          return '<div class="lbrow'+(me?" me":"")+'"><div class="rk">'+(medals[i]||(i+1))+'</div><div class="nm">'+esc(r.name)+(me?" (ты)":"")+'</div><div class="pt">⭐ '+(r.week_points||0)+'</div></div>';
        }).join("");
        lb='<div class="sec-title">🏆 ТАБЛИЦА ЛИДЕРОВ · ЗА НЕДЕЛЮ</div><div class="lb">'+items+'</div>';
      }

      document.getElementById("root").innerHTML=
        '<div class="panel">'+
          '<div class="who"><div class="name">Привет, '+esc(user.name)+'!</div><button class="logout" id="out">Выйти</button></div>'+
          '<div class="cards2">'+
            '<div class="bigcard c-streak"><div class="n">🔥 '+dayStreak+'</div><div class="l">дней подряд</div></div>'+
            '<div class="bigcard c-pts"><div class="n">⭐ '+points+'</div><div class="l">очков</div></div>'+
          '</div>'+
          '<div class="total"><div class="big">'+totalLearned+' / '+totalWords+'</div><div class="lbl">выучено слов</div></div>'+
          classHtml+
          hwHtml+
          spkHtml+
          '<div class="sec-title">БЕЙДЖИ ЗА ЮНИТЫ · '+earnedCount+' / '+stats.length+'</div>'+
          '<div class="badges">'+badges+'</div>'+
          '<div class="sec-title">ПРОГРЕСС ПО ЮНИТАМ</div>'+
          rows+
          lb+
          '<div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:6px;padding-bottom:22px"><a class="pill" href="review.html">Мои слова</a><a class="pill" href="pet.html">Мой питомец</a><a class="pill" href="pronounce.html">Произношение</a></div>'+
          '<a class="cta" href="trainer.html">Продолжить учить слова →</a>'+
        '</div>';
      document.getElementById("out").onclick=async()=>{await SM.signOut();route();};
      var jb=document.getElementById("tjoin");
      if(jb){ jb.onclick=async()=>{
        var m=document.getElementById("tmsg");m.className="msg";m.textContent="…";
        var code=(document.getElementById("tcode").value||"").trim();
        if(!code){m.className="msg err";m.textContent="Введи код";return;}
        var r=await SM.joinTeacher(code);
        if(r.ok){m.className="msg ok";m.textContent="Готово! Ты в классе 🎉";setTimeout(()=>renderDash(user),700);}
        else {m.className="msg err";m.textContent=r.error||"Код не найден";}
      };}
      document.querySelectorAll(".hwbtn:not(.spkdone)").forEach(b=>{ b.onclick=async()=>{
        b.textContent="…"; const r=await SM.markAssignment(b.dataset.id,true);
        if(r.ok) renderDash(user); else b.textContent="Выполнено";
      };});
      document.querySelectorAll(".spkdone").forEach(b=>{ b.onclick=async()=>{
        b.textContent="…"; const r=await SM.setHWDone(b.dataset.id,true);
        if(r.ok) renderDash(user); else b.textContent="Выполнено";
      };});
    }

    async function route(){ const user=await SM.getUser(); if(user)renderDash(user); else renderAuth(); }
    route();
  </script>
