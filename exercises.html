<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Упражнения · English with Asya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4ece0;font-family:'Nunito',sans-serif;color:#241a18;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none}
  .home{position:fixed;top:12px;left:12px;z-index:9;background:#7c2340;color:#fff;padding:9px 16px;border-radius:999px;font:800 14px 'Nunito',sans-serif;box-shadow:0 4px 0 #e0d5c2}
  .wrap{max-width:640px;margin:0 auto;padding:64px 18px 56px}
  h1{margin:0;text-align:center;font-size:clamp(26px,6vw,40px);font-weight:700;color:#7c2340;letter-spacing:-1px}
  .sub{text-align:center;margin:8px 0 20px;font:800 14px 'Nunito',sans-serif;color:#5c534d}
  .card{background:#fffdf8;border-radius:22px;box-shadow:0 8px 0 #e0d5c2;padding:22px;margin-bottom:18px}
  .qt{font-size:20px;font-weight:600;margin-bottom:6px}
  .kind{font:900 10px 'Nunito',sans-serif;color:#b5654a;letter-spacing:1px;margin-bottom:8px}
  .opts{display:grid;gap:10px;margin-top:10px}
  .opt{background:#f4ece0;border:1px solid #e0d5c2;border-radius:14px;padding:14px;font-size:18px;font-weight:600;text-align:left}
  .opt.correct{background:#dff0d2;border-color:#7cb342;color:#3f8f5c}
  .opt.wrong{background:#fbeae4;border-color:#7c2340;color:#7b2412}
  .field{display:flex;gap:8px;margin-top:6px}
  .field input{flex:1;border:1px solid #e0d5c2;border-radius:12px;padding:12px 14px;font:700 18px 'Nunito',sans-serif;background:#f4ece0}
  .field input:focus{outline:none;border-color:#7c2340}
  .check{background:#7c2340;color:#fff;border-radius:12px;padding:0 20px;font:800 15px 'Nunito',sans-serif}
  .fb{margin-top:10px;font:800 14px 'Nunito',sans-serif;min-height:18px}
  .fb.ok{color:#3f8f5c}.fb.no{color:#7b2412}
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:8px}
  .pc{background:#f4ece0;border:1px solid #e0d5c2;border-radius:12px;padding:13px 10px;font-size:17px;font-weight:600;text-align:center}
  .pc.sel{border-color:#7c2340;background:#fbeef1}
  .pc.pcimg{padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .pc.pcimg img{width:100%;max-height:108px;object-fit:contain;border-radius:8px;display:block}
  .pc.pcimg span{font-size:15px;line-height:1.2}
  .pc.done{opacity:0;pointer-events:none;transition:opacity .35s}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .word{background:#fffdf8;border:1px solid #e0d5c2;border-radius:12px;padding:9px 13px;font-size:17px;font-weight:600}
  .word.used{opacity:.25;pointer-events:none}
  .built{min-height:40px;border-bottom:3px dashed #e0d5c2;margin-top:12px;padding:6px 4px;font-size:20px;font-weight:700;color:#7c2340}
  .tf{display:flex;gap:10px;margin-top:10px}
  .tf button{flex:1;border-radius:14px;padding:14px;font:800 16px 'Nunito',sans-serif;border:1px solid #e0d5c2;background:#f4ece0}
  .tf button.correct{background:#dff0d2;border-color:#7cb342;color:#3f8f5c}
  .tf button.wrong{background:#fbeae4;border-color:#7c2340;color:#7b2412}
  .empty{background:#fffdf8;border-radius:22px;box-shadow:0 8px 0 #e0d5c2;padding:26px;text-align:center;font:700 14px 'Nunito',sans-serif;color:#7d726a}
  .empty a{color:#7c2340;text-decoration:underline;font-weight:900}
  .foot{text-align:center;font:700 13px 'Nunito',sans-serif;color:#7d726a;margin-top:30px}
  .sechead{display:flex;align-items:center;gap:12px;margin:28px 4px 14px;font:900 14px 'Nunito',sans-serif;color:#7c2340;letter-spacing:1.5px;text-transform:uppercase}
  .sechead::after{content:"";flex:1;height:3px;background:#e0d5c2;border-radius:2px}
  .tbar{display:flex;justify-content:flex-end;gap:6px;margin:0 2px 6px;align-items:center}
  .tbar button,.tbar a{background:#fffdf8;border:1px solid #e0d5c2;border-radius:10px;padding:4px 12px;font:800 14px 'Nunito',sans-serif;color:#5c534d;text-decoration:none;cursor:pointer}
  .tbar button:hover,.tbar a:hover{border-color:#7c2340;color:#7c2340}
  /* Выбор блоков в домашку */
  .pick{margin-right:auto;display:inline-flex;align-items:center;gap:7px;font:800 13px 'Nunito',sans-serif;color:#5c534d;cursor:pointer}
  .pick input{width:19px;height:19px;accent-color:#7c2340;cursor:pointer}
  .exwrap.on{outline:3px solid #7c2340;outline-offset:6px;border-radius:24px}
  .sechead .sec-all{margin-left:auto;background:#fffdf8;border:1px solid #e0d5c2;border-radius:10px;
    padding:3px 11px;font:800 11px 'Nunito',sans-serif;color:#5c534d;letter-spacing:.5px;cursor:pointer}
  .sechead .sec-all:hover{border-color:#7c2340;color:#7c2340}
  .sechead::after{order:9}
  /* Нижняя панель выбора */
  .picker{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#241a18;color:#fff;
    padding:13px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    box-shadow:0 -6px 24px rgba(0,0,0,.22);transform:translateY(110%);transition:transform .22s cubic-bezier(.16,1,.3,1)}
  .picker.show{transform:translateY(0)}
  .picker .n{font:900 15px 'Nunito',sans-serif}
  .picker .sp{flex:1}
  .picker .go{background:#7c2340;color:#fff;border-radius:999px;padding:11px 20px;font:800 14px 'Nunito',sans-serif}
  .picker .clr{background:transparent;color:#e0d5c2;border:2px solid #6a6664;border-radius:999px;padding:9px 16px;font:800 13px 'Nunito',sans-serif}
  .picker .clr:hover{color:#fff;border-color:#fff}
  @media(prefers-reduced-motion:reduce){.picker{transition:none}}
  /* Окно отправки в домашку */
  .ovl{position:fixed;inset:0;z-index:30;background:rgba(32,30,29,.55);display:flex;
    align-items:center;justify-content:center;padding:18px}
  .dlg{background:#fffdf8;border-radius:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
    padding:24px;box-shadow:0 14px 0 #e0d5c2}
  .dlg h3{margin:0 0 4px;font:800 21px 'Nunito',sans-serif;color:#241a18}
  .dlg .lead{margin:0 0 16px;font:600 14px 'Nunito',sans-serif;color:#5c534d}
  .dlg .lb{display:block;font:900 10px 'Nunito',sans-serif;letter-spacing:1.2px;
    text-transform:uppercase;color:#8a8280;margin:15px 0 7px}
  .dlg .stu{display:flex;flex-wrap:wrap;gap:9px}
  .dlg .stu label{display:inline-flex;align-items:center;gap:7px;background:#f4ece0;border:1px solid #e0d5c2;
    border-radius:12px;padding:8px 12px;font:700 14px 'Nunito',sans-serif;cursor:pointer}
  .dlg .stu label:has(input:checked){border-color:#7c2340;background:#fbeef1}
  .dlg .stu input{width:17px;height:17px;accent-color:#7c2340}
  .dlg input[type=date],.dlg input[type=text]{width:100%;border:1px solid #e0d5c2;border-radius:12px;
    padding:11px 13px;font:700 15px 'Nunito',sans-serif;background:#f4ece0}
  .dlg input:focus{outline:none;border-color:#7c2340}
  .dlg .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .dlg .quick button{background:#f4ece0;border:1px solid #e0d5c2;border-radius:999px;padding:7px 13px;
    font:800 12px 'Nunito',sans-serif;color:#5c534d}
  .dlg .quick button.on{background:#7c2340;border-color:#7c2340;color:#fff}
  .dlg .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .dlg .send{flex:1;background:#7c2340;color:#fff;border-radius:14px;padding:14px;font:800 15px 'Nunito',sans-serif}
  .dlg .send:disabled{opacity:.55}
  .dlg .cancel{background:#f4ece0;border:1px solid #e0d5c2;border-radius:14px;padding:13px 20px;
    font:800 14px 'Nunito',sans-serif;color:#5c534d}
  .dlg .out{margin-top:13px;font:700 13.5px 'Nunito',sans-serif;min-height:18px}
  .dlg .out.bad{color:#7b2412}
  .dlg .out.ok{color:#3f8f5c}
  .dlg .exlist{margin:0;padding-left:19px;font:600 13.5px 'Nunito',sans-serif;color:#5c534d;line-height:1.6}
</style>

<body>
  <a class="home" href="units.html">← Юниты</a>
  <div class="wrap">
    <h1>🧩 Упражнения</h1>
    <div class="sub" id="sub">от твоего учителя</div>
    <div id="root"><div class="empty">Загрузка…</div></div>
    <div class="foot">Made for @english.with_asya</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="words.js?v=6dc57848"></script>
<script src="course-words.js?v=442908de"></script>
<script src="speakout-words.js?v=3094c556"></script>
  <script src="sm-auth.js?v=1a8f02f9"></script>
  <script src="sm-play.js?v=dd356834"></script>
  <script>
    function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function speak(t){if(window.SM_speak)return SM_speak(t);try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
    function norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[.!?,]/g,"");}
    const KIND={choice:"ВЫБОР ОТВЕТА",gap:"ВПИШИ СЛОВО",match:"НАЙДИ ПАРУ",order:"ПОРЯДОК СЛОВ",tf:"ВЕРНО / НЕВЕРНО",listen:"АУДИРОВАНИЕ",multi:"НЕСКОЛЬКО ОТВЕТОВ",categorize:"КАТЕГОРИИ",cloze:"ПРОПУСКИ-ВЫБОР",letters:"СОБЕРИ СЛОВО",fillbox:"ВПИШИ ИЗ БАНКА",text:"ТЕКСТ",image:"КАРТИНКА",video:"ВИДЕО",audio:"АУДИО",dialogue:"ДИАЛОГ",note:"ЗАМЕТКА",open:"ОТКРЫТЫЙ ВОПРОС",embed:"ИНТЕРАКТИВ",shadow:"SHADOWING · СЛУШАЙ И ПОВТОРЯЙ",reading:"ЧТЕНИЕ · ЭКЗАМЕН",tfns:"TRUE / FALSE / NOT STATED",wordform:"СЛОВООБРАЗОВАНИЕ",headings:"ПОДБЕРИ ЗАГОЛОВКИ"};

    const q=new URLSearchParams(location.search);
    const uid=q.get("u")||(SM_UNITS[0]&&SM_UNITS[0].id);
    const unit=SM_UNITS.find(x=>x.id===uid);
    document.getElementById("sub").textContent=(unit?unit.emoji+" "+unit.title:"")+" · упражнения";

    function card(inner){const d=document.createElement("div");d.className="card";d.innerHTML=inner;return d;}

    function renderChoice(e){
      const c=card('<div class="kind">'+KIND.choice+'</div><div class="qt">'+esc(e.data.q)+'</div><div class="opts"></div><div class="fb" ></div>');
      const box=c.querySelector(".opts"),fb=c.querySelector(".fb");let done=false;
      e.data.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;
        b.onclick=()=>{if(done)return;done=true;const ok=i===e.data.correct;
          if(ok){b.classList.add("correct");fb.className="fb ok";fb.textContent="Верно! 🎉";}
          else{b.classList.add("wrong");[...box.children][e.data.correct].classList.add("correct");fb.className="fb no";fb.textContent="Правильный ответ подсвечен";}};
        box.appendChild(b);});
      return c;
    }
    function renderGap(e){
      const parts=esc(e.data.q).split("___");
      const c=card('<div class="kind">'+KIND.gap+'</div><div class="qt">'+parts[0]+' <span style="color:#b5654a">___</span> '+(parts[1]||"")+'</div><div class="field"><input placeholder="впиши слово"><button class="check">OK</button></div><div class="fb"></div>');
      const inp=c.querySelector("input"),fb=c.querySelector(".fb");
      const ans=e.data.answer.split(",").map(norm);
      function go(){const ok=ans.includes(norm(inp.value));inp.style.borderColor=ok?"#7cb342":"#7c2340";inp.style.background=ok?"#dff0d2":"#fbeae4";
        if(ok){fb.className="fb ok";fb.textContent="Верно! 🎉";}else{fb.className="fb no";fb.textContent="Ответ: "+esc(e.data.answer.split(",")[0].trim());}}
      c.querySelector(".check").onclick=go;inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
      return c;
    }
    function renderMatch(e){
      const c=card('<div class="kind">'+KIND.match+'</div><div class="qt">Соедини пары</div><div class="pairs"></div><div class="fb"></div>');
      const box=c.querySelector(".pairs"),fb=c.querySelector(".fb");
      const left=shuffle(e.data.pairs.map((p,i)=>({t:p.a,img:p.ia,i}))),right=shuffle(e.data.pairs.map((p,i)=>({t:p.b,img:p.ib,i})));
      const rows=Math.max(left.length,right.length);let sel=null,left_n=e.data.pairs.length;
      for(let r=0;r<rows;r++){[left[r],right[r]].forEach((it,col)=>{const b=document.createElement("button");b.className="pc";b.dataset.i=it?it.i:"-";b.dataset.side=col;if(!it)b.style.visibility="hidden";
        /* у стороны может быть картинка, текст или и то и другое */
        if(it&&it.img){ b.classList.add("pcimg");
          b.innerHTML='<img src="'+esc(it.img)+'" alt="'+esc(it.t||"")+'">'+(it.t?'<span>'+esc(it.t)+'</span>':""); }
        else b.textContent=it?it.t:"";
        b.onclick=()=>{ if(b.classList.contains("done"))return;
          if(!sel){sel=b;b.classList.add("sel");if(col===0&&it.t)speak(it.t);return;}
          if(sel===b){b.classList.remove("sel");sel=null;return;}
          if(sel.dataset.side===b.dataset.side){sel.classList.remove("sel");sel=b;b.classList.add("sel");return;}
          if(sel.dataset.i===b.dataset.i){sel.classList.add("done");b.classList.add("done");sel.classList.remove("sel");sel=null;left_n--;if(left_n===0){fb.className="fb ok";fb.textContent="Все пары найдены! 🎉";}}
          else{const s=sel;s.classList.add("wrong");b.classList.add("wrong");setTimeout(()=>{s.classList.remove("wrong","sel");b.classList.remove("wrong");},500);sel=null;}};
        box.appendChild(b);});}
      return c;
    }
    function renderOrder(e){
      const c=card('<div class="kind">'+KIND.order+'</div><div class="qt">Собери предложение</div><div class="built"></div><div class="words"></div><div class="field" style="margin-top:10px"><button class="check">Проверить</button></div><div class="fb"></div>');
      const words=e.data.answer.split(/\s+/);const shuf=shuffle(words.map((w,i)=>({w,i})));
      const wbox=c.querySelector(".words"),built=c.querySelector(".built"),fb=c.querySelector(".fb");let seq=[];
      shuf.forEach(o=>{const b=document.createElement("button");b.className="word";b.textContent=o.w;
        b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");seq.push({w:o.w,el:b});draw();};wbox.appendChild(b);});
      built.onclick=()=>{const last=seq.pop();if(last)last.el.classList.remove("used");draw();};
      function draw(){built.textContent=seq.map(x=>x.w).join(" ");}
      c.querySelector(".check").onclick=()=>{const ok=norm(seq.map(x=>x.w).join(" "))===norm(e.data.answer);
        if(ok){fb.className="fb ok";fb.textContent="Верно! 🎉";speak(e.data.answer);}else{fb.className="fb no";fb.textContent="Правильно: "+esc(e.data.answer);}};
      return c;
    }
    function renderTF(e){
      const c=card('<div class="kind">'+KIND.tf+'</div><div class="qt">'+esc(e.data.statement)+'</div><div class="tf"><button data-v="true">✅ Верно</button><button data-v="false">❌ Неверно</button></div><div class="fb"></div>');
      const fb=c.querySelector(".fb");let done=false;
      c.querySelectorAll(".tf button").forEach(b=>b.onclick=()=>{if(done)return;done=true;const chose=b.dataset.v==="true";const ok=chose===e.data.correct;
        b.classList.add(ok?"correct":"wrong");if(!ok){[...c.querySelectorAll(".tf button")].find(x=>(x.dataset.v==="true")===e.data.correct).classList.add("correct");}
        fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Верно! 🎉":"Не угадал";});
      return c;
    }
    function renderListen(e){
      const c=card('<div class="kind">'+KIND.listen+'</div><div style="text-align:center;margin:6px 0"><button class="check" style="font-size:26px;padding:14px 22px;border-radius:50%">🔊</button></div><div class="qt" style="text-align:center;font-size:15px;color:#a3968a">послушай и впиши</div><div class="field"><input placeholder="впиши, что услышал"><button class="check ok2">OK</button></div><div class="fb"></div>');
      const btn=c.querySelector(".check"),inp=c.querySelector("input"),fb=c.querySelector(".fb");
      const ans=e.data.answer.split(",").map(norm);
      /* если учитель приложил свой файл — играем его, иначе читает синтез речи */
      let au=null;
      if(e.data.src){ au=new Audio(e.data.src); au.preload="metadata"; }
      const play=()=>{ if(au){ try{au.currentTime=0;}catch(x){} au.play().catch(()=>speak(e.data.audio)); } else speak(e.data.audio); };
      btn.onclick=play; setTimeout(play,400);
      function go(){const ok=ans.includes(norm(inp.value));inp.style.borderColor=ok?"#7cb342":"#7c2340";inp.style.background=ok?"#dff0d2":"#fbeae4";fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Верно! 🎉":"Ответ: "+esc(e.data.answer.split(",")[0].trim());}
      c.querySelector(".ok2").onclick=go;inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")go();});
      return c;
    }
    function renderMulti(e){
      const c=card('<div class="kind">'+KIND.multi+'</div><div class="qt">'+esc(e.data.q)+'</div><div class="opts"></div><div class="field" style="margin-top:8px"><button class="check">Проверить</button></div><div class="fb"></div>');
      const box=c.querySelector(".opts"),fb=c.querySelector(".fb");const chosen=new Set();
      e.data.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;
        b.onclick=()=>{ if(chosen.has(i)){chosen.delete(i);b.style.background="#f4ece0";b.style.borderColor="#e0d5c2";}else{chosen.add(i);b.style.background="#ece2d3";b.style.borderColor="#7cb342";} };
        box.appendChild(b);});
      c.querySelector(".check").onclick=()=>{const cor=new Set(e.data.correct);const ok=chosen.size===cor.size&&[...chosen].every(i=>cor.has(i));
        [...box.children].forEach((b,i)=>{ if(cor.has(i))b.classList.add("correct"); else if(chosen.has(i))b.classList.add("wrong"); });
        fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Верно! 🎉":"Правильные подсвечены";};
      return c;
    }
    function renderCategorize(e){
      const c=card('<div class="kind">'+KIND.categorize+'</div><div class="qt">Разложи по категориям</div><div class="catitems"></div><div class="field" style="margin-top:8px"><button class="check">Проверить</button></div><div class="fb"></div>');
      const box=c.querySelector(".catitems"),fb=c.querySelector(".fb");
      const items=[]; e.data.cats.forEach((cat,ci)=>cat.items.forEach(it=>items.push({t:it,ci})));
      const opts=e.data.cats.map((cat,ci)=>'<option value="'+ci+'">'+esc(cat.name)+'</option>').join("");
      shuffle(items).forEach(it=>{const d=document.createElement("div");d.style.cssText="display:flex;align-items:center;gap:8px;margin-bottom:8px";
        d.innerHTML='<span style="flex:1;font-size:17px;font-weight:600">'+esc(it.t)+'</span><select data-c="'+it.ci+'" style="border:1px solid #e0d5c2;border-radius:10px;padding:8px;font:700 14px \'Nunito\',sans-serif;background:#f4ece0">'+opts+'</select>';
        box.appendChild(d);});
      c.querySelector(".check").onclick=()=>{let good=0,tot=0;box.querySelectorAll("select").forEach(s=>{tot++;const ok=String(s.dataset.c)===s.value;s.style.borderColor=ok?"#7cb342":"#7c2340";s.style.background=ok?"#dff0d2":"#fbeae4";if(ok)good++;});
        fb.className="fb "+(good===tot?"ok":"no");fb.textContent=good===tot?"Всё верно! 🎉":("Верно "+good+" из "+tot);};
      return c;
    }
    function renderCloze(e){
      const parts=e.data.q.split(/(\[\[.*?\]\])/g);
      let html='<div class="kind">'+KIND.cloze+'</div><div class="qt" style="line-height:2.1"></div><div class="field" style="margin-top:8px"><button class="check">Проверить</button></div><div class="fb"></div>';
      const c=card(html); const qt=c.querySelector(".qt"),fb=c.querySelector(".fb");

    async function loadAndRender(){
      const root=document.getElementById("root");
      /* Юнит в ссылке может быть из другого учебника, чем выбран сейчас.
         Раньше упражнения искались в текущем курсе, не находились, и страница

      let cid = SM_COURSE.id;

        if(own && own !== cid){
          cid = own;
          if(window.SM_useCourse){ SM_useCourse(cid); }

      if(loadErr){ root.innerHTML='<div class="empty">Не удалось загрузить упражнения (нет связи с базой). Обнови страницу.</div>'; return; }
      if(!SM.isCloud){ root.innerHTML='<div class="empty">Упражнения работают с настоящими аккаунтами (Supabase).</div>'; return; }
      if(!ex.length){ root.innerHTML='<div class="empty">Для этого юнита пока нет упражнений.<br>Учитель может создать их в <a href="builder.html?u='+encodeURIComponent(uid)+'">Конструкторе</a>.</div>'; return; }

      EX_ALL = ex;
      /* Ученик пришёл по заданию — оставляем только заданные блоки, в порядке урока */
      if(HW_ONLY && HW_ONLY.length){
        const keep = new Set(HW_ONLY);
        ex = ex.filter(e => keep.has(e.id));
        if(!ex.length){
          root.innerHTML='<div class="empty">Упражнений из этого задания больше нет в уроке — похоже, учитель их изменил. Напиши ему в чат.</div>';
          return;
        }
      }

      root.innerHTML="";
      let lastSection=null;
      ex.forEach((e,idx)=>{
        if(e.section&&e.section!==lastSection){
          const sh=document.createElement("div"); sh.className="sechead";
          sh.appendChild(document.createTextNode(e.section));
          if(IS_TEACHER && !HW_ONLY){
            const sa=document.createElement("button"); sa.className="sec-all"; sa.type="button";
            sa.textContent="выбрать всё"; sa.dataset.sec=e.section;
            sa.onclick=()=>toggleSection(e.section, sa);
            sh.appendChild(sa);
          }
          root.appendChild(sh); lastSection=e.section;
        }
        if(!e.section) lastSection=null;
        /* data-exid и data-extype читает sm-progress.js, чтобы записать результат упражнения */
        const wrap=document.createElement("div"); wrap.className="exwrap";
        wrap.dataset.ex=e.id; wrap.setAttribute("data-exid",e.id); wrap.setAttribute("data-extype",e.type);
        root.appendChild(wrap);
        if(IS_TEACHER){
          const bar=document.createElement("div"); bar.className="tbar";
          if(!HW_ONLY){
            const lab=document.createElement("label"); lab.className="pick";
            const cb=document.createElement("input"); cb.type="checkbox"; cb.dataset.ex=e.id;
            cb.checked=PICKED.has(e.id);
            cb.onchange=()=>{ cb.checked ? PICKED.add(e.id) : PICKED.delete(e.id); wrap.classList.toggle("on",cb.checked); drawPicker(); };
            lab.appendChild(cb); lab.appendChild(document.createTextNode("в домашку"));
            bar.appendChild(lab);
            wrap.classList.toggle("on", PICKED.has(e.id));
          }
          const btns=document.createElement("span");
          btns.innerHTML='<button data-d="-1" title="переместить выше">↑</button><button data-d="1" title="переместить ниже">↓</button><a href="builder.html?u='+encodeURIComponent(uid)+'&edit='+e.id+'" title="редактировать в конструкторе">✎</a>';
          btns.querySelectorAll("button").forEach(b=>b.onclick=()=>moveEx(ex,idx,parseInt(b.dataset.d,10)));
          bar.appendChild(btns);
          wrap.appendChild(bar);
        }
        if(e.title){const hd=document.createElement("div");hd.style.cssText="font:800 15px 'Nunito',sans-serif;color:#5c534d;margin:4px 4px 8px";hd.textContent=e.title;wrap.appendChild(hd);}
        const fn=R[e.type];
        if(!fn){ wrap.appendChild(warnCard('<div class="kind">⚠️ '+esc(e.type)+'</div><div class="qt">Этот тип упражнения не поддерживается этой страницей. Обнови страницу жёстко (Ctrl+Shift+R).</div>')); return; }
        const items=(e.data&&e.data.items&&e.data.items.length)?e.data.items:[e.data];
        items.forEach((item,i)=>{ try{ const el=fn({type:e.type,data:item});
          if(item&&item.img){ const im=document.createElement("img"); im.src=item.img; im.alt=""; im.style.cssText="max-width:100%;border-radius:14px;display:block;margin:2px auto 12px"; const k=el.querySelector(".kind"); if(k) k.insertAdjacentElement("afterend",im); else el.insertBefore(im,el.firstChild); }
          wrap.appendChild(el); }catch(err){ wrap.appendChild(warnCard('<div class="kind">⚠️ ОШИБКА</div><div class="qt">Упражнение «'+esc(e.title||"без названия")+'» не удалось отобразить. Открой его в Конструкторе, проверь поля и пересохрани.</div>')); } });
      });
    }
    /* ---------- Выбор блоков и отправка в домашку ---------- */

    function exLabel(e){
      return (e.title && e.title.trim()) ? e.title.trim() : (KIND[e.type] || e.type);
    }
    function plural(n, forms){
      const t=n%100, o=n%10;
      return n+" "+((t>10&&t<20)?forms[2]:(o===1)?forms[0]:(o>=2&&o<=4)?forms[1]:forms[2]);
    }
    function toggleSection(sec, btn){
      const ids = EX_ALL.filter(e => e.section === sec).map(e => e.id);
      const allOn = ids.every(id => PICKED.has(id));
      ids.forEach(id => allOn ? PICKED.delete(id) : PICKED.add(id));
      btn.textContent = allOn ? "выбрать всё" : "снять всё";
      document.querySelectorAll(".pick input").forEach(cb => {
        cb.checked = PICKED.has(cb.dataset.ex);
        const w = cb.closest(".exwrap"); if (w) w.classList.toggle("on", cb.checked);
      });
      drawPicker();
    }
    function clearPicked(){
      PICKED.clear();
      document.querySelectorAll(".pick input").forEach(cb => { cb.checked=false; const w=cb.closest(".exwrap"); if(w) w.classList.remove("on"); });
      document.querySelectorAll(".sec-all").forEach(b => b.textContent="выбрать всё");
      drawPicker();
    }
    function drawPicker(){
      let bar = document.getElementById("picker");
      if(!bar){
        bar = document.createElement("div"); bar.id="picker"; bar.className="picker";
        bar.innerHTML = '<span class="n" id="pickN"></span><span class="sp"></span>' +
          '<button class="clr" id="pickClr">Снять выбор</button>' +
          '<button class="go" id="pickGo">В домашнюю работу</button>';
        document.body.appendChild(bar);
        document.getElementById("pickClr").onclick = clearPicked;
        document.getElementById("pickGo").onclick = openSendDialog;
      }
      const n = PICKED.size;
      document.getElementById("pickN").textContent = "Выбрано " + plural(n, ["упражнение","упражнения","упражнений"]);
      bar.classList.toggle("show", n > 0);
    }

    function dateAfter(days){
      const d=new Date(); d.setDate(d.getDate()+days);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    }

    async function openSendDialog(){
      if(!PICKED.size) return;
      const ids = EX_ALL.filter(e => PICKED.has(e.id)).map(e => e.id); /* порядок как в уроке */
      const picked = EX_ALL.filter(e => PICKED.has(e.id));

      let students=[]; try{ students = (await SM.myStudents())||[]; }catch(e){}

      const ovl=document.createElement("div"); ovl.className="ovl"; ovl.id="sendOvl";
      ovl.innerHTML =
        '<div class="dlg">' +
          '<h3>В домашнюю работу</h3>' +
          '<p class="lead">'+plural(picked.length,["упражнение","упражнения","упражнений"])+' из урока «'+esc(unit?unit.title:uid)+'»</p>' +
          '<ol class="exlist">'+picked.map(e=>'<li>'+esc(exLabel(e))+'</li>').join("")+'</ol>' +
          '<span class="lb">Кому</span>' +
          (students.length
            ? '<div class="stu">'+students.map(s=>'<label><input type="checkbox" class="sStu" value="'+esc(s.student_id)+'" checked> '+esc(s.name)+'</label>').join("")+'</div>'
            : '<div class="lead">В классе пока нет учеников — пригласи их в разделе «Мой класс».</div>') +
          '<span class="lb">Срок</span>' +
          '<input type="date" id="sDue">' +
          '<div class="quick">' +
            '<button type="button" data-d="1">Завтра</button>' +
            '<button type="button" data-d="3">Через 3 дня</button>' +
            '<button type="button" data-d="7">Через неделю</button>' +
            '<button type="button" data-d="">Без срока</button>' +
          '</div>' +
          '<span class="lb">Комментарий</span>' +
          '<input type="text" id="sMsg" maxlength="300" placeholder="на что обратить внимание (необязательно)">' +
          '<div class="acts">' +
            '<button class="send" id="sGo"'+(students.length?'':' disabled')+'>Отправить</button>' +
            '<button class="cancel" id="sNo">Отмена</button>' +
          '</div>' +
          '<div class="out" id="sOut"></div>' +
        '</div>';
      document.body.appendChild(ovl);

      const close=()=>ovl.remove();
      ovl.onclick=e=>{ if(e.target===ovl) close(); };
      document.getElementById("sNo").onclick=close;

      ovl.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{
        const d=b.dataset.d;
        document.getElementById("sDue").value = d==="" ? "" : dateAfter(+d);
        ovl.querySelectorAll(".quick button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
      });

      document.getElementById("sGo").onclick=async ()=>{
        const go=document.getElementById("sGo"), out=document.getElementById("sOut");
        const targets=[].slice.call(ovl.querySelectorAll(".sStu")).filter(c=>c.checked).map(c=>c.value);
        if(!targets.length){ out.className="out bad"; out.textContent="Отметь, кому отправить."; return; }

        const note=JSON.stringify({
          ex: ids,
          unitId: uid,
          due: document.getElementById("sDue").value||null,
          msg: document.getElementById("sMsg").value||""
        });

        go.disabled=true;
        const ok=[], bad=[];
        for(let i=0;i<targets.length;i++){
          go.textContent="Отправляю… "+(i+1)+" из "+targets.length;
          let r;
          try{ r = await SM.addHW(targets[i], SM_COURSE.id, 0, note); }
          catch(err){ r={ok:false,error:String(err&&err.message||err)}; }
          const nm=(students.filter(s=>s.student_id===targets[i])[0]||{}).name||"ученик";
          if(r&&r.ok) ok.push(nm); else bad.push(nm+" — "+((r&&r.error)||"ошибка"));
        }
        go.disabled=false; go.textContent="Отправить";
        out.className = bad.length ? "out bad" : "out ok";
        out.textContent = (ok.length?"Отправлено: "+ok.join(", "):"") + (bad.length?(ok.length?" · ":"")+"Не вышло: "+bad.join("; "):"");
        if(ok.length && !bad.length){ setTimeout(()=>{ close(); clearPicked(); }, 1200); }
      };
    }

    /* ---------- Ученик: работа по конкретному заданию ---------- */
    async function loadHwContext(){
      if(!HW_ID) return;
      let rows=[]; try{ rows = (await SM.myHW())||[]; }catch(e){}
      HW_REC = rows.filter(r=>r.id===HW_ID)[0] || null;
      if(!HW_REC) return;
      let meta={}; try{ meta=JSON.parse(HW_REC.note||"{}"); }catch(e){}
      if(meta && Array.isArray(meta.ex) && meta.ex.length) HW_ONLY = meta.ex;
    }

    function drawHwFooter(){
      if(!HW_REC || !HW_ONLY) return;
      const st = HW_REC.status || (HW_REC.done ? "done" : "new");
      const bar=document.createElement("div"); bar.className="picker show"; bar.id="hwbar";
      const label = st==="submitted" ? "Работа у учителя на проверке"
                  : st==="done"      ? "Работа принята"
                  : st==="rework"    ? "Возвращено на доработку — исправь и отправь снова"
                  : "Реши упражнения и отправь работу";
      bar.innerHTML='<span class="n">'+esc(label)+'</span><span class="sp"></span>' +
        '<a class="clr" href="homework.html" style="text-decoration:none">К списку домашки</a>' +
        (st==="submitted"||st==="done" ? "" : '<button class="go" id="hwSend">Отправить на проверку</button>');
      document.body.appendChild(bar);
      const b=document.getElementById("hwSend");
      if(b) b.onclick=async ()=>{
        b.disabled=true; b.textContent="Отправляю…";
        const r=await SM.hwSubmit(HW_REC.id);
        if(r&&r.ok) location.href="homework.html";
        else { b.disabled=false; b.textContent="Отправить на проверку"; alert((r&&r.error)||"Не получилось отправить"); }
      };
    }

    /* Режим предпросмотра: страницу открыл конструктор в окошке и сейчас пришлёт
       одно несохранённое упражнение. Ничего из базы не грузим. */
    if(q.get("preview")){
      window.addEventListener("message",ev=>{
        const ex=ev.data&&ev.data.smPreview; if(!ex) return;
        const root=document.getElementById("root");
        if(!root) return;
        root.innerHTML="";
        const wrap=document.createElement("div"); wrap.className="exwrap"; root.appendChild(wrap);
        if(ex.title){const hd=document.createElement("div");hd.style.cssText="font:800 15px 'Nunito',sans-serif;color:#5c534d;margin:4px 4px 8px";hd.textContent=ex.title;wrap.appendChild(hd);}
        const fn=R[ex.type];
        if(!fn){ wrap.appendChild(warnCard('<div class="kind">⚠️</div><div class="qt">Тип «'+esc(ex.type)+'» не поддерживается.</div>')); return; }
        const items=(ex.data&&ex.data.items&&ex.data.items.length)?ex.data.items:[ex.data];
        items.forEach(item=>{ try{
          const el=fn({type:ex.type,data:item});
          if(item&&item.img){const im=document.createElement("img");im.src=item.img;im.alt="";im.style.cssText="max-width:100%;border-radius:14px;display:block;margin:2px auto 12px";const k=el.querySelector(".kind");if(k)k.insertAdjacentElement("afterend",im);else el.insertBefore(im,el.firstChild);}
          wrap.appendChild(el);
        }catch(err){ wrap.appendChild(warnCard('<div class="kind">⚠️ ОШИБКА</div><div class="qt">Не удалось показать: '+esc(String(err.message||err))+'</div>')); } });
      });
      const sub=document.getElementById("sub"); if(sub) sub.textContent="предпросмотр — так упражнение увидит ученик";
      const rt=document.getElementById("root"); if(rt) rt.innerHTML='<div class="empty" style="padding:30px;text-align:center">Готовлю предпросмотр…</div>';
    } else
    (async function(){
      /* Юниты облачных учебников подтягиваются асинхронно. Без ожидания
         SM_courseOfUnit не найдёт юнит из своего учебника. */
      try { await (window.SM_ready || Promise.resolve()); } catch(e){}
      await loadHwContext();
      try{ const p=await SM.myProfile();
        if(p&&p.role==="teacher"){
          IS_TEACHER=true;
          const w=document.createElement("div"); w.style.cssText="text-align:center;margin:-6px 0 16px";
          w.innerHTML='<a href="builder.html?u='+encodeURIComponent(uid)+'" style="display:inline-block;background:#b5654a;color:#fff;border-radius:999px;padding:9px 18px;font:800 13px \'Nunito\',sans-serif;text-decoration:none;box-shadow:0 4px 0 #e0d5c2">🛠 Добавить упражнение в этот урок</a>' +
            (HW_ONLY ? "" : '<div style="margin-top:9px;font:700 13px \'Nunito\',sans-serif;color:#5c534d">Отметь упражнения галочкой — и отправь их ученикам в домашнюю работу.</div>');
          document.getElementById("sub").insertAdjacentElement("afterend",w);
        }
      }catch(e){}
      await loadAndRender();
      if(HW_REC && HW_ONLY) drawHwFooter();
    })();
  </script>
</body>
